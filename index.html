on una espuma blanca, cremosa y de larga duración.","Sabor":"Sabor a malta con ricas notas a pan de medio bajas a medias, con un final lupulado y redondo. Perfil de lúpulo especiado o herbáceo de bajo a medio alto. El amargor es prominente pero nunca áspero. Sabrosa y refrescante. Un bajo diacetilo o ésteres afrutados son opcionales, pero nunca deberían ser dominantes.","Sensación en boca":"Cuerpo de medio ligero a medio. Carbonatación moderada.","Comentarios":"El nombre checo para este estilo es světlé výčepní pivo.","Historia":"Josef Groll elaboró inicialmente dos tipos de cerveza pálida en 1842–3, una výčepní y una ležák, con la más liviana de las dos teniendo el doble de volumen de producción; Evan Rail especula que estas probablemente eran cervezas de 10 °P y 12 °P (SG 1.040 y 1.048), pero que la výčepní pudo haber sido incluso más ligera. Este es el tipo de cerveza más consumido actualmente en la República Checa.","Ingredientes característicos":"Agua blanda con contenido bajo de sulfatos y carbonatos. Lúpulos tradicionales checos. Malta Pilsner checa. Levadura lager checa. El agua de bajo contenido iónico permite un perfil de lúpulo distintivamente suave y redondeado, a pesar de las elevadas tasas de lupulado.","Comparación de estilos":"Una versión refrescante y de consumo diario de la Czech Premium Pale Lager con un cuerpo más ligero y menor intensidad.","Estadísticas vitales":"OG: 1.028 – 1.044 IBU: 20 – 35 FG: 1.008 – 1.014 SRM: 3 – 6 ABV: 3.0 – 4.1%","Ejemplos comerciales":"Bernard světlé pivo 10, Březňák světlé výčepní pivo, Notch Session Pils, Primátor Antonín světlé výčepní, Radegast Rázná 10, Únětické pivo 10°","Etiquetas":""},"glass_color":"#fdb832","srm_variable":false,"clarity":"traslucida","foam_color":"#F7F4EC","abv_display":"3–4.1%","ibu_display":"20–35","srm_display":"3–6","og_display":"1.028–1.044","fg_display":"1.008–1.014","country":"República Checa","family":"Pale Lager","glass_shape":"pilsner","glass_label":"Copa pilsner","distinctive":"Una Czech Premium Pale Lager más liviana, para consumo diario.","ibu_avg":27.5,"ibu_variable":false,"abv_avg":3.5,"abv_variable":false,"summary":"Lager checa ligera, sabrosa y lupulada, de bajo alcohol.","classic_example":"Bernard světlé pivo 10","foam_level":2,"foam_height":10,"srm_lo_hex":"#ffca5a","srm_hi_hex":"#f8a600","summary_80":"Una lager checa pálida de cuerpo más ligero, sabrosa, refrescante, lupulada y amarga.","distinctive_80":"Una versión refrescante y de consumo diario de la Czech Premium Pale Lager con un cuerpo más ligero y menor intensidad.","mini_profile":{"malta":3,"lupulo":3,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Agua blanda con contenido bajo de sulfatos y carbonatos. Lúpulos tradicionales checos. Malta Pilsner checa. Levadura lager checa.","ingredient_chips":["Agua blanda con contenido…","Lúpulos tradicionales checos"],"balance_pos":2.0,"balance_malta":3,"balance_lupulo":3,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":["Malta Pilsner checa","Lúpulos tradicionales checos","Levadura lager checa"],"sabor_highlights":["Malta Pilsner checa","Lúpulos tradicionales checos","Levadura lager checa"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Amarillo","Cremosa","Translúcida"],"ingredientes_highlights":["Agua blanda con contenido…","Lúpulos tradicionales checos"],"ingredient_types":{"malta":"Malta Pilsner checa","lupulo":"Lúpulos tradicionales checos","levadura":"Levadura lager checa"}},{"code":"3B","name":"Czech Premium Pale Lager","category_num":3,"category_name":"Czech Lager","stats":{"OG":[1.044,1.06],"FG":[1.013,1.017],"IBU":[30.0,45.0],"SRM":[3.5,6.0],"ABV":[4.2,5.8]},"fields":{"Impresión general":"Una lager checa pálida y refrescante, con bastante carácter a malta y a lúpulo, y con un final prolongado. Los sabores a malta son complejos para una cerveza tipo Pilsner. El amargor es intenso y limpio pero sin asperezas, lo que aporta una impresión de balance y redondez en el sabor que realza la tomabilidad.","Aroma":"Malta con ricas notas a pan de medio a medio alto y un bouquet de lúpulo especiado, floral 0 herbáceo de medio bajo a medio alto; aunque el balance entre malta y lúpulo puede variar, la interacción es rica y compleja. Diacetilo bajo o ésteres afrutados muy bajos son opcionales. Los ésteres tienden a incrementar con la densidad.","Apariencia":"Color de amarillo medio a dorado profundo. Claridad de brillante a muy traslúcida. Espuma blanca, cremosa, densa y de larga duración.","Sabor":"Maltosidad a pan, rica y compleja, combinada con un amargor pronunciado pero suave y redondeado y un sabor a lúpulo floral y especiado. Los sabores a malta y a lúpulo son de medios a medio altos, y la malta puede contener una ligera impresión de caramelo. El amargor es prominente pero nunca áspero. El largo final puede estar balanceado hacia el lúpulo o la malta, pero nunca se inclina de manera agresiva hacia ningún lado. Diacetilo de ligero a moderadamente bajo y 5 ligeros ésteres derivados del lúpulo son aceptables, pero no es necesario que estén presentes.","Sensación en boca":"Cuerpo medio. Carbonatación de baja a moderada.","Comentarios":"En términos generales un grupo de cervezas tipo Pilsner, o pivo Plzeňského typu. Este estilo es una combinación de los estilos checos světlý ležák (11–12.9 °P, SG 1.044–1.052) y světlé speciální pivo (13–14.9 °P, SG 1.053– 1.061). En la República Checa, solo Pilsner Urquell y Gambrinus son llamadas Pilsner, a pesar de lo ampliamente reconocido de este nombre en todo el mundo. Fuera de la República Checa, se denominan algunas veces Czech Pilsner o Bohemian Pilsner para diferenciar estas cervezas de otras tipo Pilsner. Las versiones de Kvasnicové (“cerveza con levadura”) son populares en la República Checa y pueden recibir una adición de kräusening (Nota de la Traducción: adición de mosto en fermentación activa a otro mosto o cerveza) o recibir una nueva dosis de levadura pura después de la fermentación. Estas cervezas son a veces brumosas, con un sutil carácter a levadura y un acentuado carácter a lúpulo. Los ejemplos modernos varían en su balance de malta y lúpulo, y muchos no son tan lupulados como Pilsner Urquell.","Historia":"Comúnmente asociada con Pilsner Urquell, la cual fue elaborada por primera vez en 1842 después de la construcción de una nueva cervecería por los ciudadanos burgueses descontentos con el estándar de la cerveza elaborada en Pilsen. Se acredita al cervecero bávaro Josef Groll como el primero en elaborar esta cerveza, aunque pudieron existir lagers pálidas más antiguas en Bohemia. El uso de las técnicas de malteado inglesas fue tan importante como la levadura lager.","Ingredientes característicos":"Lúpulos checos tradicionales. Malta checa. Levadura lager checa. El agua baja en sulfatos y carbonatos aporta un sabor a lúpulo distintivamente suave y redondeado, a pesar de las elevadas tasas de lupulado. El nivel de amargor de algunos de los ejemplos comerciales más populares se ha reducido en los últimos años, aunque no tanto como en muchos de los ejemplos alemanes contemporáneos.","Comparación de estilos":"Más color, riqueza de malta y cuerpo que una German Pils, con un final más pleno y una impresión más limpia y suave. Más intensa que una Czech Pale Lager.","Estadísticas vitales":"OG: 1.044 – 1.060 IBU: 30 – 45 FG: 1.013 – 1.017 SRM: 3.5 – 6 ABV: 4.2 – 5.8%","Ejemplos comerciales":"Bernard světlý ležák 12°, Budvar 33 světlý ležák, Pilsner Urquell, Pivovar Jihlava Ježek 11%, Primátor Premium Lager, Radegast Ryze hořká 12, Únětické pivo 12°","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónbaja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-pilsner, balanceada"},"glass_color":"#fcb42b","srm_variable":false,"clarity":"traslucida","foam_color":"#F7F4EC","abv_display":"4.2–5.8%","ibu_display":"30–45","srm_display":"3.5–6","og_display":"1.044–1.06","fg_display":"1.013–1.017","country":"República Checa","family":"Pilsner","glass_shape":"pilsner","glass_label":"Copa pilsner","distinctive":"Más cuerpo y malta que una German Pils.","ibu_avg":37.5,"ibu_variable":false,"abv_avg":5.0,"abv_variable":false,"summary":"La Pilsner checa clásica: malta y lúpulo marcados, final largo.","classic_example":"Bernard světlý ležák 12°","foam_level":2,"foam_height":10,"srm_lo_hex":"#ffc44e","srm_hi_hex":"#f8a600","summary_80":"Una lager checa pálida y refrescante, con bastante carácter a malta y a lúpulo, y con un final prolongado.","distinctive_80":"Más color, riqueza de malta y cuerpo que una German Pils, con un final más pleno y una impresión más limpia y suave.","mini_profile":{"malta":3,"lupulo":3,"cuerpo":2,"carbonatacion":2},"char_tags":["balanceada"],"ingredients_line":"Lúpulos checos tradicionales. Malta checa. Levadura lager checa.","ingredient_chips":["Lúpulos checos tradicionales","Malta checa"],"balance_pos":2.0,"balance_malta":3,"balance_lupulo":3,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":["Malta checa","Lúpulos checos tradicionales","Levadura lager checa"],"sabor_highlights":["Malta checa","Lúpulos checos tradicionales","Levadura lager checa"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Amarillo","Cremosa","Translúcida"],"ingredientes_highlights":["Lúpulos checos tradicionales","Malta checa"],"ingredient_types":{"malta":"Malta checa","lupulo":"Lúpulos checos tradicionales","levadura":"Levadura lager checa"}},{"code":"3C","name":"Czech Amber Lager","category_num":3,"category_name":"Czech Lager","stats":{"OG":[1.044,1.06],"FG":[1.013,1.017],"IBU":[20.0,35.0],"SRM":[10.0,16.0],"ABV":[4.4,5.8]},"fields":{"Impresión general":"Una lager checa ámbar de perfil maltoso, con un carácter de lúpulo que puede variar de bajo a bastante significativo. Los sabores de la malta también pueden variar, dando lugar a diferentes interpretaciones y balances que van desde las más secas, con notas a pan y un poco a galletas, hasta las más dulces y algo acarameladas.","Aroma":"Malta rica y de intensidad moderada, que puede ser a pan y con productos de Maillard dominantes o con un dulzor 6 ligeramente acaramelado. El carácter a lúpulo especiado, floral o herbáceo puede ser de nulo a moderado. Carácter lager limpio, aunque unos ligeros ésteres afrutados pueden estar presentes (frutas de carozo o bayas). Un nivel bajo de diacetilo es opcional.","Apariencia":"Color de ámbar profundo a cobrizo. Claridad de traslúcida a brillante. Espuma voluminosa, blanquecina y persistente.","Sabor":"Domina un complejo sabor a malta (de medio a medio alto), aunque este puede variar desde seco y dominado por los productos de Maillard hasta acaramelado y casi dulce. Algunos ejemplos tienen un carácter de malta como a caramelos o a galletas integrales dulces (tipo Graham). Sabor a lúpulo especiado de bajo a moderado. Amargor de lúpulo prominente pero limpio que proporciona un final balanceado. Ésteres sutiles a ciruelas o bayas son opcionales. Bajo diacetilo es opcional. Sin sabores a maltas rostizadas. El final puede variar de seco y lupulado hasta relativamente dulce.","Sensación en boca":"Cuerpo medio a medio pleno. Suave y redonda, a menudo con una ligera cremosidad. Carbonatación de baja a moderada.","Comentarios":"El nombre checo del estilo es polotmavé pivo, que se traduce como cerveza semioscura. Este estilo es una combinación de los estilos checos polotmavý ležák (11–12.9 °P, SG 1.044–1.052) y polotmavé speciální pivo (13–14.9 °P, SG 1.053–1.061). Algunas versiones pueden ser una mezcla de cervezas lagers pálidas y oscuras.","Historia":"Una lager estilo Vienna que se ha seguido elaborando en la República Checa. Un resurgimiento en la apertura de pequeñas cervecerías en la República Checa ha aumentado el número de ejemplos de este estilo.","Ingredientes característicos":"Maltas Pilsner y Caramelo, pero también se pueden utilizar maltas Viena y Múnich. Agua de bajo contenido mineral. Lúpulos checos tradicionales. Levadura lager checa.","Comparación de estilos":"El estilo puede ser similar a una Vienna Lager pero con un carácter de lúpulo checo tardío más fuerte, o acercándose a una British Bitter pero significativamente más sabrosa y con un carácter acaramelado más intenso. Las versiones de grandes cervecerías son generalmente similares a una Czech Premium Pale Lager pero con sabores a maltas ligeramente más oscuras y menos lúpulo, mientras que las cervecerías más pequeñas a menudo elaboran versiones con considerable carácter a lúpulo, complejidad de maltas o dulzor residual.","Estadísticas vitales":"OG: 1.044 – 1.060 IBU: 20 – 35 FG: 1.013 – 1.017 SRM: 10 – 16 ABV: 4.4 – 5.8%","Ejemplos comerciales":"Bernard Jantarový ležák 12°, Gambrinus Polotmavá 12°, Kozel Semi-Dark, Lobkowicz Démon 13, Primátor 13 polotmavé, Strakonický Dudák Klostermann polotmavý ležák","Etiquetas":"intensidad-estándar, color-ámbar, fermentaciónbaja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-lager-ámbar"},"glass_color":"#cb6200","srm_variable":false,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"4.4–5.8%","ibu_display":"20–35","srm_display":"10–16","og_display":"1.044–1.06","fg_display":"1.013–1.017","country":"República Checa","family":"Amber Lager","glass_shape":"pilsner","glass_label":"Copa pilsner","distinctive":"Entre una Vienna Lager lupulada y una British Bitter acaramelada.","ibu_avg":27.5,"ibu_variable":false,"abv_avg":5.1,"abv_variable":false,"summary":"Lager checa ámbar y maltosa, de lúpulo variable.","classic_example":"Bernard Jantarový ležák 12°","foam_level":3,"foam_height":14,"srm_lo_hex":"#de7c00","srm_hi_hex":"#b54c00","summary_80":"Una lager checa ámbar de perfil maltoso, con un carácter de lúpulo que puede variar de bajo a bastante significativo.","distinctive_80":"El estilo puede ser similar a una Vienna Lager pero con un carácter de lúpulo checo tardío más fuerte.","mini_profile":{"malta":3,"lupulo":3,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Maltas Pilsner y Caramelo, pero también se pueden utilizar maltas Viena y Múnich. Agua de bajo contenido mineral.","ingredient_chips":["Maltas Pilsner y Caramelo","Agua de bajo contenido mineral"],"balance_pos":2.0,"balance_malta":3,"balance_lupulo":3,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":["Maltas Pilsner y Caramelo","Lúpulos checos tradicionales","Levadura lager checa"],"sabor_highlights":["Maltas Pilsner y Caramelo","Lúpulos checos tradicionales","Levadura lager checa"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Ámbar","Voluminosa","Translúcida"],"ingredientes_highlights":["Maltas Pilsner y Caramelo","Agua de bajo contenido mineral"],"ingredient_types":{"malta":"Maltas Pilsner y Caramelo","lupulo":"Lúpulos checos tradicionales","levadura":"Levadura lager checa"}},{"code":"3D","name":"Czech Dark Lager","category_num":3,"category_name":"Czech Lager","stats":{"OG":[1.044,1.06],"FG":[1.013,1.017],"IBU":[18.0,34.0],"SRM":[17.0,35.0],"ABV":[4.4,5.8]},"fields":{"Impresión general":"Una lager checa sabrosa, oscura y maltosa con un carácter rostizado que puede ir desde casi ausente a bastante elevado. Balance hacia la malta y un perfil de sabor interesante y complejo, con diferentes niveles de lupulado que proporcionan una serie de posibles interpretaciones.","Aroma":"Maltosidad sabrosa, intensa y a veces dulce de media a media alta, con perfiles opcionales de corteza de pan, tostadas, frutos secos, bebidas de cola, frutas oscuras o caramelo. El carácter de malta rostizada similar al chocolate o al café endulzado puede variar de ausente a moderado, pero no debe sobrepasar el carácter de la malta base. Lúpulo especiado de bajo a moderado es opcional. Bajos niveles de diacetilo y ésteres afrutados (ciruelas o bayas) de bajos a moderados pueden estar presentes.","Apariencia":"Color de cobrizo oscuro a casi negro, a menudo con tintes rojizos o granates. Claridad de traslúcida a brillante. Espuma voluminosa y persistente, con color de blanquecino a canela.","Sabor":"Domina la maltosidad profunda y compleja de intensidad de media a media alta, típicamente con productos de Maillard de riqueza maltosa y un dulzor residual de malta de ligero a moderado. Sabores de malta a caramelo, tostadas, frutos secos, regaliz, frutas oscuras deshidratadas, chocolate o café pueden estar presentes también, con un carácter rostizado de muy bajo a moderado. Lúpulo especiado de bajo a moderado. Amargor de moderado a medio bajo, pero siempre perceptible. El balance puede variar desde maltoso, a relativamente equilibrado y hasta suavemente lupulado. Diacetilo de bajo a moderado y ligeros ésteres a ciruelas o bayas pueden estar presentes.","Sensación en boca":"Cuerpo de medio a medio pleno, sustancioso, sin ser pesado ni empalagoso. Textura moderadamente cremosa y suave. Carbonatación de baja a moderada. Las versiones más fuertes pueden tener una leve tibieza alcohólica.","Comentarios":"Este estilo es una combinación de los estilos checos tmavý ležák (11–12.9 °P, SG 1.044–1.052) y tmavé speciální pivo (13–14.9 °P, SG 1.053–1.061). Los ejemplos modernos son más secos y tienen mayor amargor, mientras que las versiones tradicionales a menudo tienen un rango de IBU de 18–20 con un balance más dulce.","Historia":"La cervecería U Fleků ha estado operando en Praga desde 1499 y produce la versión más conocida. Muchas cervecerías nuevas de pequeño tamaño están elaborando este estilo.","Ingredientes característicos":"Maltas Pilsner y Caramelo oscuro con adición de maltas rostizadas desamargadas son los más comunes, pero las adiciones de malta Viena o Múnich también son apropiadas. Agua de bajo contenido mineral. Lúpulos checos tradicionales. Levadura lager checa.","Comparación de estilos":"Esta cerveza es el equivalente checo de una lager oscura y puede variar en carácter desde una Munich Dunkel hasta una Schwarzbier, pero típicamente con mayor riqueza de malta y con más aroma, sabor y amargor de lúpulo.","Estadísticas vitales":"OG: 1.044 – 1.060 IBU: 18 – 34 FG: 1.013 – 1.017 SRM: 17 – 35 ABV: 4.4 – 5.8%","Ejemplos comerciales":"Bernard černý ležák 12°, Budvar tmavý ležák, Herold tmavé silné pivo 13°, Kozel Dark, Krušovice černé, Primátor Dark Lager, U Fleků Flekovský tmavý ležák 13°","Etiquetas":"intensidad-estándar, color-oscuro, fermentaciónbaja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-lager-oscura"},"glass_color":"#771900","srm_variable":false,"clarity":"traslucida","foam_color":"#D9B183","abv_display":"4.4–5.8%","ibu_display":"18–34","srm_display":"17–35","og_display":"1.044–1.06","fg_display":"1.013–1.017","country":"República Checa","family":"Dark Lager","glass_shape":"pilsner","glass_label":"Copa pilsner","distinctive":"El equivalente checo de una lager oscura, tipo Dunkel o Schwarzbier.","ibu_avg":26.0,"ibu_variable":false,"abv_avg":5.1,"abv_variable":false,"summary":"Lager checa oscura y maltosa, rostizado variable.","classic_example":"Bernard černý ležák 12°","foam_level":3,"foam_height":14,"srm_lo_hex":"#b04500","srm_hi_hex":"#470606","summary_80":"Una lager checa sabrosa, oscura y maltosa con un carácter rostizado que puede ir desde casi ausente a bastante elevado.","distinctive_80":"Esta cerveza es el equivalente checo de una lager oscura y puede variar en carácter desde una Munich Dunkel hasta una Schwarzbier.","mini_profile":{"malta":3,"lupulo":2,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Maltas Pilsner y Caramelo oscuro con adición de maltas rostizadas desamargadas son los más comunes.","ingredient_chips":["Maltas Pilsner y Caramelo…","Agua de bajo contenido mineral"],"balance_pos":1.5,"balance_malta":3,"balance_lupulo":2,"aroma_highlight":"Malta media","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":["Maltas Pilsner y Caramelo…","Lúpulos checos tradicionales","Levadura lager checa"],"sabor_highlights":["Maltas Pilsner y Caramelo…","Lúpulos checos tradicionales","Levadura lager checa"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Cobrizo","Voluminosa","Translúcida"],"ingredientes_highlights":["Maltas Pilsner y Caramelo…","Agua de bajo contenido mineral"],"ingredient_types":{"malta":"Maltas Pilsner y Caramelo…","lupulo":"Lúpulos checos tradicionales","levadura":"Levadura lager checa"}},{"code":"4A","name":"Munich Helles","category_num":4,"category_name":"Pale Malty European Lager","stats":{"OG":[1.044,1.048],"FG":[1.006,1.012],"IBU":[16.0,22.0],"SRM":[3.0,5.0],"ABV":[4.7,5.4]},"fields":{"Impresión general":"Una lager alemana de color dorado con un sabor maltoso suave y final seco sin asperezas. Lúpulos sutiles de carácter especiado, floral o herbáceo y un discreto amargor que ayuda a mantener el balance maltoso pero no dulce, lo que contribuye a hacer de esta cerveza una bebida refrescante para todos los días.","Aroma":"Malta moderada a dulzor de grano. Lúpulo de bajo a moderadamente bajo con carácter especiado, floral o herbáceo. Perfil de fermentación limpio y agradable, con la malta dominando el balance. Los ejemplos más frescos poseerán más aroma a malta dulce.","Apariencia":"Color de amarillo pálido a dorado pálido. Transparente. Espuma blanca, cremosa y persistente.","Sabor":"Inicio moderadamente maltoso que sugiere dulzor, con sabor de malta moderado a grano dulce y con una sensación suave y redondeada en el paladar, apoyada por un amargor de bajo a medio bajo. Final suave y seco, no tan crisp y sin picor carbónico. Lúpulo bajo a moderadamente bajo con perfil especiado, floral o herbáceo. La malta domina al lúpulo en el paladar, final y retrogusto, pero los lúpulos deben notarse. Sin dulzor residual, simplemente la impresión de maltosidad con un discreto amargor. Perfil de fermentación limpio.","Sensación en boca":"Cuerpo medio. Carbonatación media. Carácter sedoso por una adecuada y prolongada maduración en frío.","Comentarios":"Los ejemplos muy frescos pueden presentar un carácter a malta y lúpulo más prominentes, que se disipa con el tiempo, como a menudo se percibe en cervezas exportadas. La Helles en Múnich tiende a ser una versión más ligera que las de fuera de la ciudad. Puede ser llamada Helles Lagerbier.","Historia":"Creada en Múnich en 1894 para competir con las cervezas pálidas tipo Pilsner, usualmente se le atribuye a Spaten la primera versión. Más popular en el sur de Alemania.","Ingredientes característicos":"Malta Pilsner de Europa continental. Lúpulos tradicionales alemanes. Levadura lager alemana de perfil limpio.","Comparación de estilos":"Similar balance de malta y amargor que una Munich Dunkel, pero con menos dulzor de malta, y pálida en vez de oscura y rica. Más cuerpo y maltosidad que una German Pils, pero menos crisp y con menos carácter de lúpulo de principio a fin. Perfil de malta similar a una German Helles Exportbier, pero con menos lúpulos en el balance y alcohol levemente menor. Menos cuerpo y alcohol que una Festbier.","Estadísticas vitales":"OG: 1.044 – 1.048 IBU: 16 – 22 FG: 1.006 – 1.012 SRM: 3 – 5 ABV: 4.7 – 5.4%","Ejemplos comerciales":"Augustiner Lagerbier Hell, HackerPschorr Münchner Gold, Löwenbräu Original, Paulaner Münchner Lager, Schönramer Hell, Spaten Münchner Hell, Weihenstephaner Original Helles","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónbaja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-lager-pálida, maltosa"},"glass_color":"#ffbf42","srm_variable":false,"clarity":"brillante","foam_color":"#F7F4EC","abv_display":"4.7–5.4%","ibu_display":"16–22","srm_display":"3–5","og_display":"1.044–1.048","fg_display":"1.006–1.012","country":"Alemania","family":"Pale Lager","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Más cuerpo que una German Pils, pero menos lupulada.","ibu_avg":19.0,"ibu_variable":false,"abv_avg":5.1,"abv_variable":false,"summary":"Lager alemana dorada, maltosa suave y de final seco.","classic_example":"Augustiner Lagerbier Hell","foam_level":2,"foam_height":10,"srm_lo_hex":"#ffca5a","srm_hi_hex":"#fbb123","summary_80":"Una lager alemana de color dorado con un sabor maltoso suave y final seco sin asperezas.","distinctive_80":"Similar balance de malta y amargor que una Munich Dunkel, pero con menos dulzor de malta, y pálida en vez de oscura y rica.","mini_profile":{"malta":2,"lupulo":1,"cuerpo":2,"carbonatacion":2},"char_tags":["maltosa"],"ingredients_line":"Malta Pilsner de Europa continental. Lúpulos tradicionales alemanes. Levadura lager alemana de perfil limpio.","ingredient_chips":["Malta Pilsner de Europa…","Lúpulos tradicionales alemanes"],"balance_pos":1.5,"balance_malta":2,"balance_lupulo":1,"aroma_highlight":"Malta media","sabor_highlight":"Malta media","apariencia_highlight":"Brillante","boca_highlight":"Cuerpo medio","aroma_highlights":["Malta Pilsner de Europa…","Lúpulos tradicionales alemanes","Levadura lager alemana de…"],"sabor_highlights":["Malta Pilsner de Europa…","Lúpulos tradicionales alemanes","Levadura lager alemana de…"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Amarillo","Cremosa","Brillante"],"ingredientes_highlights":["Malta Pilsner de Europa…","Lúpulos tradicionales alemanes"],"ingredient_types":{"malta":"Malta Pilsner de Europa…","lupulo":"Lúpulos tradicionales alemanes","levadura":"Levadura lager alemana de…"}},{"code":"4B","name":"Festbier","category_num":4,"category_name":"Pale Malty European Lager","stats":{"OG":[1.054,1.057],"FG":[1.01,1.012],"IBU":[18.0,25.0],"SRM":[4.0,6.0],"ABV":[5.8,6.3]},"fields":{"Impresión general":"Una lager alemana pálida, suave y limpia, con sabor a malta moderadamente fuerte y un ligero carácter a lúpulo. Balancea con destreza la intensidad alcohólica y la tomabilidad, con una impresión en el paladar y un final que invitan a beber. Exhibe elegantes sabores a maltas alemanas sin llegar a ser demasiado pesada o llenar demasiado.","Aroma":"Riqueza de malta moderada, con énfasis en aromas a tostados y a masa, y con una impresión de dulzor. Lúpulo de bajo a medio bajo floral, herbáceo o especiado. La malta no debe tener un carácter profundo tostado, a caramelo ni a galleta. Perfil limpio de fermentación lager.","Apariencia":"Color de amarillo profundo a dorado profundo; no debe tener tonos ámbar. Claridad brillante. Espuma persistente de blanca a blanquecina. La mayoría de los ejemplos comerciales son de color dorado pálido.","Sabor":"Malta de intensidad media a media alta, con una cualidad a tostado ligero y masa de pan, y una impresión de suave riqueza de malta. Amargor de medio bajo a medio, definitivamente maltosa en el balance. Bien atenuada y crisp, pero no seca. Lúpulo de medio bajo a medio con carácter floral, herbáceo o especiado. Perfil de fermentación limpio. El sabor es sobre todo a malta Pils, pero con toques ligeramente tostados. El amargor es de soporte, pero debe tener un final maltoso y lleno de sabor.","Sensación en boca":"Cuerpo medio, con una textura suave y algo cremosa. Carbonatación media. Intensidad alcohólica apenas perceptible como calidez.","Comentarios":"Este estilo representa la cerveza alemana moderna servida en el Oktoberfest (aunque no está reservada exclusivamente para el Oktoberfest; puede ser encontrada en muchos otros festivales de cerveza), y algunas veces es llamada Wiesn (“El Prado”, nombre local para el festival Oktoberfest). Escogimos llamar este estilo Festbier ya que por las leyes alemanas y de la Unión Europea, Oktoberfestbier es una denominación protegida para la cerveza producida en las grandes cervecerías de dentro de los límites de la ciudad de Múnich, para consumo en el Oktoberfest. Otros países no están regidos por estas normas, por lo que muchas cervecerías artesanales de Estados Unidos producen una cerveza llamada Oktoberfest, pero basada en el estilo tradicional descrito en esta Guía como Märzen. Puede ser llamada Helles Märzen.","Historia":"Desde 1990, la mayoría de la cerveza servida en el Oktoberfest de Múnich ha sido de este estilo. La cerveza de exportación elaborada específicamente para Estados Unidos sigue siendo principalmente del estilo ámbar tradicional, así como las interpretaciones elaboradas en Estados Unidos. Paulaner creó la primera versión dorada a mediados de la década de 1970 porque consideraban que el estilo Oktoberfest tradicional llenaba demasiado. Así que desarrollaron una versión más ligera, más tomable, aun así maltosa, que deseaban que fuera “más fácil de beber” (en palabras del maestro cervecero de Paulaner). Pero el estilo concreto de cerveza servido en el Oktoberfest es establecido por un comité de la ciudad de Múnich.","Ingredientes característicos":"En su mayoría malta Pils, pero con algo de malta Viena o Múnich para aumentar la maltosidad. Las diferencias entre los ejemplos comerciales se 8 deben generalmente a distintos productores de maltas y levaduras, no a grandes variaciones en el listado de granos.","Comparación de estilos":"Menos intensa y con un tostado menos profundo que una Märzen. Más robusta que una Munich Helles, con un poco más de cuerpo, sabor a lúpulo y a malta. Menos rica en intensidad de malta que una Helles Bock. La complejidad de malta es similar a una Czech Premium Pale Lager de mayor densidad, aunque sin los lúpulos esperados para el estilo.","Estadísticas vitales":"OG: 1.054 – 1.057 IBU: 18 – 25 FG: 1.010 – 1.012 SRM: 4 – 6 ABV: 5.8 – 6.3%","Ejemplos comerciales":"Augustiner Oktoberfest, HackerPschorr Superior Festbier, Hofbräu Oktoberfestbier, Löwenbräu Oktoberfestbier, Paulaner Oktoberfest Bier, Weihenstephaner Festbier","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónbaja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-lager-pálida"},"glass_color":"#fbb123","srm_variable":false,"clarity":"brillante","foam_color":"#F5F1E6","abv_display":"5.8–6.3%","ibu_display":"18–25","srm_display":"4–6","og_display":"1.054–1.057","fg_display":"1.01–1.012","country":"Alemania","family":"Pale Lager","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Menos intensa que una Märzen, más robusta que una Helles.","ibu_avg":21.5,"ibu_variable":false,"abv_avg":6.0,"abv_variable":false,"summary":"Lager alemana pálida y limpia, malta moderada, lúpulo ligero.","classic_example":"Augustiner Oktoberfest","foam_level":2,"foam_height":10,"srm_lo_hex":"#ffbf42","srm_hi_hex":"#f8a600","summary_80":"Una lager alemana pálida, suave y limpia, con sabor a malta moderadamente fuerte y un ligero carácter a lúpulo.","distinctive_80":"Menos intensa y con un tostado menos profundo que una Märzen. Más robusta que una Munich Helles, con un poco más de cuerpo, sabor a lúpulo y a malta.","mini_profile":{"malta":3,"lupulo":2,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"En su mayoría malta Pils, pero con algo de malta Viena o Múnich para aumentar la maltosidad.","ingredient_chips":["En su mayoría malta Pils"],"balance_pos":1.5,"balance_malta":3,"balance_lupulo":2,"aroma_highlight":"Malta media","sabor_highlight":"Malta alta","apariencia_highlight":"Brillante","boca_highlight":"Cuerpo medio","aroma_highlights":["En su mayoría malta Pils"],"sabor_highlights":["En su mayoría malta Pils"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Amarillo","Blanquecina","Brillante"],"ingredientes_highlights":["En su mayoría malta Pils"],"ingredient_types":{"malta":"En su mayoría malta Pils"}},{"code":"4C","name":"Helles Bock","category_num":4,"category_name":"Pale Malty European Lager","stats":{"OG":[1.064,1.072],"FG":[1.011,1.018],"IBU":[23.0,35.0],"SRM":[6.0,9.0],"ABV":[6.3,7.4]},"fields":{"Impresión general":"Una lager alemana relativamente pálida, fuerte y maltosa, con un final bien atenuado que realza la tomabilidad. El carácter a lúpulo es generalmente más aparente, y la intensidad de malta es de una riqueza menos profunda que en otras Bock.","Aroma":"Malta a grano dulce de moderada a alta intensidad, a menudo con un carácter ligeramente tostado y productos de Maillard de nivel bajo. Son opcionales los lúpulos especiados, herbáceos o florales en nivel moderadamente bajo. Perfil de fermentación limpio. Bajos ésteres frutales son opcionales. Alcohol muy ligero opcional.","Apariencia":"Color de dorado profundo a ámbar claro. Claridad de traslúcida a brillante. Espuma blanca voluminosa, cremosa y persistente.","Sabor":"Domina la malta a grano dulce, masa cruda, pan o tostado ligero, de intensidad moderada a moderadamente alta, con algunos productos de Maillard que aportan un interés adicional por su riqueza. Es opcional la presencia de algunos sabores a caramelo. Lúpulo especiado, herbáceo, floral o a pimienta de bajo a moderado es opcional, pero está presente en los mejores ejemplos. Amargor de lúpulo moderado, más aparente en el balance que en otras Bock. Perfil de fermentación limpio. Bien atenuada, no empalagosa, con un final moderadamente seco que puede tener sabor tanto a malta como a lúpulo.","Sensación en boca":"Cuerpo medio. Carbonatación de moderada a moderadamente alta. Suave y limpia, sin asperezas ni astringencia, a pesar del mayor amargor de lúpulo. Ligera tibieza alcohólica opcional.","Comentarios":"También conocida como Maibock. Comparada con cervezas Bock más oscuras, los lúpulos compensan el menor nivel de productos de Maillard en el balance.","Historia":"Un desarrollo bastante reciente en comparación con los otros miembros de la familia Bock. La disponibilidad de Maibock es una oferta de temporada asociada a la primavera (del hemisferio norte) y al mes de mayo, y puede incluir un rango más amplio de color y lupulado que lo que se ve en productos de exportación.","Ingredientes característicos":"Una mezcla de maltas Pils, Viena y Múnich. Sin adjuntos. Es posible un ligero uso de maltas tipo Crystal pálidas. Lúpulos tradicionales alemanes. Levadura lager limpia. El macerado por decocción es tradicional, pero el hervor es menor que en una Dunkles Bock para restringir el desarrollo de color. Agua blanda.","Comparación de estilos":"Se puede interpretar ya sea como una versión pálida de una Dunkles Bock, o como una Munich Helles o Festbier elaborada en intensidad Bock. Aunque es bastante maltosa, esta cerveza tiene típicamente menor sabor a maltas oscuras y ricas, y puede ser más seca, lupulada y amarga que una Dunkles Bock. Menos intensa que una Doppelbock pálida, pero con sabores similares.","Estadísticas vitales":"OG: 1.064 – 1.072 IBU: 23 – 35 FG: 1.011 – 1.018 SRM: 6 – 9 ABV: 6.3 – 7.4%","Ejemplos comerciales":"Altenmünster Maibock, Ayinger Maibock, Chuckanut Maibock, Einbecker Mai-Ur-Bock, Hofbräu Maibock, Mahr’s Heller Bock","Etiquetas":"intensidad-alta, color-pálido, fermentación-baja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-bock"},"glass_color":"#ee9600","srm_variable":false,"clarity":"traslucida","foam_color":"#F7F4EC","abv_display":"6.3–7.4%","ibu_display":"23–35","srm_display":"6–9","og_display":"1.064–1.072","fg_display":"1.011–1.018","country":"Alemania","family":"Bock","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Una Dunkles Bock en versión pálida.","ibu_avg":29.0,"ibu_variable":false,"abv_avg":6.8,"abv_variable":false,"summary":"Lager alemana pálida y fuerte, maltosa pero bien atenuada.","classic_example":"Altenmünster Maibock","foam_level":3,"foam_height":14,"srm_lo_hex":"#f8a600","srm_hi_hex":"#e58500","summary_80":"Una lager alemana relativamente pálida, fuerte y maltosa, con un final bien atenuado que realza la tomabilidad.","distinctive_80":"Se puede interpretar ya sea como una versión pálida de una Dunkles Bock, o como una Munich Helles o Festbier elaborada en intensidad Bock.","mini_profile":{"malta":3,"lupulo":2,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"Una mezcla de maltas Pils, Viena y Múnich. Sin adjuntos. Es posible un ligero uso de maltas tipo Crystal pálidas.","ingredient_chips":["Una mezcla de maltas Pils","Es posible un ligero uso de…"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Malta alta","sabor_highlight":"Malta media","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Una mezcla de maltas Pils","Lúpulos tradicionales alemanes","Levadura lager limpia"],"sabor_highlights":["Una mezcla de maltas Pils","Lúpulos tradicionales alemanes","Levadura lager limpia"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Dorado","Cremosa","Translúcida"],"ingredientes_highlights":["Una mezcla de maltas Pils","Es posible un ligero uso de…"],"ingredient_types":{"malta":"Una mezcla de maltas Pils","lupulo":"Lúpulos tradicionales alemanes","levadura":"Levadura lager limpia"}},{"code":"5A","name":"German Leichtbier","category_num":5,"category_name":"Pale Bitter European Beer","stats":{"OG":[1.026,1.034],"FG":[1.006,1.01],"IBU":[15.0,28.0],"SRM":[1.5,4.0],"ABV":[2.4,3.6]},"fields":{"Impresión general":"Una lager alemana pálida, altamente atenuada y de cuerpo ligero, con menos alcohol y calorías que las cervezas de intensidad estándar. Con un amargor moderado y sabores perceptibles de malta y lúpulo, esta cerveza resulta aún interesante de tomar.","Aroma":"Lúpulo de bajo a medio con carácter especiado, herbáceo o floral. Malta de baja a medio baja a grano dulce o levemente a galleta cracker. Perfil de fermentación limpio.","Apariencia":"Color de pajizo pálido a amarillo profundo. Claridad brillante. Espuma moderada, blanca, con una retención no superior a la media.","Sabor":"Al inicio el sabor de malta es de bajo a medio con carácter a grano dulce. Amargor de lúpulo medio. Sabor de lúpulo de bajo a medio con carácter especiado, herbáceo o floral. Carácter de fermentación limpio, con adecuada y prolongada maduración en frío (lagered). Final seco con un retrogusto ligeramente maltoso y lupulado.","Sensación en boca":"Cuerpo de muy ligero a ligero. Carbonatación de media a alta. Suave, bien atenuada.","Comentarios":"Publicitada principalmente como una cerveza para quienes estén a dieta, con menos carbohidratos, alcohol y calorías. Se pronuncia como “LAIGT-bia”. También puede ser conocida como Diat Pils o Helles, este estilo está en la categoría de densidad Schankbier. Otras variedades de cervezas de la categoría Leicht pueden ser elaboradas a partir de una Weissbier, Kölsch y Altbier; esas cervezas quedan mejor inscritas como 34B Mixed-Style Beer.","Historia":"Las versiones tradicionales existieron como bebidas para los trabajadores de las industrias o el campo, pero las versiones modernas están más basadas en los productos populares de Estados Unidos de la misma clase y dirigidas a consumidores conscientes de la salud o la forma física. Reemplazadas cada vez más en el mercado actual por las cervezas sin alcohol y radlers (Nota de la Traducción: mezcla de cerveza con limonada originaria de Alemania).","Ingredientes característicos":"Malta Pils de Europa continental. Levadura lager alemana. Lúpulos tradicionales alemanes.","Comparación de estilos":"Como una German Pils o Munich Helles pero de alcohol más bajo, cuerpo más ligero y un poco menos agresiva. Más amarga y sabrosa que una American Light Lager.","Estadísticas vitales":"OG: 1.026 – 1.034 IBU: 15 – 28 FG: 1.006 – 1.010 SRM: 1.5 – 4 ABV: 2.4 – 3.6%","Ejemplos comerciales":"Autenrieder Schlossbräu Leicht, Greif-Bräu Leicht, Hohenthanner Tannen Hell Leicht, Müllerbräu Heimer Leicht, Schönramer Surtaler Schankbier, Waldhaus Sommer Bier","Etiquetas":"intensidad-baja, color-pálido, fermentación-baja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-lager-pálida, amarga, lupulada"},"glass_color":"#ffce62","srm_variable":false,"clarity":"brillante","foam_color":"#F7F4EC","abv_display":"2.4–3.6%","ibu_display":"15–28","srm_display":"1.5–4","og_display":"1.026–1.034","fg_display":"1.006–1.01","country":"Alemania","family":"Pale Lager","glass_shape":"pilsner","glass_label":"Copa pilsner","distinctive":"Como una German Pils o Helles, pero más suave.","ibu_avg":21.5,"ibu_variable":false,"abv_avg":3.0,"abv_variable":false,"summary":"Lager alemana ligera en cuerpo y alcohol.","classic_example":"Autenrieder Schlossbräu Leicht","foam_level":1,"foam_height":7,"srm_lo_hex":"#ffdf88","srm_hi_hex":"#ffbf42","summary_80":"Una lager alemana pálida, altamente atenuada y de cuerpo ligero, con menos alcohol y calorías que las cervezas de intensidad estándar.","distinctive_80":"Como una German Pils o Munich Helles pero de alcohol más bajo, cuerpo más ligero y un poco menos agresiva.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":1,"carbonatacion":3},"char_tags":["amarga","lupulada"],"ingredients_line":"Malta Pils de Europa continental. Levadura lager alemana. Lúpulos tradicionales alemanes.","ingredient_chips":["Malta Pils de Europa…","Levadura lager alemana"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Lúpulo medio","sabor_highlight":"Malta media","apariencia_highlight":"Brillante","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta Pils de Europa continental","Lúpulos tradicionales alemanes","Levadura lager alemana"],"sabor_highlights":["Malta Pils de Europa continental","Lúpulos tradicionales alemanes","Levadura lager alemana"],"boca_highlights":["Carbonatación alta","Cuerpo ligero"],"apariencia_highlights":["Pajizo","Blanca","Brillante"],"ingredientes_highlights":["Malta Pils de Europa…","Levadura lager alemana"],"ingredient_types":{"malta":"Malta Pils de Europa continental","lupulo":"Lúpulos tradicionales alemanes","levadura":"Levadura lager alemana"}},{"code":"5B","name":"Kölsch","category_num":5,"category_name":"Pale Bitter European Beer","stats":{"OG":[1.044,1.05],"FG":[1.007,1.011],"IBU":[18.0,30.0],"SRM":[3.5,5.0],"ABV":[4.4,5.2]},"fields":{"Impresión general":"Una cerveza sutil, pálida y de claridad muy brillante, con un delicado balance entre el carácter a malta, la frutosidad y el lúpulo, con amargor moderado y un final bien atenuado pero suave. La frescura marca una gran diferencia en esta cerveza, ya que con el tiempo el carácter delicado puede desvanecerse rápidamente.","Aroma":"Malta de muy baja a baja a grano dulce. Un sutil aroma a fruta (manzana, pera o, a veces cereza) es opcional pero bienvenido. El aroma bajo a lúpulo floral, especiado o herbáceo es opcional. Los aromas son de intensidades bastante sutiles pero generalmente balanceados, limpios, frescos y agradables.","Apariencia":"Color de amarillo medio a dorado claro. Claridad brillante. Espuma blanca y delicada que puede no persistir.","Sabor":"Delicado balance entre la malta, la frutosidad, el amargor y los lúpulos, con un final limpio y bien atenuado. Maltosidad granosa de media baja a media, que puede poseer notas muy ligeras a pan o miel. La frutosidad puede tener un dulzor casi imperceptible. Amargor de medio bajo a medio. Lúpulo de bajo a moderadamente alto de tipo floral, especiado o herbáceo; la mayoría de las veces de medio bajo a medio. Al principio puede aportar una impresión desde grano neutro a malta ligeramente dulce. Paladar suave y redondo. Final suave, seco y levemente crisp, sin ser invasivo ni áspero. Sin dulzor residual perceptible. Si bien el balance entre los componentes de sabor puede variar, ninguno es demasiado fuerte.","Sensación en boca":"Cuerpo de medio ligero a medio; la mayoría es medio ligero. Carbonatación de media a media alta. Suave y delicada, pero bien atenuada y liviana. Sin asperezas.","Comentarios":"Una cerveza de fermentación alta y con prolongada maduración en frío (lagered) tradicional de Colonia, Alemania (Köln). Las cervecerías de Colonia se diferencian entre sí por el balance, por lo que al evaluarlas, permita un rango de variación en el estilo. Las versiones más secas pueden parecer más lupuladas o más amargas de lo que podrían sugerir los niveles de IBU. El delicado perfil de sabor no envejece bien, así es que preste atención a los defectos de oxidación. En Colonia es servida en un vaso alto y angosto de 20cl conocido como Stange.","Historia":"Colonia posee una tradición cervecera de fermentación alta desde la Edad Media, pero la cerveza conocida hoy en día como Kölsch fue desarrollada a fines del siglo XIX como una alternativa a las lagers pálidas. De hecho, la fermentación baja estaba prohibida en Colonia. Kölsch es una denominación protegida por la Kölsch Konvention (1986), y está limitada a cervecerías dentro y alrededor de esa área. La Konvention define la cerveza simplemente como una “Vollbier de fermentación alta, ligera y transparente, altamente atenuada, en la que resalta el lúpulo”.","Ingredientes característicos":"Lúpulos tradicionales alemanes. Malta pálida, Pils o Viena alemanas. Levadura ale alemana limpia y de alta atenuación. Uso ocasional de trigo malteado en pequeñas cantidades. La práctica comercial actual es fermentarla alrededor de los 15 °C, acondicionarla en frío 10 cerca del punto de congelación hasta por un mes, y servirla fresca.","Comparación de estilos":"Puede confundirse con una Cream Ale o una German Pils algo sutil.","Estadísticas vitales":"OG: 1.044 – 1.050 IBU: 18 – 30 FG: 1.007 – 1.011 SRM: 3.5 – 5 ABV: 4.4 – 5.2%","Ejemplos comerciales":"Früh Kölsch, Gaffel Kölsch, Mühlen Kölsch, Päffgen Kölsch, Reissdorf Kölsch, Sion Kölsch, Sünner Kölsch","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónalta, acondicionada-en-frío, europa-central, estilo-tradicional, familia-ale-pálida"},"glass_color":"#febc3a","srm_variable":false,"clarity":"brillante","foam_color":"#F7F4EC","abv_display":"4.4–5.2%","ibu_display":"18–30","srm_display":"3.5–5","og_display":"1.044–1.05","fg_display":"1.007–1.011","country":"Alemania","family":"Pale Ale","glass_shape":"flute","glass_label":"Vaso stange / flauta","distinctive":"Puede confundirse con una Cream Ale o una German Pils sutil.","ibu_avg":24.0,"ibu_variable":false,"abv_avg":4.8,"abv_variable":false,"summary":"Cerveza sutil, pálida y brillante; mejor fresca.","classic_example":"Früh Kölsch","foam_level":0,"foam_height":4,"srm_lo_hex":"#ffc44e","srm_hi_hex":"#fbb123","summary_80":"Una cerveza sutil, pálida y de claridad muy brillante, con un delicado balance entre el carácter a malta, la frutosidad y el lúpulo.","distinctive_80":"Puede confundirse con una Cream Ale o una German Pils algo sutil.","mini_profile":{"malta":2,"lupulo":3,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"Lúpulos tradicionales alemanes. Malta pálida, Pils o Viena alemanas. Levadura ale alemana limpia y de alta atenuación.","ingredient_chips":["Lúpulos tradicionales alemanes","Malta pálida"],"balance_pos":2.5,"balance_malta":2,"balance_lupulo":3,"aroma_highlight":"Malta baja","sabor_highlight":"Lúpulo alto","apariencia_highlight":"Brillante","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta pálida","Lúpulos tradicionales alemanes","Levadura ale alemana limpia y…"],"sabor_highlights":["Malta pálida","Lúpulos tradicionales alemanes","Levadura ale alemana limpia y…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Amarillo","Blanca","Brillante"],"ingredientes_highlights":["Lúpulos tradicionales alemanes","Malta pálida"],"ingredient_types":{"malta":"Malta pálida","lupulo":"Lúpulos tradicionales alemanes","levadura":"Levadura ale alemana limpia y…"}},{"code":"5C","name":"German Helles Exportbier","category_num":5,"category_name":"Pale Bitter European Beer","stats":{"OG":[1.05,1.058],"FG":[1.008,1.015],"IBU":[20.0,30.0],"SRM":[4.0,6.0],"ABV":[5.0,6.0]},"fields":{"Impresión general":"Una lager alemana dorada que equilibra un suave perfil de malta con un carácter lupulado y amargo, en una cerveza de cuerpo e intensidad de alcohol levemente por encima del promedio.","Aroma":"Lúpulo floral, especiado o herbáceo de medio bajo a medio. Malta moderada a grano dulce, posiblemente con ligeras notas a tostado, pan o masa cruda. Perfil de fermentación limpio. Tanto los lúpulos como la malta son perceptibles y generalmente equilibrados.","Apariencia":"Color de amarillo medio a dorado profundo. Transparente. Espuma blanca y persistente.","Sabor":"Malta y lúpulos moderados y equilibrados, con amargor de apoyo. Sabores de malta y lúpulo similares al aroma (mismos descriptores e intensidades). Amargor medio y perceptible, de paladar pleno, con un final semi seco. Carácter de fermentación limpio. Retrogusto tanto a malta como a lúpulos, generalmente en equilibrio. El carácter mineral es percibido típicamente más como una redondez y plenitud de sabor, junto a una sensación de aspereza seca y con dureza en el final, en lugar de sabores minerales evidentes. Sulfato de fondo opcional.","Sensación en boca":"Cuerpo de medio a medio pleno. Carbonatación media. Suave y delicada en el paladar. Una calidez muy ligera puede ser percibida en versiones con mayor intensidad de alcohol.","Comentarios":"Conocida también como Dortmunder Export, Dortmunder, Export o simplemente Dort. Denominada Export dentro de Alemania y a menudo Dortmunder en otros lugares. Export también es un descriptor de la intensidad de alcohol de la cerveza según la tradición cervecera alemana, y podría ser aplicado a otros estilos. Representa un punto medio entre una German Pils y una Munich Helles en varios aspectos: color, equilibrio malta-lúpulo, final y amargor.","Historia":"Desarrollada en la década de 1870 en Dortmund, en la región industrial del Ruhr, como respuesta a las cervezas pálidas tipo Pilsner. Se volvió muy popular después de la Segunda Guerra Mundial pero decayó en la década de 1970. Otras cervezas de clase Export aparecieron de forma independiente, y reflejaban versiones levemente más intensas en alcohol de cervezas de la época.","Ingredientes característicos":"Agua mineralizada con altos niveles de sulfatos, carbonatos y cloruros. Lúpulos tradicionales alemanes o checos. Malta Pilsner. Levadura lager alemana. El macerado por decocción es tradicional.","Comparación de estilos":"Menos lúpulos de adición tardía y más cuerpo que una German Pils. Más amarga y seca que una Munich Helles. Más intensa y seca, pero menos lupulada, que una Czech Premium Pale Lager.","Estadísticas vitales":"OG: 1.050 – 1.058 IBU: 20 – 30 FG: 1.008 – 1.015 SRM: 4 – 6 ABV: 5.0 – 6.0%","Ejemplos comerciales":"Chuckanut Export Dortmunder Lager, DAB Dortmunder Export, Dortmunder Kronen, Landshuter Edel Hell, Müllerbräu Export Gold, Schönramer Gold","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónbaja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-lager-pálida"},"glass_color":"#fbb123","srm_variable":false,"clarity":"brillante","foam_color":"#F7F4EC","abv_display":"5–6%","ibu_display":"20–30","srm_display":"4–6","og_display":"1.05–1.058","fg_display":"1.008–1.015","country":"Alemania","family":"Pale Lager","glass_shape":"pilsner","glass_label":"Copa pilsner","distinctive":"Más amarga que una Munich Helles; más cuerpo que una German Pils.","ibu_avg":25.0,"ibu_variable":false,"abv_avg":5.5,"abv_variable":false,"summary":"Lager alemana dorada, entre malta suave y lúpulo amargo.","classic_example":"Chuckanut Export Dortmunder Lager","foam_level":2,"foam_height":10,"srm_lo_hex":"#ffbf42","srm_hi_hex":"#f8a600","summary_80":"Una lager alemana dorada que equilibra un suave perfil de malta con un carácter lupulado y amargo.","distinctive_80":"Menos lúpulos de adición tardía y más cuerpo que una German Pils. Más amarga y seca que una Munich Helles. Más intensa y seca.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Agua mineralizada con altos niveles de sulfatos, carbonatos y cloruros. Lúpulos tradicionales alemanes o checos. Malta Pilsner.","ingredient_chips":["Agua mineralizada con altos…","Lúpulos tradicionales…"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Malta media","sabor_highlight":"Malta media","apariencia_highlight":"Brillante","boca_highlight":"Cuerpo medio","aroma_highlights":["Malta Pilsner","Lúpulos tradicionales alemanes…","Levadura lager alemana"],"sabor_highlights":["Malta Pilsner","Lúpulos tradicionales alemanes…","Levadura lager alemana"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Amarillo","Blanca","Brillante"],"ingredientes_highlights":["Agua mineralizada con altos…","Lúpulos tradicionales…"],"ingredient_types":{"malta":"Malta Pilsner","lupulo":"Lúpulos tradicionales alemanes…","levadura":"Levadura lager alemana"}},{"code":"5D","name":"German Pils","category_num":5,"category_name":"Pale Bitter European Beer","stats":{"OG":[1.044,1.05],"FG":[1.008,1.013],"IBU":[22.0,40.0],"SRM":[2.0,4.0],"ABV":[4.4,5.2]},"fields":{"Impresión general":"Una lager alemana pálida, seca y amarga que presenta un prominente aroma a lúpulo. Crisp, limpia y refrescante, luciendo un color dorado brillante con excelente retención de espuma.","Aroma":"Lúpulo floral, especiado o herbáceo de moderado a moderadamente alto. Malta de baja a media con carácter granoso, dulce o a masa cruda, a menudo con una ligera cualidad a miel y galleta cracker tostada. Perfil de fermentación limpio. Los lúpulos deberían estar al frente, pero no dominar totalmente a la malta en el balance.","Apariencia":"Color de pajizo a amarillo profundo, de brillante a muy transparente, con una espuma blanca, cremosa y duradera.","Sabor":"El sabor inicial a malta es superado rápidamente por el sabor y amargor del lúpulo, lo que conduce a un final seco y crisp. Sabores de malta y lúpulo similares al aroma (mismos descriptores e intensidades). Amargor de medio a alto, persistiendo en el retrogusto junto con un toque de malta y lúpulos. Perfil de fermentación limpio. La mineralización del agua puede acentuar y prolongar el final seco. Los lúpulos y la malta pueden atenuarse con el tiempo, pero la cerveza siempre debe tener un balance amargo.","Sensación en boca":"Cuerpo medio ligero. Carbonatación de media a alta. No debe sentirse pesada. Sin asperezas, pero algunos ejemplos pueden tener una dureza mineral.","Comentarios":"Los ejemplos modernos de las Pils tienden a ser más pálidos en color, más secos y punzantes en el final, y más amargos, según nos trasladamos del sur al norte de Alemania, a menudo reflejando el incremento de sulfatos en el agua. Las Pils que se encuentran en Baviera tienden a ser un poco más suaves en amargor, con más sabor de malta y carácter a lúpulo de adición tardía, pero todavía con suficientes lúpulos y un final crisp que la diferencian de una Munich Helles. En Alemania el uso del término Pils es más común que Pilsner para diferenciarlo del estilo checo y (algunos dicen) para mostrar respeto.","Historia":"Adaptada de la Pilsner checa para adecuarse a las condiciones de elaboración de cerveza en Alemania, en particular al agua con mayor contenido mineral, y a variedades de lúpulo nacionales. Elaborada por primera vez en Alemania a principios de la década de 1870. Se volvió más popular después de la Segunda Guerra Mundial cuando las escuelas cerveceras alemanas pusieron énfasis en técnicas modernas. Junto con su prima la Pilsner checa, es el ancestro de los estilos de cerveza más ampliamente producidos en la actualidad.","Ingredientes característicos":"Malta Pilsner de Europa continental. Lúpulos tradicionales alemanes. Levadura lager alemana limpia.","Comparación de estilos":"De color y cuerpo más ligeros, más seca, más crisp, más plenamente atenuada, con más amargor persistente y mayor carbonatación que una Czech Premium 11 Pale Lager. Más carácter a lúpulo, sabor a malta y amargor que una International Pale Lager. Más carácter a lúpulo y amargor, con un final más seco y más crisp que una Munich Helles; la Helles tiene mayor intensidad de malta, pero posee el mismo carácter que la German Pils.","Estadísticas vitales":"OG: 1.044 – 1.050 IBU: 22 – 40 FG: 1.008 – 1.013 SRM: 2 – 4 ABV: 4.4 – 5.2%","Ejemplos comerciales":"ABK Pils Anno 1907, Jever Pilsener, König Pilsener, Paulaner Pils, Bierstadt Slow-Pour Pils, Rothaus Pils, Schönramer Pils, Trumer Pils","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónbaja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-pilsner, amarga"},"glass_color":"#ffca5a","srm_variable":false,"clarity":"brillante","foam_color":"#F7F4EC","abv_display":"4.4–5.2%","ibu_display":"22–40","srm_display":"2–4","og_display":"1.044–1.05","fg_display":"1.008–1.013","country":"Alemania","family":"Pilsner","glass_shape":"pilsner","glass_label":"Copa pilsner","distinctive":"Más seca y amarga que una Czech Premium Pale Lager.","ibu_avg":31.0,"ibu_variable":false,"abv_avg":4.8,"abv_variable":false,"summary":"Lager alemana pálida, seca y amarga, muy aromática a lúpulo.","classic_example":"ABK Pils Anno 1907","foam_level":2,"foam_height":10,"srm_lo_hex":"#ffd878","srm_hi_hex":"#ffbf42","summary_80":"Una lager alemana pálida, seca y amarga que presenta un prominente aroma a lúpulo. Crisp, limpia y refrescante.","distinctive_80":"De color y cuerpo más ligeros, más seca, más crisp, más plenamente atenuada.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":3},"char_tags":["amarga"],"ingredients_line":"Malta Pilsner de Europa continental. Lúpulos tradicionales alemanes. Levadura lager alemana limpia.","ingredient_chips":["Malta Pilsner de Europa…","Lúpulos tradicionales alemanes"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Malta media","sabor_highlight":"Amargor alto","apariencia_highlight":"Brillante","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta Pilsner de Europa…","Lúpulos tradicionales alemanes","Levadura lager alemana limpia"],"sabor_highlights":["Malta Pilsner de Europa…","Lúpulos tradicionales alemanes","Levadura lager alemana limpia"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Pajizo","Cremosa","Brillante"],"ingredientes_highlights":["Malta Pilsner de Europa…","Lúpulos tradicionales alemanes"],"ingredient_types":{"malta":"Malta Pilsner de Europa…","lupulo":"Lúpulos tradicionales alemanes","levadura":"Levadura lager alemana limpia"}},{"code":"6A","name":"Märzen","category_num":6,"category_name":"Amber Malty European Lager","stats":{"OG":[1.054,1.06],"FG":[1.01,1.014],"IBU":[18.0,24.0],"SRM":[8.0,17.0],"ABV":[5.6,6.3]},"fields":{"Impresión general":"Una lager alemana ámbar y maltosa, con un sabor a malta limpio, sabroso, tostado y similar al pan, con un discreto amargor y un final bien atenuado. La sensación general de la malta es suave, elegante y compleja, con un retrogusto sabroso y maltoso, que no es empalagoso ni pesado.","Aroma":"Moderadamente maltoso, habitualmente rico, a pan, algo tostado, y con suaves notas a corteza de pan. Carácter limpio de fermentación lager. Un aroma muy bajo a lúpulo floral, herbáceo o especiado es opcional. Los aromas de la malta tipo caramelo dulce, galleta seca o rostizados son inapropiados. Un muy ligero alcohol puede ser detectado, pero no debería ser punzante. Una riqueza de malta limpia y elegante debería ser el aroma principal.","Apariencia":"Color de ámbar anaranjado a un profundo rojo cobrizo; no debería ser dorada. De claridad brillante, con una persistente espuma blanquecina.","Sabor":"El perfil rico de malta, de intensidad moderada a alta, a menudo sugiere dulzor inicialmente, pero el final es de moderadamente seco a seco. Maltosidad distintiva y compleja, que frecuentemente incluye matices con carácter tostado y a pan. El amargor del lúpulo es moderado y es opcional un bajo sabor a lúpulo de tipo floral, herbáceo o especiado. Los lúpulos aportan el balance suficiente para que el paladar y el final maltoso no se perciban dulces. El retrogusto es maltoso, con los mismos sabores persistentes a malta rica y elegante. Los sabores intensos a caramelo dulce, galleta seca o rostizados son inapropiados. Perfil de fermentación limpio.","Sensación en boca":"Cuerpo medio, con una textura suave y cremosa que a menudo sugiere un cuerpo más pleno. Carbonatación media. Completamente atenuada, sin una impresión dulce o empalagosa. Puede presentar una ligera tibieza, pero la intensidad alcohólica debería estar relativamente oculta.","Comentarios":"Las versiones locales modernas de una Oktoberfest alemana son doradas; consulte el estilo Festbier para esta versión. Las versiones alemanas de exportación (por lo menos a Estados Unidos) son típicamente de color ámbar anaranjado, tienen un distintivo carácter maltoso tostado y son frecuentemente etiquetadas como Oktoberfest. Muchas versiones artesanales de la Oktoberfest se basan en este estilo. Las versiones históricas de esta cerveza tendían a ser más oscuras, llegando al rango de color marrón, pero ha habido muchos “matices” de Märzen (cuando el nombre es usado para describir la intensidad alcohólica); esta descripción de estilo se refiere específicamente a la versión lager ámbar más fuerte. Según estos términos, la Festbier moderna puede ser concebida como una Märzen pálida de cuerpo más ligero. 12","Historia":"Como sugiere el nombre, era elaborada como una “cerveza de marzo” más intensa y madurada en frías cuevas de forma prolongada (lagered) durante el verano. Las versiones modernas trazan su origen hasta la lager desarrollada por Spaten en 1841, contemporánea al desarrollo de la Vienna Lager. Sin embargo, el nombre Märzen es mucho más antiguo que 1841; las versiones más primitivas eran de color marrón oscuro y el nombre implicaba un rango de intensidad alcohólica (14 °P, SG 1.057) en vez de un estilo. Este fue el estilo lager ámbar servido en el Oktoberfest desde 1872 hasta 1990, cuando la Festbier dorada fue adoptada como la cerveza estándar del festival.","Ingredientes característicos":"El listado de granos varía, aunque las versiones tradicionales alemanas resaltan la malta Múnich. La noción de elegancia deriva del uso de los ingredientes de la más fina calidad, en particular las maltas base. El macerado por decocción es tradicional, y realza el perfil sabroso de las maltas.","Comparación de estilos":"No es tan fuerte ni sabrosa como una Dunkles Bock. Mayor profundidad y riqueza de malta que una Festbier, con un cuerpo más pesado y levemente menos lúpulo. Menos lupulada pero igual de maltosa que una Czech Amber Lager, aunque con un perfil de maltas diferente.","Estadísticas vitales":"OG: 1.054 – 1.060 IBU: 18 – 24 FG: 1.010 – 1.014 SRM: 8 – 17 ABV: 5.6 – 6.3%","Ejemplos comerciales":"Hacker-Pschorr Oktoberfest Märzen, Hofmark Märzen, Paulaner Oktoberfest, Saalfelder Ur-Saalfelder, Weltenburger Kloster Anno 1050","Etiquetas":"intensidad-estándar, color-ámbar, fermentaciónbaja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-lager-ámbar"},"glass_color":"#cd6600","srm_variable":false,"clarity":"brillante","foam_color":"#F5F1E6","abv_display":"5.6–6.3%","ibu_display":"18–24","srm_display":"8–17","og_display":"1.054–1.06","fg_display":"1.01–1.014","country":"Alemania","family":"Amber Lager","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Menos fuerte que una Dunkles Bock, más rica que una Festbier.","ibu_avg":21.0,"ibu_variable":false,"abv_avg":5.9,"abv_variable":false,"summary":"Lager alemana ámbar y maltosa, a pan tostado.","classic_example":"Hacker-Pschorr Oktoberfest Märzen","foam_level":2,"foam_height":10,"srm_lo_hex":"#ea8f00","srm_hi_hex":"#b04500","summary_80":"Una lager alemana ámbar y maltosa, con un sabor a malta limpio, sabroso, tostado y similar al pan, con un discreto amargor y un final bien atenuado.","distinctive_80":"No es tan fuerte ni sabrosa como una Dunkles Bock.","mini_profile":{"malta":3,"lupulo":2,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"El listado de granos varía, aunque las versiones tradicionales alemanas resaltan la malta Múnich.","ingredient_chips":[],"balance_pos":1.5,"balance_malta":3,"balance_lupulo":2,"aroma_highlight":"Malta media","sabor_highlight":"Malta alta","apariencia_highlight":"Brillante","boca_highlight":"Cuerpo medio","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Ámbar","Blanquecina","Brillante"],"ingredientes_highlights":[],"ingredient_types":{}},{"code":"6B","name":"Rauchbier","category_num":6,"category_name":"Amber Malty European Lager","stats":{"OG":[1.05,1.057],"FG":[1.012,1.016],"IBU":[20.0,30.0],"SRM":[12.0,22.0],"ABV":[4.8,6.0]},"fields":{"Impresión general":"Una lager alemana ámbar, maltosa y ahumada con madera de haya. El perfil esperado de una Märzen a malta tostada sabrosa, discreto amargor, fermentación limpia y un final relativamente seco, se realza con un carácter ahumado de notorio a intenso.","Aroma":"Una mezcla entre humo y malta, variando en balance e intensidad. El carácter a humo de madera de haya puede ir de sutil a bastante intenso, y se puede percibir como ahumado, amaderado o a tocino. El carácter a malta puede ser de bajo a moderado, con un perfil un tanto sabroso, tostado o a malta dulce. Los componentes de malta y humo generalmente son inversamente proporcionales (es decir, cuando aumenta el humo, disminuye la malta y viceversa). Un bajo aroma a lúpulo floral o especiado es opcional. Perfil de fermentación limpio.","Apariencia":"Muy traslúcida, con una espuma voluminosa, cremosa y abundante, y color de crema a canela. Color de ámbar profundo a marrón cobrizo, generalmente un poco más oscura que el estilo Märzen de base.","Sabor":"Generalmente es similar al perfil de aroma, con una mezcla de humo y malta que varía en balance e intensidad, pero que se complementan mutuamente. Las cualidades similares a una Märzen deberían ser evidentes, en particular una riqueza maltosa y tostada, mientras que el sabor a humo de madera de haya puede ser de bajo a alto. El paladar puede ser algo maltoso, sabroso y dulce, pero el final tiende a ir de semi seco a seco, con el carácter a humo ocasionalmente acentuando la sequedad del final. El retrogusto puede reflejar tanto la riqueza de la malta como los sabores a humo, preferentemente en una presentación balanceada. Amargor de lúpulo moderado y balanceado. Puede tener un sabor a lúpulo hasta moderado, con notas especiadas, florales o herbáceas. Carácter de fermentación lager limpio. La calidad y el carácter del humo es importante; debería ser un ahumado limpio. En mayor intensidad, el humo puede tomar un carácter similar al jamón o tocino, el cual es aceptable mientras no se desvíe al rango grasoso. Sabores ahumados fenólicos ásperos, amargos, quemados, agrios, carbonizados, similares al caucho, sulfurosos o a alquitrán son inapropiados.","Sensación en boca":"Cuerpo medio. Carbonatación de media a media alta. Suave carácter de lager. Una aspereza significativamente astringente y fenólica es inapropiada.","Comentarios":"En alemán literalmente significa cerveza de humo. El carácter e intensidad del humo varían según las malterías y cervecerías, por lo que se deben permitir variaciones en el estilo cuando se juzgue; no todos los ejemplos son extremadamente ahumados. Muchos otros estilos tradicionales alemanes son ahumados; estos deberían ser inscritos en el estilo 32A Classic Style Smoked Beer. Este estilo es solo para la cerveza más común de base Märzen.","Historia":"Una especialidad histórica de la ciudad de Bamberg, en la región de Franconia en Baviera, Alemania. Aunque en el pasado sin duda fueron elaboradas cervezas ahumadas, los orígenes de este estilo en específico no están claros, pero debe haberse desarrollado después de que la Märzen fuera creada.","Ingredientes característicos":"Listado de granos tipo Märzen, con la adición de una cantidad considerable de Rauchmalz alemana (malta tipo Viena ahumada con madera de haya). Algunas cervecerías ahúman su propia malta. Levadura lager alemana. Lúpulos tradicionales alemanes o checos.","Comparación de estilos":"Como una Märzen pero con aroma y sabor ahumado, balanceado y dulce, y un tanto más oscura en color.","Estadísticas vitales":"OG: 1.050 – 1.057 IBU: 20 – 30 FG: 1.012 – 1.016 SRM: 12 – 22 ABV: 4.8 – 6.0%","Ejemplos comerciales":"Cervejaria Bamberg Rauchbier, Göller Rauchbier, Rittmayer Rauchbier, Schlenkerla Rauchbier Märzen, Spezial Rauchbier Märzen","Etiquetas":"intensidad-estándar, color-ámbar, fermentaciónbaja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-lager-ámbar, maltosa"},"glass_color":"#b04500","srm_variable":false,"clarity":"traslucida","foam_color":"#F0E4BE","abv_display":"4.8–6%","ibu_display":"20–30","srm_display":"12–22","og_display":"1.05–1.057","fg_display":"1.012–1.016","country":"Alemania","family":"Amber Lager","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Como una Märzen pero con humo notorio.","ibu_avg":25.0,"ibu_variable":false,"abv_avg":5.4,"abv_variable":false,"summary":"Lager ámbar ahumada con madera de haya, tipo Märzen.","classic_example":"Cervejaria Bamberg Rauchbier","foam_level":3,"foam_height":14,"srm_lo_hex":"#cf6900","srm_hi_hex":"#8e2900","summary_80":"Una lager alemana ámbar, maltosa y ahumada con madera de haya.","distinctive_80":"Como una Märzen pero con aroma y sabor ahumado, balanceado y dulce.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":3},"char_tags":["maltosa"],"ingredients_line":"Listado de granos tipo Märzen.","ingredient_chips":["Listado de granos tipo Märzen","Algunas cervecerías ahúman su…"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Malta media","sabor_highlight":"Malta media","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Listado de granos tipo Märzen","Lúpulos tradicionales alemanes…","Levadura lager alemana"],"sabor_highlights":["Listado de granos tipo Märzen","Lúpulos tradicionales alemanes…","Levadura lager alemana"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Ámbar","Cremosa","Translúcida"],"ingredientes_highlights":["Listado de granos tipo Märzen","Algunas cervecerías ahúman su…"],"ingredient_types":{"malta":"Listado de granos tipo Märzen","lupulo":"Lúpulos tradicionales alemanes…","levadura":"Levadura lager alemana"}},{"code":"6C","name":"Dunkles Bock","category_num":6,"category_name":"Amber Malty European Lager","stats":{"OG":[1.064,1.072],"FG":[1.013,1.019],"IBU":[20.0,27.0],"SRM":[14.0,22.0],"ABV":[6.3,7.2]},"fields":{"Impresión general":"Una lager alemana fuerte, oscura y maltosa, que enfatiza las cualidades de rica maltosidad y un tanto tostadas de las maltas de Europa continental, sin presentar un final dulce.","Aroma":"Carácter de malta rico a pan de medio a medio alto, generalmente con cantidades moderadas de productos de Maillard sabrosos o acentos tostados. Virtualmente sin aroma a lúpulo. Se puede percibir algo de alcohol. Carácter lager limpio, aunque una tenue nota a frutas oscuras es aceptable.","Apariencia":"Color de cobrizo claro a marrón, a menudo con atractivos destellos granate. Buena claridad a pesar del color oscuro. Espuma blanquecina voluminosa, cremosa y persistente.","Sabor":"Maltosidad rica y compleja de intensidad media a media alta, dominada por sabrosos productos de Maillard tostados. Pueden estar presentes algunas notas a caramelo oscuro. El amargor de lúpulo generalmente es solo lo suficientemente elevado como para dar soporte a los sabores de la malta, permitiendo que perdure algo de dulzor de malta en el final. Bien atenuada, no empalagosa. Perfil de fermentación limpio, aunque la malta puede aportar un ligero carácter a frutas oscuras. Sin sabor a lúpulo. Sin carácter rostizado, quemado o a galleta seca.","Sensación en boca":"Cuerpo de medio a medio pleno. Carbonatación de moderadamente baja a moderada. Se puede encontrar algo de tibieza alcohólica, pero no debe ser quemante. Suave, sin asperezas ni astringencia.","Comentarios":"El macerado por decocción juega un rol importante en el desarrollo del sabor, ya que realza los matices de sabor a caramelo y productos de Maillard de la malta.","Historia":"Originada en el norte de Alemania en la ciudad de Einbeck, que fue un centro cervecero y un exportador popular en los días de la Liga Hanseática (siglos XIV al XVII). Recreada en Múnich al inicio del siglo XVII. “Bock” se traduce como “carnero” en alemán, y es el motivo por el que este animal es usualmente utilizado en logos y publicidad.","Ingredientes característicos":"Maltas Múnich y Viena, rara vez una pequeña cantidad de maltas oscuras rostizadas para ajuste de color; nunca adjuntos distintos a malta. Se utilizan variedades de lúpulos de Europa continental. Levadura lager alemana limpia.","Comparación de estilos":"Más oscura, con un perfil de malta más sabroso y un amargor menos aparente que una Helles Bock. Menos alcohol y menos riqueza de malta que una Doppelbock. Sabores a malta más intensos y mayor graduación alcohólica que una Märzen. Más sabrosa, menos atenuada y menos lupulada que una Czech Amber Lager.","Estadísticas vitales":"OG: 1.064 – 1.072 IBU: 20 – 27 FG: 1.013 – 1.019 SRM: 14 – 22 ABV: 6.3 – 7.2%","Ejemplos comerciales":"Aass Bock, Einbecker Ur-Bock Dunkel, Kneitinger Bock, Lindeboom Bock, Schell’s Bock, Penn Brewery St. Nikolaus Bock","Etiquetas":"intensidad-alta, color-ámbar, fermentación-baja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-bock"},"glass_color":"#a63e00","srm_variable":false,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"6.3–7.2%","ibu_display":"20–27","srm_display":"14–22","og_display":"1.064–1.072","fg_display":"1.013–1.019","country":"Alemania","family":"Bock","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Más oscura que una Helles Bock, menos fuerte que una Doppelbock.","
