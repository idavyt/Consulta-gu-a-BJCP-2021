y los procesos de calidad, y no de adjuntos o maltas especiales.","Aroma":"A malta moderadamente intenso, con notas tostadas y a riqueza maltosa. Un bajo aroma a lúpulo floral y especiado es opcional. Carácter limpio de fermentación lager. Un perfil significativo a galleta, caramelo o rostizado es inapropiado.","Apariencia":"Color de ámbar rojizo claro a cobrizo. Claridad brillante. Espuma voluminosa y persistente de color blanquecino.","Sabor":"En un primer plano, complejidad de malta de carácter suave y elegante, con un amargor de lúpulo lo suficientemente firme para aportar un final balanceado. El sabor de la malta tiende hacia un carácter rico y tostado sin sabores significativos a galleta, caramelo o rostizado. Bastante seca, de final suave, presenta tanto riqueza de malta como amargor de lúpulo en el retrogusto. Un bajo sabor a lúpulo floral, especiado o herbáceo es opcional. Perfil de fermentación limpio.","Sensación en boca":"Cuerpo de medio ligero a medio, con una cremosidad agradable. Carbonatación moderada. Suave.","Comentarios":"Es una cerveza de consumo cotidiano con intensidad estándar, no una cerveza elaborada para festivales. Muchos ejemplos tradicionales se han vuelto más dulces y con un alto carácter a adjuntos, siendo similares en la actualidad a las International Amber / Dark Lager.","Historia":"Desarrolladas por Anton Dreher en Viena en 1841, se volvieron populares en la segunda mitad del siglo XIX. Este estilo fue llevado a México por Santiago Graf, y otros cerveceros austriacos inmigrantes, a finales del siglo XIX. En otros países se encuentra principalmente como una interpretación artesanal moderna.","Ingredientes característicos":"Tradicionalmente, malta tipo Viena de la mejor calidad, pero también puede usar maltas tipo Pils o Múnich. Lúpulos tradicionales de Europa continental. Levadura lager alemana de perfil limpio. Puede usar una pequeña cantidad de maltas especiales para aportar color y dulzor.","Comparación de estilos":"Sabor a malta similar al de una Märzen, pero más ligera en cuanto a cuerpo e intensidad, con un balance ligeramente más seco y amargo. Menor intensidad alcohólica que una Märzen o una Festbier. Con menos riqueza, maltosidad y lupulado que una Czech Amber Lager.","Estadísticas vitales":"OG: 1.048 – 1.055 IBU: 18 – 30 FG: 1.010 – 1.014 SRM: 9 – 15 ABV: 4.7 – 5.5%","Ejemplos comerciales":"Chuckanut Vienna Lager, Devils Backbone Vienna Lager, Figueroa Mountain Red Lager, Heavy Seas Cutlass, Ottakringer Wiener Original, Schell’s Firebrick, Theresianer Vienna","Etiquetas":"intensidad-estándar, color-ámbar, fermentaciónbaja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-lager-ámbar"},"glass_color":"#cf6900","srm_variable":false,"clarity":"brillante","foam_color":"#F5F1E6","abv_display":"4.7–5.5%","ibu_display":"18–30","srm_display":"9–15","og_display":"1.048–1.055","fg_display":"1.01–1.014","country":"Austria","family":"Amber Lager","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Como una Märzen pero más ligera y seca.","ibu_avg":24.0,"ibu_variable":false,"abv_avg":5.1,"abv_variable":false,"summary":"Lager ámbar de intensidad moderada, malta a pan tostado.","classic_example":"Chuckanut Vienna Lager","foam_level":3,"foam_height":14,"srm_lo_hex":"#e58500","srm_hi_hex":"#bb5100","summary_80":"Una lager de Europa continental, de color ámbar e intensidad moderada, con una maltosidad suave y delicada, un amargor moderado y balanceado.","distinctive_80":"Sabor a malta similar al de una Märzen, pero más ligera en cuanto a cuerpo e intensidad, con un balance ligeramente más seco y amargo.","mini_profile":{"malta":3,"lupulo":1,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Tradicionalmente, malta tipo Viena de la mejor calidad, pero también puede usar maltas tipo Pils o Múnich.","ingredient_chips":["Tradicionalmente","Lúpulos tradicionales de…"],"balance_pos":1.0,"balance_malta":3,"balance_lupulo":1,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Brillante","boca_highlight":"Cuerpo medio","aroma_highlights":["Tradicionalmente","Lúpulos tradicionales de Europa…","Levadura lager alemana de…"],"sabor_highlights":["Tradicionalmente","Lúpulos tradicionales de Europa…","Levadura lager alemana de…"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Ámbar","Voluminosa","Brillante"],"ingredientes_highlights":["Tradicionalmente","Lúpulos tradicionales de…"],"ingredient_types":{"malta":"Tradicionalmente","lupulo":"Lúpulos tradicionales de Europa…","levadura":"Levadura lager alemana de…"}},{"code":"7B","name":"Altbier","category_num":7,"category_name":"Amber Bitter European Beer","stats":{"OG":[1.044,1.052],"FG":[1.008,1.014],"IBU":[25.0,50.0],"SRM":[9.0,17.0],"ABV":[4.3,5.5]},"fields":{"Impresión general":"Una cerveza de un color moderado, bien atenuada y amarga, con una riqueza de maltas que balancea el fuerte amargor. Un carácter de lúpulo ligero y especiado complementa la malta. Una cerveza seca con un cuerpo firme y paladar suave.","Aroma":"Maltosa y rica con carácter a grano como a pan horneado, corteza de pan tostado o frutos secos. No debe presentar notas a chocolate o a un rostizado más oscuro. La intensidad de maltas va de media a media alta. Una presencia de baja a moderada de lúpulo complementa pero no domina a la malta, y usualmente tiene un perfil especiado, a pimienta o floral. El carácter de fermentación es muy limpio. Ésteres de bajos a medio bajos son opcionales.","Apariencia":"El color varía de ámbar a cobrizo profundo, pero nunca llegando a marrón; un color bronce anaranjado es el más común. Claridad brillante. Espuma blanquecina, cremosa, gruesa y duradera.","Sabor":"Perfil de maltas similar al del aroma, con un marcado amargor de lúpulo de intensidad media a alta que balancea los sabores ricos y maltosos. La cerveza tiene un final de semi seco a seco con un retrogusto a grano, amargo y con riqueza de maltas. El sabor del final perdura un largo tiempo, a veces con una impresión semi amarga o a frutos secos. El nivel de amargor aparente puede estar enmascarado por el carácter de la malta si la cerveza no es muy seca, pero el amargor suele estar nivelado con la riqueza de la malta para mantener el balance. Sin sabores rostizados. Sin asperezas. Perfil de fermentación limpio. Puede presentar ésteres afrutados ligeros, especialmente a frutas oscuras. Sabor a lúpulo de intensidad baja a media con perfil especiado, a pimienta o floral. Puede presentar un carácter mineral opcional de baja intensidad.","Sensación en boca":"Cuerpo medio. Suave. Carbonatación de media a media alta. Astringencia de baja a nula.","Comentarios":"Los ejemplos clásicos y tradicionales son servidos de casks en la Altstadt (“ciudad vieja”) de Düsseldorf. La mayoría de los ejemplos tienen un amargor balanceado (25– 35 IBU), y no el carácter agresivo a lúpulo de la muy popular Zum Uerige. Las versiones más fuertes sticke y doppelsticke deben ser inscritas en la categoría 27 Historical Beer.","Historia":"Se desarrolló a finales del siglo XIX en Düsseldorf usando técnicas de elaboración lager para competir con cervezas de estilo lager. Existen estilos alemanes más antiguos que eran elaborados en la zona, pero no tienen conexión con las Altbier actuales.","Ingredientes característicos":"El listado de granos puede variar, pero normalmente está formado por maltas base alemanas (generalmente Pils, a veces Múnich) con pequeños agregados de maltas tipo Crystal, chocolate u oscuras. Puede incluir algo de trigo, incluso trigo tostado. Los lúpulos Spalt son los tradicionales, pero se pueden usar otros lúpulos clásicos alemanes o checos. Levadura ale limpia y de elevada atenuación. Es tradicional realizar maceración escalonada. Se 14 fermenta en el rango bajo de temperatura de las ales, y luego es acondicionada en frío.","Comparación de estilos":"Más amarga y maltosa que la International Amber Lager. De alguna manera similar a la California Common, tanto en técnicas de elaboración como en sabor y color finales, aunque los ingredientes difieren. Menos alcohol, menos riqueza de maltas y más amargor que la Dunkles Bock. Más amarga, seca y con mayor riqueza que una Vienna Lager.","Estadísticas vitales":"OG: 1.044 – 1.052 IBU: 25 – 50 FG: 1.008 – 1.014 SRM: 9 – 17 ABV: 4.3 – 5.5%","Ejemplos comerciales":"Bolten Alt, Diebels Alt, Füchschen Alt, Original Schlüssel Alt, Schlösser Alt, Schumacher Alt, Uerige Altbier","Etiquetas":"intensidad-estándar, color-ámbar, fermentaciónalta, acondicionada-en-frío, europa-central, estilo-tradicional, familia-ale-ámbar"},"glass_color":"#cb6200","srm_variable":false,"clarity":"brillante","foam_color":"#F5F1E6","abv_display":"4.3–5.5%","ibu_display":"25–50","srm_display":"9–17","og_display":"1.044–1.052","fg_display":"1.008–1.014","country":"Alemania","family":"Amber Ale","glass_shape":"flute","glass_label":"Vaso stange / flauta","distinctive":"Más amarga que una International Amber Lager.","ibu_avg":37.5,"ibu_variable":false,"abv_avg":4.9,"abv_variable":false,"summary":"Ale alemana de color moderado, bien atenuada y amarga.","classic_example":"Bolten Alt","foam_level":2,"foam_height":10,"srm_lo_hex":"#e58500","srm_hi_hex":"#b04500","summary_80":"Una cerveza de un color moderado, bien atenuada y amarga, con una riqueza de maltas que balancea el fuerte amargor.","distinctive_80":"Más amarga y maltosa que la International Amber Lager.","mini_profile":{"malta":3,"lupulo":3,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"El listado de granos puede variar, pero normalmente está formado por maltas base alemanas (generalmente Pils.","ingredient_chips":["Levadura ale limpia y de…","Es tradicional realizar…"],"balance_pos":2.0,"balance_malta":3,"balance_lupulo":3,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Brillante","boca_highlight":"Carbonatación alta","aroma_highlights":["Levadura ale limpia y de…"],"sabor_highlights":["Levadura ale limpia y de…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Ámbar","Cremosa","Brillante"],"ingredientes_highlights":["Levadura ale limpia y de…","Es tradicional realizar…"],"ingredient_types":{"levadura":"Levadura ale limpia y de…"}},{"code":"8A","name":"Munich Dunkel","category_num":8,"category_name":"Dark European Lager","stats":{"OG":[1.048,1.056],"FG":[1.01,1.016],"IBU":[18.0,28.0],"SRM":[17.0,28.0],"ABV":[4.5,5.6]},"fields":{"Impresión general":"Una lager maltosa y marrón, tradicional de Baviera. Con sabores de malta profundamente tostados y a pan, sin un carácter rostizado ni quemado. Suave y sabrosa, con un discreto amargor y un final relativamente seco, que permite su consumo en gran cantidad.","Aroma":"Riqueza de malta de moderada a alta, como corteza de pan tostado con notas a chocolate, frutos secos, caramelo o toffee. Las versiones tradicionales frescas generalmente presentan niveles más elevados de chocolate. El carácter a malta es más con una riqueza maltosa que con un dulzor de azúcar o de caramelo. Perfil de fermentación limpio. Un aroma a lúpulo ligeramente especiado, floral o herbáceo es opcional.","Apariencia":"Color de cobrizo profundo a marrón oscuro, generalmente con un tinte rojo o granate. Espuma cremosa de color canela, con tono de ligero a medio. Usualmente traslúcida.","Sabor":"Sabor a malta rico con intensidad de media a alta, similar al aroma (aplican los mismos descriptores de malta). Discreto amargor de intensidad media baja a media, que resulta en un balance general hacia la malta. Paladar maltoso y suave, sin ser demasiado dulce, con un final semi seco y un retrogusto maltoso. Sin sabores rostizados, quemados o amargos provenientes de la malta. Los sabores tostados no deberían tener una sequedad granosa áspera, y los sabores a caramelo no deberían ser dulces. Un sabor a lúpulo ligeramente especiado, herbáceo o floral es opcional. Perfil de fermentación limpio.","Sensación en boca":"Cuerpo de medio a medio pleno, aportando una sensación suave y dextrinosa, sin ser pesada ni empalagosa. Carbonatación moderada. Suave carácter a lager. Sin astringencia áspera o punzante. Sin tibieza alcohólica.","Comentarios":"Estilo tradicional de Múnich, es el equivalente oscuro de la Helles. Las versiones de Franconia son más amargas que las de Múnich.","Historia":"Creada por Spaten en la década de 1830 a raíz del desarrollo de la malta Múnich, y vista como la sucesora de las cervezas regionales oscuras de la época. Aunque se originó en Múnich, el estilo se popularizó por toda Baviera (especialmente en Franconia).","Ingredientes característicos":"Tradicionalmente usa maltas Múnich, pero las Pils y Viena pueden ser utilizadas también. Uso ligero de maltas especiales para color y profundidad. El macerado por decocción es tradicional. Lúpulos y levaduras lager alemanes.","Comparación de estilos":"Menos fuerte y con un perfil de malta menos intenso que una Dunkles Bock. Carente de los sabores más rostizados y a menudo del amargor de lúpulo de una Schwarzbier. Más sabrosa, más centrada en la malta y menos lupulada que una Czech Dark Lager.","Estadísticas vitales":"OG: 1.048 – 1.056 IBU: 18 – 28 FG: 1.010 – 1.016 SRM: 17 – 28 ABV: 4.5 – 5.6%","Ejemplos comerciales":"Ayinger Altbairisch Dunkel, Ettaler Kloster-Dunkel, Eittinger Urtyp Dunkel, Hacker-Pschorr Münchner Dunkel, Hofbräuhaus Dunkel, Weltenburger Kloster Barock-Dunkel","Etiquetas":"intensidad-estándar, color-oscuro, fermentaciónbaja, acondicionada-en-frío, europa-central, estilo-tradicional, maltosa"},"glass_color":"#8b2600","srm_variable":false,"clarity":"traslucida","foam_color":"#D9B183","abv_display":"4.5–5.6%","ibu_display":"18–28","srm_display":"17–28","og_display":"1.048–1.056","fg_display":"1.01–1.016","country":"Alemania","family":"Dark Lager","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Menos fuerte que una Dunkles Bock, menos rostizada que una Schwarzbier.","ibu_avg":23.0,"ibu_variable":false,"abv_avg":5.0,"abv_variable":false,"summary":"Lager marrón y maltosa de Baviera, sabor a pan tostado.","classic_example":"Ayinger Altbairisch Dunkel","foam_level":1,"foam_height":7,"srm_lo_hex":"#b04500","srm_hi_hex":"#6a0e00","summary_80":"Una lager maltosa y marrón, tradicional de Baviera. Con sabores de malta profundamente tostados y a pan, sin un carácter rostizado ni quemado.","distinctive_80":"Menos fuerte y con un perfil de malta menos intenso que una Dunkles Bock.","mini_profile":{"malta":3,"lupulo":1,"cuerpo":2,"carbonatacion":2},"char_tags":["maltosa"],"ingredients_line":"Tradicionalmente usa maltas Múnich, pero las Pils y Viena pueden ser utilizadas también.","ingredient_chips":["Tradicionalmente usa maltas…","Uso ligero de maltas…"],"balance_pos":1.0,"balance_malta":3,"balance_lupulo":1,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":["Tradicionalmente usa maltas…","Lúpulos y levaduras lager…","Lúpulos y levaduras lager…"],"sabor_highlights":["Tradicionalmente usa maltas…","Lúpulos y levaduras lager…","Lúpulos y levaduras lager…"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Cobrizo","Cremosa","Translúcida"],"ingredientes_highlights":["Tradicionalmente usa maltas…","Uso ligero de maltas…"],"ingredient_types":{"malta":"Tradicionalmente usa maltas…","lupulo":"Lúpulos y levaduras lager…","levadura":"Lúpulos y levaduras lager…"}},{"code":"8B","name":"Schwarzbier","category_num":8,"category_name":"Dark European Lager","stats":{"OG":[1.046,1.052],"FG":[1.01,1.016],"IBU":[20.0,35.0],"SRM":[19.0,30.0],"ABV":[4.4,5.4]},"fields":{"Impresión general":"Una lager alemana oscura que balancea sabores rostizados pero suaves a malta, con un amargor de lúpulo moderado. El cuerpo más ligero, el final seco y la ausencia de un retrogusto áspero, quemado o pesado, la ayudan a ser bastante fácil de tomar.","Aroma":"A malta de bajo a moderado, con un bajo dulzor de malta y notas a malta rostizada a menudo aparentes. La malta puede ser limpia y neutra, o moderadamente rica y con carácter a pan, y puede tener una nota a caramelo oscuro. El carácter rostizado puede recordar a chocolate amargo o a café, pero nunca debería ser quemado. Un aroma a lúpulo especiado, floral o herbáceo moderadamente bajo es opcional. Carácter limpio de levadura lager.","Apariencia":"Color de marrón medio a muy oscuro, generalmente con destellos de rubí profundo a granate, pero casi nunca es realmente negra. Muy traslúcida. Espuma color canela, voluminosa y persistente.","Sabor":"A malta de ligero a moderado, que puede tener desde un carácter limpio y neutro hasta una cualidad moderadamente rica y a pan. Sabores a malta rostizada de ligeros a moderados, que pueden aportar un paladar a chocolate amargo sin ser quemado. Amargor de medio bajo a medio. Sabor a lúpulo especiado, floral o herbáceo de ligero a moderado. Carácter limpio de fermentación lager. Final seco. Cierto dulzor residual es aceptable pero no tradicional. Retrogusto con amargor de lúpulo, con un rostizado complementario pero sutil en segundo plano.","Sensación en boca":"Cuerpo de medio ligero a medio. Carbonatación de moderada a moderadamente alta. Suave. Sin aspereza ni astringencia, a pesar del uso de maltas oscuras rostizadas.","Comentarios":"Literalmente significa cerveza negra en alemán. Algunas veces llamada “Pils negra”, la cerveza rara vez es tan oscura como para llegar al negro, ni tan lupulada y 15 amarga como una Pils. Sabores rostizados fuertes, similares a una porter, son un defecto.","Historia":"Una especialidad regional de Turingia, Sajonia y Franconia en Alemania. Sirvió de inspiración para las lagers oscuras elaboradas en Japón. Su popularidad se incrementó después de la reunificación alemana en 1990.","Ingredientes característicos":"Maltas base alemanas Múnich y Pilsner, con maltas oscuras rostizadas sin cáscara, que aportan un perfil rostizado sin generar sabores quemados. Son tradicionales las variedades alemanas de lúpulos y las levaduras lager limpias.","Comparación de estilos":"En comparación con una Munich Dunkel, es usualmente más oscura, más seca en el paladar, con un cuerpo más ligero y un perfil perceptible (pero no elevado) de malta rostizada para balancear la malta base. No debería saber como una American Porter elaborada con levadura lager. Más seca, menos maltosa y con menos carácter a lúpulo que una Czech Dark Lager.","Estadísticas vitales":"OG: 1.046 – 1.052 IBU: 20 – 35 FG: 1.010 – 1.016 SRM: 19 – 30 ABV: 4.4 – 5.4%","Ejemplos comerciales":"Chuckanut Schwarz Lager, Devils Backbone Schwartz Bier, Köstritzer Schwarzbier, Kulmbacher Mönchshof Schwarzbier, Neuzeller Original Badebier, pFriem Schwarzbier","Etiquetas":"intensidad-estándar, color-oscuro, fermentaciónbaja, acondicionada-en-frío, europa-central, estilo-tradicional, balanceada"},"glass_color":"#7e1c00","srm_variable":false,"clarity":"traslucida","foam_color":"#D9B183","abv_display":"4.4–5.4%","ibu_display":"20–35","srm_display":"19–30","og_display":"1.046–1.052","fg_display":"1.01–1.016","country":"Alemania","family":"Dark Lager","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Más seca y ligera que una Munich Dunkel.","ibu_avg":27.5,"ibu_variable":false,"abv_avg":4.9,"abv_variable":false,"summary":"Lager alemana oscura, malta rostizada suave, final seco.","classic_example":"Chuckanut Schwarz Lager","foam_level":3,"foam_height":14,"srm_lo_hex":"#a13700","srm_hi_hex":"#5e0b00","summary_80":"Una lager alemana oscura que balancea sabores rostizados pero suaves a malta, con un amargor de lúpulo moderado.","distinctive_80":"En comparación con una Munich Dunkel, es usualmente más oscura, más seca en el paladar.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":3},"char_tags":["balanceada"],"ingredients_line":"Maltas base alemanas Múnich y Pilsner, con maltas oscuras rostizadas sin cáscara.","ingredient_chips":["Maltas base alemanas Múnich y…","Son tradicionales las…"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Malta media","sabor_highlight":"Malta media","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Maltas base alemanas Múnich y…","Son tradicionales las…","Son tradicionales las…"],"sabor_highlights":["Maltas base alemanas Múnich y…","Son tradicionales las…","Son tradicionales las…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Marrón","Voluminosa","Translúcida"],"ingredientes_highlights":["Maltas base alemanas Múnich y…","Son tradicionales las…"],"ingredient_types":{"malta":"Maltas base alemanas Múnich y…","lupulo":"Son tradicionales las…","levadura":"Son tradicionales las…"}},{"code":"9A","name":"Doppelbock","category_num":9,"category_name":"Strong European Beer","stats":{"OG":[1.072,1.112],"FG":[1.016,1.024],"IBU":[16.0,26.0],"SRM":[6.0,25.0],"ABV":[7.0,10.0]},"fields":{"Impresión general":"Una cerveza lager alemana, fuerte, rica y muy maltosa, que puede tener variedades pálidas y oscuras. Las versiones más oscuras presentan sabores a malta más profundos y complejos, mientras que las versiones más pálidas tienen un poco más de lúpulo y son más secas.","Aroma":"Maltosidad muy intensa, con notas ligeras a caramelo opcionales, y un aroma a alcohol que puede llegar a ser moderado. Prácticamente sin aroma a lúpulo. Las versiones oscuras poseen ricos y significativos productos de Maillard, malta con tostado profundo y posiblemente un ligero aroma a chocolate, que nunca debe percibirse como rostizado o quemado. Se permite un aroma a fruta oscura moderadamente bajo como a ciruelas, uvas negras o fruit leather (Nota de la Traducción: snack a base de puré de fruta deshidratado, con textura que se asemeja al cuero y sabor a fruta concentrado). Las versiones pálidas tienen una fuerte presencia de malta rica, a menudo tostada, posiblemente con una ligera presencia de lúpulo floral, especiado o herbáceo.","Apariencia":"Buena claridad, con una espuma voluminosa, cremosa y persistente. Las versiones oscuras son de color desde cobrizo a marrón oscuro, a menudo con reflejos rubí, y con una espuma blanquecina. Las versiones pálidas son de color desde dorado profundo a ámbar claro, con una espuma blanca.","Sabor":"Muy rico y maltoso. El amargor del lúpulo varía de moderadamente bajo a moderado, pero siempre permite que la malta domine el sabor. Un leve sabor a lúpulo es opcional. La mayoría de los ejemplos están bastante orientados al dulzor de malta en el paladar, pero deben tener una impresión de atenuación en el final. La impresión de dulzor proviene del bajo lupulado, no de una fermentación incompleta. Perfil de fermentación limpio. Las versiones oscuras tienen sabores a malta y ésteres similares al aroma (mismos descriptores e intensidades). Las versiones pálidas tienen un intenso sabor a malta con carácter tostado y a pan, un ligero sabor a lúpulo floral, especiado o herbáceo, y un final más seco.","Sensación en boca":"Cuerpo de medio pleno a pleno. Carbonatación de moderadamente baja a moderada. Muy suave, sin asperezas ni astringencia. Se puede percibir una ligera tibieza alcohólica, pero nunca debe quemar. 16","Comentarios":"Doppelbock significa Bock doble. La mayoría de las versiones son de color oscuro, y pueden mostrar caramelización y productos de Maillard debido a un macerado por decocción. También existen excelentes versiones pálidas que, a diferencia de las oscuras, no tendrán la misma riqueza y sabores a malta y frutas oscuras, y pueden ser un poco más secas, más lupuladas y más amargas. Aunque la mayoría de los ejemplos tradicionales están en el extremo inferior de los rangos citados, se puede considerar que el estilo no tiene un límite superior para la densidad y el alcohol, siempre que el balance sea el mismo.","Historia":"Una especialidad bávara originaria de Múnich, elaborada primero por los monjes de San Francisco de Paula en el siglo XVIII. Las versiones históricas estaban menos atenuadas que las interpretaciones modernas, por lo tanto, con mayor dulzor y menor nivel de alcohol. Los monjes la llamaban “pan líquido” y se consumía durante el ayuno de la Cuaresma. Las cervecerías adoptaron nombres que terminan en “-ator” para estas cervezas luego de un fallo judicial del siglo XIX, por el que solo a Paulaner se le permitió usar el nombre de Salvator. Tradicionalmente eran de color marrón oscuro; los ejemplos más pálidos son un desarrollo más reciente.","Ingredientes característicos":"Maltas Pils, Viena y Múnich. Ocasionalmente malta oscura para ajuste de color. Lúpulos alemanes tradicionales. Levadura lager alemana limpia. El macerado por decocción es tradicional.","Comparación de estilos":"Una versión más fuerte, más rica y con más cuerpo de una Dunkles Bock o una Helles Bock. Las versiones pálidas mostrarán una mayor atenuación y un menor carácter a frutas oscuras que las versiones más oscuras.","Instrucciones para la inscripción":"Quien inscriba especificará si la cerveza es una variedad pálida u oscura.","Estadísticas vitales":"OG: 1.072 – 1.112 IBU: 16 – 26 FG: 1.016 – 1.024 SRM: 6 – 25 ABV: 7.0 – 10.0%","Ejemplos comerciales":"Versiones oscuras – Andechs Doppelbock Dunkel, Ayinger Celebrator, Paulaner Salvator, Spaten Optimator, Tröegs Troegenator, Weihenstephaner Korbinian; Versiones pálidas – Eggenberg Urbock 23°, Meinel Doppelbock Hell, Plank Bavarian Heller Doppelbock, Riegele Auris 19, Schönbuch Doppelbock Hell, Staffelberg-Bräu Zwergator","Etiquetas":"intensidad-alta, color-ámbar, color-pálido, fermentación-baja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-bock"},"glass_color":"#b84e00","srm_variable":false,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"7–10%","ibu_display":"16–26","srm_display":"6–25","og_display":"1.072–1.112","fg_display":"1.016–1.024","country":"Alemania","family":"Bock","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Una Dunkles/Helles Bock llevada a mayor fuerza y cuerpo.","ibu_avg":21.0,"ibu_variable":false,"abv_avg":8.5,"abv_variable":false,"summary":"Lager alemana fuerte, rica y muy maltosa.","classic_example":"Versiones oscuras – Andechs Doppelbock Dunkel","foam_level":3,"foam_height":14,"srm_lo_hex":"#f8a600","srm_hi_hex":"#7b1a00","summary_80":"Una cerveza lager alemana, fuerte, rica y muy maltosa, que puede tener variedades pálidas y oscuras.","distinctive_80":"Una versión más fuerte, más rica y con más cuerpo de una Dunkles Bock o una Helles Bock.","mini_profile":{"malta":4,"lupulo":2,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Maltas Pils, Viena y Múnich. Ocasionalmente malta oscura para ajuste de color. Lúpulos alemanes tradicionales.","ingredient_chips":["Maltas Pils","Lúpulos alemanes tradicionales"],"balance_pos":1.5,"balance_malta":3,"balance_lupulo":2,"aroma_highlight":"Malta muy alta","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":["Maltas Pils","Lúpulos alemanes tradicionales","Levadura lager alemana limpia"],"sabor_highlights":["Maltas Pils","Lúpulos alemanes tradicionales","Levadura lager alemana limpia"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Oscura","Cremosa","Translúcida"],"ingredientes_highlights":["Maltas Pils","Lúpulos alemanes tradicionales"],"ingredient_types":{"malta":"Maltas Pils","lupulo":"Lúpulos alemanes tradicionales","levadura":"Levadura lager alemana limpia"}},{"code":"9B","name":"Eisbock","category_num":9,"category_name":"Strong European Beer","stats":{"OG":[1.078,1.12],"FG":[1.02,1.035],"IBU":[25.0,35.0],"SRM":[17.0,30.0],"ABV":[9.0,14.0]},"fields":{"Impresión general":"Una lager alemana de color oscuro, fuerte, de cuerpo pleno, rica y maltosa, a menudo con un carácter viscoso y sabores intensos. Aunque los sabores están concentrados, el alcohol debe ser suave y cálido, no quemante.","Aroma":"Dominado por una rica e intensa maltosidad, y una evidente presencia de alcohol. La malta puede tener cualidades tostadas y a pan, con un poco de caramelo o un leve chocolate, a menudo con notas a frutas oscuras, como ciruelas o uvas. Sin aroma a lúpulo. Los aromas del alcohol no deben ser ásperos ni similares al solvente. Perfil de fermentación limpio.","Apariencia":"Color de cobrizo profundo a marrón oscuro, a menudo con atractivos reflejos rubí. Buena claridad. La retención de espuma puede ser de pobre a moderada. Espuma de color desde blanquecino a marfil intenso. Unas piernas pronunciadas, a menudo, son evidentes.","Sabor":"Maltosidad rica y dulce, balanceada por una presencia de alcohol significativa. La malta puede aportar productos de Maillard, un carácter tostado, algo de caramelo, y de vez en cuando, un ligero sabor a chocolate. Puede tener importante presencia de ésteres de frutas oscuras derivados de la malta. El amargor de lúpulo solo compensa el dulzor de la malta, lo suficiente como para evitar un carácter empalagoso. Sin sabor a lúpulo. El alcohol ayuda a balancear la intensa presencia de malta. El final debe ser a malta rica, pero con una cierta sequedad proveniente del alcohol. No debe tener un dulzor pegajoso, almibarado o empalagoso. Perfil de fermentación limpio.","Sensación en boca":"Cuerpo de pleno a muy pleno. Baja carbonatación. Calidez significativa del alcohol sin un calor áspero. Muy suave y sedosa, sin asperezas de alcohol, amargor, alcoholes superiores u otros sabores concentrados.","Comentarios":"A menudo es necesaria una maduración en frío prolongada, posterior a la congelación, para suavizar el alcohol y realzar el balance entre este y la malta. Se pronuncia \"AISbock\".","Historia":"Es originaria de Kulmbach, Franconia, a finales del siglo XIX, aunque no se conoce su origen exacto. Las fábulas la describen como si viniera de una cerveza que se congeló accidentalmente en una cervecería.","Ingredientes característicos":"Similar al estilo Doppelbock. Producida al congelar una cerveza tipo Doppelbock y quitar el hielo (“destilación por congelación”), concentrando de esta manera el sabor y el alcohol, así como cualquier defecto presente. Las Eisbock comerciales generalmente tienen una concentración de entre un 7% y 33% de su volumen.","Comparación de estilos":"Las Eisbock no son simplemente Doppelbock más fuertes; el nombre hace referencia al proceso de congelar y concentrar la cerveza, y no es una declaración sobre el alcohol; algunas Doppelbock son más fuertes que las Eisbock. No tan espesas, ricas o dulces como un Wheatwine.","Estadísticas vitales":"OG: 1.078 – 1.120 IBU: 25 – 35 FG: 1.020 – 1.035 SRM: 17 – 30 ABV: 9.0 – 14.0%","Ejemplos comerciales":"Kulmbacher Eisbock","Etiquetas":"intensidad-muy-alta, color-ámbar, fermentaciónbaja, acondicionada-en-frío, europa-central, estilo-tradicional, familia-bock"},"glass_color":"#852000","srm_variable":false,"clarity":"traslucida","foam_color":"#F1E8CE","abv_display":"9–14%","ibu_display":"25–35","srm_display":"17–30","og_display":"1.078–1.12","fg_display":"1.02–1.035","country":"Alemania","family":"Bock","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"No es solo una Doppelbock más fuerte: refiere al proceso de congelado.","ibu_avg":30.0,"ibu_variable":false,"abv_avg":11.5,"abv_variable":false,"summary":"Lager oscura y fuerte, concentrada por congelación.","classic_example":"Kulmbacher Eisbock","foam_level":1,"foam_height":7,"srm_lo_hex":"#b04500","srm_hi_hex":"#5e0b00","summary_80":"Una lager alemana de color oscuro, fuerte, de cuerpo pleno, rica y maltosa, a menudo con un carácter viscoso y sabores intensos.","distinctive_80":"Las Eisbock no son simplemente Doppelbock más fuertes; el nombre hace referencia al proceso de congelar y concentrar la cerveza.","mini_profile":{"malta":3,"lupulo":0,"cuerpo":2,"carbonatacion":1},"char_tags":[],"ingredients_line":"Similar al estilo Doppelbock.","ingredient_chips":["Similar al estilo Doppelbock","Producida al congelar una…"],"balance_pos":0.5,"balance_malta":3,"balance_lupulo":0,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Cuerpo medio","Carbonatación baja"],"apariencia_highlights":["Cobrizo","Translúcida"],"ingredientes_highlights":["Similar al estilo Doppelbock","Producida al congelar una…"],"ingredient_types":{}},{"code":"9C","name":"Baltic Porter","category_num":9,"category_name":"Strong European Beer","stats":{"OG":[1.06,1.09],"FG":[1.016,1.024],"IBU":[20.0,40.0],"SRM":[17.0,30.0],"ABV":[6.5,9.5]},"fields":{"Impresión general":"Una cerveza fuerte, oscura y maltosa con diferentes interpretaciones dentro de la región Báltica. Suave, cálida y ricamente maltosa, con complejos sabores a frutas oscuras y un sabor rostizado sin notas quemadas.","Aroma":"Maltosidad rica que a menudo contiene notas a caramelo, toffee, frutos secos, profundas a tostadas o regaliz. Perfil complejo de alcohol y ésteres de intensidad moderada, que recuerdan a ciruelas, ciruelas pasas, uvas pasas, cerezas o grosellas, ocasionalmente con una cualidad vinosa similar a la del oporto. Profundos toques de malta a chocolate amargo, café o melaza, pero nunca quemados. Sin lúpulo. Sin acidez. Con una impresión suave y sin asperezas.","Apariencia":"Color de rojizo oscuro o cobrizo a marrón oscuro opaco, pero no negro. Espuma de color canela espesa y persistente. Traslúcida, aunque las versiones más oscuras pueden ser opacas.","Sabor":"Al igual que en el aroma, tiene una rica maltosidad con una compleja mezcla de maltas intensas, ésteres a frutos deshidratados y alcohol. La malta puede tener una complejidad a caramelo, toffee, frutos secos, melaza o regaliz. Sabor rostizado prominente pero suave, similar al estilo Schwarzbier, a punto de percibirse quemado. Ligeros toques a grosellas negras y frutas oscuras deshidratadas. Paladar suave y final pleno. Comienza con una maltosidad dulce, pero los sabores de las maltas más oscuras dominan rápidamente y persisten hasta un final algo seco, dejando un toque a café rostizado o regaliz y frutas deshidratadas en el retrogusto. Amargor de medio bajo a medio, solo para proporcionar balance y evitar que se perciba empalagosa. El sabor a lúpulo ligeramente especiado varía de nulo a medio bajo. Perfil de fermentación limpio.","Sensación en boca":"En general con bastante cuerpo y suave, con una tibieza alcohólica correctamente envejecida que puede resultar engañosa. Carbonatación de media a media alta, lo que la hace parecer aún más plena. No es pesada en la lengua debido al nivel de carbonatación.","Comentarios":"La mayoría de las versiones comerciales están en el rango de 7–8.5% ABV. Los mejores ejemplos tienen una intensidad engañosa, que las hace peligrosamente fáciles de tomar. El carácter de estas cervezas varía según el país de origen, así que tenga cuidado en generalizar basándose en un solo ejemplo. Algunas cervezas son más fieles a sus raíces inglesas, mientras que otras son más del estilo inicialmente popularizado en Polonia.","Historia":"Desarrollada de forma autóctona (e independiente) en varios países que bordean el Mar Báltico, después de que la importación de las populares porter y stout inglesas se interrumpiera a principios del siglo XIX. Históricamente de fermentación alta, muchas cervecerías adaptaron las recetas para levaduras de fermentación baja, junto con el resto de sus productos. El nombre Baltic Porter es reciente (desde la década de 1990) y describe la colección moderna de cervezas de estos países con un perfil de alguna manera similar, no las versiones históricas.","Ingredientes característicos":"Generalmente levadura lager (fermentada en frío si se utiliza levadura ale, como se requiere cuando se elabora en Rusia). Malta oscura desamargada. Malta base Múnich o Viena. Lúpulos de Europa continental. Puede contener maltas tipo Crystal o adjuntos. En recetas históricas, es común la malta marrón o ámbar. Ya que es una colección de cervezas regionales, se esperan recetas diversas.","Comparación de estilos":"Combina el cuerpo, maltosidad, riqueza y suavidad de una Doppelbock, el carácter a maltas más oscuras de una English Porter, los sabores rostizados de 17 una Schwarzbier, y el alcohol y la frutosidad de una Old Ale. Mucho menos rostizada y a menudo más baja en alcohol que una Imperial Stout.","Estadísticas vitales":"OG: 1.060 – 1.090 IBU: 20 – 40 FG: 1.016 – 1.024 SRM: 17 – 30 ABV: 6.5 – 9.5%","Ejemplos comerciales":"Aldaris Mežpils Porteris, Baltika 6 Porter, Devils Backbone Danzig, Okocim Mistrzowski Porter, Sinebrychoff Porter, Zywiec Porter","Etiquetas":"intensidad-alta, color-oscuro, cualquierfermentación, acondicionada-en-frío, europa-oriental, estilotradicional, familia-porter"},"glass_color":"#852000","srm_variable":false,"clarity":"opaca","foam_color":"#D9B183","abv_display":"6.5–9.5%","ibu_display":"20–40","srm_display":"17–30","og_display":"1.06–1.09","fg_display":"1.016–1.024","country":"Escandinavia","family":"Porter","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Cruce entre Doppelbock, Porter inglesa y Schwarzbier.","ibu_avg":30.0,"ibu_variable":false,"abv_avg":8.0,"abv_variable":false,"summary":"Cerveza fuerte, oscura y maltosa de tradición báltica.","classic_example":"Aldaris Mežpils Porteris","foam_level":3,"foam_height":14,"srm_lo_hex":"#b04500","srm_hi_hex":"#5e0b00","summary_80":"Una cerveza fuerte, oscura y maltosa con diferentes interpretaciones dentro de la región Báltica. Suave, cálida y ricamente maltosa.","distinctive_80":"Combina el cuerpo, maltosidad, riqueza y suavidad de una Doppelbock, el carácter a maltas más oscuras de una English Porter.","mini_profile":{"malta":3,"lupulo":1,"cuerpo":1,"carbonatacion":3},"char_tags":[],"ingredients_line":"Generalmente levadura lager (fermentada en frío si se utiliza levadura ale, como se requiere cuando se elabora en Rusia).","ingredient_chips":["Generalmente levadura lager…","Malta oscura desamargada"],"balance_pos":1.0,"balance_malta":3,"balance_lupulo":1,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Opaca","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta oscura desamargada","Lúpulos de Europa continental","Generalmente levadura lager…"],"sabor_highlights":["Malta oscura desamargada","Lúpulos de Europa continental","Generalmente levadura lager…"],"boca_highlights":["Carbonatación alta","Cuerpo ligero"],"apariencia_highlights":["Rojizo","Canela","Opaca"],"ingredientes_highlights":["Generalmente levadura lager…","Malta oscura desamargada"],"ingredient_types":{"malta":"Malta oscura desamargada","lupulo":"Lúpulos de Europa continental","levadura":"Generalmente levadura lager…"}},{"code":"10A","name":"Weissbier","category_num":10,"category_name":"German Wheat Beer","stats":{"OG":[1.044,1.053],"FG":[1.008,1.014],"IBU":[8.0,15.0],"SRM":[2.0,6.0],"ABV":[4.3,5.6]},"fields":{"Impresión general":"Una cerveza de trigo alemana pálida, refrescante, ligeramente lupulada, con alta carbonatación, final seco, sensación en boca esponjosa, y con un perfil de fermentación único que aporta un carácter a banana/plátano y clavo de olor.","Aroma":"Ésteres y fenoles de moderados a fuertes, típicamente banana/plátano y clavo de olor, a menudo bien balanceados y comúnmente más intensos que la malta. Aroma a malta de ligero a moderado con notas a pan, masa o a granos de trigo. Un ligero aroma a vainilla es opcional. Un carácter ligero a lúpulo floral, especiado o herbáceo es opcional. Un carácter a goma de mascar (frutilla/fresa con banana/plátano), acidez o ahumado son defectos.","Apariencia":"Color de pajizo pálido a dorado. Espuma blanca muy gruesa, como mousse, y de larga duración. Puede ser turbia y con brillo por el trigo y la levadura, aunque puede sedimentar en las botellas.","Sabor":"Banana/plátano y clavo de olor de bajos a moderadamente fuertes, a menudo bien balanceados. Sabor del trigo suave, algo similar al pan, a masa o granos de intensidad baja a moderada, apoyado por un ligero carácter a grano dulce de la malta Pils. Amargor de muy bajo a moderadamente bajo. Paladar redondo y lleno de sabor, con un final relativamente seco. Un ligero carácter a vainilla es opcional. Un sabor muy bajo a lúpulo floral, especiado o herbáceo es opcional. Cualquier impresión de dulzor se debe más al bajo amargor que al azúcar residual; un final dulce o pesado afecta la tomabilidad. Sabor a goma de mascar, acidez o ahumado son defectos. Si bien el perfil a banana/plátano y a clavo de olor es importante, no debería ser tan intenso como para percibirse extremo y desequilibrado.","Sensación en boca":"Cuerpo de medio ligero a medio; nunca pesado. Sensación plena esponjosa y cremosa, que evoluciona hacia un final ligero y burbujeante, reforzado por una carbonatación de alta a muy alta. Efervescente.","Comentarios":"También conocida como Hefeweizen o Weizenbier, particularmente fuera de Baviera. Estas cervezas se disfrutan mejor jóvenes y frescas, ya que a menudo no envejecen bien. En Alemania las versiones ligeras de menos alcohol (leicht) y sin alcohol son populares. Las versiones Kristall se filtran para obtener una claridad brillante.","Historia":"Aunque Baviera tiene una tradición de cervezas de trigo que se remonta a antes del siglo XVI, la elaboración de cervezas de trigo solía ser un monopolio reservado a la realeza bávara. Las Weissbier modernas datan de 1872, cuando Schneider comenzó la producción de su versión ámbar. Sin embargo, las Weissbier pálidas solo se hicieron populares a 18 partir de la década de 1960 (aunque históricamente el nombre podía usarse en Alemania para describir cervezas elaboradas con malta secada al aire, una tradición diferente). Hoy en día es muy popular, sobre todo en el sur de Alemania.","Ingredientes característicos":"El trigo malteado es al menos la mitad del listado de granos. Malta Pilsner. El macerado por decocción es tradicional. Levadura Weizen y temperaturas de fermentación bajas.","Comparación de estilos":"Comparado con la American Wheat, tiene un carácter de levadura a banana/plátano y clavo de olor, y menos amargor. Comparado con una Dunkles Weissbier, tiene un color más pálido, y menos sabor y riqueza de malta.","Instrucciones para la inscripción":"Quien inscriba puede especificar si la levadura debe agitarse antes de servir.","Estadísticas vitales":"OG: 1.044 – 1.053 IBU: 8 – 15 FG: 1.008 – 1.014 SRM: 2 – 6 ABV: 4.3 – 5.6%","Ejemplos comerciales":"Ayinger Bräuweisse, Distelhäuser Hell Weizen, Hacker-Pschorr Hefeweißbier, Hofbräuhaus Münchner Weisse, Schneider Weisse Original Weissbier, Weihenstephaner Hefeweißbier","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónalta, europa-central, estilo-tradicional, familia-cerveza-trigo"},"glass_color":"#ffbf42","srm_variable":false,"clarity":"turbia","foam_color":"#F7F4EC","abv_display":"4.3–5.6%","ibu_display":"8–15","srm_display":"2–6","og_display":"1.044–1.053","fg_display":"1.008–1.014","country":"Alemania","family":"Wheat Beer","glass_shape":"weizen","glass_label":"Vaso weizen","distinctive":"A diferencia de la American Wheat, la define la levadura.","ibu_avg":11.5,"ibu_variable":false,"abv_avg":4.9,"abv_variable":false,"summary":"Cerveza de trigo alemana pálida, con banana y clavo de olor.","classic_example":"Ayinger Bräuweisse","foam_level":2,"foam_height":10,"srm_lo_hex":"#ffd878","srm_hi_hex":"#f8a600","summary_80":"Una cerveza de trigo alemana pálida, refrescante, ligeramente lupulada, con alta carbonatación, final seco, sensación en boca esponjosa.","distinctive_80":"Comparado con la American Wheat, tiene un carácter de levadura a banana/plátano y clavo de olor, y menos amargor. Comparado con una Dunkles Weissbier.","mini_profile":{"malta":3,"lupulo":1,"cuerpo":2,"carbonatacion":4},"char_tags":[],"ingredients_line":"El trigo malteado es al menos la mitad del listado de granos. Malta Pilsner. El macerado por decocción es tradicional.","ingredient_chips":["Malta Pilsner","Levadura Weizen y…"],"balance_pos":2.0,"balance_malta":1,"balance_lupulo":1,"aroma_highlight":"Malta alta","sabor_highlight":"Malta baja","apariencia_highlight":"Turbia","boca_highlight":"Carbonatación muy alta","aroma_highlights":["Malta Pilsner","Levadura Weizen y temperaturas…"],"sabor_highlights":["Malta Pilsner","Levadura Weizen y temperaturas…"],"boca_highlights":["Carbonatación muy alta","Cuerpo medio"],"apariencia_highlights":["Pajizo","Blanca","Turbia"],"ingredientes_highlights":["Malta Pilsner","Levadura Weizen y…"],"ingredient_types":{"malta":"Malta Pilsner","levadura":"Levadura Weizen y temperaturas…"}},{"code":"10B","name":"Dunkles Weissbier","category_num":10,"category_name":"German Wheat Beer","stats":{"OG":[1.044,1.057],"FG":[1.008,1.014],"IBU":[10.0,18.0],"SRM":[14.0,23.0],"ABV":[4.3,5.6]},"fields":{"Impresión general":"Una cerveza de trigo alemana moderadamente oscura con un distintivo carácter de levadura a banana/plátano y clavo de olor, sostenido por sabores de malta a pan tostado o caramelo. Altamente carbonatada y refrescante, con una textura cremosa y esponjosa, y un final ligero.","Aroma":"Ésteres y fenoles moderados, comúnmente a banana/plátano y clavo de olor, a menudo bien balanceados entre sí y con la malta. Aroma del trigo a pan, masa o granos de ligero a moderado, a menudo acompañado de notas a caramelo, corteza de pan o maltas sabrosas. Un carácter a vainilla de bajo a moderado es opcional. Un ligero aroma a lúpulo floral, especiado o herbáceo es opcional. Un carácter a goma de mascar (frutilla/fresa con banana/plátano), acidez o ahumado son defectos.","Apariencia":"Color de cobrizo claro a marrón caoba oscuro. Espuma blanquecina muy gruesa, como mousse, y de larga duración. Puede ser turbia y con brillo por el trigo y la levadura, aunque puede sedimentar en las botellas.","Sabor":"Banana/plátano y clavo de olor de bajos a moderadamente fuertes, a menudo bien balanceados entre sí y con la malta, aunque la malta a veces puede ocultar la impresión a clavo de olor. Sabor a trigo suave, algo similar al pan, masa o granos de bajo a medio alto, con sabores más intensos a caramelo, tostadas o corteza de pan. Sin sabores intensamente tostados, pero se permite un toque de sequedad rostizada. Amargor de muy bajo a bajo. Paladar redondo y lleno de sabor, a menudo algo maltoso, con un final relativamente seco. Un carácter a vainilla de muy ligero a moderado es opcional. Un sabor bajo a lúpulo especiado, herbáceo o floral es opcional. Sabor a goma de mascar, acidez o ahumado son defectos.","Sensación en boca":"Cuerpo de medio ligero a medio pleno. Sensación plena esponjosa y cremosa, que evoluciona hacia un final ligero, reforzado por una carbonatación de moderada a alta. Efervescente.","Comentarios":"A menudo conocida como Dunkelweizen, particularmente en Estados Unidos. Es cada vez más difícil de encontrar y a menudo es reemplazada por versiones Kristall y sin alcohol en Alemania.","Historia":"Baviera tiene una tradición de cientos de años en la elaboración de cervezas de trigo, pero los derechos de elaboración estuvieron reservados para la realeza bávara hasta fines del siglo XVIII. La antigua cerveza de trigo bávara era a menudo oscura, al igual que la mayoría de las cervezas de esa época. La Weissbier pálida comenzó a hacerse popular en la década de 1960, pero la cerveza de trigo oscura tradicional se mantuvo como una bebida consumida por la gente mayor.","Ingredientes característicos":"El trigo malteado es al menos la mitad del listado de granos. Maltas Múnich, Viena o Pilsner. Maltas de trigo oscuro, de trigo caramelizado o de color. El macerado por decocción es tradicional. Levadura Weizen y temperaturas de fermentación bajas.","Comparación de estilos":"Combina el carácter de la levadura y el trigo de una Weissbier con la rica maltosidad de una Munich Dunkel. El carácter a banana/plátano y clavo de olor a menudo es menos evidente que en una Weissbier, debido al aumento en la maltosidad. Tiene un carácter a levadura similar a una Roggenbier, pero sin el sabor a centeno y el mayor cuerpo.","Estadísticas vitales":"OG: 1.044 – 1.057 IBU: 10 – 18 FG: 1.008 – 1.014 SRM: 14 – 23 ABV: 4.3 – 5.6%","Ejemplos comerciales":"Ayinger Urweisse, Ettaler Benediktiner Weißbier Dunkel, Franziskaner Hefe-Weisse Dunkel, Hirsch Dunkel Weisse, Tucher Dunkles Hefe Weizen, Weihenstephaner Hefeweißbier Dunkel","Etiquetas":"intensidad-estándar, color-ámbar, fermentaciónalta, europa-central, estilo-tradicional, familia-cerveza-trigo"},"glass_color":"#a43a00","srm_variable":false,"clarity":"turbia","foam_color":"#F5F1E6","abv_display":"4.3–5.6%","ibu_display":"10–18","srm_display":"14–23","og_display":"1.044–1.057","fg_display":"1.008–1.014","country":"Alemania","family":"Wheat Beer","glass_shape":"weizen","glass_label":"Vaso weizen","distinctive":"Una Weissbier con la maltosidad de una Munich Dunkel.","ibu_avg":14.0,"ibu_variable":false,"abv_avg":4.9,"abv_variable":false,"summary":"Cerveza de trigo alemana oscura, banana y clavo sobre malta tostada.","classic_example":"Ayinger Urweisse","foam_level":2,"foam_height":10,"srm_lo_hex":"#c35900","srm_hi_hex":"#882300","summary_80":"Una cerveza de trigo alemana moderadamente oscura con un distintivo carácter de levadura a banana/plátano y clavo de olor.","distinctive_80":"Combina el carácter de la levadura y el trigo de una Weissbier con la rica maltosidad de una Munich Dunkel.","mini_profile":{"malta":2,"lupulo":1,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"El trigo malteado es al menos la mitad del listado de granos. Maltas Múnich, Viena o Pilsner.","ingredient_chips":["Maltas Múnich","Maltas de trigo oscuro"],"balance_pos":1.5,"balance_malta":2,"balance_lupulo":1,"aroma_highlight":"Malta media","sabor_highlight":"Malta media","apariencia_highlight":"Turbia","boca_highlight":"Carbonatación alta","aroma_highlights":["Maltas Múnich","Levadura Weizen y temperaturas…"],"sabor_highlights":["Maltas Múnich","Levadura Weizen y temperaturas…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Cobrizo","Blanquecina","Turbia"],"ingredientes_highlights":["Maltas Múnich","Maltas de trigo oscuro"],"ingredient_types":{"malta":"Maltas Múnich","levadura":"Levadura Weizen y temperaturas…"}},{"code":"10C","name":"Weizenbock","category_num":10,"category_name":"German Wheat Beer","stats":{"OG":[1.064,1.09],"FG":[1.015,1.022],"IBU":[15.0,30.0],"SRM":[6.0,25.0],"ABV":[6.5,9.0]},"fields":{"Impresión general":"Una cerveza de trigo alemana fuerte y maltosa, que combina los mejores sabores del trigo y la levadura de una Weissbier, con la rica maltosidad, intensidad y cuerpo de una Bock. El rango del estilo incluye intensidades del tipo Bock y Doppelbock, con variantes de color pálido y oscuro.","Aroma":"Riqueza de malta de media alta a alta, con un significativo carácter a pan y granos de trigo. Carácter de levadura Weizen de medio bajo a medio alto, típicamente a banana/plátano y clavo de olor. Las notas a vainilla son opcionales. Sin lúpulo. Aroma a alcohol de bajo a moderado, sin ser quemante ni similar al solvente. La malta, la levadura y el alcohol están bien balanceados, son atractivos y con complejidad. Un carácter a goma de mascar (frutilla/fresa con banana/plátano), acidez o ahumado son defectos. Las versiones oscuras tienen una riqueza de malta más profunda, con carácter altamente tostado y a pan, junto a significativos productos de Maillard, similar a una Dunkles Bock o una Doppelbock oscura. También pueden tener caramelo y ésteres de frutas oscuras como ciruelas, ciruelas pasas, uvas oscuras, fruit leather (Nota de la Traducción: snack a base de puré de fruta deshidratado, con textura que se asemeja al cuero y sabor a fruta concentrado) y uvas pasas, especialmente a medida que envejecen. Las versiones pálidas tienen una riqueza de malta a grano dulce, con carácter tostado y a pan, similar a una Helles Bock o Doppelbock pálida.","Apariencia":"Espuma muy gruesa, como mousse, y de larga duración. Puede ser turbia y con brillo por el trigo y la levadura, aunque se puede sedimentar con el tiempo. Las versiones oscuras son de color desde ámbar oscuro a marrón rubí oscuro, con una espuma de color canela claro. Las versiones pálidas son de color desde dorado a ámbar, con una espuma desde muy blanca a blanquecina.","Sabor":"Riqueza de malta de media alta a alta, con significativo sabor a pan y granos de trigo. Carácter de levadura a banana/plátano y especias (clavo de olor, vainilla) de bajo a moderado. Sin sabor a lúpulo. Un amargor de bajo a medio bajo puede dar una impresión de paladar ligeramente dulce, pero normalmente la cerveza tiene un final seco. Un ligero alcohol puede acentuar este carácter. La interacción entre la malta, la levadura y el alcohol añade complejidad e interés, que a menudo se acentúa con el tiempo. Sabor a goma de mascar, acidez o ahumado son defectos. Las versiones oscuras tienen sabores a malta más ricos y profundos, a tostado o a pan, con productos de Maillard significativos, opcionalmente a caramelo o chocolate ligero, pero no rostizados. Puede tener algunos ésteres de frutas oscuras como ciruelas, ciruelas pasas, uvas oscuras, fruit leather o uvas pasas, especialmente a medida que envejecen. Las versiones pálidas tienen una riqueza de malta a pan, con carácter tostado y a grano dulce.","Sensación en boca":"Cuerpo de medio pleno a pleno. Textura suave, delicada, esponjosa o cremosa. Leve tibieza alcohólica. Carbonatación de moderada a alta.","Comentarios":"Una Weissbier elaborada con la intensidad de una Bock o una Doppelbock, aunque Schneider también produce una versión Eisbock. Existen versiones pálidas y oscuras, pero la oscura es la más común. Los productos de Maillard levemente oxidados pueden producir ciertos sabores y aromas ricos e intensos, que son usualmente percibidos en productos comerciales envejecidos de importación; las versiones más frescas no tendrán este carácter. Las versiones correctamente añejadas también pueden adquirir una complejidad similar al jerez. Las versiones pálidas, al igual que sus primas Doppelbock, tienen una complejidad de malta menos rica y a menudo son más lupuladas. Sin embargo, las versiones que tengan adiciones significativas de lúpulos tardíos o dry hopping, deben inscribirse en la categoría 34B MixedStyle Beer.","Historia":"La cerveza Aventinus, de intensidad Doppelbock, fue creada en 1907 por la Schneider Weisse Bräuhaus de Múnich. Las versiones pálidas son un invento mucho más reciente.","Ingredientes característicos":"El trigo malteado es al menos la mitad del listado de granos. Maltas Múnich, Viena o Pilsner. 19 Pueden ser utilizadas maltas de color con moderación. El macerado por decocción es tradicional. Levadura Weizen y temperaturas de fermentación bajas.","Comparación de estilos":"Más fuerte y rica que una Weissbier o una Dunkles Weissbier, pero con un carácter de levadura similar. Directamente comparable con el estilo Doppelbock, en las versiones pálidas y oscuras. Puede variar ampliamente en intensidad, pero la mayoría está en el rango de Bock a Doppelbock.","Instrucciones para la inscripción":"Quien inscriba indicará si es una versión pálida (SRM 6-9) u oscura (SRM 10-25).","Estadísticas vitales":"OG: 1.064 – 1.090 IBU: 15 – 30 FG: 1.015 – 1.022 SRM: 6 – 25 ABV: 6.5 – 9.0%","Ejemplos comerciales":"Oscuras: Plank Bavarian Dunkler Weizenbock, Penn Weizenbock, Schalchner Weisser Bock, Schneider Weisse Aventinus; Pálidas: Ayinger Weizenbock, Distelhäuser Weizen Bock, Ladenburger Weizenbock Hell, Weihenstephaner Vitus","Etiquetas":"intensidad-alta, color-ámbar, color-pálido, fermentación-alta, europa-central, estilo-tradicional, familiacerveza-trigo"},"glass_color":"#b84e00","srm_variable":false,"clarity":"turbia","foam_color":"#F5F1E6","abv_display":"6.5–9%",
