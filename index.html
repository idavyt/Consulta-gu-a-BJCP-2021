s simplemente realzan el sabor de la cerveza base. Algunos granos añaden sequedad en el final.","Sensación en boca":"Igual que la cerveza base, aunque muchos de los granos adicionales (p. ej.: avena, centeno) aumentan el cuerpo y la viscosidad, mientras algunos (p. ej.: granos sin gluten) crean una cerveza más delgada.","Comentarios":"El grano adicional debería ser evidente en alguna parte del perfil sensorial. Si el grano alternativo no proporciona un carácter distinguible a la cerveza, inscríbala como su estilo base. Este estilo no debería ser usado para estilos donde el grano alternativo es fundamental en su definición (p. ej.: Rye IPA, Oatmeal Stout, International Lager basada en arroz o maíz). Tenga en cuenta que el sake no es cerveza, y no está destinado a esta categoría.","Instrucciones para la inscripción":"Quien inscriba debe especificar el tipo de grano alternativo utilizado. Además debe especificar una descripción de la cerveza, identificando uno de dos: o un estilo base o los ingredientes, las especificaciones o el carácter objetivo de la cerveza. Una descripción general de la naturaleza especial de la cerveza puede cubrir todos los elementos requeridos.","Estadísticas vitales":"OG, FG, IBU, SRM y ABV variarán según la cerveza base.","Ejemplos comerciales":"Blue/Point Rastafarye Ale, Green’s India Pale Ale, Lakefront New Grist, New Planet Pale Ale, Rogue Morimoto Soba Ale, Voodoo Swimming Jeans","Etiquetas":""},"glass_color":"#fbb123","srm_variable":true,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"shaker","glass_label":"Pinta americana","distinctive":"Depende enteramente de los granos añadidos.","ibu_avg":25,"ibu_variable":true,"abv_avg":5.5,"abv_variable":true,"summary":"Cerveza intensificada por granos adicionales.","classic_example":"Blue/Point Rastafarye Ale","foam_level":1,"foam_height":7,"srm_lo_hex":"#fbb123","srm_hi_hex":"#fbb123","summary_80":"Una cerveza base que es intensificada por, o que presenta, el carácter de granos adicionales.","distinctive_80":"Depende enteramente de los granos añadidos.","mini_profile":{"malta":null,"lupulo":null,"cuerpo":2,"carbonatacion":null},"char_tags":[],"ingredients_line":"","ingredient_chips":[],"balance_pos":null,"balance_malta":null,"balance_lupulo":null,"aroma_highlight":null,"sabor_highlight":null,"apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Cuerpo medio"],"apariencia_highlights":["Translúcida"],"ingredientes_highlights":[],"ingredient_types":{}},{"code":"31B","name":"Alternative Sugar Beer","category_num":31,"category_name":"Alternative Fermentables Beer","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":null},"fields":{"Impresión general":"Una integración agradable de azúcar y cerveza, pero aún reconocible como cerveza. El carácter debe ser evidente, pero en balance con la cerveza, no tan agresivo como para sugerir un producto artificial.","Aroma":"Igual que la cerveza base, excepto que algunos fermentables adicionales (p. ej.: miel, melaza) pueden agregar aroma, que debería ser una combinación apetecible y balanceada con la cerveza.","Apariencia":"Igual que la cerveza base, aunque algunos azúcares pueden aportar colores adicionales, usualmente más oscuros.","Sabor":"Igual que la cerveza base, excepto que algunos fermentables adicionales (p. ej.: miel, melaza) pueden agregar sabor, que debería ser una combinación agradable y balanceada con la cerveza. Los azúcares agregados no deben tener un sabor crudo y sin fermentar. Algunos azúcares no fermentables dan un final más pleno, mientras que los azúcares totalmente fermentables pueden diluir el final.","Sensación en boca":"Igual que la cerveza base, aunque dependiendo del tipo de azúcar añadida, podría aumentar o disminuir el cuerpo.","Comentarios":"El azúcar añadida debería ser evidente en alguna parte del perfil sensorial. Si los azúcares no proporcionan un carácter distinguible a la cerveza, inscríbala en la categoría del estilo base. Una cerveza basada en miel no debería tener tanta para que se perciba más como una hidromiel con cerveza (es decir, un braggot) que como una cerveza con miel. Este estilo no debería ser usado para estilos donde el azúcar alternativo es fundamental en su definición, o donde una pequeña cantidad de azúcar con sabor neutro es utilizada simplemente para aumentar la densidad, aumentar la atenuación, o aligerar el sabor o el cuerpo; dichas cervezas deberían ser inscritas como el estilo base normal.","Instrucciones para la inscripción":"Quien inscriba debe especificar el tipo de azúcar utilizado. Además debe especificar una descripción de la cerveza, identificando uno de dos: o un estilo base o los ingredientes, las especificaciones o el carácter objetivo de la cerveza. Una descripción general de la naturaleza especial de la cerveza puede cubrir todos los elementos requeridos.","Estadísticas vitales":"OG, FG, IBU, SRM y ABV variarán según la cerveza base.","Ejemplos comerciales":"Bell’s Hopslam, Cervejaria Colorado Appia, Fifth Hammer Break of Jawn, Groundswell Piloncillo, Long Trail Harvest, New Glarus Cabin Fever","Etiquetas":""},"glass_color":"#fbb123","srm_variable":true,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"shaker","glass_label":"Pinta americana","distinctive":"Depende del tipo de azúcar alternativo usado.","ibu_avg":25,"ibu_variable":true,"abv_avg":5.5,"abv_variable":true,"summary":"Azúcar integrado en la cerveza, en balance.","classic_example":"Bell’s Hopslam","foam_level":1,"foam_height":7,"srm_lo_hex":"#fbb123","srm_hi_hex":"#fbb123","summary_80":"Una integración agradable de azúcar y cerveza, pero aún reconocible como cerveza. El carácter debe ser evidente, pero no artificial.","distinctive_80":"Depende del tipo de azúcar alternativo usado.","mini_profile":{"malta":null,"lupulo":null,"cuerpo":2,"carbonatacion":null},"char_tags":[],"ingredients_line":"","ingredient_chips":[],"balance_pos":null,"balance_malta":null,"balance_lupulo":null,"aroma_highlight":null,"sabor_highlight":null,"apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Cuerpo medio"],"apariencia_highlights":["Oscuro","Translúcida"],"ingredientes_highlights":[],"ingredient_types":{}},{"code":"32A","name":"Classic Style Smoked Beer","category_num":32,"category_name":"Smoked Beer","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":null},"fields":{"Impresión general":"Una fusión correctamente balanceada de la malta y el lúpulo del estilo base, con un carácter ahumado agradable y placentero.","Aroma":"Un balance agradable entre el aroma esperado de la cerveza base y la malta ahumada. El rango del carácter ahumado es de bajo a asertivo, y puede mostrar el carácter propio de la variedad de madera utilizada (p. ej.: aliso, roble, haya). El balance entre el ahumado y la cerveza puede variar; no es necesario que tengan la misma intensidad. En cualquier caso, el resultado debe ser atractivo. Los aromas punzantes, fenólicos, ásperos, similares al caucho o quemados derivados del ahumado son inapropiados.","Apariencia":"Variable. La apariencia debe reflejar el estilo de cerveza base, aunque el color es a menudo un poco más oscuro de lo esperado para el estilo base.","Sabor":"Similar al aroma, con un balance entre la cerveza base y el carácter de la malta ahumada, con una intensidad de baja a asertiva. Distintas maderas pueden producir perfiles diferentes de sabor. El balance entre el perfil ahumado y la cerveza puede variar, pero la mezcla resultante debe ser placentera. El ahumado puede agregar algo de sequedad al final. Los sabores ásperos, amargos, quemados, carbonizados, similares al caucho, sulfurosos, medicinales o fenólicos derivados del ahumado son inapropiados.","Sensación en boca":"Variable según el estilo de cerveza base. Se considera como un defecto una aspereza significativa, astringente y fenólica, derivada del ahumado.","Comentarios":"Use este estilo para cervezas que no sean del tipo Rauchbier de Bamberg (es decir, Märzen ahumada con madera de haya), que ya tienen su estilo propio. Quienes juzguen deben evaluar estas cervezas principalmente por su balance general, y cuán bien el carácter ahumado realza la cerveza base.","Historia":"El uso de maltas ahumadas ha sido adaptado a muchos estilos por las cervecerías artesanales. En Alemania, se han utilizado tradicionalmente maltas ahumadas para cervezas Bock, Doppelbock, Weissbier, Munich Dunkel, Schwarzbier, Munich Helles, Pils y otros Estilos de Especialidad.","Ingredientes característicos":"Se utilizan diferentes materiales para ahumar la malta, lo que resulta en características únicas de sabor y aroma. Se pueden usar maltas ahumadas con madera de haya u otras maderas duras (p. ej.: roble, arce, mezquite, aliso, pacano, manzano, cerezo y otras maderas de frutales). Estas pueden recordar a ciertos alimentos ahumados (p. ej.: la pacana a las costillas, el arce al tocino o a las salchichas, y el aliso al salmón). La madera de árboles de hoja perenne nunca debe ser usada ya que aporta un sabor a la malta con carácter medicinal y a pino. La malta ahumada con turba, de manera perceptible, es universalmente indeseable debido a sus fenoles agudos y punzantes, y su carácter a tierra sucia. El resto de los ingredientes varían según el estilo base. Si las maltas ahumadas se combinan con otros 80 ingredientes poco usuales (p. ej.: frutas, vegetales, especias, miel) en cantidades significativas, la cerveza resultante debería inscribirse en 32B Specialty Smoked Beer.","Instrucciones para la inscripción":"Quien inscriba debe especificar un estilo base. Además, debe especificar el tipo de madera o ahumado si el carácter particular del humo es perceptible.","Estadísticas vitales":"Variables según el estilo de cerveza base.","Ejemplos comerciales":"Alaskan Smoked Porter, Schlenkerla Oak Smoke Doppelbock, Schlenkerla Rauchbier Weizen, Schlenkerla Rauchbier Ur-Bock, O’Fallon Smoked Porter, Spezial Rauchbier Lagerbier","Etiquetas":"cerveza-especialidad"},"glass_color":"#cf6900","srm_variable":true,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Depende del estilo base y el tipo de humo.","ibu_avg":25,"ibu_variable":true,"abv_avg":5.5,"abv_variable":true,"summary":"Estilo clásico con carácter ahumado agradable.","classic_example":"Alaskan Smoked Porter","foam_level":1,"foam_height":7,"srm_lo_hex":"#cf6900","srm_hi_hex":"#cf6900","summary_80":"Una fusión correctamente balanceada de la malta y el lúpulo del estilo base.","distinctive_80":"Depende del estilo base y el tipo de humo.","mini_profile":{"malta":2,"lupulo":null,"cuerpo":null,"carbonatacion":null},"char_tags":[],"ingredients_line":"Se utilizan diferentes materiales para ahumar la malta, lo que resulta en características únicas de sabor y aroma.","ingredient_chips":["Se utilizan diferentes…","Se pueden usar maltas…"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":null,"aroma_highlight":"Malta media","sabor_highlight":"Malta media","apariencia_highlight":"Translúcida","boca_highlight":null,"aroma_highlights":["Se utilizan diferentes…"],"sabor_highlights":["Se utilizan diferentes…"],"boca_highlights":[],"apariencia_highlights":["Oscuro","Translúcida"],"ingredientes_highlights":["Se utilizan diferentes…","Se pueden usar maltas…"],"ingredient_types":{"malta":"Se utilizan diferentes…"}},{"code":"32B","name":"Specialty Smoked Beer","category_num":32,"category_name":"Smoked Beer","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":null},"fields":{"Impresión general":"Una fusión correctamente balanceada de la malta y el lúpulo del estilo base de especialidad, con un agradable y placentero carácter ahumado.","Aroma":"Un balance agradable entre el aroma esperado de la cerveza base, la malta ahumada y cualquier Ingrediente Especial. El rango del carácter ahumado es de bajo a asertivo, y puede mostrar el carácter propio de la variedad de madera utilizada (p. ej.: aliso, roble, haya). El balance entre el ahumado, la cerveza y cualquier Ingrediente Especial puede variar; no es necesario que tengan la misma intensidad. En cualquier caso, el resultado debe ser atractivo. Los aromas punzantes, fenólicos, ásperos, similares al caucho o quemados derivados del ahumado son inapropiados.","Apariencia":"Variable. La apariencia debe reflejar el estilo de cerveza base, aunque el color es a menudo un poco más oscuro de lo esperado para el estilo base. El uso de ciertas frutas y especias también puede afectar el color y tono de la cerveza.","Sabor":"Similar al aroma, con un balance entre la cerveza base, cualquier Ingrediente Especial y el carácter de la malta ahumada, con una intensidad de baja a asertiva. Distintas maderas pueden producir perfiles diferentes de sabor. El balance entre el perfil ahumado, la cerveza y cualquier Ingrediente Especial puede variar, pero la mezcla resultante debe ser placentera. El ahumado puede agregar algo de sequedad al final. Los sabores ásperos, amargos, quemados, carbonizados, similares al caucho, sulfurosos, medicinales o fenólicos derivados del ahumado son inapropiados.","Sensación en boca":"Variable según el estilo de cerveza base. Se considera como un defecto una aspereza significativa, astringente y fenólica, derivada del ahumado.","Comentarios":"Quienes juzguen deben evaluar estas cervezas principalmente por su balance general, y cuán bien el carácter ahumado realza la cerveza base y cualquier Ingrediente Especial.","Ingredientes característicos":"Los mismos que para 32A Classic Style Smoked Beer, con la posible adición de ingredientes especiales (p. ej.: frutas, especias, vegetales, miel) en cantidades significativas.","Instrucciones para la inscripción":"Quien inscriba debe especificar el tipo de madera o ahumado si el carácter particular del humo es perceptible. Además debe especificar los ingredientes o procesos adicionales que hacen de esta una Specialty Smoked Beer. Por otro lado, debe especificar una descripción de la cerveza, identificando uno de dos: o un estilo base o los ingredientes, las especificaciones o el carácter objetivo de la cerveza. Una descripción general de la naturaleza especial de la cerveza puede cubrir todos los elementos requeridos.","Estadísticas vitales":"Variables según el estilo de cerveza base.","Ejemplos comerciales":"Fat Head’s Up in Smoke, Ommegang Bourbon Barrel Vanilla Smoked Porter","Etiquetas":"cerveza-especialidad"},"glass_color":"#cf6900","srm_variable":true,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Depende del estilo base y el tipo de humo.","ibu_avg":25,"ibu_variable":true,"abv_avg":5.5,"abv_variable":true,"summary":"Estilo de especialidad con carácter ahumado agradable.","classic_example":"Fat Head’s Up in Smoke","foam_level":1,"foam_height":7,"srm_lo_hex":"#cf6900","srm_hi_hex":"#cf6900","summary_80":"Una fusión correctamente balanceada de la malta y el lúpulo del estilo base de especialidad.","distinctive_80":"Depende del estilo base y el tipo de humo.","mini_profile":{"malta":2,"lupulo":null,"cuerpo":null,"carbonatacion":null},"char_tags":[],"ingredients_line":"Los mismos que para 32A Classic Style Smoked Beer, con la posible adición de ingredientes especiales (p. ej.: frutas, especias.","ingredient_chips":["Ej.: frutas"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":null,"aroma_highlight":"Malta media","sabor_highlight":"Malta media","apariencia_highlight":"Translúcida","boca_highlight":null,"aroma_highlights":[],"sabor_highlights":[],"boca_highlights":[],"apariencia_highlights":["Oscuro","Translúcida"],"ingredientes_highlights":["Ej.: frutas"],"ingredient_types":{}},{"code":"33A","name":"Wood-Aged Beer","category_num":33,"category_name":"Wood Beer","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":null},"fields":{"Impresión general":"Una versión realzada y placentera del estilo de cerveza base, con las características del envejecimiento en contacto con madera. Los mejores ejemplos serán suaves, llenos de sabor, bien balanceados y estarán madurados adecuadamente.","Aroma":"Variable según el estilo base. Un aroma a madera de bajo a moderado está usualmente presente; algunas variedades de madera pueden tener un carácter más fuerte o distintivo. La madera fresca puede impartir ocasionalmente un aroma a madera cruda y recién talada, aunque este carácter nunca debería ser demasiado fuerte. Si la madera está tostada o quemada, puede haber un carácter de bajo a moderado a vainilla, caramelo, toffee, tostadas o cacao presente.","Apariencia":"Variable según el estilo base. Generalmente más oscura que el estilo de cerveza base sin modificar, particularmente si se utilizan barricas tostadas o quemadas.","Sabor":"Variable según el estilo base. La madera usualmente otorga un sabor propio, y posiblemente un carácter distintivo de la variedad utilizada. La madera nueva puede añadir una impresión a madera cruda y recién talada. La madera tostada o quemada puede añadir sabores a vainilla, caramelo, butterscotch, pan tostado, frutos secos tostados, café, chocolate o cacao, dependiendo de la variedad utilizada y el nivel de tostado o quemado. Los sabores derivados de la madera deberían ser balanceados, de apoyo y perceptibles, siempre y cuando no dominen el estilo de cerveza base.","Sensación en boca":"Variable según el estilo base. Los taninos de la madera pueden incrementar la percepción de cuerpo, como también pueden aumentar la sequedad del final; se permite algo de astringencia derivada de los taninos de la madera. Características de acidez, de cualquier tipo, deberían ser de nulas a bajas, y nunca convertirse en una distracción.","Comentarios":"La mayor parte del carácter depende del tipo de madera utilizada y cómo complementa y realza el estilo base. Se permite un carácter de envejecimiento, pero una oxidación o acidez excesiva son una falla. Un alcohol notorio no es un defecto en estilos base más fuertes. Esta categoría no debería ser utilizada para estilos base donde el envejecimiento en madera es un requerimiento fundamental para el estilo (p. ej.: Flanders Red, Lambic). Las cervezas elaboradas ya sea con un envejecimiento limitado en madera o con productos que solo otorgan un carácter sutil en segundo plano, pueden ser inscritas en la categoría del estilo base siempre y cuando el carácter de la madera no sea una característica destacada.","Historia":"Un método de producción tradicional que raramente es utilizado por las grandes cervecerías, y usualmente solo se usa con productos de especialidad. Más popular con las cervecerías artesanales modernas que buscan productos nuevos y distintivos. Las barricas y casks de roble son tradicionales, aunque otras maderas están ganando popularidad.","Ingredientes característicos":"Variable según el estilo base. Envejecida en barricas o casks de madera, o utilizando aditivos basados en madera (p. ej.: chips, duelas, espirales, cubos). Los estilos base de cuerpo más pleno y mayor densidad son usados a menudo, ya que pueden soportar mejor los sabores adicionales, aunque se valora la experimentación.","Instrucciones para la inscripción":"Quien inscriba debe especificar el tipo de madera utilizada y el nivel de tostado o quemado (si es el caso). Si se utiliza una variedad de madera inusual, se debe proveer una breve descripción de los aspectos sensoriales que la madera añade a la cerveza. Quien inscriba debe especificar una descripción de la cerveza, identificando uno de dos: o un estilo base o los ingredientes, las especificaciones o el carácter objetivo de la cerveza. Una descripción general de la naturaleza especial de la cerveza puede cubrir todos los elementos requeridos.","Estadísticas vitales":"OG: variable según el estilo base, generalmente sobre el promedio FG: variable según el estilo base ABV: variable según el estilo base, generalmente sobre el promedio IBU: variable según el estilo base SRM: variable según el estilo base, generalmente más oscura que el estilo base sin modificar","Ejemplos comerciales":"Bush Prestige, Cigar City Spanish Cedar Jai Alai, Firestone Walker Double Barrel Ale, Midnight Sun Arctic Devil, Petrus Aged Pale, Samuel Smith Yorkshire Stingo","Etiquetas":"cerveza-especialidad"},"glass_color":"#de7c00","srm_variable":true,"clarity":"traslucida","foam_color":"#C99A66","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"snifter","glass_label":"Copa snifter","distinctive":"Depende del estilo base y el tipo de madera.","ibu_avg":25,"ibu_variable":true,"abv_avg":7.0,"abv_variable":true,"summary":"Estilo base realzado por contacto con madera.","classic_example":"Bush Prestige","foam_level":1,"foam_height":7,"srm_lo_hex":"#de7c00","srm_hi_hex":"#de7c00","summary_80":"Una versión realzada y placentera del estilo de cerveza base, con las características del envejecimiento en contacto con madera.","distinctive_80":"Depende del estilo base y el tipo de madera.","mini_profile":{"malta":null,"lupulo":null,"cuerpo":2,"carbonatacion":null},"char_tags":[],"ingredients_line":"Variable según el estilo base.","ingredient_chips":["Variable según el estilo base","Envejecida en barricas o…"],"balance_pos":null,"balance_malta":null,"balance_lupulo":null,"aroma_highlight":null,"sabor_highlight":null,"apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Cuerpo medio"],"apariencia_highlights":["Oscura","Translúcida"],"ingredientes_highlights":["Variable según el estilo base","Envejecida en barricas o…"],"ingredient_types":{}},{"code":"33B","name":"Specialty Wood-Aged Beer","category_num":33,"category_name":"Wood Beer","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":null},"fields":{"Impresión general":"Una versión realzada del estilo de cerveza base, con las características del envejecimiento en contacto con madera, incluyendo productos alcohólicos del contacto previo con la madera. Los mejores ejemplos serán suaves, llenos de sabor, bien balanceados y estarán madurados adecuadamente.","Aroma":"Variable según el estilo base. Un aroma a madera de bajo a moderado está usualmente presente; algunas variedades de madera pueden tener un carácter más fuerte o distintivo. Si la madera está tostada o quemada, puede haber un carácter de bajo a moderado a vainilla, caramelo, toffee, tostadas o cacao presente. Los aromas asociados al alcohol previamente almacenado en la barrica (p. ej.: destilados, vino) deberían ser perceptibles, pero balanceados.","Apariencia":"Variable según el estilo base. Generalmente más oscura que el estilo de cerveza base sin modificar, particularmente si se utilizan barricas quemadas. Las cervezas envejecidas en barricas de vino u otros productos con un color distintivo, también pueden ver modificado su color.","Sabor":"Variable según el estilo base. La madera usualmente otorga un sabor propio, y posiblemente un carácter distintivo de la variedad utilizada. La madera tostada o quemada puede añadir sabores a vainilla, caramelo, butterscotch, pan tostado, frutos secos tostados, café, chocolate o cacao, dependiendo de la variedad utilizada y el nivel de tostado o quemado. Los sabores derivados de la madera y alcohol añadido deberían ser balanceados, apoyarse mutuamente y ser perceptibles, siempre y cuando no dominen el estilo de cerveza base, ni el uno al otro.","Sensación en boca":"Variable según el estilo base. Los taninos de la madera pueden incrementar la percepción de cuerpo, como también pueden aumentar la sequedad del final; se permite algo de astringencia derivada de los taninos de la madera. Usualmente exhibe una tibieza alcohólica adicional, pero no debería ser quemante ni agresiva. Características de acidez, de cualquier tipo, deberían ser de nulas a bajas, y nunca convertirse en una distracción.","Historia":"La misma que 33A Wood-Aged Beer.","Comentarios":"El éxito en este estilo depende de cómo el carácter de la madera y el alcohol dan soporte y realzan la 82 cerveza base, y qué tan bien integrados estén con el perfil de sabor general. Se permite un carácter de envejecimiento, pero una oxidación o acidez excesiva son una falta. Ales especiales de fermentación “salvaje” y añejadas con madera, deberían ser inscritas como 28C Wild Specialty Beer.","Ingredientes característicos":"Variable según el estilo base. Envejecida en barricas o casks de madera utilizados previamente para almacenar alcohol (p. ej.: whisky, bourbon, ron, ginebra, tequila, oporto, jerez, madeira, vino). Los estilos base de cuerpo más pleno y mayor densidad son usados a menudo, ya que pueden soportar mejor los sabores adicionales, aunque se valora la experimentación.","Instrucciones para la inscripción":"Quien inscriba debe especificar el carácter adicional de alcohol, con información acerca de la barrica si es relevante para el perfil de sabor final. Si se utiliza una variedad de madera o ingrediente inusual, se debe proveer una breve descripción de los aspectos sensoriales que los ingredientes añaden a la cerveza. Quien inscriba debe especificar una descripción de la cerveza, identificando uno de dos: o un estilo base o los ingredientes, las especificaciones o el carácter objetivo de la cerveza. Una descripción general de la naturaleza especial de la cerveza puede cubrir todos los elementos requeridos.","Estadísticas vitales":"OG: variable según el estilo base, generalmente sobre el promedio FG: variable según el estilo base ABV: variable según el estilo base, generalmente sobre el promedio IBU: variable según el estilo base SRM: variable según el estilo base, generalmente más oscura que el estilo base sin modificar","Ejemplos comerciales":"AleSmith Barrel-Aged Old Numbskull, Founders Kentucky Breakfast Stout, Firestone Walker Parabola, Goose Island Bourbon County Stout, Great Divide Barrel Aged Yeti, The Lost Abbey Angel’s Share Ale","Etiquetas":"cerveza-especialidad"},"glass_color":"#de7c00","srm_variable":true,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"snifter","glass_label":"Copa snifter","distinctive":"Depende del estilo base y el tipo de madera.","ibu_avg":25,"ibu_variable":true,"abv_avg":7.0,"abv_variable":true,"summary":"Estilo de especialidad realzado por contacto con madera.","classic_example":"AleSmith Barrel-Aged Old Numbskull","foam_level":1,"foam_height":7,"srm_lo_hex":"#de7c00","srm_hi_hex":"#de7c00","summary_80":"Una versión realzada del estilo de cerveza base, con las características del envejecimiento en contacto con madera.","distinctive_80":"Depende del estilo base y el tipo de madera.","mini_profile":{"malta":null,"lupulo":null,"cuerpo":2,"carbonatacion":null},"char_tags":[],"ingredients_line":"Variable según el estilo base.","ingredient_chips":["Variable según el estilo bas nt_types":{}},{"code":"X1","name":"Dorada Pampeana","category_num":99,"category_name":"Apéndice B: Estilos Locales","stats":{"OG":[1.042,1.054],"FG":[1.009,1.013],"IBU":[15.0,22.0],"SRM":[3.0,5.0],"ABV":[4.3,5.5]},"fields":{"Impresión general":"Con buena tomabilidad, accesible y orientada hacia la malta.","Aroma":"Malta dulce de ligera a moderada. Es aceptable un aroma afrutado de bajo a moderado. Debe tener aroma a lúpulo de bajo a medio. Sin diacetilo.","Apariencia":"Color de amarillo claro a dorado profundo. Claridad de traslúcida a brillante. Espuma de baja a media con buena retención.","Sabor":"Malta dulce suave al inicio. Caramelo típicamente ausente. Lúpulo de ligero a moderado (usualmente Cascade), pero no debería ser agresivo. Amargor de bajo a moderado, pero el balance está orientado hacia la malta. Final de semi seco a algo dulce. Sin diacetilo.","Sensación en boca":"Cuerpo de medio ligero a medio. Carbonatación de media a alta. Suave, sin amargor áspero ni astringencia.","Comentarios":"El balance es difícil de lograr.","Historia":"En sus comienzos, quienes elaboraban cerveza casera en Argentina tenían muchas limitaciones: no había extractos, solo podían utilizar malta Pilsen, lúpulos Cascade y levadura seca, comúnmente Nottingham, Windsor o SafAle. Con estos ingredientes, desarrollaron una variante de la Blonde Ale, llamada Dorada Pampeana.","Ingredientes característicos":"Usualmente solo malta pálida o Pils, aunque puede incluir bajas proporciones de malta caramelizada. Comúnmente lúpulos Cascade. Levadura estadounidense limpia, británica levemente afrutada o Kölsch, usualmente acondicionada en frío.","Estadísticas vitales":"OG: 1.042 – 1.054 IBU: 15 – 22 FG: 1.009 – 1.013 SRM: 3 – 5 ABV: 4.3% – 5.5%","Etiquetas":"sud-américa"},"glass_color":"#ffbf42","srm_variable":false,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"4.3–5.5%","ibu_display":"15–22","srm_display":"3–5","og_display":"1.042–1.054","fg_display":"1.009–1.013","country":"Argentina","family":"Pale Ale","glass_shape":"shaker","glass_label":"Pinta americana","distinctive":"Variante argentina de la Blonde Ale.","ibu_avg":18.5,"ibu_variable":false,"abv_avg":4.9,"abv_variable":false,"color_text":"Color de amarillo claro a dorado profundo.","foam_text":"Espuma de baja a media con buena retención.","suggested_category":"18. Pale American Ale","summary":"Blonde ale argentina, accesible y orientada a la malta.","classic_example":null,"foam_level":1,"foam_height":7,"srm_lo_hex":"#ffca5a","srm_hi_hex":"#fbb123","summary_80":"Con buena tomabilidad, accesible y orientada hacia la malta.","distinctive_80":"Variante argentina de la Blonde Ale.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"Usualmente solo malta pálida o Pils, aunque puede incluir bajas proporciones de malta caramelizada. Comúnmente lúpulos Cascade.","ingredient_chips":["Usualmente solo malta pálida…","Comúnmente lúpulos Cascade"],"balance_pos":2.5,"balance_malta":1,"balance_lupulo":2,"aroma_highlight":"Malta media","sabor_highlight":"Lúpulo medio","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Usualmente solo malta pálida o…","Comúnmente lúpulos Cascade","Levadura estadounidense limpia"],"sabor_highlights":["Usualmente solo malta pálida o…","Comúnmente lúpulos Cascade","Levadura estadounidense limpia"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Amarillo","Translúcida"],"ingredientes_highlights":["Usualmente solo malta pálida…","Comúnmente lúpulos Cascade"],"ingredient_types":{"malta":"Usualmente solo malta pálida o…","lupulo":"Comúnmente lúpulos Cascade","levadura":"Levadura estadounidense limpia"}},{"code":"X2","name":"IPA Argenta","category_num":99,"category_name":"Apéndice B: Estilos Locales","stats":{"OG":[1.055,1.065],"FG":[1.008,1.015],"IBU":[35.0,60.0],"SRM":[6.0,15.0],"ABV":[5.0,6.5]},"fields":{"Impresión general":"Una ale pálida argentina decididamente amarga y lupulada, refrescante y moderadamente alcohólica. La clave del estilo está en la tomabilidad sin asperezas y un buen balance.","Aroma":"Lúpulo intenso con carácter floral y cítrico, derivado de lúpulos argentinos. Muchas versiones tienen dry hopping, lo que le otorga un carácter herbáceo adicional, aunque no es requerido. Algo de malta dulce limpia y caramelo pueden ser percibidos, pero en una menor intensidad que las English IPA. Un carácter afrutado leve de los ésteres es aceptable, al igual que toques fenólicos producto de la fermentación del trigo, que nunca deben ser dominantes y solo deben agregar complejidad. De todos modos, el carácter relativamente neutro de la fermentación es lo más usual. Puede notarse algo de alcohol en las versiones más fuertes. Sin DMS. El diacetilo es un defecto importante en esta cerveza ya que puede opacar el lúpulo, por lo que nunca debe estar presente.","Apariencia":"Color de dorado medio a cobre rojizo medio; algunas versiones pueden tener un tinte anaranjado. Debe ser traslúcida, aunque las versiones con dry hopping o que contienen trigo no malteado pueden tener una leve turbidez. Espuma de buena formación, persistente.","Sabor":"Lúpulo de medio a alto, debería reflejar el carácter del lúpulo argentino, con matices prominentemente cítricos a pomelo/toronja rosada y cáscara de mandarina, que deben dominar. Puede tener también tonos florales como azahar, o también herbáceos o a resina, aunque es menos habitual y solo deben agregar complejidad. Amargor de medio a medio alto, apoyado por una maltosidad limpia que proporciona un balance adecuado. Sabor a malta de bajo a medio, limpio, aunque son aceptables bajos niveles acaramelados o especiados por el uso de trigo, sea o no malteado. Sin diacetilo. Un bajo carácter afrutado es opcional. El amargor debe permanecer en el retrogusto pero nunca debe ser áspero. Final de semi seco a seco y refrescante. Puede percibirse algún sabor a alcohol en las versiones más fuertes.","Sensación en boca":"Cuerpo de medio ligero a medio, suave, sin astringencia derivada del lúpulo, aunque la carbonatación de moderada a moderadamente alta puede combinarse con el trigo para dar una sensación seca, aún en presencia del dulzor de la malta. Suave tibieza alcohólica en las versiones más fuertes (no en todas).","Historia":"La versión argentina del histórico estilo inglés, desarrollada en el marco de una serie de encuentros de la Asociación Civil Somos Cerveceros en 2013, donde se fueron definiendo sus características distintivas. Se diferencia de la American IPA por el uso de trigo y lúpulos argentinos, que tienen características únicas de sabor y aroma. Se busca que las características cítricas del lúpulo argentino armonicen con el trigo, como sucede en la Witbier. Las bajas cantidades de trigo adicional pueden recordar el listado de granos de la Kölsch, donde también hay un carácter afrutado producto de la fermentación.","Ingredientes característicos":"Malta pálida (bien modificada y apropiada para maceración por infusión simple) y una cantidad de trigo como complemento que no debe superar el 15%; el trigo puede ser malteado o sin maltear. En el caso de utilizar maltas Caramelo, deben ser limitadas y preferentemente utilizando trigo caramelizado. Los lúpulos argentinos como el Cascade, Mapuche y Nugget son los usuales, aunque puede tener Spalt, Victoria y Bullion para agregar complejidad. Levadura estadounidense con perfil limpio o levemente afrutado. El agua varía de blanda a moderadamente sulfatada.","Comparación de estilos":"Menor cuerpo que la English IPA, y más seca que la American IPA. 91","Estadísticas vitales":"OG: 1.055 – 1.065 IBU: 35 – 60 FG: 1.008 – 1.015 SRM: 6 – 15 ABV: 5.0 – 6.5%","Ejemplos comerciales":"Antares IPA Argenta, Kerze IPA Argenta","Etiquetas":""},"glass_color":"#da7700","srm_variable":false,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"5–6.5%","ibu_display":"35–60","srm_display":"6–15","og_display":"1.055–1.065","fg_display":"1.008–1.015","country":"Argentina","family":"IPA","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Menos cuerpo que una English IPA, más seca que una American IPA.","ibu_avg":47.5,"ibu_variable":false,"abv_avg":5.8,"abv_variable":false,"color_text":"Color de dorado medio a cobre rojizo medio; algunas versiones pueden tener un tinte anaranjado.","foam_text":"Espuma de buena formación, persistente.","suggested_category":"21. IPA","summary":"Ale pálida argentina, bastante amarga y lupulada.","classic_example":"Antares IPA Argenta","foam_level":2,"foam_height":10,"srm_lo_hex":"#f8a600","srm_hi_hex":"#bb5100","summary_80":"Una ale pálida argentina decididamente amarga y lupulada, refrescante y moderadamente alcohólica.","distinctive_80":"Menor cuerpo que la English IPA.","mini_profile":{"malta":2,"lupulo":3,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"Malta pálida (bien modificada y apropiada para maceración por infusión simple) y una cantidad de trigo como complemento que no.","ingredient_chips":["Malta pálida (bien modificada…","En el caso de utilizar maltas…"],"balance_pos":2.5,"balance_malta":2,"balance_lupulo":3,"aroma_highlight":"Lúpulo alto","sabor_highlight":"Lúpulo alto","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta pálida (bien modificada y…","Levadura estadounidense con…"],"sabor_highlights":["Malta pálida (bien modificada y…","Levadura estadounidense con…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Dorado","Translúcida"],"ingredientes_highlights":["Malta pálida (bien modificada…","En el caso de utilizar maltas…"],"ingredient_types":{"malta":"Malta pálida (bien modificada y…","levadura":"Levadura estadounidense con…"}},{"code":"X3","name":"Italian Grape Ale","category_num":99,"category_name":"Apéndice B: Estilos Locales","stats":{"OG":[1.045,1.1],"FG":[1.005,1.015],"IBU":[6.0,30.0],"SRM":[4.0,25.0],"ABV":[4.5,12.0]},"fields":{"Impresión general":"Una ale italiana a veces refrescante, a veces más compleja, caracterizada por el uso de diferentes variedades de uvas.","Aroma":"Las características aromáticas de la uva específica utilizada deben ser perceptibles, pero no deberían dominar a los otros aromas. El carácter a uva debería ser agradable y no debería tener defectos como la oxidación. El carácter a malta es usualmente discreto, y no debería exhibir un perfil rostizado y similar a una stout. Lúpulo de ausente a medio bajo, con carácter floral o terroso. Un bajo carácter “salvaje” descrito como establo, terroso o caprino puede estar presente en algunos ejemplos, pero no debería ser tan intenso como en una Lambic o Fruit Lambic. Sin diacetilo.","Apariencia":"Color de dorado claro a cobrizo, pero algunos ejemplos pueden ser marrones. Un color rojizo o rubí usualmente se debe al uso de variedades de uva tinta. Espuma de blanca a rojiza, generalmente con retención media baja. La claridad generalmente es buena, pero algo de brumosidad puede estar presente.","Sabor":"Un carácter a uva de medio bajo a medio alto (a mosto de uva o similar al vino) debe estar presente, como en el aroma. Las variedades de uva pueden contribuir de forma diferente al perfil de sabor: en general, la fruta de carozo o tropical (durazno/melocotón, pera, albaricoque/damasco, piña) puede provenir de las uvas blancas, y las frutas rojas (p. ej.: cereza, frutilla/fresa) de las variedades de uva tinta. Un carácter afrutado adicional proveniente de la fermentación también es común. Pueden ser utilizadas maltas especiales de diferentes tipos, pero deberían ser de apoyo y balanceadas, no tan prominentes como para eclipsar la cerveza base. Un carácter fuerte rostizado o a chocolate es inapropiado. Notas ligeras a acidez, debido al uso de uva, son comunes y pueden ayudar a mejorar la tomabilidad, pero no deberían ser prominentes como en una Sour Ale, Lambic o similar. Un carácter a roble, junto a algunas notas a establo, terrosas o caprinas pueden estar presentes, pero no deberían ser predominantes. Amargor y sabor de lúpulo bajos. Sin diacetilo.","Sensación en boca":"Carbonatación media alta que mejora la percepción de aroma. Cuerpo generalmente de ligero a medio. Algo de acidez puede contribuir a incrementar la percepción de sequedad. Una tibieza alcohólica puede estar presente en los ejemplos fuertes pero sin ser quemante o similar al solvente.","Historia":"Elaborada inicialmente por Birrificio Montegioco y Birrificio Barley en 2006-2007, el estilo Italian Grape Ale (IGA) actualmente es producido por muchas cervecerías artesanales italianas. También se está volviendo popular en Estados Unidos y otros países vitivinícolas. Representa una comunión entre la cerveza y el vino, promovida por la gran disponibilidad local de diferentes variedades de uva en todo el país. Estas cervezas pueden ser una expresión del territorio, biodiversidad y creatividad de quienes las elaboran. 92 Normalmente presentada como una cerveza de especialidad dentro del rango de productos de una cervecería. Las cervecerías llaman “Wild IGA” o “Sour IGA” a cualquier versión “salvaje” o ácida del estilo.","Ingredientes característicos":"Malta base Pils en la mayoría de los casos, o maltas pálidas, con algo de maltas especiales (si hay alguna). El contenido de uva puede representar hasta un 40% de los fermentables totales. Uva o mosto de uva, a veces hervido extensamente antes de ser usado, que se puede utilizar en diferentes etapas: durante el hervor o más comúnmente durante la fermentación primaria o secundaria. La levadura puede mostrar un carácter neutro (lo más común) o un perfil afrutado o especiado (cepas inglesas y belgas). Puede ser utilizada también levadura de vino de forma simultánea a otras levaduras. Variedades de lúpulo del Viejo Mundo, principalmente alemanes o ingleses, son usados en bajas cantidades para no caracterizar excesivamente a la cerveza.","Comparación de estilos":"Similar a una Fruit Beer pero evolucionó como un estilo independiente debido a la abundancia de variedades de uva en Italia.","Estadísticas vitales":"OG: 1.045 – 1.100 IBU: 6 – 30 FG: 1.005 – 1.015 SRM: 4 – 25 ABV: 4.5 – 12.0%","Ejemplos comerciales":"Montegioco Open Mind, Birrificio Barley BB5-10, Birrificio del Forte Il Tralcio, Viess Beer al mosto di gewurtztraminer, CRAK IGA Cabernet, Birrificio Apuano Ninkasi, Luppolajo Mons Rubus","Etiquetas":"cerveza-especialidad"},"glass_color":"#bf5500","srm_variable":false,"clarity":"traslucida","foam_color":"#F7F4EC","abv_display":"4.5–12%","ibu_display":"6–30","srm_display":"4–25","og_display":"1.045–1.1","fg_display":"1.005–1.015","country":"Italia","family":"Cerveza de Especialidad","glass_shape":"goblet","glass_label":"Cáliz / Copa belga","distinctive":"Similar a una Fruit Beer, pero estilo propio.","ibu_avg":18.0,"ibu_variable":false,"abv_avg":8.2,"abv_variable":false,"color_text":"Color de dorado claro a cobrizo, pero algunos ejemplos pueden ser marrones.","foam_text":"Espuma de blanca a rojiza, generalmente con retención media baja.","suggested_category":"29. Grape Ale","summary":"Ale italiana definida por variedades de uva.","classic_example":"Montegioco Open Mind","foam_level":1,"foam_height":7,"srm_lo_hex":"#ffbf42","srm_hi_hex":"#7b1a00","summary_80":"Una ale italiana a veces refrescante, a veces más compleja.","distinctive_80":"Similar a una Fruit Beer pero evolucionó como un estilo independiente debido a la abundancia de variedades de uva en Italia.","mini_profile":{"malta":2,"lupulo":1,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"Malta base Pils en la mayoría de los casos, o maltas pálidas, con algo de maltas especiales (si hay alguna).","ingredient_chips":["Malta base Pils en la mayoría…","Uva o mosto de uva"],"balance_pos":1.5,"balance_malta":2,"balance_lupulo":1,"aroma_highlight":"Malta baja","sabor_highlight":"Malta media","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta base Pils en la mayoría…","Variedades de lúpulo del Viejo…"],"sabor_highlights":["Malta base Pils en la mayoría…","Variedades de lúpulo del Viejo…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Dorado","Blanca","Translúcida"],"ingredientes_highlights":["Malta base Pils en la mayoría…","Uva o mosto de uva"],"ingredient_types":{"malta":"Malta base Pils en la mayoría…","lupulo":"Variedades de lúpulo del Viejo…"}},{"code":"X4","name":"Catharina Sour","category_num":99,"category_name":"Apéndice B: Estilos Locales","stats":{"OG":[1.039,1.048],"FG":[1.004,1.012],"IBU":[2.0,8.0],"SRM":[2.0,6.0],"ABV":[4.0,5.5]},"fields":{"Impresión general":"Una cerveza de trigo ácida y con fruta, refrescante, con un carácter vibrante a fruta y una acidez láctica limpia. El alcohol discreto, el cuerpo ligero, la carbonatación elevada y la carencia de amargor percibido, permiten que destaque la fruta fresca. La fruta es a menudo, pero no siempre, de naturaleza tropical.","Aroma":"Carácter a fruta de medio a alto, inmediatamente perceptible y reconocible. Acidez láctica limpia, de baja a media y en apoyo a la fruta. Típicamente malta neutra, pero puede tener notas bajas granosas o a pan de apoyo. Perfil de fermentación limpio, sin carácter salvaje ni funky. Lúpulo ausente. Sin alcohol punzante. La adición de especias, hierbas y vegetales es opcional, y deberían apoyar a la fruta si están presentes.","Apariencia":"Color a menudo bastante pálido, de pajizo a dorado. Espuma blanca de media a alta, con retención de aceptable a buena. La cerveza y la espuma pueden adquirir el color de la fruta. Claridad de bastante traslúcida a turbia. Efervescente.","Sabor":"Domina la fruta fresca de media a alta, con una acidez láctica limpia de baja a media alta, de apoyo pero perceptible. La fruta debería tener un carácter fresco, no parecer cocida, como mermelada o artificial. La malta a menudo está ausente, pero si está presente puede tener una cualidad baja granosa o a pan que nunca compite con la fruta o la acidez. Amargor de lúpulo inferior al nivel del umbral sensorial. Final seco, con retrogusto afrutado, ácido y limpio. Lúpulo ausente. Sin notas acéticas, a diacetilo ni sabores funky de Brett. Especias, hierbas y vegetales son opcionales, en apoyo a la fruta.","Sensación en boca":"Cuerpo de bajo a medio bajo. Carbonatación de media a alta. Sin tibieza alcohólica. Acidez de baja a medio alta, sin ser agresiva ni astringente.","Comentarios":"Es mejor consumirla fresca. La acidez puede hacer que la cerveza parezca más seca y ligera de cuerpo que lo que podría sugerir la densidad final. Las cervezas Berliner Weisse con fruta deberían ser inscritas como 29A Fruit Beer.","Historia":"Previamente existieron en Brasil ejemplos individuales bajo distintos nombres, pero el estilo se volvió popular bajo esta denominación después de que fuera definido formalmente en el año 2015, durante un taller entre personas que elaboraban cerveza artesanal y casera en el estado brasileño de Santa Catalina. Al presentar ingredientes locales que se adaptan bien al clima cálido, el estilo se ha extendido a otros estados dentro de Brasil y a otros lugares, siendo un estilo moderno muy popular en América del Sur, tanto en competencias de cervezas comerciales como de elaboración casera.","Ingredientes característicos":"Malta Pilsner con malta de trigo o trigo sin maltear. Lo más común es una acidificación rápida en la olla de hervor con Lacto (kettle souring), seguida de una fermentación con levadura ale neutra. La fruta es añadida típicamente de forma tardía en la fermentación. Fruta fresca de temporada, a menudo tropical. Especias, hierbas y vegetales son opcionales, pero siempre deberían apoyar y realzar la presentación de la fruta.","Comparación de estilos":"Como una Berliner Weisse más fuerte, pero con fruta fresca y sin Brett. Menos ácida que una Lambic o Gueuze, y sin carácter de Brett. Bajo la Guía de Estilos 2021, cervezas similares podrían ser inscritas en el estilo más amplio 28C Wild Specialty Beer.","Estadísticas vitales":"OG: 1.039 – 1.048 IBU: 2 – 8 FG: 1.004 – 1.012 SRM: 2 – 6 ABV: 4.0 – 5.5%","Ejemplos comerciales":"Armada Daenerys, Blumenau Catharina Sour Pêssego, Istepô Goiabêra, Itajahy Catharina Araçá Sour, Liffey Coroa Real, UNIKA Tangerina Clemenules","Etiquetas":"sud-américa, cerveza-especialidad, estiloartesanal, ácida"},"glass_color":"#ffbf42","srm_variable":false,"clarity":"turbia","foam_color":"#F7F4EC","abv_display":"4–5.5%","ibu_display":"2–8","srm_display":"2–6","og_display":"1.039–1.048","fg_display":"1.004–1.012","country":"Brasil","family":"Cerveza de Especialidad","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Como una Berliner Weisse más fuerte, con fruta y sin Brett.","ibu_avg":5.0,"ibu_variable":false,"abv_avg":4.8,"abv_variable":false,"color_text":"Color a menudo bastante pálido, de pajizo a dorado.","foam_text":"Espuma blanca de media a alta, con retención de aceptable a buena.","suggested_category":"29. Fruit Beer","summary":"Cerveza de trigo brasileña, ácida y frutal.","classic_example":"Armada Daenerys","foam_level":1,"foam_height":7,"srm_lo_hex":"#ffd878","srm_hi_hex":"#f8a600","summary_80":"Una cerveza de trigo ácida y con fruta, refrescante, con un carácter vibrante a fruta y una acidez láctica limpia.","distinctive_80":"Como una Berliner Weisse más fuerte, pero con fruta fresca y sin Brett. Menos ácida que una Lambic o Gueuze, y sin carácter de Brett.","mini_profile":{"malta":2,"lupulo":0,"cuerpo":1,"carbonatacion":3},"char_tags":["ácida"],"ingredients_line":"Malta Pilsner con malta de trigo o trigo sin maltear.","ingredient_chips":["Malta Pilsner con malta de…","Lo más común es una…"],"balance_pos":2.0,"balance_malta":0,"balance_lupulo":0,"aroma_highlight":"Malta media","sabor_highlight":"Amargor medio","apariencia_highlight":"Turbia","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta Pilsner con malta de…","Lo más común es una…"],"sabor_highlights":["Malta Pilsner con malta de…","Lo más común es una…"],"boca_highlights":["Carbonatación alta","Cuerpo ligero"],"apariencia_highlights":["Pálido","Blanca","Turbia"],"ingredientes_highlights":["Malta Pilsner con malta de…","Lo más común es una…"],"ingredient_types":{"malta":"Malta Pilsner con malta de…","levadura":"Lo más común es una…"}},{"code":"X5","name":"New Zealand Pilsner","category_num":99,"category_name":"Apéndice B: Estilos Locales","stats":{"OG":[1.044,1.056],"FG":[1.009,1.014],"IBU":[25.0,45.0],"SRM":[2.0,6.0],"ABV":[4.5,5.8]},"fields":{"Impresión general":"Una cerveza pálida, seca, de color dorado y de fermentación limpia, que presenta lúpulos característicos de Nueva Zelanda con carácter tropical, cítrico, afrutado o a pasto/césped. Cuerpo medio, sensación en boca suave, de paladar y final delicados, con una base de malta de neutra a similar al pan, que le da soporte a esta cerveza orientada al lúpulo, refrescante y de mucha tomabilidad.","Aroma":"Lúpulo de medio a alto reflejando las variedades modernas del Nuevo Mundo, a menudo exhibiendo fruta tropical, cítricos (lima, pomelo/toronja blanca), grosella o melón tuna/dulce (honeydew, en inglés), con un ligero carácter a pimiento verde o a pasto/césped. Malta de media baja a media de apoyo, con una cualidad de neutra a similar al pan o galleta cracker. Muy bajo DMS es aceptable pero no obligatorio. Carácter de levadura neutro y limpio, opcionalmente con una cualidad sulfurosa muy ligera. El carácter del lúpulo debería ser lo más prominente en el balance, pero algo de carácter de malta debe ser evidente.","Apariencia":"Color de pajizo a dorado profundo, pero la mayoría de los ejemplos son amarillo dorado. Generalmente con claridad de bastante traslúcida a brillante; la turbidez es un defecto. Espuma blanca, cremosa y duradera.","Sabor":"Amargor de medio a alto, limpio y sin asperezas, más prominente en el balance y perdurando hasta el retrogusto. Lúpulo de medio a alto con características similares al aroma (tropical, cítrico, grosella, melón, pasto/césped). Malta de media baja a media, a grano dulce, pan o galleta cracker. Perfil de fermentación limpio (los ésteres de fermentación son un defecto). Final de seco a prácticamente seco, limpio y suave, con un retrogusto amargo pero sin asperezas. La malta puede sugerir una impresión de dulzor, pero la cerveza no debería ser literalmente dulce. El final puede ser seco, pero no percibirse crisp o con picor carbónico. El balance siempre debería ser amargo, pero el sabor a malta debe ser perceptible.","Sensación en boca":"Cuerpo de medio ligero a medio. Carbonatación de media a media alta. La suavidad es la impresión más prominente. Nunca astringente ni áspera.","Comentarios":"Los aromas del lúpulo a menudo tienen una cualidad similar a muchos vinos Sauvignon Blanc de Nueva Zelanda, con aromas a fruta tropical, pasto/césped, melón y lima. Frecuentemente elaborada en Nueva Zelanda como un estilo híbrido, utilizando levadura ale neutra a temperaturas frías. Es importante limitar el carácter sulfuroso en el producto final ya que este puede chocar con el lúpulo.","Historia":"Definida en gran medida por la cerveza original creada por Emerson’s Brewery a mediados de la década de 1990, la New Zealand Pilsner ha ampliado su carácter a medida que las variedades de lúpulos de Nueva Zelanda han aumentado en número y popularidad.","Ingredientes característicos":"Lúpulo de variedades de Nueva Zelanda como Motueka, Riwaka y Nelson Sauvin, a menudo con Pacific Jade para amargor. Pueden ser utilizadas otras variedades del Nuevo Mundo provenientes de Australia o Estados Unidos, si poseen características similares. Maltas base pálidas o Pilsner, tal vez con un porcentaje pequeño de trigo malteado. Agua bastante baja en contenido mineral, típicamente con más cloruros que sulfatos. Levadura lager limpia o levadura ale muy neutra.","Comparación de estilos":"Comparada con una German Pils, no es tan crisp ni seca en el final, con una presentación más suave, más maltosa y un cuerpo más pleno. Comparada con una Czech Premium Pale Lager, menos complejidad de malta y una fermentación más limpia. Similar en el balance a una Kölsch o British Golden Ale, pero con aroma más lupulado. Comparada con cualquiera de estos estilos alemanes, exhibe variedades de lúpulo de Nueva Zelanda con características tropicales, cítricas, afrutadas o a pasto/césped, a menudo con un carácter similar al vino blanco. No debería ser tan lupulada ni amarga en el balance como una IPA.","Estadísticas vitales":"OG: 1.044 – 1.056 IBU: 25 – 45 FG: 1.009 – 1.014 SRM: 2 – 6 ABV: 4.5 – 5.8%","Ejemplos comerciales":"Croucher New Zealand Pilsner, Emerson’s Pilsner, Liberty Halo Pilsner, Panhead Port Road Pilsner, Sawmill Pilsner, Tuatara Mot Eureka","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónbaja, acondicionada-en-frío, pacífico, familia-pilsner, estiloartesanal, amarga"},"glass_color":"#ffbf42","srm_variable":false,"clarity":"traslucida","foam_color":"#F7F4EC","abv_display":"4.5–5.8%","ibu_display":"25–45","srm_display":"2–6","og_display":"1.044–1.056","fg_display":"1.009–1.014","country":"Nueva Zelanda","family":"Pale Ale","glass_shape":"pilsner","glass_label":"Copa pilsner","distinctive":"Más suave que una German Pils, menos amarga que una IPA.","ibu_avg":35.0,"ibu_variable":false,"abv_avg":5.2,"abv_variable":false,"color_text":"Color de pajizo a dorado profundo, pero la mayoría de los ejemplos son amarillo dorado.","foam_text":"Espuma blanca, cremosa y duradera.","suggested_category":"12. Pale Commonwealth Beer","summary":"Lager pálida y seca de Nueva Zelanda, lúpulos tropicales.","classic_example":"Croucher New Zealand Pilsner","foam_level":2,"foam_height":10,"srm_lo_hex":"#ffd878","srm_hi_hex":"#f8a600","summary_80":"Una cerveza pálida, seca, de color dorado y de fermentación limpia, que presenta lúpulos característicos de Nueva Zelanda con carácter tropical, cítrico.","distinctive_80":"Comparada con una German Pils, no es tan crisp ni seca en el final, con una presentación más suave, más maltosa y un cuerpo más pleno.","mini_profile":{"malta":2,"lupulo":3,"cuerpo":2,"carbonatacion":3},"char_tags":["amarga"],"ingredients_line":"Lúpulo de variedades de Nueva Zelanda como Motueka, Riwaka y Nelson Sauvin, a menudo con Pacific Jade para amargor.","ingredient_chips":["Lúpulo de variedades de Nueva…","Maltas base pálidas o Pilsner"],"balance_pos":2.5,"balance_malta":2,"balance_lupulo":3,"aroma_highlight":"Lúpulo alto","sabor_highlight":"Lúpulo alto","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Maltas base pálidas o Pilsner","Lúpulo de variedades de Nueva…","Levadura lager limpia o…"],"sabor_highlights":["Maltas base pálidas o Pilsner","Lúpulo de variedades de Nueva…","Levadura lager limpia o…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Pajizo","Cremosa","Translúcida"],"ingredientes_highlights":["Lúpulo de variedades de Nueva…","Maltas base pálidas o Pilsner"],"ingredient_types":{"malta":"Maltas base pálidas o Pilsner","lupulo":"Lúpulo de variedades de Nueva…","levadura":"Levadura lager limpia o…"}}]</script>
<script>(function(){
  const DATA = JSON.parse(document.getElementById('bjcp-data').textContent);
  const CATEGORY_ORDER = [...new Set(DATA.map(d=>d.category_num))].sort((a,b)=>a-b);
  const COUNTRY_ORDER = ["Alemania","República Checa","Austria","Inglaterra","Escocia","Irlanda",
    "Bélgica","Francia","Estados Unidos","Internacional","Escandinavia","Australia",
    "Argentina","Brasil","Italia","Nueva Zelanda","Cerveza de Especialidad"]
    .filter(c => DATA.some(d=>d.country===c));

  const FAMILY_ORDER = ["Pale Lager","Pilsner","Amber Lager","Dark Lager","Bock","Pale Ale","IPA",
    "Amber Ale","Brown Ale","Porter","Stout","Strong Ale","Wheat Beer","Sour Ale","Cerveza de Especialidad"]
    .filter(fm => DATA.some(d=>d.family===fm));

  // ---------- Glass shapes ----------
  const GLASS_SHAPES = {
    shaker:  { outline:"M17,9 L43,9 L39,78 Q30,81 21,78 Z", liquidTop:22 },
    nonic:   { outline:"M17,9 L43,9 L44,26 Q44,31 41,33 L39,78 Q30,81 21,78 L19,33 Q16,31 16,26 Z", liquidTop:22 },
    weizen:  { outline:"M27,78 Q22,78 22,71 L18,26 Q17,15 22,10 L38,10 Q43,15 42,26 L38,71 Q38,78 33,78 Q30,80.5 27,78 Z", liquidTop:24 },
    pilsner: { outline:"M20,9 L40,9 L34,77 Q30,80 26,77 Z", liquidTop:20 },
    flute:   { outline:"M25,9 L35,9 L32,76 Q30,78.5 28,76 Z", liquidTop:18 },
    seidel:  { outline:"M16,11 L44,11 L44,75 L16,75 Z", liquidTop:22, handle:"M44,26 Q55,26 55,39 Q55,52 44,52" },
    tulip:   { outline:"M30,11 C17,11 13,27 18,41 C21,52 25,59 30,60 C35,59 39,52 42,41 C47,27 43,11 30,11 Z",
               liquidTop:24, stem:"M30,60 L30,72", foot:{cx:30,cy:76,rx:9,ry:2.6} },
    goblet:  { outline:"M30,11 C16,11 12,29 17,43 C20,54 24,59 30,59 C36,59 40,54 43,43 C48,29 44,11 30,11 Z",
               liquidTop:24, stem:"M30,59 L30,73", foot:{cx:30,cy:77,rx:11,ry:2.8} },
    snifter: { outline:"M30,19 C14,19 12,38 18,52 C23,63 37,63 42,52 C48,38 46,19 30,19 Z", liquidTop:32 }
  };

  function svgDefsOnce(){
    if(document.getElementById('bjcp-svg-defs')) return;
    const div = document.createElement('div');
    div.style.position='absolute'; div.style.width='0'; div.style.height='0'; div.style.overflow='hidden';
    div.innerHTML = `
    <svg id="bjcp-svg-defs" width="0" height="0">
      <defs>
        <filter id="hazeBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.5"/></filter>
        <filter id="opaqueBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.35"/></filter>
        <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
          <stop offset="20%" stop-color="#ffffff" stop-opacity="0.04"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
      </defs>
    </svg>`;
    document.body.appendChild(div);
  }

  // ---------- color helpers ----------
  function hexToRgb(hex){
    const h = hex.replace('#','');
    return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)];
  }
  function rgbToHex(r,g,b){
    const c = v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');
    return '#'+c(r)+c(g)+c(b);
  }
  function shade(hex, amt){ // amt: -1..1 (negative = darker, positive = lighter)
    const [r,g,b] = hexToRgb(hex);
    const t = amt<0 ? 0 : 255;
    const p = Math.abs(amt);
    return rgbToHex(r+(t-r)*p, g+(t-g)*p, b+(t-b)*p);
  }

  let uid = 0;
  function glassSVG(style, size){
    size = size || 64;
    const w = size*60/84, h = size;
    const shape = GLASS_SHAPES[style.glass_shape] || GLASS_SHAPES.shaker;
    const clarity = style.clarity;
    let liquidOpacity = 0.90, filterAttr = '';
    if(clarity==='traslucida'){ liquidOpacity=0.90; filterAttr='filter="url(#opaqueBlur)"'; }
    else if(clarity==='turbia'){ liquidOpacity=0.97; filterAttr='filter="url(#hazeBlur)"'; }
    else if(clarity==='opaca'){ liquidOpacity=1; filterAttr='filter="url(#opaqueBlur)"'; }

    const gid = uid++;
    const clipId = `clip-${style.code}-${gid}`;
    const liqId = `liq-${style.code}-${gid}`;
    const foamId = `foam-${style.code}-${gid}`;
    const topColor = shade(style.glass_color, 0.14);
    const botColor = shade(style.glass_color, -0.12);
    const foamTop = shade(style.foam_color, 0.5);
    const foamBot = shade(style.foam_color, -0.12);

    let extras = '';
    if(shape.stem){ extras += `<path d="${shape.stem}" stroke="var(--ink-soft)" stroke-width="1.6" stroke-opacity="0.55" fill="none"/>`; }
    if(shape.foot){
      const f = shape.foot;
      extras += `<ellipse cx="${f.cx}" cy="${f.cy}" rx="${f.rx}" ry="${f.ry}" fill="none" stroke="var(--ink-soft)" stroke-width="1.1" stroke-opacity="0.55"/>`;
    }
    if(shape.handle){ extras += `<path d="${shape.handle}" fill="none" stroke="var(--ink-soft)" stroke-width="1.4" stroke-opacity="0.55"/>`; }

    // a few rising bubble dots, positions scaled loosely within the liquid column
    const bubbleYs = [72,64,55,46,38,30];
    let bubbles = '';
    bubbleYs.forEach((by,i)=>{
      if(by <= shape.liquidTop+4) return;
      const bx = 22 + ((i*7)%16);
      const r = i%3===0 ? 0.9 : 0.6;
      bubbles += `<circle cx="${bx}" cy="${by}" r="${r}" fill="#ffffff" fill-opacity="0.35"/>`;
    });

    return `
    <svg width="${w}" height="${h}" viewBox="0 0 60 84" aria-hidden="true">
      <defs>
        <linearGradient id="${liqId}" x1="0" y1="0" x2="0" y2="1">

          <stop offset="30%" stop-color="${style.glass_color}"/>
          <stop offset="75%" stop-color="${style.glass_color}"/>
          <stop offset="100%" stop-color="${botColor}"/>
        </linearGradient>
        <linearGradient id="${foamId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${foamTop}"/>
          <stop offset="100%" stop-color="${foamBot}"/>
        </linearGradient>
        <clipPath id="${clipId}"><path d="${shape.outline}"/></clipPath>
      </defs>
      <ellipse cx="30" cy="87" rx="16" ry="2.6" fill="#000000" opacity="0.10"/>
      <g clip-path="url(#${clipId})">
        <rect x="10" y="${shape.liquidTop}" width="40" height="${84-shape.liquidTop}" fill="url(#${liqId})" fill-opacity="${liquidOpacity}" ${filterAttr}/>
        ${bubbles}
        <rect x="10" y="${shape.liquidTop}" width="40" height="${style.foam_height}" fill="url(#${foamId})"/>
        <circle cx="20" cy="${shape.liquidTop+3}" r="2" fill="#ffffff" fill-opacity="0.5"/>
        <circle cx="38" cy="${shape.liquidTop+5}" r="1.4" fill="#ffffff" fill-opacity="0.4"/>
      </g>
      <path d="${shape.outline}" fill="none" stroke="var(--ink-soft)" stroke-width="1" stroke-opacity="0.5" stroke-linejoin="round"/>
      ${extras}
      <path d="${shape.outline}" fill="url(#glassSheen)" opacity="0.7"/>
    </svg>`;
  }

  // ---------- Hop bitterness icon (single icon, fill height = IBU intensity) ----------
  // ---------- Hop bitterness row (5 hop cones, fractional fill = IBU intensity) ----------
  const IBU_DOMAIN = 100; // fixed scale: 5/5 filled cones = 100 IBU
  const HOP_OUTLINE = "M32,14 C20,14 8,24 8,36 C8,42 10,48 13,54 C16,62 19,70 22,76 C25,82 28,86 32,88 C36,86 39,82 42,76 C45,70 48,62 51,54 C54,48 56,42 56,36 C56,24 44,14 32,14 Z";
  const HOP_LINES = "M14,32 Q32,38 50,32 M13,46 Q32,53 51,46 M16,60 Q32,66 48,60 M20,72 Q32,77 44,72 M32,18 L32,86";
  const HOP_STEM  = "M32,14 C30,9 26,8 27,4 C28,1 33,2 31,6";
  const HOP_FILL_COLOR = "#4E8F2E";

  function hopCone(fillFrac, size){
    // fillFrac: 0 (empty/outline only) .. 1 (fully painted)
    size = size || 22;
    const w = size*64/92, h = size;
    const cid = `hc-${uid++}`;
    let fillEl = '';
    if(fillFrac > 0.02){
      const fw = Math.min(64, 64*fillFrac);
      fillEl = `<g clip-path="url(#${cid})"><rect x="0" y="0" width="${fw}" height="92" fill="${HOP_FILL_COLOR}"/></g>`;
    }
    return `
    <svg width="${w}" height="${h}" viewBox="0 0 64 92" aria-hidden="true">
      <clipPath id="${cid}"><path d="${HOP_OUTLINE}"/></clipPath>
      ${fillEl}
      <path d="${HOP_OUTLINE}" fill="none" stroke="var(--ink-soft)" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="${HOP_LINES}" stroke="var(--ink-soft)" stroke-width="1" stroke-opacity="0.45" fill="none"/>
      <path d="${HOP_STEM}" stroke="var(--ink-soft)" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>`;
  }

  function hopBitternessRow(style, size){
    size = size || 20;
    const value = Math.max(0, Math.min(5, style.ibu_avg/IBU_DOMAIN*5));
    const full = Math.floor(value + 1e-9);
    const frac = value - full;
    let icons = '';
    for(let i=0;i<5;i++){
      let f = 0;
      if(i < full) f = 1;
      else if(i === full && frac > 0.02) f = frac;
      icons += hopCone(f, size);
    }
    return icons;
  }

  function ibuCaption(style){
    return style.ibu_variable
      ? 'IBU según estilo base'
      : `${style.ibu_display} IBU`;
  }

  // ---------- Alcohol speedometer (semicircle gauge with needle) ----------
  const ABV_DOMAIN = 16; // fixed scale: needle at far right = 16% ABV
  const ABV_BANDS = [
    { from:0,   to:36,  color:'#8FBF4F' },
    { from:36,  to:72,  color:'#C9D24A' },
    { from:72,  to:108, color:'#E8A63A' },
    { from:108, to:144, color:'#D9702F' },
    { from:144, to:180, color:'#B33A2E' },
  ];
  function polarPt(cx,cy,r,thetaDeg){
    const rad = thetaDeg*Math.PI/180;
    return [cx + r*Math.cos(rad), cy - r*Math.sin(rad)];
  }
  function arcPath(cx,cy,r,thetaStart,thetaEnd,steps){
    steps = steps || 10;
    let d = '';
    for(let i=0;i<=steps;i++){
      const t = thetaStart + (thetaEnd-thetaStart)*(i/steps);
      const [x,y] = polarPt(cx,cy,r,180-t);
      d += (i===0?'M':'L') + x.toFixed(2) + ',' + y.toFixed(2) + ' ';
    }
    return d;
  }

  function speedometer(style, size){
    size = size || 60;
    const w = size, h = size*(70/120);
    const cx = 60, cy = 62, rTrack = 48, rNeedle = 42;
    const value = Math.max(0, Math.min(ABV_DOMAIN, style.abv_avg));
    const theta = (value/ABV_DOMAIN)*180; // 0=left(min) .. 180=right(max), matches arcPath's internal 180-t flip
    const bands = ABV_BANDS.map(b=>
      `<path d="${arcPath(cx,cy,rTrack,b.from,b.to,8)}" fill="none" stroke="${b.color}" stroke-width="11" stroke-linecap="butt"/>`
    ).join('');
    const [nx,ny] = polarPt(cx,cy,rNeedle,180-theta);
    return `
    <svg width="${w}" height="${h}" viewBox="0 0 120 70" aria-hidden="true">
      ${bands}
      <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="5" fill="var(--ink)"/>
      <circle cx="${cx}" cy="${cy}" r="2" fill="var(--paper-card)"/>
    </svg>`;
  }

  function abvCaption(style){
    return style.abv_variable
      ? 'ABV según estilo base'
      : `${style.abv_display} ABV`;
  }

  function srmCaption(style){
    return style.srm_variable
      ? 'SRM según estilo base'
      : `${style.srm_display} SRM`;
  }

  // ---------- Modal sensory bars (track + marker style, all 4 alike) ----------
  const MP_DEFS = {
    malta:         { label:'Maltosidad',    words:['Nula','Baja','Media','Alta','Muy alta'],      ends:['Nula','Muy alta'],      grad:'grad-malt' },
    cuerpo:        { label:'Cuerpo',        words:['Muy ligero','Ligero','Medio','Pleno','Muy pleno'], ends:['Muy ligero','Muy pleno'], grad:'grad-body' },
    carbonatacion: { label:'Carbonatación', words:['Nula','Baja','Media','Alta','Muy alta'],      ends:['Nula','Muy alta'],      grad:'grad-carb' },
  };
  function mpTrack(key, level){
    const def = MP_DEFS[key];
    let marker = '';
    if(level != null){
      const pct = (level/4*100).toFixed(1);
      marker = `<div class="mp-marker" style="left:${pct}%"></div>`;
    }
    return `<div class="mprow">
      <div class="mprow-label"><span class="name">${def.label}</span></div>
      <div class="mp-track ${def.grad}">${marker}</div>
      <div class="mp-ends"><span>${def.ends[0]}</span><span>${def.ends[1]}</span></div>
    </div>`;
  }
  function balanceBar(style){
    const pos = style.balance_pos;
    let marker = '';
    if(pos != null){
      const pct = (pos/4*100).toFixed(1);
      marker = `<div class="mp-marker" style="left:${pct}%"></div>`;
    }
    return `<div class="mprow">
      <div class="mprow-label"><span class="name">Balance</span></div>
      <div class="mp-track grad-balance">${marker}</div>
      <div class="mp-ends"><span>Maltoso</span><span>Lupulado</span></div>
    </div>`;
  }
  function modalProfileHTML(style){
    return `<div class="modal-profile">
      ${mpTrack('malta', style.mini_profile.malta)}
      ${balanceBar(style)}
      ${mpTrack('cuerpo', style.mini_profile.cuerpo)}
      ${mpTrack('carbonatacion', style.mini_profile.carbonatacion)}
      <div class="modal-profile-note">Niveles estimados.</div>
    </div>`;
  }

  // ---------- Mini sensory profile (one compact text line) ----------
  const LEVEL_WORDS = {
    malta:         ['nula','baja','media','alta','muy alta'],
    lupulo:        ['nulo','bajo','medio','alto','muy alto'],
    cuerpo:        ['muy ligero','ligero','medio','pleno','muy pleno'],
    carbonatacion: ['nula','baja','media','alta','muy alta'],
  };
  const MINI_LABELS = { malta:'Malta', lupulo:'Lúpulo', cuerpo:'Cuerpo', carbonatacion:'CO₂' };
  function miniProfileHTML(style){
    const p = style.mini_profile || {};
    const parts = ['malta','lupulo','cuerpo','carbonatacion']
      .filter(k => p[k] != null)
      .map(k => `${MINI_LABELS[k]} ${LEVEL_WORDS[k][p[k]]}`);
    if(!parts.length) return '';
    return `<div class="mini-profile-line">${parts.join(' · ')}</div>`;
  }

  function ingredientsLineHTML(style){
    const chips = style.ingredient_chips;
    if(!chips || !chips.length) return '';
    const icon = `<svg viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><path d="M6,13 L6,2 M6,3 L3.8,1.2 M6,3 L8.2,1.2 M6,5.4 L3.8,3.6 M6,5.4 L8.2,3.6 M6,7.8 L3.8,6 M6,7.8 L8.2,6"/></svg>`;
    return `<div class="ingredients-line">${icon}${chips.map(c=>`<span class="itag">${escapeHTML(c)}</span>`).join('')}</div>`;
  }

  // ---------- Helpers ----------
  function escapeHTML(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Link style names mentioned in "Comparación de estilos" ----------
  function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  const STYLE_NAME_MAP = {};
  const STYLE_NAME_LIST = DATA
    .filter(d => d.name && d.name.length > 2)
    .map(d => { STYLE_NAME_MAP[d.name.toLowerCase()] = d.code; return d.name; })
    .sort((a,b) => b.length - a.length);
  const STYLE_NAME_REGEX = new RegExp('\\b(' + STYLE_NAME_LIST.map(escapeRegExp).join('|') + ')\\b', 'gi');

  function linkifyStyleNames(text, currentCode){
    const escaped = escapeHTML(text);
    return escaped.replace(STYLE_NAME_REGEX, (match) => {
      const code = STYLE_NAME_MAP[match.toLowerCase()];
      if(!code || code === currentCode) return match;
      return `<span class="style-link" data-code="${code}">${match}</span>`;
    });
  }

  function cardHTML(style){
    const f = style.fields;
    return `
    <button class="card" data-code="${style.code}" aria-label="${escapeHTML(style.name)}">
      <div class="card-glass-wrap">
        ${style.classic_example ? `<div class="classic-example">${escapeHTML(style.classic_example)}</div>` : ''}
        ${glassSVG(style,74)}
        <div class="glass-label">${style.glass_label}</div>
        <div class="srm-caption stat-chip">${srmCaption(style)}</div>
        <div class="hop-gauge">
          <div class="hop-row-icons">${hopBitternessRow(style,20)}</div>
          <span class="ibu-num stat-chip">${ibuCaption(style)}</span>
        </div>
        <div class="abv-gauge">
          ${speedometer(style,58)}
          <span class="abv-num stat-chip">${abvCaption(style)}</span>
        </div>
      </div>
      <div class="card-body">
        <div class="card-country">${escapeHTML(style.country)} · ${escapeHTML(style.family)}</div>
        <div class="card-code">${style.code}</div>

          <span class="stat-chip">OG ${style.og_display}</span>
          <span class="stat-chip">FG ${style.fg_display}</span>
        </div>
        <div class="card-preview">${escapeHTML(style.summary_80 || f['Impresión general'] || style.summary || '')}</div>
        ${(style.distinctive_80 || style.distinctive) ? `<div class="card-distinctive"><b>Se diferencia:</b> ${linkifyStyleNames(style.distinctive_80 || style.distinctive, style.code)}</div>` : ''}
        ${miniProfileHTML(style)}
        ${style.char_tags && style.char_tags.length ? `<div class="char-tags">${style.char_tags.map(t=>`<span class="ctag">${escapeHTML(t)}</span>`).join('')}</div>` : ''}
      </div>
    </button>`;
  }

  function categoryBlockHTML(catNum, items){
    const catName = items[0].category_name;
    const numLabel = catNum===99 ? '§' : catNum+'.';
    return `
    <section class="category-block" data-cat="${catNum}">
      <div class="category-head">
        <span class="num">${numLabel}</span>
        <h2>${escapeHTML(catName)}</h2>
        <span class="tally">${items.length} estilo${items.length!==1?'s':''}</span>
      </div>
      <div class="card-grid">
        ${items.map(cardHTML).join('')}
      </div>
    </section>`;
  }

  function render(list){
    const main = document.getElementById('main');
    const noResults = document.getElementById('noResults');
    document.getElementById('resultCount').textContent = list.length + (list.length===DATA.length ? ' estilos' : ' resultado' + (list.length!==1?'s':''));
    if(list.length===0){ main.innerHTML=''; noResults.style.display='block'; return; }
    noResults.style.display='none';
    const byCat = {};
    list.forEach(d=>{ (byCat[d.category_num]=byCat[d.category_num]||[]).push(d); });
    const catsPresent = CATEGORY_ORDER.filter(c=>byCat[c]);
    main.innerHTML = catsPresent.map(c=>categoryBlockHTML(c, byCat[c])).join('');
    main.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('click', ()=> openModal(card.dataset.code));
    });
  }

  // ---------- Filtering ----------
  function currentFilters(){
    return {
      q: document.getElementById('searchInput').value.trim().toLowerCase(),
      cat: document.getElementById('categorySelect').value,
      country: document.getElementById('countrySelect').value,
      family: document.getElementById('familyStyleSelect').value
    };
  }
  function applyFilters(){
    const {q, cat, country, family} = currentFilters();
    let list = DATA;
    if(cat) list = list.filter(d=>String(d.category_num)===cat);
    if(country) list = list.filter(d=>d.country===country);
    if(family) list = list.filter(d=>d.family===family);
    if(q){
      list = list.filter(d=>{
        return d.name.toLowerCase().includes(q)
          || d.code.toLowerCase().includes(q)
          || (d.fields['Ejemplos comerciales']||'').toLowerCase().includes(q)
          || d.category_name.toLowerCase().includes(q)
          || d.country.toLowerCase().includes(q)
          || d.family.toLowerCase().includes(q);
      });
    }
    render(list);
  }

  // ---------- Modal ----------
  function statBox(k,v){ return `<div class="modal-stat"><div class="k">${k}</div><div class="v">${v}</div></div>`; }

  const SECTION_ICONS = {

    sabor:    `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5,2 C5,6 4,7 4,9.5 C4,12 5.8,14 8,14 C10.2,14 12,12 12,9.5 C12,7 11,6 11,2"/><path d="M6,9.5 C6,10.6 6.9,11.5 8,11.5 C9.1,11.5 10,10.6 10,9.5"/></svg>`,
