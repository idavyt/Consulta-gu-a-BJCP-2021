},{"code":"15A","name":"Irish Red Ale","category_num":15,"category_name":"Irish Beer","stats":{"OG":[1.036,1.046],"FG":[1.01,1.014],"IBU":[18.0,28.0],"SRM":[9.0,14.0],"ABV":[3.8,5.0]},"fields":{"Impresión general":"Una pinta fácil de tomar, a menudo con sabores sutiles. Ligeramente maltosa en el balance, a veces con un dulzor inicial suave a toffee o caramelo, un paladar ligeramente granoso y a galleta, y un toque de sequedad rostizada en el final. Algunas versiones pueden enfatizar más el caramelo y el dulzor, mientras que otras favorecen el paladar granoso y la sequedad rostizada.","Aroma":"A malta de bajo a moderado, ya sea a grano neutro o con un ligero carácter a caramelo, tostadas o toffee. Un muy bajo carácter a mantequilla es opcional. Un ligero aroma a lúpulo terroso o floral es opcional. Bastante limpia.","Apariencia":"Color de ámbar medio a cobre rojizo medio. Traslúcida. Espuma baja con color de blanquecino a canela, con persistencia media.","Sabor":"A malta de muy bajo a moderado con carácter a caramelo y dulzor, rara vez con una cualidad ligera a tostadas con mantequilla, o similar al toffee. El paladar a menudo es bastante neutro y granoso, o puede tomar una ligera nota tostada o a galleta al final, con un ligero sabor a grano rostizado, lo que le da una sequedad final característica. Un ligero sabor a lúpulo terroso o floral es opcional. Amargor de medio bajo a medio. Final de seco a semi seco. Limpia y suave. Ésteres bajos son opcionales. El balance tiende a ir levemente hacia la malta, aunque un ligero uso de granos rostizados puede aumentar levemente la percepción de amargor.","Sensación en boca":"Cuerpo de medio ligero a medio, aunque los ejemplos que contienen niveles bajos de diacetilo pueden tener una sensación en boca ligeramente untuosa (no requerida). Carbonatación moderada. Suave.","Comentarios":"El estilo es bastante amplio para permitir ejemplos más allá de los tradicionales de Irlanda. Los ejemplos irlandeses tienden a ser más bajos en alcohol, más granosos y 28 con un final más seco, mientras que las versiones no irlandesas suelen ser más altas en alcohol, más dulces, quizá más acarameladas y esterosas, y a menudo son cervezas de temporada.","Historia":"Si bien Irlanda tiene una larga tradición en elaboración de ales, el estilo moderno Irish Red Ale es esencialmente una adaptación o interpretación del popular estilo English Bitter, con menos lúpulo y un poco de rostizado para agregar color y sequedad, aunque hay quienes proponen una historia más larga. Redescubierta como un estilo de cerveza artesanal en Irlanda, hoy en día es una parte esencial en la mayoría de las cartas de las cervecerías, junto con una pale ale y una stout.","Ingredientes característicos":"Generalmente tiene un poco de cebada rostizada o malta negra para darle un color rojizo y un final rostizado seco. Malta base pálida. Históricamente, las maltas Caramelo se importaban y eran más caras, por lo que no todas las cervecerías las utilizaban.","Comparación de estilos":"Una equivalente irlandesa de la English Bitter, menos amarga y lupulada, con un final algo seco debido a la cebada rostizada. Más atenuada, con menos sabor a caramelo y cuerpo que las Scottish Ale de intensidad equivalente.","Estadísticas vitales":"OG: 1.036 – 1.046 IBU: 18 – 28 FG: 1.010 – 1.014 SRM: 9 – 14 ABV: 3.8 – 5.0%","Ejemplos comerciales":"Franciscan Well Rebel Red, Kilkenny Irish Beer, Murphy’s Irish Red, O’Hara’s Irish Red Ale, Porterhouse Nitro Red Ale, Smithwick’s Irish Ale","Etiquetas":"intensidad-estándar, color-ámbar, fermentaciónalta, islas-británicas, estilo-tradicional, familia-ale-ámbar"},"glass_color":"#d36e00","srm_variable":false,"clarity":"traslucida","foam_color":"#D9B183","abv_display":"3.8–5%","ibu_display":"18–28","srm_display":"9–14","og_display":"1.036–1.046","fg_display":"1.01–1.014","country":"Irlanda","family":"Amber Ale","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Como una English Bitter menos amarga, final seco.","ibu_avg":23.0,"ibu_variable":false,"abv_avg":4.4,"abv_variable":false,"summary":"Pinta irlandesa fácil de tomar, ligeramente maltosa.","classic_example":"Franciscan Well Rebel Red","foam_level":1,"foam_height":7,"srm_lo_hex":"#e58500","srm_hi_hex":"#c35900","summary_80":"Una pinta fácil de tomar, a menudo con sabores sutiles.","distinctive_80":"Una equivalente irlandesa de la English Bitter, menos amarga y lupulada, con un final algo seco debido a la cebada rostizada. Más atenuada.","mini_profile":{"malta":2,"lupulo":1,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Generalmente tiene un poco de cebada rostizada o malta negra para darle un color rojizo y un final rostizado seco.","ingredient_chips":["Generalmente tiene un poco de…","Malta base pálida"],"balance_pos":1.5,"balance_malta":2,"balance_lupulo":1,"aroma_highlight":"Malta media","sabor_highlight":"Malta media","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":["Generalmente tiene un poco de…"],"sabor_highlights":["Generalmente tiene un poco de…"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Ámbar","Canela","Translúcida"],"ingredientes_highlights":["Generalmente tiene un poco de…","Malta base pálida"],"ingredient_types":{"malta":"Generalmente tiene un poco de…"}},{"code":"15B","name":"Irish Stout","category_num":15,"category_name":"Irish Beer","stats":{"OG":[1.036,1.044],"FG":[1.007,1.011],"IBU":[25.0,45.0],"SRM":[25.0,40.0],"ABV":[3.8,5.0]},"fields":{"Impresión general":"Una cerveza negra con un pronunciado sabor rostizado, a menudo similar al café. El balance puede variar de bastante equilibrado a bastante amargo; las versiones más equilibradas tienen un ligero dulzor de malta y las versiones amargas son bastante secas. Las versiones tiradas (draft) suelen ser cremosas al ser servidas con nitrógeno, pero las versiones embotelladas no tendrán este carácter derivado del servicio. El sabor rostizado puede variar desde seco y similar al café hasta algo similar al chocolate.","Aroma":"Por lo general, domina un aroma moderado similar al del café; puede tener ligeras notas secundarias a chocolate amargo, cacao o granos rostizados. Ésteres medio bajos son opcionales. Un bajo aroma a lúpulo terroso o floral es opcional.","Apariencia":"Color de marrón oscuro a negro azabache con reflejos granate. Según Guinness, \"la cerveza Guinness puede parecer negra, pero en realidad es un tono muy oscuro de rubí\". Opaca. Al servirla con nitrógeno, es característica una espuma espesa, cremosa, de larga duración, con color de canela a marrón, pero no espere una espuma compacta y cremosa de una cerveza embotellada.","Sabor":"A grano o a malta rostizados de intensidad moderada, con un amargor de medio a alto. El final puede ir de seco y similar al café a moderadamente balanceado, con un toque de caramelo o dulzor de malta. Por lo general tiene sabores similares al café, pero también puede tener un carácter semi amargo o a chocolate sin azúcar en el paladar, que perdura hasta el final. El balance puede incluir factores como algo de cremosidad, frutosidad media baja o sabor a lúpulo terroso de intensidad media. El nivel de amargor es algo variable, al igual que el carácter rostizado y la sequedad del final; permita la interpretación por parte de quien la elabora.","Sensación en boca":"Cuerpo de medio bajo a medio pleno, con un carácter algo cremoso, especialmente cuando se sirve con nitrógeno. Carbonatación de baja a moderada. Esta cerveza es notablemente suave a pesar de un alto amargor de lúpulos y una proporción significativa de granos oscuros presentes. Puede tener una ligera astringencia de los granos rostizados, aunque la aspereza no es deseable.","Comentarios":"Tradicionalmente un producto para servicio tirado (draft). Los ejemplos modernos casi siempre se asocian con un servicio utilizando nitrógeno. No espere que las cervezas embotelladas tengan la textura plena y cremosa, o la espuma duradera asociada con el servicio mediante mezcla de gases. Existen diferencias regionales en Irlanda, similares a la variabilidad en las English Bitter. Las stout tipo Dublín emplean cebada rostizada, son más amargas y más secas. Las stout tipo Cork son más dulces, menos amargas y tienen sabores a chocolate y maltas especiales.","Historia":"El estilo evolucionó a partir de las porter de Londres, pero exhibiendo un cuerpo e intensidad más plenos, cremosos y más “fuertes” (stout). Guinness comenzó a elaborar únicamente porter en 1799, y un “tipo de porter más fuerte” alrededor de 1810. La Irish Stout se separó de la London Single Stout (o simplemente porter) a fines del siglo XIX, con énfasis en las maltas más oscuras y la cebada rostizada. Guinness comenzó a usar cebada en hojuelas después de la Segunda Guerra Mundial, y Guinness Draught se lanzó como marca en 1959. Las latas y botellas Draught (“widget”) se desarrollaron a finales de las décadas de 1980 y 1990 (Nota de la Traducción: un widget es una pieza plástica, que va en el interior del envase de cerveza, y se encarga de liberar nitrógeno al abrir la lata o botella).","Ingredientes característicos":"Maltas o granos rostizados oscuros, suficientes para que la cerveza adquiera un color negro. Malta pálida. Puede utilizar granos sin maltear para el cuerpo.","Comparación de estilos":"Menos intensidad que una Irish Extra Stout. De color más oscuro (negro) que una English Porter (marrón).","Estadísticas vitales":"OG: 1.036 – 1.044 IBU: 25 – 45 FG: 1.007 – 1.011 SRM: 25 – 40 ABV: 3.8 – 5.0%","Ejemplos comerciales":"Beamish Irish Stout, Belhaven Black Stout, Guinness Draught, Murphy’s Irish Stout, O’Hara’s Irish Stout, Porterhouse Irish Stout","Etiquetas":"intensidad-estándar, color-oscuro, fermentaciónalta, islas-británicas, estilo-tradicional, familia-stout, amarga"},"glass_color":"#590905","srm_variable":false,"clarity":"opaca","foam_color":"#D9B183","abv_display":"3.8–5%","ibu_display":"25–45","srm_display":"25–40","og_display":"1.036–1.044","fg_display":"1.007–1.011","country":"Irlanda","family":"Stout","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Menos intensa que una Irish Extra Stout.","ibu_avg":35.0,"ibu_variable":false,"abv_avg":4.4,"abv_variable":false,"summary":"Stout negra con marcado sabor rostizado a café.","classic_example":"Beamish Irish Stout","foam_level":3,"foam_height":14,"srm_lo_hex":"#7b1a00","srm_hi_hex":"#030403","summary_80":"Una cerveza negra con un pronunciado sabor rostizado, a menudo similar al café.","distinctive_80":"Menos intensidad que una Irish Extra Stout.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":2},"char_tags":["amarga"],"ingredients_line":"Maltas o granos rostizados oscuros, suficientes para que la cerveza adquiera un color negro. Malta pálida.","ingredient_chips":["Maltas o granos rostizados…","Malta pálida"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Lúpulo bajo","sabor_highlight":"Amargor alto","apariencia_highlight":"Opaca","boca_highlight":"Cuerpo medio","aroma_highlights":["Maltas o granos rostizados…"],"sabor_highlights":["Maltas o granos rostizados…"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Marrón","Cremosa","Opaca"],"ingredientes_highlights":["Maltas o granos rostizados…","Malta pálida"],"ingredient_types":{"malta":"Maltas o granos rostizados…"}},{"code":"15C","name":"Irish Extra Stout","category_num":15,"category_name":"Irish Beer","stats":{"OG":[1.052,1.062],"FG":[1.01,1.014],"IBU":[35.0,50.0],"SRM":[30.0,40.0],"ABV":[5.0,6.5]},"fields":{"Impresión general":"Una cerveza negra de cuerpo más pleno, con un pronunciado sabor rostizado, a menudo similar al café y al chocolate amargo, con cierta complejidad de malta. El balance puede variar de moderadamente semi amargo a amargo; las versiones más balanceadas tienen una riqueza de malta de intensidad hasta moderada, y las versiones amargas son bastante secas.","Aroma":"De moderado a moderadamente alto similar al café, a menudo con ligeras notas secundarias a chocolate amargo, cacao, galleta, vainilla o granos rostizados. Ésteres medio bajos son opcionales. El aroma a lúpulo es de bajo a nulo, puede ser ligeramente terroso o especiado, pero por lo general está ausente. La malta y un perfil rostizado dominan el aroma.","Apariencia":"Color negro azabache. Opaca. Es característica una espuma espesa, cremosa y persistente de color canela.","Sabor":"De intensidad media a media alta a maltas o granos oscuros rostizados, con un amargor de medio a medio alto. El final puede ir de seco y similar al café a moderadamente balanceado con un dulzor hasta moderado a caramelo o malta. Por lo general, tiene sabores rostizados similares al café, pero a menudo también tiene un carácter a chocolate amargo en el paladar, que perdura hasta el final. A menudo están presentes sabores en segundo plano a moca (café con chocolate) o a galleta que agregan complejidad. Una frutosidad media baja es opcional. Lúpulo medio terroso o especiado es opcional. El nivel de amargor es variable en cierta medida, al igual que el carácter rostizado y la sequedad del final; permita la interpretación por parte de quien la elabora.","Sensación en boca":"Cuerpo de medio pleno a pleno, con un carácter algo cremoso. Carbonatación moderada. Muy suave. Puede tener una ligera astringencia de los granos rostizados, aunque la aspereza no es deseable. Se puede detectar un carácter ligeramente cálido.","Comentarios":"Tradicionalmente, es un producto embotellado más fuerte y con una gama de posibles interpretaciones igualmente válidas, variando con mayor frecuencia en el sabor rostizado y el dulzor. La mayoría de los ejemplos comerciales irlandeses tradicionales están en el rango de 5.6 a 6.0% ABV.","Historia":"Tiene el mismo origen que la Irish Stout, pero como un producto más fuerte. La Guinness Extra Stout (Extra Superior Porter, posteriormente Double Stout) se elaboró por primera vez en 1821, y era principalmente un producto embotellado. 29","Ingredientes característicos":"Similar a la Irish Stout. Puede tener adicionalmente maltas Crystal oscuras o azúcares morenas.","Comparación de estilos":"A medio camino entre una Irish Stout y una Foreign Extra Stout en intensidad de alcohol y de sabor, aunque con un balance similar. Más cuerpo, riqueza y, a menudo, complejidad de malta que una Irish Stout. De color negro, no marrón como una English Porter.","Estadísticas vitales":"OG: 1.052 – 1.062 IBU: 35 – 50 FG: 1.010 – 1.014 SRM: 30 – 40 ABV: 5.0 – 6.5%","Ejemplos comerciales":"Guinness Extra Stout, O’Hara’s Leann Folláin, Porterhouse XXXX, Sheaf Stout","Etiquetas":"intensidad-alta, color-oscuro, fermentación-alta, islas-británicas, estilo-tradicional, familia-stout, amarga"},"glass_color":"#470606","srm_variable":false,"clarity":"opaca","foam_color":"#D9B183","abv_display":"5–6.5%","ibu_display":"35–50","srm_display":"30–40","og_display":"1.052–1.062","fg_display":"1.01–1.014","country":"Irlanda","family":"Stout","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"A medio camino entre Irish Stout y Foreign Extra Stout.","ibu_avg":42.5,"ibu_variable":false,"abv_avg":5.8,"abv_variable":false,"summary":"Stout negra de cuerpo pleno, rostizado a café y chocolate.","classic_example":"Guinness Extra Stout","foam_level":3,"foam_height":14,"srm_lo_hex":"#5e0b00","srm_hi_hex":"#030403","summary_80":"Una cerveza negra de cuerpo más pleno, con un pronunciado sabor rostizado, a menudo similar al café y al chocolate amargo, con cierta complejidad de malta.","distinctive_80":"A medio camino entre una Irish Stout y una Foreign Extra Stout en intensidad de alcohol y de sabor, aunque con un balance similar.","mini_profile":{"malta":3,"lupulo":2,"cuerpo":2,"carbonatacion":2},"char_tags":["amarga"],"ingredients_line":"Similar a la Irish Stout. Puede tener adicionalmente maltas Crystal oscuras o azúcares morenas.","ingredient_chips":["Similar a la Irish Stout"],"balance_pos":1.5,"balance_malta":3,"balance_lupulo":2,"aroma_highlight":"Malta media","sabor_highlight":"Malta alta","apariencia_highlight":"Opaca","boca_highlight":"Cuerpo medio","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Negro","Cremosa","Opaca"],"ingredientes_highlights":["Similar a la Irish Stout"],"ingredient_types":{}},{"code":"16A","name":"Sweet Stout","category_num":16,"category_name":"Dark British Beer","stats":{"OG":[1.044,1.06],"FG":[1.012,1.024],"IBU":[20.0,40.0],"SRM":[30.0,40.0],"ABV":[4.0,6.0]},"fields":{"Impresión general":"Una stout muy oscura, dulce, de cuerpo pleno, ligeramente rostizada que recuerda a café con crema o espresso endulzado.","Aroma":"Leve aroma a grano rostizado, a veces con notas a café o chocolate. A menudo está presente una impresión de dulzor que recuerda a la crema. Puede estar presente un aroma a frutas de bajo a moderadamente alto. Diacetilo bajo es opcional. Un bajo aroma a lúpulo floral o terroso es opcional.","Apariencia":"Color de marrón muy oscuro a negro. Traslúcida, si no es opaca. Espuma cremosa de canela a marrón.","Sabor":"Dominan en el paladar sabores oscuros, rostizados, a café o chocolate. Ésteres afrutados de bajos a moderados. Amargor moderado. Dulzor de medio a alto, que proporciona un contrapunto al carácter rostizado y al amargor, y que permanece hasta el final. El balance entre los granos o maltas oscuras y el dulzor puede variar de bastante dulce a moderadamente seco y algo rostizado. Diacetilo bajo es opcional. Un bajo sabor a lúpulo floral o terroso es opcional.","Sensación en boca":"Cuerpo de medio pleno a pleno y cremoso. Carbonatación de baja a moderada. Un alto dulzor residual proveniente de azúcares no fermentados realza la sensación plena en boca.","Comentarios":"Las densidades son bajas en Gran Bretaña (a veces más bajas que las estadísticas aquí indicadas), y son mayores en los productos exportados y estadounidenses. Existen variantes, siendo las variables más sujetas a interpretación: los niveles de dulzor residual, la intensidad del carácter rostizado y el balance entre ambos.","Historia":"Estilo inglés de stout desarrollado a principios del siglo XX. Históricamente conocida como “Milk” o “Cream” Stout, esta denominación ya no está permitida legalmente en Inglaterra, pero puede ser aceptable en otros lugares. El nombre “milk” deriva del uso de lactosa (azúcar de leche) como endulzante. Originalmente comercializada como un tónico para personas con discapacidad física y madres lactantes.","Ingredientes característicos":"Base de malta pálida, junto a maltas o granos oscuros. Puede llevar adjuntos de grano o azúcar. La lactosa es agregada con frecuencia para proporcionar dulzor residual adicional.","Comparación de estilos":"Más dulce y menos amarga que otras stout, excepto la intensa Tropical Stout. El carácter rostizado es leve, no tan quemado como en otras stout. Puede tener un balance similar al de una Oatmeal Stout, pero con mayor dulzor.","Estadísticas vitales":"OG: 1.044 – 1.060 IBU: 20 – 40 FG: 1.012 – 1.024 30 SRM: 30 – 40 ABV: 4.0 – 6.0%","Ejemplos comerciales":"Bristol Beer Factory Milk Stout, Firestone Nitro Merlin Milk Stout, Left Hand Milk Stout, Lancaster Milk Stout, Mackeson’s XXX Stout, Marston’s Pearl Jet Stout","Etiquetas":"intensidad-estándar, color-oscuro, fermentaciónalta, islas-británicas, estilo-tradicional, familia-stout, maltosa, rostizada"},"glass_color":"#470606","srm_variable":false,"clarity":"opaca","foam_color":"#D9B183","abv_display":"4–6%","ibu_display":"20–40","srm_display":"30–40","og_display":"1.044–1.06","fg_display":"1.012–1.024","country":"Inglaterra","family":"Stout","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Más dulce y menos amarga que casi cualquier stout.","ibu_avg":30.0,"ibu_variable":false,"abv_avg":5.0,"abv_variable":false,"summary":"Stout muy oscura y dulce, como café con crema.","classic_example":"Bristol Beer Factory Milk Stout","foam_level":1,"foam_height":7,"srm_lo_hex":"#5e0b00","srm_hi_hex":"#030403","summary_80":"Una stout muy oscura, dulce, de cuerpo pleno, ligeramente rostizada que recuerda a café con crema o espresso endulzado.","distinctive_80":"Más dulce y menos amarga que otras stout, excepto la intensa Tropical Stout. El carácter rostizado es leve, no tan quemado como en otras stout.","mini_profile":{"malta":2,"lupulo":1,"cuerpo":2,"carbonatacion":2},"char_tags":["maltosa","rostizada"],"ingredients_line":"Base de malta pálida, junto a maltas o granos oscuros. Puede llevar adjuntos de grano o azúcar.","ingredient_chips":["Base de malta pálida"],"balance_pos":1.5,"balance_malta":2,"balance_lupulo":1,"aroma_highlight":"Lúpulo bajo","sabor_highlight":"Malta media","apariencia_highlight":"Opaca","boca_highlight":"Cuerpo medio","aroma_highlights":["Base de malta pálida"],"sabor_highlights":["Base de malta pálida"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Marrón","Cremosa","Opaca"],"ingredientes_highlights":["Base de malta pálida"],"ingredient_types":{"malta":"Base de malta pálida"}},{"code":"16B","name":"Oatmeal Stout","category_num":16,"category_name":"Dark British Beer","stats":{"OG":[1.045,1.065],"FG":[1.01,1.018],"IBU":[25.0,40.0],"SRM":[22.0,40.0],"ABV":[4.2,5.9]},"fields":{"Impresión general":"Una stout oscura, rostizada, de cuerpo pleno con suficiente dulzor como para dar soporte a la base de avena. El dulzor, balance y sensación de la avena pueden variar considerablemente.","Aroma":"Ligero carácter granoso, rostizado y similar al café, con un leve dulzor de malta que puede dar una impresión de café con crema. Frutosidad de baja a media alta. Es opcional un aroma medio bajo a lúpulo terroso o floral. Un ligero aroma granoso y a frutos secos producto de la avena es opcional. Diacetilo medio bajo es opcional pero típicamente ausente.","Apariencia":"Color de marrón a negro. Espuma densa, cremosa, persistente, con color de canela a marrón. Traslúcida, si no es opaca.","Sabor":"Similar al aroma, con un leve sabor a café rostizado, chocolate con leche o café con crema, junto a una frutosidad de baja a moderadamente alta. La avena puede agregar un sabor a frutos secos tostados, granoso o terroso. Amargor medio. Final de semi seco a semi dulce, que afecta la percepción del balance. Retrogusto maltoso, rostizado y a frutos secos. Lúpulo medio bajo floral o terroso es opcional. Diacetilo medio bajo es opcional pero típicamente ausente.","Sensación en boca":"Cuerpo de medio pleno a pleno, con una untuosidad proveniente de la avena suave, sedosa, aterciopelada y a veces casi oleosa. Cremosa. Carbonatación de media a media alta. Las versiones más fuertes pueden tener una ligera tibieza alcohólica.","Comentarios":"Al evaluar, tenga en cuenta las diferencias en balance e interpretación. Las versiones estadounidenses tienden a ser más lupuladas, menos dulces y afrutadas que los ejemplos ingleses. El amargor, el dulzor y la sensación de la avena pueden ser variables. El uso ligero de la avena puede dar cierta sedosidad al cuerpo y riqueza al sabor, mientras que su uso excesivo puede aportar un sabor bastante intenso, con una sensación en boca casi oleosa y un final algo seco.","Historia":"Creada alrededor del 1900, como una variante de stout nutritiva o para personas con una discapacidad física, que usaba avena en el listado de granos, de manera similar pero independiente, al desarrollo de la Sweet Stout que usaba lactosa. Una versión original escocesa usaba una cantidad significativa de avena malteada. Más tarde pasó por una fase “turbia” cuando algunas cervecerías inglesas arrojaban un puñado de avena en sus stout elaboradas a través del proceso de parti-gyling (Nota de la Traducción: múltiples mostos obtenidos de un mismo macerado), para justificar legalmente la producción de una Oatmeal Stout “saludable” con fines publicitarios. Su mayor popularidad fue en Inglaterra en el periodo de entreguerras mundiales, y revivió en la era de la cerveza artesanal para la exportación, lo que ayudó a que se adoptara como un estilo de cerveza artesanal estadounidense moderno y popular, que usa una cantidad significativa (no simbólica) de avena.","Ingredientes característicos":"Maltas pálidas, maltas Caramelo, junto a maltas y granos rostizados oscuros (a menudo tipo chocolate). Avena o avena malteada (del 5 al 20% o más). Lúpulos principalmente para el amargor. Puede usar azúcar cervecero o siropes. Levadura ale inglesa.","Comparación de estilos":"La mayoría son como un cruce entre una Irish Extra Stout y una Sweet Stout, con una adición de avena. Existen diversas variantes, con las versiones más dulces siendo similares a una Sweet Stout con avena en lugar de lactosa, y las versiones más secas similares a una Irish Extra Stout más sabrosa y con carácter a frutos secos. Ambas tienden a resaltar el cuerpo y la sensación en boca.","Estadísticas vitales":"OG: 1.045 – 1.065 IBU: 25 – 40 FG: 1.010 – 1.018 SRM: 22 – 40 ABV: 4.2 – 5.9%","Ejemplos comerciales":"Anderson Valley Barney Flats Oatmeal Stout, Broughton Stout Jock, St-Ambroise Oatmeal Stout, Samuel Smith Oatmeal Stout, Summit Oatmeal Stout, Young’s London Stout","Etiquetas":"intensidad-estándar, color-oscuro, fermentaciónalta, islas-británicas, estilo-tradicional, familia-stout, balanceada"},"glass_color":"#5a0a02","srm_variable":false,"clarity":"opaca","foam_color":"#D9B183","abv_display":"4.2–5.9%","ibu_display":"25–40","srm_display":"22–40","og_display":"1.045–1.065","fg_display":"1.01–1.018","country":"Inglaterra","family":"Stout","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Cruce entre Irish Extra Stout y Sweet Stout.","ibu_avg":32.5,"ibu_variable":false,"abv_avg":5.1,"abv_variable":false,"summary":"Stout oscura y rostizada, con avena y sensación sedosa.","classic_example":"Anderson Valley Barney Flats Oatmeal Stout","foam_level":2,"foam_height":10,"srm_lo_hex":"#8e2900","srm_hi_hex":"#030403","summary_80":"Una stout oscura, rostizada, de cuerpo pleno con suficiente dulzor como para dar soporte a la base de avena. El dulzor.","distinctive_80":"La mayoría son como un cruce entre una Irish Extra Stout y una Sweet Stout, con una adición de avena.","mini_profile":{"malta":2,"lupulo":1,"cuerpo":2,"carbonatacion":3},"char_tags":["balanceada"],"ingredients_line":"Maltas pálidas, maltas Caramelo, junto a maltas y granos rostizados oscuros (a menudo tipo chocolate).","ingredient_chips":["Maltas pálidas","Avena o avena malteada (del 5…"],"balance_pos":1.5,"balance_malta":2,"balance_lupulo":1,"aroma_highlight":"Malta baja","sabor_highlight":"Malta media","apariencia_highlight":"Opaca","boca_highlight":"Carbonatación alta","aroma_highlights":["Maltas pálidas","Lúpulos principalmente para el…","Levadura ale inglesa"],"sabor_highlights":["Maltas pálidas","Lúpulos principalmente para el…","Levadura ale inglesa"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Marrón","Cremosa","Opaca"],"ingredientes_highlights":["Maltas pálidas","Avena o avena malteada (del 5…"],"ingredient_types":{"malta":"Maltas pálidas","lupulo":"Lúpulos principalmente para el…","levadura":"Levadura ale inglesa"}},{"code":"16C","name":"Tropical Stout","category_num":16,"category_name":"Dark British Beer","stats":{"OG":[1.056,1.075],"FG":[1.01,1.018],"IBU":[30.0,50.0],"SRM":[30.0,40.0],"ABV":[5.5,8.0]},"fields":{"Impresión general":"Una stout muy oscura, dulce, afrutada y moderadamente intensa, con suaves sabores rostizados, pero sin la aspereza de sabores quemados.","Aroma":"Destaca un dulzor de moderado a alto. Aroma rostizado a café o chocolate de moderado a alto, pero no quemado. Frutosidad de media a alta. Puede tener aroma a melaza, regaliz, azúcar quemada, frutas deshidratadas o similares al vino. Las versiones más intensas pueden tener un aroma sutil y limpio a alcohol. Un bajo aroma a lúpulo es opcional. Diacetilo bajo es opcional.","Apariencia":"Color de marrón muy oscuro a negro. Claridad usualmente oscurecida por su color profundo. Traslúcida, si no es opaca. Espuma de color desde canela a marrón, voluminosa y con buena retención.","Sabor":"Bastante dulce, con sabores suaves a grano oscuro y un discreto amargor de medio bajo a medio. Sabor rostizado suave, a menudo similar al café o chocolate, pero moderado en el balance por el final dulce. Sin sabor a malta quemada o aspereza en el final. Ésteres afrutados de moderados a altos. Puede tener una cualidad dulce, como a ron añejo, melaza o azúcar quemada. Un bajo sabor a lúpulo es opcional. Diacetilo medio bajo es opcional.","Sensación en boca":"Cuerpo de medio pleno a pleno, a menudo con un carácter suave y cremoso. Puede percibirse una","Comparación de estilos":"Sabor similar a una Sweet Stout más intensa, con una mayor frutosidad. Similar a algunas Imperial Stout sin el alto amargor, el rostizado intenso o quemado ni los lúpulos de adición tardía, y con menor alcohol. Mucho más dulce y menos lupulada que las American Stout. Mucho más dulce y menos amarga que una Foreign Extra Stout de densidad similar.","Estadísticas vitales":"OG: 1.056 – 1.075 IBU: 30 – 50 FG: 1.010 – 1.018 SRM: 30 – 40 ABV: 5.5 – 8.0%","Ejemplos comerciales":"ABC Extra Stout, Bahamian Strong Back Stout, Dragon Stout, Jamaica Stout, Lion Stout, Royal Extra Stout","Etiquetas":"intensidad-alta, color-oscuro, fermentación-alta, islas-británicas, estilo-tradicional, familia-stout, maltosa, rostizada, dulce"},"glass_color":"#470606","srm_variable":false,"clarity":"opaca","foam_color":"#D9B183","abv_display":"5.5–8%","ibu_display":"30–50","srm_display":"30–40","og_display":"1.056–1.075","fg_display":"1.01–1.018","country":"Inglaterra","family":"Stout","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Como una Sweet Stout más intensa y frutal.","ibu_avg":40.0,"ibu_variable":false,"abv_avg":6.8,"abv_variable":false,"summary":"Stout muy oscura, dulce y afrutada.","classic_example":"ABC Extra Stout","foam_level":3,"foam_height":14,"srm_lo_hex":"#5e0b00","srm_hi_hex":"#030403","summary_80":"Una stout muy oscura, dulce, afrutada y moderadamente intensa, con suaves sabores rostizados.","distinctive_80":"Sabor similar a una Sweet Stout más intensa, con una mayor frutosidad.","mini_profile":{"malta":0,"lupulo":1,"cuerpo":2,"carbonatacion":null},"char_tags":["maltosa","rostizada","dulce"],"ingredients_line":"","ingredient_chips":[],"balance_pos":2.5,"balance_malta":0,"balance_lupulo":1,"aroma_highlight":"Lúpulo bajo","sabor_highlight":"Levadura alto","apariencia_highlight":"Opaca","boca_highlight":"Cuerpo medio","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Cuerpo medio"],"apariencia_highlights":["Marrón","Voluminosa","Opaca"],"ingredientes_highlights":[],"ingredient_types":{}},{"code":"16D","name":"Foreign Extra Stout","category_num":16,"category_name":"Dark British Beer","stats":{"OG":[1.056,1.075],"FG":[1.01,1.018],"IBU":[50.0,70.0],"SRM":[30.0,40.0],"ABV":[6.3,8.0]},"fields":{"Impresión general":"Una stout muy oscura, sabrosa, moderadamente intensa, bastante seca y con sabores rostizados prominentes.","Aroma":"Rostizado de moderado a alto, similar al café, chocolate amargo o a grano ligeramente quemado. Frutosidad de baja a media. Puede tener un aroma dulce o a melaza, regaliz, frutas deshidratadas o similares al vino. Las versiones más intensas pueden tener un aroma sutil y limpio a alcohol. Un bajo aroma a lúpulo terroso, herbáceo o floral es opcional. Diacetilo bajo es opcional.","Apariencia":"Color de marrón muy oscuro a negro. Claridad usualmente oscurecida por su color profundo. Traslúcida, si no es opaca. Espuma de color desde canela a marrón, voluminosa y con buena retención.","Sabor":"Rostizado de moderado a alto, similar al café, chocolate amargo o a grano ligeramente quemado, pero sin aspereza. Ésteres de bajos a medios. Amargor de medio a alto. Final moderadamente seco. Un moderado sabor a lúpulo terroso, herbáceo o floral es opcional. Diacetilo medio bajo es opcional.","Sensación en boca":"Cuerpo de medio pleno a pleno, a menudo con un carácter suave y a veces cremoso. Puede percibirse una tibieza alcohólica, pero sin ser quemante. Carbonatación de moderada a moderadamente alta.","Comentarios":"Conocida también como Foreign Stout, Export Stout y Foreign Export Stout. Las versiones históricas (al 31 menos las anteriores a la Primera Guerra Mundial) tenían la misma densidad inicial que las versiones domésticas de Extra Stout, pero dependiendo de la cervecería podían tener un ABV más alto, debido a una larga fermentación secundaria con Brett. La diferencia entre las versiones domésticas y de exportación eran el lupulado y el tiempo de maduración.","Historia":"Hoy en día, es una stout más intensa que se elabora para el mercado de exportación, pero con una historia que se remonta a los siglos XVIII y XIX, cuando eran versiones más intensamente lupuladas de las stout de exportación más fuertes. Originalmente era almacenada en cubas de madera (vats), pero Guinness cesó esta práctica en la década de 1950. Guinness Foreign Extra Stout (originalmente West India Porter, posteriormente Foreign Extra Double Stout) fue elaborada por primera vez en 1801 de acuerdo a Guinness con “lúpulos adicionales para darle un sabor distintivo y una mayor durabilidad en el clima cálido”.","Ingredientes característicos":"Maltas pálidas, junto a maltas y granos rostizados oscuros, históricamente también pudieron usarse maltas marrón y ámbar. Lúpulo principalmente para amargor, de variedades típicamente inglesas. Puede usar adjuntos y azúcares para aumentar la densidad.","Comparación de estilos":"Similar en balance a una Irish Extra Stout, pero con más alcohol. No tan corpulenta o intensa como una Imperial Stout. Carece del intenso amargor y de la gran cantidad de lúpulos de adición tardía de una American Stout. Densidad similar a una Tropical Stout, pero con un final más seco y un mayor amargor.","Estadísticas vitales":"OG: 1.056 – 1.075 IBU: 50 – 70 FG: 1.010 – 1.018 SRM: 30 – 40 ABV: 6.3 – 8.0%","Ejemplos comerciales":"Coopers Best Extra Stout, Guinness Foreign Extra Stout, The Kernel Export Stout London 1890, La Cumbre Malpais Stout, Pelican Tsunami Export Stout, Ridgeway Foreign Export Stout","Etiquetas":"intensidad-alta, color-oscuro, fermentación-alta, islas-británicas, estilo-tradicional, familia-stout, balanceada"},"glass_color":"#470606","srm_variable":false,"clarity":"opaca","foam_color":"#D9B183","abv_display":"6.3–8%","ibu_display":"50–70","srm_display":"30–40","og_display":"1.056–1.075","fg_display":"1.01–1.018","country":"Inglaterra","family":"Stout","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Como una Irish Extra Stout con más alcohol.","ibu_avg":60.0,"ibu_variable":false,"abv_avg":7.2,"abv_variable":false,"summary":"Stout muy oscura, seca y sabrosa, rostizado prominente.","classic_example":"Coopers Best Extra Stout","foam_level":3,"foam_height":14,"srm_lo_hex":"#5e0b00","srm_hi_hex":"#030403","summary_80":"Una stout muy oscura, sabrosa, moderadamente intensa.","distinctive_80":"Similar en balance a una Irish Extra Stout, pero con más alcohol. No tan corpulenta o intensa como una Imperial Stout.","mini_profile":{"malta":null,"lupulo":2,"cuerpo":2,"carbonatacion":3},"char_tags":["balanceada"],"ingredients_line":"Maltas pálidas, junto a maltas y granos rostizados oscuros, históricamente también pudieron usarse maltas marrón y ámbar.","ingredient_chips":["Maltas pálidas","Lúpulo principalmente para…"],"balance_pos":2.0,"balance_malta":null,"balance_lupulo":2,"aroma_highlight":"Lúpulo bajo","sabor_highlight":"Amargor alto","apariencia_highlight":"Opaca","boca_highlight":"Carbonatación alta","aroma_highlights":["Maltas pálidas","Lúpulo principalmente para…"],"sabor_highlights":["Maltas pálidas","Lúpulo principalmente para…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Marrón","Voluminosa","Opaca"],"ingredientes_highlights":["Maltas pálidas","Lúpulo principalmente para…"],"ingredient_types":{"malta":"Maltas pálidas","lupulo":"Lúpulo principalmente para…"}},{"code":"17A","name":"British Strong Ale","category_num":17,"category_name":"Strong British Ale","stats":{"OG":[1.055,1.08],"FG":[1.015,1.022],"IBU":[30.0,60.0],"SRM":[8.0,22.0],"ABV":[5.5,8.0]},"fields":{"Impresión general":"Una ale de respetable intensidad alcohólica, tradicionalmente acondicionada en botella y de guarda. Puede tener una amplia gama de interpretaciones, pero la mayoría tendrá diferentes niveles de riqueza de maltas, lúpulos de adición tardía y amargor, ésteres afrutados y tibieza alcohólica. Los sabores e intensidad de malta y adjuntos pueden variar ampliamente, pero cualquier combinación debe resultar en una experiencia agradable al paladar.","Aroma":"A dulzor de malta con ésteres afrutados, a menudo con una compleja mezcla de frutas deshidratadas, caramelo, frutos secos, toffee u otros aromas de maltas especiales. Algunas notas a alcohol son aceptables, pero no deberían percibirse quemantes o similares al solvente. Los aromas a lúpulo pueden variar ampliamente, pero por lo general tienen notas terrosas, resinosas, afrutadas o florales. El balance puede variar ampliamente, pero la mayoría de los ejemplos tendrá una combinación de malta, fruta, lúpulo y alcohol en diferentes intensidades.","Apariencia":"Color de ámbar a marrón rojizo oscuro; muchas son bastante oscuras. Generalmente traslúcida, aunque las versiones más oscuras pueden ser casi opacas. Espuma de baja a moderada, con color de crema a canela claro y de retención media.","Sabor":"Carácter a malta de medio a alto, a menudo rico con sabores a frutos secos, toffee o caramelo. Ligeras notas a chocolate se encuentran a veces en las cervezas más oscuras. Puede tener una interesante complejidad de sabor por el uso de azúcares cerveceros. El balance es a menudo maltoso, pero puede estar bien lupulada, lo que afecta la impresión de maltosidad. Los ésteres afrutados moderados son comunes, a menudo con carácter a fruta oscura o fruta deshidratada. El final puede variar de semi seco a algo dulce. La intensidad alcohólica debe ser evidente, pero no abrumadora. Un bajo nivel de diacetilo es opcional, pero generalmente no deseable. 32","Sensación en boca":"Cuerpo de medio a pleno y “masticable”. La tibieza alcohólica es a menudo evidente y siempre bienvenida. Carbonatación de baja a moderada. Textura suave.","Comentarios":"Una categoría para inscripción en competencias más que un estilo; la intensidad y el carácter de los ejemplos pueden variar ampliamente. Se ajusta al espacio de estilos entre cervezas de densidad normal y las Barley Wine. Puede incluir cervezas pálidas maltosas-lupuladas de mayor intensidad, cervezas de invierno inglesas (Winter Warmer), Dark Mild fuertes, Burton Ale más ligeras y otras cervezas únicas con un rango de densidad general que no les permite encajar en otras categorías. Quienes juzguen deben permitir un significativo rango en el carácter. Siempre y cuando la cerveza esté dentro del rango de graduación alcohólica y tenga un interesante carácter “británico”, probablemente se ajuste al estilo.","Historia":"Una colección de estilos menores no relacionados, cada uno de los cuales tiene su propia tradición. No utilice la agrupación de esta categoría para inferir una relación histórica entre los ejemplos: no es ese el objetivo. Esta es una categoría para juzgar especialidades británicas modernas, en las que el atributo “especial” es el nivel de alcohol.","Ingredientes característicos":"El listado de granos varía, a menudo con maltas pálidas de base, junto a maltas Caramelo y especiales. Algunos ejemplos más oscuros sugieren un uso ligero de maltas oscuras (p. ej.: chocolate, malta negra). Son comunes adjuntos azucarados y almidonados (p. ej.: maíz, cebada en hojuelas, trigo). Los lúpulos de adición tardía son tradicionalmente ingleses.","Comparación de estilos":"Tiene un solapamiento significativo en densidad con las Old Ale, pero sin un carácter envejecido. Es posible una amplia gama de interpretaciones. No debe ser tan rica o intensa como una English Barley Wine. Más fuerte que una Strong Bitter potente de consumo diario, que una British Brown Ale y que una English Porter. Más carácter a maltas especiales o a azúcares que la American Strong Ale.","Estadísticas vitales":"OG: 1.055 – 1.080 IBU: 30 – 60 FG: 1.015 – 1.022 SRM: 8 – 22 ABV: 5.5 – 8.0%","Ejemplos comerciales":"Fuller’s 1845, Harvey’s Elizabethan Ale, J.W. Lees Moonraker, McEwan’s Champion, Samuel Smith’s Winter Welcome, Shepherd Neame 1698","Etiquetas":"intensidad-alta, color-ámbar, fermentación-alta, islas-británicas, estilo-tradicional, familia-ale-fuerte"},"glass_color":"#bb5100","srm_variable":false,"clarity":"opaca","foam_color":"#F0E4BE","abv_display":"5.5–8%","ibu_display":"30–60","srm_display":"8–22","og_display":"1.055–1.08","fg_display":"1.015–1.022","country":"Inglaterra","family":"Strong Ale","glass_shape":"snifter","glass_label":"Copa snifter","distinctive":"Se solapa con la Old Ale pero sin carácter envejecido.","ibu_avg":45.0,"ibu_variable":false,"abv_avg":6.8,"abv_variable":false,"summary":"Ale inglesa fuerte, tradicionalmente embotellada.","classic_example":"Fuller’s 1845","foam_level":1,"foam_height":7,"srm_lo_hex":"#ea8f00","srm_hi_hex":"#8e2900","summary_80":"Una ale de respetable intensidad alcohólica, tradicionalmente acondicionada en botella y de guarda.","distinctive_80":"Tiene un solapamiento significativo en densidad con las Old Ale, pero sin carácter envejecido. No debe ser tan rica o intensa como una English Barley Wine.","mini_profile":{"malta":3,"lupulo":2,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"El listado de granos varía, a menudo con maltas pálidas de base, junto a maltas Caramelo y especiales.","ingredient_chips":["Algunos ejemplos más oscuros…","Ej.: chocolate"],"balance_pos":1.5,"balance_malta":3,"balance_lupulo":null,"aroma_highlight":"Malta media","sabor_highlight":"Malta alta","apariencia_highlight":"Opaca","boca_highlight":"Cuerpo medio","aroma_highlights":["Algunos ejemplos más oscuros…"],"sabor_highlights":["Algunos ejemplos más oscuros…"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Ámbar","Canela","Opaca"],"ingredientes_highlights":["Algunos ejemplos más oscuros…","Ej.: chocolate"],"ingredient_types":{"malta":"Algunos ejemplos más oscuros…"}},{"code":"17B","name":"Old Ale","category_num":17,"category_name":"Strong British Ale","stats":{"OG":[1.055,1.088],"FG":[1.015,1.022],"IBU":[30.0,60.0],"SRM":[10.0,22.0],"ABV":[5.5,9.0]},"fields":{"Impresión general":"Una ale inglesa usualmente maltosa y más fuerte que el promedio, aunque por lo general no es tan fuerte o rica como una British Barley Wine. Presenta tibieza alcohólica. Cuando está correctamente envejecida y bien cuidada, muestra los efectos positivos de la maduración.","Aroma":"A dulzor de malta con ésteres afrutados, a menudo con una compleja mezcla de frutas deshidratadas, carácter vinoso, caramelo, melaza, toffee, sirope dorado (treacle) u otros aromas de maltas especiales. Son aceptables algunas notas a alcohol y oxidativas a frutos secos, similares a las encontradas en el jerez, oporto o madeira. El aroma a lúpulo no suele estar presente.","Apariencia":"Color de ámbar profundo a marrón rojizo muy oscuro, pero la mayoría son bastante oscuras. La edad y la oxidación pueden oscurecer la cerveza aún más. Traslúcida, pero puede ser casi opaca. Espuma de baja a moderada, con color de crema a canela claro; retención de baja a promedio.","Sabor":"Carácter a malta de medio a alto con una maltosidad de exquisita complejidad, a menudo con sabores a frutos secos, caramelo o similares a la melaza. Los sabores a chocolate ligero o a malta rostizada son opcionales, pero nunca deben ser prominentes. El balance suele ser maltoso dulce, pero puede estar bien lupulada; la impresión de amargor a menudo depende del tiempo de envejecimiento. Son comunes los ésteres afrutados de moderados a altos, y pueden tomar un carácter a frutas deshidratadas o vinoso. El final puede variar de seco a algo dulce. Un envejecimiento prolongado puede aportar sabores oxidativos similares a un fino jerez, oporto o madeira añejos. La intensidad alcohólica debe ser evidente, aunque no abrumadora. Un bajo diacetilo es opcional.","Sensación en boca":"Cuerpo de medio a pleno y “masticable”, aunque los ejemplos de más edad pueden tener un cuerpo más ligero debido a una continua atenuación durante el acondicionamiento. La tibieza alcohólica es a menudo evidente y siempre bienvenida. Carbonatación de baja a moderada, dependiendo de la edad y acondicionamiento. Puede haber una ligera acidez, así como algo de taninos si está envejecida en madera; ambos son opcionales.","Comentarios":"La intensidad y el carácter varían ampliamente. La cualidad predominante que caracteriza a este estilo es la impresión de envejecimiento, que puede manifestarse de diferentes formas (complejidad, oxidación, cuero, cualidades vinosas, etc.). Muchas de estas cualidades son defectos en otros casos, pero si el carácter resultante de la cerveza es complejo y agradablemente tomable, entonces estas características son aceptables. De ninguna manera se debe interpretar que estas características permisibles hagan que una cerveza imbebible y con off flavors, esté de alguna forma en el estilo. Old Peculier es una cerveza bien conocida pero bastante única, muy diferente a otras Old Ale.","Historia":"Históricamente, una ale envejecida utilizada como cerveza de guarda (stock ale) para mezclar con otras o ser disfrutada con toda su intensidad (los términos “añeja” [stale] o “de guarda” [stock], se refieren a cervezas que fueron envejecidas o almacenadas durante un período de tiempo significativo). Hay al menos dos tipos bien definidos en Gran Bretaña hoy en día: las más débiles, sin envejecer, servidas tiradas (draft) y que son similares a las mild de alrededor de 4.5%, y las más fuertes, envejecidas, y que a menudo tienen 68% o más.","Ingredientes característicos":"La composición varía, aunque generalmente es similar a las British Strong Ale. La clave más importante en el perfil final del estilo es el carácter del envejecimiento, que es producto más del manejo de almacenamiento que de la elaboración.","Comparación de estilos":"Tiene cierto solapamiento con las British Strong Ale y con el extremo inferior de las English Barley Wine, pero presentando siempre una cualidad de envejecimiento. La distinción entre una Old Ale y una Barley Wine es algo arbitraria por encima del 7% ABV, y generalmente significa tener una cualidad de envejecimiento más notoria.","Estadísticas vitales":"OG: 1.055 – 1.088 IBU: 30 – 60 FG: 1.015 – 1.022 SRM: 10 – 22 ABV: 5.5 – 9.0%","Ejemplos comerciales":"Avery Old Jubilation, Berlina Old Ale, Greene King Strong Suffolk Ale, Marston Owd Roger, Theakston Old Peculier","Etiquetas":"intensidad-alta, color-ámbar, fermentación-alta, islas-británicas, estilo-tradicional, familia-ale-fuerte, maltosa"},"glass_color":"#b54c00","srm_variable":false,"clarity":"opaca","foam_color":"#F0E4BE","abv_display":"5.5–9%","ibu_display":"30–60","srm_display":"10–22","og_display":"1.055–1.088","fg_display":"1.015–1.022","country":"Inglaterra","family":"Strong Ale","glass_shape":"snifter","glass_label":"Copa snifter","distinctive":"Se distingue por su cualidad de cerveza envejecida.","ibu_avg":45.0,"ibu_variable":false,"abv_avg":7.2,"abv_variable":false,"summary":"Ale inglesa maltosa, más fuerte que el promedio, apta para guarda.","classic_example":"Avery Old Jubilation","foam_level":1,"foam_height":7,"srm_lo_hex":"#de7c00","srm_hi_hex":"#8e2900","summary_80":"Una ale inglesa usualmente maltosa y más fuerte que el promedio, aunque por lo general no es tan fuerte o rica como una British Barley Wine.","distinctive_80":"Tiene cierto solapamiento con las British Strong Ale y con el extremo inferior de las English Barley Wine.","mini_profile":{"malta":3,"lupulo":2,"cuerpo":2,"carbonatacion":2},"char_tags":["maltosa"],"ingredients_line":"La composición varía, aunque generalmente es similar a las British Strong Ale.","ingredient_chips":[],"balance_pos":1.5,"balance_malta":3,"balance_lupulo":null,"aroma_highlight":"Malta media","sabor_highlight":"Malta alta","apariencia_highlight":"Opaca","boca_highlight":"Cuerpo medio","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Ámbar","Canela","Opaca"],"ingredientes_highlights":[],"ingredient_types":{}},{"code":"17C","name":"Wee Heavy","category_num":17,"category_name":"Strong British Ale","stats":{"OG":[1.07,1.13],"FG":[1.018,1.04],"IBU":[17.0,35.0],"SRM":[14.0,25.0],"ABV":[6.5,10.0]},"fields":{"Impresión general":"Profundidad de malta rica y dulce con sabores a caramelo, toffee y frutas. De cuerpo pleno y “masticable”, con un alcohol que aporta tibieza. Amargor discreto, pero ni empalagosa ni almibarada.","Aroma":"Intenso a malta con carácter a pan y tostado, con un carácter alto a caramelo y toffee. Es posible un amplio rango de aromas de soporte a azúcares caramelizadas y similares al pan tostado (migas de pan tostadas, bizcochos de soletilla [ladyfingers], galletas inglesas, galletas integrales dulces [tipo Graham], turrón, butterscotch, etc.). Algunas veces se percibe un leve toque rostizado. Notas de bajas a moderadas a alcohol y ésteres a frutas oscuras o deshidratadas. Es opcional un muy bajo carácter a lúpulo terroso, floral, cítrico a naranja o especiado.","Apariencia":"Color de cobrizo claro a marrón oscuro, a menudo con reflejos rubí oscuro. Traslúcida. Por lo general, tiene una espuma color canela voluminosa, que puede que no persista. Las piernas pueden ser evidentes en las versiones más fuertes.","Sabor":"Malta rica y con sabores a pan y tostados, que a menudo es plena y dulce en el paladar, con sabores a caramelo y toffee, pero balanceada por el alcohol y un toque a granos rostizados en el final. La malta a menudo tiene sabores tostados y a azúcares caramelizadas del mismo tipo a los descritos en el aroma. Alcohol y ésteres (ciruelas, uvas pasas, frutas deshidratadas, etc.) de bajos a medios. Bajo amargor en el balance, dando un final de semi seco a dulce. Es opcional un sabor a lúpulo medio bajo, con descriptores similares a los del aroma.","Sensación en boca":"Cuerpo de medio pleno a pleno, en ocasiones con una viscosidad espesa, “masticable”, a veces cremosa. Una tibieza alcohólica suave suele estar presente y es deseable ya que balancea el dulzor de la malta. Carbonatación moderada. 33","Comentarios":"Se permite un rango de intensidades; no todas las versiones son muy fuertes. También es conocida como “Strong Scotch Ale”, el término “Wee Heavy” significa “pequeña fuerte” y tiene su origen en la cerveza que hizo famoso el término, Fowler’s Wee Heavy, una ale de 12 guineas.","Historia":"Descendiente de la Edinburgh Ale, una cerveza maltosa más fuerte elaborada en un rango de intensidades, similar a las Burton Ale (aunque utilizando la mitad de lúpulo). Las versiones modernas tienen dos variantes principales, una cerveza más modesta de 5% ABV y la más ampliamente conocida de 8-9% ABV. Dado que las densidades disminuyeron con el paso del tiempo, algunas de las variantes dejaron de producirse.","Ingredientes característicos":"Malta Pale Ale escocesa, una amplia gama de otros ingredientes es posible, incluyendo adjuntos. Algunos pueden usar malta Crystal o granos más oscuros para el color. Sin malta ahumada con turba.","Comparación de estilos":"En cierta medida similar a una English Barley Wine, pero a menudo más oscura y con más caramelo.","Estadísticas vitales":"OG: 1.070 – 1.130 IBU: 17 – 35 FG: 1.018 – 1.040 SRM: 14 – 25 ABV: 6.5 – 10.0%","Ejemplos comerciales":"Belhaven Wee Heavy, Broughton Old Jock, McEwan’s Scotch Ale, Orkney Skull Splitter, Traquair House Ale, The Duck-Rabbit Wee Heavy Scotch-Style Ale","Etiquetas":"intensidad-alta, color-ámbar, fermentación-alta, islas-británicas, estilo-tradicional, familia-ale-fuerte"},"glass_color":"#9e3400","srm_variable":false,"clarity":"traslucida","foam_color":"#D9B183","abv_display":"6.5–10%","ibu_display":"17–35","srm_display":"14–25","og_display":"1.07–1.13","fg_display":"1.018–1.04","country":"Escocia","family":"Strong Ale","glass_shape":"snifter","glass_label":"Copa snifter","distinctive":"Como una English Barley Wine, pero más oscura.","ibu_avg":26.0,"ibu_variable":false,"abv_avg":8.2,"abv_variable":false,"summary":"Ale escocesa fuerte, rica en caramelo y toffee.","classic_example":"Belhaven Wee Heavy","foam_level":3,"foam_height":14,"srm_lo_hex":"#c35900","srm_hi_hex":"#7b1a00","summary_80":"Profundidad de malta rica y dulce con sabores a caramelo, toffee y frutas. De cuerpo pleno y “masticable”, con un alcohol que aporta tibieza.","distinctive_80":"En cierta medida similar a una English Barley Wine.","mini_profile":{"malta":3,"lupulo":1,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Malta Pale Ale escocesa, una amplia gama de otros ingredientes es posible, incluyendo adjuntos.","ingredient_chips":["Malta Pale Ale escocesa","Algunos pueden usar malta…"],"balance_pos":1.0,"balance_malta":3,"balance_lupulo":1,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":["Malta Pale Ale escocesa"],"sabor_highlights":["Malta Pale Ale escocesa"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Cobrizo","Voluminosa","Translúcida"],"ingredientes_highlights":["Malta Pale Ale escocesa","Algunos pueden usar malta…"],"ingredient_types":{"malta":"Malta Pale Ale escocesa"}},{"code":"17D","name":"English Barley Wine","category_num":17,"category_name":"Strong British Ale","stats":{"OG":[1.08,1.12],"FG":[1.018,1.03],"IBU":[35.0,70.0],"SRM":[8.0,22.0],"ABV":[8.0,12.0]},"fields":{"Impresión general":"Una ale fuerte y ricamente maltosa, con una agradable profundidad afrutada o lupulada. Una cerveza de invierno para tomar a sorbos con tibieza alcohólica y un cuerpo pleno y “masticable”.","Aroma":"Muy rico, intensamente maltoso, a menudo con aroma a caramelo en las versiones más oscuras o un ligero carácter a toffee en las versiones más pálidas. Puede tener un carácter rico a pan, tostado o notas a toffee. Puede tener una frutosidad de moderada a fuerte, a menudo con un carácter a frutas oscuras o deshidratadas, particularmente en las versiones oscuras. El aroma a lúpulo puede variar de suave a intenso, y es típicamente floral, terroso, similar al té o a la mermelada. El alcohol puede ser de bajo a moderado, pero es suave y redondo. La intensidad aromática disminuye con el tiempo, y puede desarrollar una cualidad como a jerez, vino u oporto.","Apariencia":"Color que va de ámbar dorado a marrón oscuro, a menudo con reflejos rubí y una profundidad significativa de color. No debe ser negra u opaca. Espuma blanquecina de baja a moderada. Puede tener baja retención de espuma. Claridad brillante, particularmente cuando está envejecida, aunque las versiones más jóvenes pueden ser ligeramente turbias. El alto contenido de alcohol y la viscosidad pueden ser visibles como piernas.","Sabor":"Dulzor a malta rico de medio a alto, a menudo complejo y con múltiples capas, con sabores de malta a pan, galletas y caramelo (más similar al toffee en las versiones más pálidas) y con una frutosidad de media a alta (a menudo con matices a frutas oscuras o deshidratadas). Cuando está envejecida, estos componentes afrutados irán aumentando, 34 teniendo las versiones más oscuras un nivel más alto que las más pálidas. El aroma, sabor y amargor del lúpulo pueden variar enormemente. Son comunes los lúpulos con un carácter inglés (florales, terrosos, similares al té o a la mermelada) de ligeros a intensos. El amargor puede ser de ligero a bastante fuerte, desvaneciéndose con el tiempo, por lo que el balance puede ir de maltoso hasta algo amargo. Las versiones más fuertes tendrán un leve carácter a alcohol. El final y el retrogusto pueden ser de moderadamente secos a moderadamente dulces, a menudo dependiendo del envejecimiento. Las versiones envejecidas pueden desarrollar sabores oxidativos complejos o vinosos, en un nivel notorio pero no prominente. Las versiones pálidas por lo general se perciben más amargas, mejor atenuadas y con mayor presencia de lúpulo que las versiones más oscuras.","Sensación en boca":"Tienen un cuerpo pleno y “masticable”, con una textura aterciopelada y exquisita, que disminuye con el envejecimiento. Una suave tibieza del alcohol envejecido debe estar presente, pero no debe ser quemante. La carbonatación puede ser de baja a moderada, dependiendo del envejecimiento y acondicionamiento.","Comentarios":"La más rica y fuerte de las ales inglesas modernas. Su carácter puede cambiar significativamente con el tiempo; tanto las versiones jóvenes como las maduras deben ser apreciadas por lo que son. El perfil de la malta puede variar ampliamente; no todos los ejemplos tendrán todos los sabores o aromas posibles. Las variedades más pálidas no tendrán los sabores a caramelo y a malta más ricos y, en general, tampoco tendrán los frutos deshidratados más oscuros; no espere sabores y aromas que son imposibles en una cerveza de ese color. Comúnmente escrito como “Barley Wine” en el Reino Unido y como “Barleywine” en Estados Unidos.","Historia":"Una descendiente moderna de las Burton Ale más fuertes. La cerveza Bass No. 1 fue la primera en ser llamada Barley Wine en 1872. Tradicionalmente era una cerveza oscura hasta que Tennant (hoy en día Whitbread) produjo por primera vez Gold Label, una versión dorada en 1951. Es el estilo original que inspiró variedades derivadas en Bélgica, Estados Unidos y en el resto del mundo.","Ingredientes característicos":"Maltas Pale Ale y Crystal británicas. Uso limitado de maltas oscuras. A menudo se utilizan azúcares cerveceros. Lúpulos ingleses. Levadura británica.","Comparación de estilos":"Menos lupulada y amarga, más maltosa y más afrutada que la American Barleywine. Puede solaparse con la Old Ale en el extremo inferior del rango, pero sin los intensos signos del envejecimiento. No tan acaramelada y, a menudo, no tan dulce como una Wee Heavy.","Estadísticas vitales":"OG: 1.080 – 1.120 IBU: 35 – 70 FG: 1.018 – 1.030 SRM: 8 – 22 ABV: 8.0 – 12.0%","Ejemplos comerciales":"Burton Bridge Thomas Sykes Old Ale, Coniston No. 9 Barley Wine, Fuller’s Golden Pride, Hogs Back A over T, J.W. Lee’s Vintage Harvest Ale, Robinson’s Old Tom","Etiquetas":"intensidad-muy-alta, color-ámbar, fermentaciónalta, islas-británicas, estilo-tradicional, familia-ale-fuerte"},"glass_color":"#bb5100","srm_variable":false,"clarity":"opaca","foam_color":"#F5F1E6","abv_display":"8–12%","ibu_display":"35–70","srm_display":"8–22","og_display":"1.08–1.12","fg_display":"1.018–1.03","country":"Inglaterra","family":"Strong Ale","glass_shape":"snifter","glass_label":"Copa snifter","distinctive":"Menos lupulada que la American Barleywine.","ibu_avg":52.5,"ibu_variable":false,"abv_avg":10.0,"abv_variable":false,"summary":"Ale inglesa fuerte y muy maltosa, para tomar a sorbos.","classic_example":"Burton Bridge Thomas Sykes Old Ale","foam_level":1,"foam_height":7,"srm_lo_hex":"#ea8f00","srm_hi_hex":"#8e2900","summary_80":"Una ale fuerte y ricamente maltosa, con una agradable profundidad afrutada o lupulada.","distinctive_80":"Menos lupulada y amarga, más maltosa y más afrutada que la American Barleywine.","mini_profile":{"malta":3,"lupulo":3,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Maltas Pale Ale y Crystal británicas. Uso limitado de maltas oscuras. A menudo se utilizan azúcares cerveceros. Lúpulos ingleses.","ingredient_chips":["Maltas Pale Ale y Crystal…","Uso limitado de maltas oscuras"],"balance_pos":1.5,"balance_malta":3,"balance_lupulo":2,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Opaca","boca_highlight":"Cuerpo medio","aroma_highlights":["Maltas Pale Ale y Crystal…","Lúpulos ingleses","Levadura británica"],"sabor_highlights":["Maltas Pale Ale y Crystal…","Lúpulos ingleses","Levadura británica"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Ámbar","Blanquecina","Opaca"],"ingredientes_highlights":["Maltas Pale Ale y Crystal…","Uso limitado de maltas oscuras"],"ingredient_types":{"malta":"Maltas Pale Ale y Crystal…","lupulo":"Lúpulos ingleses","levadura":"Levadura británica"}},{"code":"18A","name":"Blonde Ale","category_num":18,"category_name":"Pale American Ale","stats":{"OG":[1.038,1.054],"FG":[1.008,1.013],"IBU":[15.0,28.0],"SRM":[3.0,6.0],"ABV":[3.8,5.5]},"fields":{"Impresión general":"Una cerveza artesanal estadounidense orientada a la malta, accesible a todos los paladares y con buena tomabilidad. A menudo con interesantes notas afrutadas, a lúpulo o a maltas especiales. Limpia y bien balanceada, es una bebida refrescante sin sabores agresivos.","Aroma":"Malta de baja a moderada, generalmente neutra o granosa, puede tener una ligera nota a pan o a caramelo. Una frutosidad de baja a moderada es opcional pero aceptable. Puede tener un aroma a lúpulo de bajo a medio, reflejando un amplio rango de variedades, aunque son más comunes las que aportan notas cítricas, florales, afrutadas o especiadas. Perfil de fermentación limpio.","Apariencia":"Color de amarillo claro a dorado intenso. De transparente a brillante. Espuma blanca de baja a media, con una retención de moderada a buena.","Sabor":"Maltosidad inicial suave, pero también puede tener un ligero sabor a malta especial (p. ej.: pan, tostadas, galleta o trigo). Sabores a caramelo usualmente ausentes; si estuvieran, son típicamente notas a caramelo claro o miel. Ésteres afrutados de bajos a medios son opcionales, pero bienvenidos. Sabor a lúpulo de ligero a moderado (de cualquier variedad), pero no debería ser demasiado agresivo. Amargor de medio bajo a medio, pero el balance es normalmente hacia la malta o equilibrado entre malta y lúpulo. Final de semi seco a ligeramente maltoso; una sensación de dulzor es a menudo más una expresión del bajo amargor que de un dulzor residual real. Perfil de fermentación limpio.","Sensación en boca":"Cuerpo de medio ligero a medio. Carbonatación de media a alta. Suave sin resultar pesada.","Comentarios":"Los ejemplos oxidados pueden desarrollar notas a miel o a caramelo, que no se deben confundir con los sabores similares derivados de la malta. Se conoce también, a veces, como Golden Ale o simplemente Gold.","Historia":"Un estilo de cerveza artesanal estadounidense elaborado como una alternativa más rápida de producir que las American Lager estándar. Se cree que fue producida por primera vez por Catamount en 1987. A menudo cumple una función como ale de la casa de nivel introductorio.","Ingredientes característicos":"Generalmente “todo malta”, pero puede incluir trigo malteado o algún azúcar como adjunto. Cualquier variedad de lúpulo puede ser usada. Levadura estadounidense limpia, levadura inglesa ligeramente afrutada o levadura Kölsch. También puede ser elaborada con levadura lager, o ser acondicionada en frío.","Comparación de estilos":"Típicamente con más sabor que una American Lager o una Cream Ale. Menos amargor que una American Pale Ale. Probablemente similar a los ejemplos más maltosos de Kölsch.","Estadísticas vitales":"OG: 1.038 – 1.054 IBU: 15 – 28 FG: 1.008 – 1.013 SRM: 3 – 6 ABV: 3.8 – 5.5%","Ejemplos comerciales":"Firestone Walker 805, Kona Big Wave Golden Ale, Real Ale Firemans #4 Blonde Ale, Russian River Aud Blonde, Victory Summer Love, Widmer Citra Summer Blonde Brew","Etiquetas":"intensidad-estándar, color-pálido, cualquierfermentación, norte-américa, estilo-artesanal, familia-alepálida"},"glass_color":"#fdb832","srm_variable": ":[1.045,1.06],"FG":[1.01,1.015],"IBU":[30.0,50.0],"SRM":[5.0,10.0],"ABV":[4.5,6.2]},"fields":{"Impresión general":"Una cerveza artesanal estadounidense pálida, de intensidad estándar y orientada hacia el lúpulo, pero con suficiente malta de apoyo para que sea balanceada y fácil de tomar. La presencia limpia de los lúpulos puede reflejar variedades estadounidenses o del Nuevo Mundo, bien sean clásicas o modernas, con un amplio rango de características.","Aroma":"Lúpulo de moderado a moderadamente alto proveniente de variedades estadounidenses o del Nuevo Mundo, con un amplio rango de posibles características, incluyendo perfiles cítricos, florales, a pino, resinosos, especiados, frutas tropicales, frutas de carozo, bayas o melón. Ninguna de estas características particulares es obligatoria, pero el aroma lupulado debe ser evidente. Esta presentación de lúpulos es apoyada por una maltosidad de intensidad de baja a moderada, con carácter neutro o a grano, y que puede aportar un bajo carácter a maltas especiales (p. ej.: pan, tostadas, galleta o caramelo). Los ésteres afrutados son opcionales, nunca sobrepasando una intensidad moderada. El aroma fresco a lúpulo agregado como dry hop es opcional.","Apariencia":"Color de dorado pálido a ámbar. Espuma moderadamente voluminosa, con color de blanco a blanquecino, con buena retención. Por lo general bastante traslúcida.","Sabor":"Carácter de lúpulos y maltas similares a los del aroma (aplican los mismos descriptores e intensidades). Los sabores a caramelo a menudo están ausentes o son bastante discretos, siendo aceptables siempre y cuando no entren en conflicto con los lúpulos. Amargor de moderado a alto. Perfil de fermentación limpio. Los ésteres afrutados de la levadura pueden ser de nulos a moderados, no obstante, muchas de las variedades de lúpulos pueden ser bastante afrutadas. Final de seco a medio. El balance es típicamente hacia el amargor y los lúpulos de adición tardía; la presencia de malta debe ser de apoyo y no una distracción. El sabor a lúpulo y el amargor a menudo permanecen hasta el final, pero el retrogusto debe ser generalmente limpio y sin asperezas. El sabor fresco a lúpulo agregado como dry hop es opcional.","Sensación en boca":"Cuerpo de medio ligero a medio. Carbonatación de moderada a alta. En general, con un final suave sin astringencia ni asperezas.","Comentarios":"Las versiones estadounidenses modernas son, a menudo, solamente una IPA de menor densidad. Tradicionalmente era un estilo que permitía experimentar con variedades de lúpulo y métodos de utilización, lo cual a menudo se puede observar hoy en día en las adaptaciones internacionales de países con un mercado emergente de cerveza artesanal. Al juzgar esta cerveza, permita las características de los lúpulos modernos estadounidenses o del Nuevo Mundo, según sean desarrollados y lanzados al mercado.","Historia":"Una adaptación de la English Pale Ale en la era moderna de la cerveza artesanal estadounidense, reflejando ingredientes autóctonos. Sierra Nevada Pale Ale fue elaborada 35 por primera vez en 1980 y ayudó a popularizar el estilo. Antes de la explosión de fama de las IPA, este estilo era el más conocido y popular entre las cervezas artesanales estadounidenses.","Ingredientes característicos":"Malta pálida neutra. Lúpulos estadounidenses o del Nuevo Mundo. Levadura ale, neutra o ligeramente afrutada, de origen estadounidense o inglés. Pequeñas cantidades de diversas maltas especiales.","Comparación de estilos":"Típicamente de color más claro, con un perfil de fermentación más limpio, y con menos sabores a caramelo que sus equivalentes ingleses. Puede existir cierto solapamiento en el color entre la American Pale Ale y la American Amber Ale. La American Pale Ale será generalmente más limpia, con un perfil de maltas Caramelo más ligero, cuerpo más liviano y a menudo más lúpulos de adición tardía. Menos amargor en el balance y menos intensidad alcohólica que una American IPA. Más maltosa, más balanceada y fácil de tomar, y menos intensamente amarga y centrada en los lúpulos que una American IPA de bajo alcohol (conocidas como Session IPA). Más amarga y lupulada que una Blonde Ale.","Estadísticas vitales":"OG: 1.045 – 1.060 IBU: 30 – 50 FG: 1.010 – 1.015 SRM: 5 – 10 ABV: 4.5 – 6.2%","Ejemplos comerciales":"Deschutes Mirror Pond Pale Ale, Half Acre Daisy Cutter Pale Ale, Great Lakes Burning River, La Cumbre Acclimated APA, Sierra Nevada Pale Ale, Stone Pale Ale 2.0","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónalta, norte-américa, estilo-artesanal, familia-ale-pálida, amarga"},"glass_color":"#ee9600","srm_variable":false,"clarity":"traslucida","foam_color":"#F7F4EC","abv_display":"4.5–6.2%","ibu_display":"30–50","srm_display":"5–10","og_display":"1.045–1.06","fg_display":"1.01–1.015","country":"Estados Unidos","family":"Pale Ale","glass_shape":"shaker","glass_label":"Pinta americana","distinctive":"Menos amarga que una American IPA, más lupulada que una Blonde.","ibu_avg":40.0,"ibu_variable":false,"abv_avg":5.3,"abv_variable":false,"summary":"Ale estadounidense pálida orientada al lúpulo.","classic_example":"Deschutes Mirror Pond Pale Ale","foam_level":3,"foam_height":14,"srm_lo_hex":"#fbb123","srm_hi_hex":"#de7c00","summary_80":"Una cerveza artesanal estadounidense pálida, de intensidad estándar y orientada hacia el lúpulo.","distinctive_80":"Típicamente de color más claro, con un perfil de fermentación más limpio, y con menos sabores a caramelo que sus equivalentes ingleses.","mini_profile":{"malta":2,"lupulo":3,"cuerpo":2,"carbonatacion":3},"char_tags":["amarga"],"ingredients_line":"Malta pálida neutra. Lúpulos estadounidenses o del Nuevo Mundo.","ingredient_chips":["Malta pálida neutra","Lúpulos estadounidenses o del…"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Lúpulo alto","sabor_highlight":"Amargor alto","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta pálida neutra","Lúpulos estadounidenses o del…","Levadura ale"],"sabor_highlights":["Malta pálida neutra","Lúpulos estadounidenses o del…","Levadura ale"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Dorado","Voluminosa","Translúcida"],"ingredientes_highlights":["Malta pálida neutra","Lúpulos estadounidenses o del…"],"ingredient_types":{"malta":"Malta pálida neutra","lupulo":"Lúpulos estadounidenses o del…","levadura":"Levadura ale"}},{"code":"19A","name":"American Amber Ale","category_num":19,"category_name":"Amber and Brown American Beer","stats":{"OG":[1.045,1.06],"FG":[1.01,1.015],"IBU":[25.0,40.0],"SRM":[10.0,17.0],"ABV":[4.5,6.2]},"fields":{"Impresión general":"Una cerveza artesanal estadounidense ámbar, lupulada, de moderada intensidad y con un sabor a caramelo derivado de la malta. El balance puede variar bastante, con algunas versiones siendo muy maltosas y otras agresivamente lupuladas. Las versiones lupuladas y amargas no deberían tener sabores que choquen con el perfil a caramelo de la malta.","Aroma":"Aroma a lúpulo de bajo a moderado que refleja variedades de lúpulos estadounidenses o del Nuevo Mundo (cítrico, floral, a pino, resinoso, especiado, fruta tropical, fruta de carozo, baya o melón). Un carácter a lúpulo cítrico es común, pero no obligatorio. Maltosidad de moderadamente baja a moderadamente alta, usualmente con un carácter moderado a caramelo, que puede aportar soporte, balance, o a veces, enmascarar la presencia del lúpulo. Los ésteres varían de nulos a moderados.","Apariencia":"Color de ámbar profundo a marrón cobrizo, algunas veces con tonos rojizos. Espuma blanquecina moderadamente voluminosa, con buena retención. Por lo general bastante traslúcida.","Sabor":"Lúpulo de moderado a alto con características similares a las del aroma. Los sabores a malta son de moderados a altos, y usualmente presentan un dulzor de malta inicial seguido de un sabor moderado a caramelo y, a veces, sabores tostados o a galleta en cantidades menores. Están ausentes sabores de maltas oscuras o rostizadas. Amargor de moderado a moderadamente alto. El balance puede variar desde algo maltoso a algo amargo. Los ésteres afrutados pueden ser de nulos a moderados. Final de medio a pleno, aunque seco, con el dulzor del caramelo, el sabor a lúpulo y el amargor pudiendo persistir ligeramente.","Sensación en boca":"Cuerpo de medio a medio pleno. Carbonatación de media a alta. Generalmente con un final suave y sin astringencia. Las versiones más fuertes pueden tener cierta tibieza alcohólica.","Comentarios":"Puede solaparse en color con versiones más oscuras de las American Pale Ale, pero con un sabor a malta y un balance diferentes. Existe un rango de balances en este estilo, desde equilibrado y maltoso hasta agresivamente lupulado. 36","Historia":"Un estilo de cerveza artesanal estadounidense moderno, desarrollado como una variante de las American Pale Ale. Mendocino Red Tail Ale fue elaborada por primera vez en 1983, y regionalmente era conocida como una Red Ale. Esta cerveza actuó como la progenitora de las Double Red (American Strong Ale), Red IPA y otras cervezas lupuladas y acarameladas.","Ingredientes característicos":"Malta Pale Ale neutra. Maltas Crystal de color medio a oscuro. Son comunes lúpulos estadounidenses o del Nuevo Mundo, frecuentemente con sabores cítricos, pero también pueden ser usados otros. Levadura de carácter neutro a ligeramente esteroso.","Comparación de estilos":"Más oscura, más acaramelada, con más cuerpo y generalmente menos amarga en el balance que una American Pale Ale. Menos alcohol, amargor y carácter de lúpulo que las Red IPA. Menos intensidad, malta y carácter de lúpulo que las American Strong Ale. Menos chocolate y caramelo oscuro que una American Brown Ale.","Estadísticas vitales":"OG: 1.045 – 1.060 IBU: 25 – 40 FG: 1.010 – 1.015 SRM: 10 – 17 ABV: 4.5 – 6.2%","Ejemplos comerciales":"Anderson Valley Boont Amber Ale, Bell’s Amber Ale, Full Sail Amber, North Coast Red Seal Ale, Saint Arnold Amber Ale, Tröegs Hopback Amber Ale","Etiquetas":"intensidad-estándar, color-ámbar, fermentaciónalta, norte-américa, estilo-artesanal, familia-ale-ámbar, balanceada"},"glass_color":"#c75e00","srm_variable":false,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"4.5–6.2%","ibu_display":"25–40","srm_display":"10–17","og_display":"1.045–1.06","fg_display":"1.01–1.015","country":"Estados Unidos","family":"Amber Ale","glass_shape":"shaker","glass_label":"Pinta americana","distinctive":"Más oscura y menos amarga que una American Pale Ale.","ibu_avg":32.5,"ibu_variable":false,"abv_avg":5.3,"abv_variable":false,"summary":"Ale estadounidense ámbar y lupulada, sabor a caramelo.","classic_example":"Anderson Valley Boont Amber Ale","foam_level":3,"foam_height":14,"srm_lo_hex":"#de7c00","srm_hi_hex":"#b04500","summary_80":"Una cerveza artesanal estadounidense ámbar, lupulada, de moderada intensidad y con un sabor a caramelo derivado de la malta.","distinctive_80":"Más oscura, más acaramelada, con más cuerpo y generalmente menos amarga en el balance que una American Pale Ale.","mini_profile":{"malta":3,"lupulo":3,"cuerpo":2,"carbonatacion":3},"char_tags":["balanceada"],"ingredients_line":"Malta Pale Ale neutra. Maltas Crystal de color medio a oscuro.","ingredient_chips":["Malta Pale Ale neutra","Maltas Crystal de color medio…"],"balance_pos":2.0,"balance_malta":3,"balance_lupulo":3,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta Pale Ale neutra","Son comunes lúpulos…","Levadura de carácter neutro a…"],"sabor_highlights":["Malta Pale Ale neutra","Son comunes lúpulos…","Levadura de carácter neutro a…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Ámbar","Voluminosa","Translúcida"],"ingredientes_highlights":["Malta Pale Ale neutra","Maltas Crystal de color medio…"],"ingredient_types":{"malta":"Malta Pale Ale neutra","lupulo":"Son comunes lúpulos…","levadura":"Levadura de carácter neutro a…"}},{"code":"19B","name":"California Common","category_num":19,"category_name":"Amber and Brown American Beer","stats":{"OG":[1.048,1.054],"FG":[1.011,1.014],"IBU":[30.0,45.0],"SRM":[9.0,14.0],"ABV":[4.5,5.5]},"fields":{"Impresión general":"Una cerveza tostada y acaramelada, bastante amarga, de intensidad estándar, con un interesante perfil frutal y un carácter a lúpulo como amaderado y rústico. Suave y bien carbonatada.","Aroma":"Lúpulo de moderado a alto con carácter herbáceo, resinoso, floral o mentolado. Un suave carácter afrutado es aceptable. Un aroma a caramelo o tostado de la malta, en intensidad de baja a moderada, da soporte a los lúpulos.","Apariencia":"Color de ámbar medio a cobrizo ligero. Por lo general traslúcida. Espuma blanquecina de tamaño moderado y buena retención.","Sabor":"Moderadamente maltoso con un pronunciado amargor de lúpulo. El carácter de malta usualmente tiene sabores tostados (no rostizados) y caramelo. Sabor de lúpulo de bajo a moderadamente alto, usualmente con una cualidad rústica de variedades tradicionales estadounidenses (a menudo herbáceo, resinoso, floral, mentolado). Final bastante seco y crisp, con un amargor de lúpulo que persiste y un sabor a malta firme y granoso. Se aceptan ligeros ésteres afrutados, pero generalmente es limpia.","Sensación en boca":"Cuerpo medio. Carbonatación de media a media alta.","Comentarios":"Este estilo está descrito específicamente entorno a la prototípica Anchor Steam, aunque permitiendo el uso de otros ingredientes típicos de la época. Los lúpulos Northern Brewer no son un requerimiento estricto para el estilo. Los lúpulos modernos estadounidenses y del Nuevo Mundo (particularmente los cítricos) son inapropiados.","Historia":"Original de la costa oeste de Estados Unidos, elaborada inicialmente como Steam Beer durante la fiebre del oro. Se utilizaban fermentadores grandes, poco profundos y abiertos (coolships) para compensar la falta de refrigeración y para aprovechar las bajas temperaturas del área de la bahía de San Francisco. Las versiones modernas se basan en el relanzamiento del estilo por Anchor Brewing en la década de 1970.","Ingredientes característicos":"Malta Pale Ale, lúpulos no cítricos (a menudo Northern Brewer), pequeñas cantidades de malta tostada o Crystal. Levadura lager; sin embargo, algunas cepas (a menudo mencionando “California” en su nombre) trabajan mejor que otras a las temperaturas de fermentación más cálidas comúnmente utilizadas (55 a 60 °F, aprox. 13 a 16 °C). Tome en cuenta que algunas cepas de levadura alemanas producen un carácter sulfuroso inapropiado.","Comparación de estilos":"Superficialmente similar a una American Amber Ale, pero con elecciones específicas de malta y lupulado; el sabor y el aroma a lúpulo son del tipo estadounidense tradicional (no moderno), los sabores a malta son más tostados, el lupulado es siempre intenso, y se utiliza levadura lager fermentada a temperatura cálida. Menos atenuada, menos carbonatada y menos afrutada que una Australian Sparkling Ale.","Estadísticas vitales":"OG: 1.048 – 1.054 IBU: 30 – 45 FG: 1.011 – 1.014 SRM: 9 – 14 ABV: 4.5 – 5.5%","Ejemplos comerciales":"Anchor Steam, Steamworks Steam Engine Lager","Etiquetas":"intensidad-estándar, color-ámbar, fermentaciónbaja, norte-américa, estilo-tradicional, familia-lager-ámbar, amarga"},"glass_color":"#d36e00","srm_variable":false,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"4.5–5.5%","ibu_display":"30–45","srm_display":"9–14","og_display":"1.048–1.054","fg_display":"1.011–1.014","country":"Estados Unidos","family":"Amber Lager","glass_shape":"shaker","glass_label":"Pinta americana","distinctive":"Con levadura lager a temperatura de ale.","ibu_avg":37.5,"ibu_variable":false,"abv_avg":5.0,"abv_variable":false,"summary":"Ale tostada y acaramelada, bastante amarga.","classic_example":"Anchor Steam","foam_level":1,"foam_height":7,"srm_lo_hex
