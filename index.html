":"#e58500","srm_hi_hex":"#c35900","summary_80":"Una cerveza tostada y acaramelada, bastante amarga, de intensidad estándar.","distinctive_80":"Superficialmente similar a una American Amber Ale.","mini_profile":{"malta":3,"lupulo":3,"cuerpo":2,"carbonatacion":3},"char_tags":["amarga"],"ingredients_line":"Malta Pale Ale, lúpulos no cítricos (a menudo Northern Brewer), pequeñas cantidades de malta tostada o Crystal.","ingredient_chips":["Malta Pale Ale","Levadura lager; sin embargo"],"balance_pos":2.0,"balance_malta":3,"balance_lupulo":3,"aroma_highlight":"Lúpulo alto","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta Pale Ale","Malta Pale Ale","Levadura lager; sin embargo"],"sabor_highlights":["Malta Pale Ale","Malta Pale Ale","Levadura lager; sin embargo"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Ámbar","Blanquecina","Translúcida"],"ingredientes_highlights":["Malta Pale Ale","Levadura lager; sin embargo"],"ingredient_types":{"malta":"Malta Pale Ale","lupulo":"Malta Pale Ale","levadura":"Levadura lager; sin embargo"}},{"code":"19C","name":"American Brown Ale","category_num":19,"category_name":"Amber and Brown American Beer","stats":{"OG":[1.045,1.06],"FG":[1.01,1.016],"IBU":[20.0,30.0],"SRM":[18.0,35.0],"ABV":[4.3,6.2]},"fields":{"Impresión general":"Una ale estadounidense maltosa pero lupulada, de intensidad estándar, frecuentemente con sabores a chocolate y caramelo. El sabor y el aroma del lúpulo complementan y realzan a la malta en lugar de chocar con ella.","Aroma":"De malta dulce a malta sabrosa, en intensidad moderada, con cualidades a chocolate, caramelo, frutos secos o tostado. El aroma a lúpulo es típicamente de bajo a moderado, de casi cualquier tipo que complemente a la malta. Algunas interpretaciones del estilo pueden presentar opcionalmente un mayor aroma a lúpulo, un carácter estadounidense o del Nuevo Mundo (cítrico, afrutado, tropical, etc.), o aromas derivados de dry hopping. Los ésteres afrutados van de muy bajos a moderados. El carácter a malta oscura es más robusto que en otras Brown Ale, aunque no lo suficiente como para parecerse demasiado a una porter.","Apariencia":"Color marrón de ligero a muy oscuro. Traslúcida. Espuma de ligera a moderada, con color de blanquecino a canela claro.","Sabor":"Maltosidad dulce o rica de media a moderadamente alta, con complejidad a chocolate, caramelo, frutos secos o tostado, y con amargor de medio a medio alto. Final de semi seco a medio, con un retrogusto tanto a malta como a lúpulos. Sabor a lúpulo de ligero a moderado, a veces cítrico, afrutado o tropical, aunque es aceptable cualquier sabor a lúpulo que complemente a la malta. Ésteres afrutados de muy bajos a moderados. La malta y el lúpulo generalmente tienen la misma intensidad, pero el balance puede variar en ambas direcciones. No debería tener un carácter rostizado que sugiera una porter o una stout.","Sensación en boca":"Cuerpo de medio a medio pleno. Las versiones más amargas pueden dar una impresión seca y resinosa. Carbonatación de moderada a moderadamente alta. Las versiones más fuertes pueden presentar una ligera tibieza alcohólica.","Comentarios":"La mayoría de las American Brown comerciales no son tan agresivas como las versiones caseras originales y algunos ejemplos artesanales modernos. Este estilo describe la oferta comercial actual, típicamente vendida como American Brown Ale, en lugar de las versiones más fuertes y lupuladas de los primeros días de la elaboración casera. Estas Brown Ale con intensidad de IPA deberían inscribirse como 21B Specialty IPA: Brown IPA.","Historia":"Un estilo estadounidense de los inicios de la era moderna de la cerveza artesanal. Derivado de la English Brown Ale, pero con más lúpulos. Pete’s Wicked Ale (1986) definió el estilo, que fue juzgado por primera vez en el Great American Beer Festival de 1992.","Ingredientes característicos":"Malta pálida, con adición de maltas Crystal y oscuras (típicamente chocolate). Los lúpulos estadounidenses son típicos, pero también pueden ser utilizados lúpulos de Europa continental o del Nuevo Mundo.","Comparación de estilos":"Más sabores a chocolate y caramelo que las American Pale o Amber Ale, típicamente con un amargor menos prominente en el balance. Menor amargor, alcohol y carácter lupulado que las Brown IPA. Más amarga y típicamente más lupulada que las English Brown Ale, con una presencia de malta más rica, usualmente con más alcohol, y con un carácter de lúpulo estadounidense o del Nuevo Mundo.","Estadísticas vitales":"OG: 1.045 – 1.060 IBU: 20 – 30 FG: 1.010 – 1.016 SRM: 18 – 35 ABV: 4.3 – 6.2%","Ejemplos comerciales":"Avery Ellie’s Brown Ale, Big Sky Moose Drool Brown Ale, Brooklyn Brown Ale, Bell’s Best Brown, Smuttynose Old Brown Dog Ale, Telluride Face Down Brown","Etiquetas":"intensidad-estándar, color-oscuro, fermentaciónalta, norte-américa, estilo-artesanal, familia-ale-marrón, balanceada"},"glass_color":"#741600","srm_variable":false,"clarity":"traslucida","foam_color":"#D9B183","abv_display":"4.3–6.2%","ibu_display":"20–30","srm_display":"18–35","og_display":"1.045–1.06","fg_display":"1.01–1.016","country":"Estados Unidos","family":"Brown Ale","glass_shape":"shaker","glass_label":"Pinta americana","distinctive":"Más amarga que una English Brown Ale.","ibu_avg":25.0,"ibu_variable":false,"abv_avg":5.2,"abv_variable":false,"summary":"Ale estadounidense marrón, maltosa pero lupulada.","classic_example":"Avery Ellie’s Brown Ale","foam_level":1,"foam_height":7,"srm_lo_hex":"#a63e00","srm_hi_hex":"#470606","summary_80":"Una ale estadounidense maltosa pero lupulada, de intensidad estándar, frecuentemente con sabores a chocolate y caramelo.","distinctive_80":"Más sabores a chocolate y caramelo que las American Pale o Amber Ale, típicamente con un amargor menos prominente en el balance.","mini_profile":{"malta":3,"lupulo":2,"cuerpo":2,"carbonatacion":3},"char_tags":["balanceada"],"ingredients_line":"Malta pálida, con adición de maltas Crystal y oscuras (típicamente chocolate).","ingredient_chips":["Malta pálida"],"balance_pos":1.5,"balance_malta":3,"balance_lupulo":2,"aroma_highlight":"Malta media","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta pálida"],"sabor_highlights":["Malta pálida"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Marrón","Canela","Translúcida"],"ingredientes_highlights":["Malta pálida"],"ingredient_types":{"malta":"Malta pálida"}},{"code":"20A","name":"American Porter","category_num":20,"category_name":"American Porter and Stout","stats":{"OG":[1.05,1.07],"FG":[1.012,1.018],"IBU":[25.0,50.0],"SRM":[22.0,40.0],"ABV":[4.8,6.5]},"fields":{"Impresión general":"Una cerveza oscura maltosa, amarga y a menudo un tanto lupulada, con un carácter balanceado, rostizado y frecuentemente a chocolate.","Aroma":"Rostizado de medio ligero a medio alto, a menudo con un carácter a chocolate, café ligero o levemente quemado, a veces con dulzor de caramelo o toffee en segundo plano, o riqueza de malta. El carácter a lúpulo resinoso, terroso o floral puede variar de bajo a alto. Ésteres afrutados moderados son opcionales. No debe percibirse punzante, agrio ni ácido. El balance de malta y lúpulo puede variar, pero siempre debe tener un aroma a malta rostizada.","Apariencia":"Color de marrón medio a marrón muy oscuro, a menudo con destellos rubí o granate. Puede acercarse al color negro. Traslúcida, si no es opaca. Espuma color canela densa, de retención moderadamente buena.","Sabor":"Rostizado moderadamente fuerte, a menudo con un carácter a chocolate y ligeramente quemado, a veces con un caramelo dulce o riqueza de malta para dar soporte. Amargor de medio a alto, con un final de seco a semi dulce. Las maltas oscuras pueden acentuar esta impresión, pero no deberían añadir un sabor agrio, quemado ni áspero. Lúpulo resinoso, terroso o floral de bajo a alto, que no debería chocar con la malta oscura. Versiones con dry hop pueden tener un sabor a lúpulo fresco o resinoso. Ésteres afrutados moderados son opcionales. No debería tener una acidez cortante.","Sensación en boca":"Cuerpo de medio a medio pleno. Carbonatación de moderadamente baja a moderadamente alta. Las versiones más fuertes pueden tener una ligera tibieza alcohólica. Pueden tener una ligera astringencia por la malta oscura, pero este carácter no debería ser intenso.","Comentarios":"A veces llamada Robust Porter, se está volviendo cada vez más difícil de encontrar. Es un estilo un tanto amplio, abierto a la interpretación por parte de quien la elabora. La intensidad y los sabores a maltas oscuras pueden variar significativamente. Es opcional un carácter intenso a lúpulo, o a subproductos significativos de la fermentación; por eso puede tener un carácter o “estadounidense” o “británico”.","Historia":"Una versión más fuerte y agresiva de las antiguas Pre-Prohibition Porter o English Porter, elaborada por primera vez en la era moderna de la cerveza artesanal (introducida en 1974). Este estilo describe las versiones artesanales modernas; para las versiones estadounidenses antiguas consulte el estilo Historical Beer: Pre-Prohibition Porter.","Ingredientes característicos":"Malta base pálida, frecuentemente malta Crystal. Maltas oscuras, a menudo malta negra o chocolate. Típicamente lúpulos estadounidenses para amargor, pero se pueden utilizar variedades estadounidenses o británicas para adiciones tardías. Levadura ale que puede ser una variedad estadounidense limpia o una inglesa llena de carácter.","Comparación de estilos":"Más amarga y a menudo más fuerte, y con más cualidades de maltas oscuras y más secas que las English Porter o Pre-Prohibition Porter. Menos alcohólica e intensa que una American Stout. 38","Estadísticas vitales":"OG: 1.050 – 1.070 IBU: 25 – 50 FG: 1.012 – 1.018 SRM: 22 – 40 ABV: 4.8 – 6.5%","Ejemplos comerciales":"Anchor Porter, Bell’s Porter, Deschutes Black Butte Porter, Great Lakes Edmund Fitzgerald Porter, Sierra Nevada Porter, Smuttynose Robust Porter","Etiquetas":"intensidad-estándar, color-oscuro, fermentaciónalta, norte-américa, estilo-artesanal, familia-porter, amarga, rostizada"},"glass_color":"#5a0a02","srm_variable":false,"clarity":"opaca","foam_color":"#D9B183","abv_display":"4.8–6.5%","ibu_display":"25–50","srm_display":"22–40","og_display":"1.05–1.07","fg_display":"1.012–1.018","country":"Estados Unidos","family":"Porter","glass_shape":"shaker","glass_label":"Pinta americana","distinctive":"Más amarga que una English Porter, menos intensa que una Stout.","ibu_avg":37.5,"ibu_variable":false,"abv_avg":5.7,"abv_variable":false,"summary":"Ale oscura, maltosa y algo amarga, notas a chocolate.","classic_example":"Anchor Porter","foam_level":2,"foam_height":10,"srm_lo_hex":"#8e2900","srm_hi_hex":"#030403","summary_80":"Una cerveza oscura maltosa, amarga y a menudo un tanto lupulada, con un carácter balanceado.","distinctive_80":"Más amarga y a menudo más fuerte, y con más cualidades de maltas oscuras y más secas que las English Porter o Pre-Prohibition Porter.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":3},"char_tags":["amarga","rostizada"],"ingredients_line":"Malta base pálida, frecuentemente malta Crystal. Maltas oscuras, a menudo malta negra o chocolate.","ingredient_chips":["Malta base pálida","Maltas oscuras"],"balance_pos":3.0,"balance_malta":0,"balance_lupulo":2,"aroma_highlight":"Malta media","sabor_highlight":"Amargor alto","apariencia_highlight":"Opaca","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta base pálida","Típicamente lúpulos…","Levadura ale que puede ser una…"],"sabor_highlights":["Malta base pálida","Típicamente lúpulos…","Levadura ale que puede ser una…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Marrón","Densa","Opaca"],"ingredientes_highlights":["Malta base pálida","Maltas oscuras"],"ingredient_types":{"malta":"Malta base pálida","lupulo":"Típicamente lúpulos…","levadura":"Levadura ale que puede ser una…"}},{"code":"20B","name":"American Stout","category_num":20,"category_name":"American Porter and Stout","stats":{"OG":[1.05,1.075],"FG":[1.01,1.022],"IBU":[35.0,75.0],"SRM":[30.0,40.0],"ABV":[5.0,7.0]},"fields":{"Impresión general":"Una stout oscura bastante fuerte, altamente rostizada, amarga y lupulada. Tiene el cuerpo y los sabores oscuros típicos de una stout, con un carácter más agresivo a lúpulo estadounidense y mayor amargor.","Aroma":"Rostizado de moderado a fuerte, a menudo con una cualidad a café rostizado o chocolate amargo. Aromas quemados o a carbón son aceptables en niveles bajos. Aroma a lúpulo de muy bajo a medio, a menudo con un carácter cítrico o resinoso. Ésteres de intensidad media son opcionales. Un ligero alcohol es opcional. No debe percibirse punzante, agrio ni ácido.","Apariencia":"Generalmente de color negro azabache, aunque algunas pueden verse como un marrón muy oscuro. Espuma voluminosa y persistente, con color de canela claro a marrón claro. Usualmente opaca.","Sabor":"Rostizado de moderado a muy alto, a menudo con notas a café, chocolate amargo o semi amargo, o granos de café rostizados. Puede tener una nota a poso de café ligeramente quemado, pero este carácter no debería ser prominente. Dulzor de malta de bajo a medio, a menudo con sabrosas notas a chocolate o caramelo. Amargor de medio a alto. Sabor a lúpulo de bajo a alto, generalmente cítrico o resinoso. Final de seco a medio, ocasionalmente con una cualidad ligeramente quemada. Ésteres bajos son opcionales. Un sabor a alcohol ligero pero suave es opcional.","Sensación en boca":"Cuerpo de medio a pleno. Puede ser algo cremosa. Puede tener un poco de astringencia derivada del rostizado, pero este carácter no debería ser excesivo. Carbonatación de media alta a alta. Tibieza alcohólica de ligera a moderadamente fuerte, pero suave y no excesivamente quemante.","Comentarios":"Cada cervecería expresa su personalidad variando el perfil de maltas rostizadas, el dulzor y el sabor de maltas, además de las cantidades de lúpulo de adición tardía utilizados. Generalmente tiene sabores de maltas rostizadas y un lupulado más intensos que otras stout tradicionales (excepto las Imperial Stout). Es cada vez más difícil de encontrar.","Historia":"Un estilo moderno de cerveza artesanal y casera que aplicaba un régimen de lupulado más agresivo, al estilo estadounidense, a una stout fuerte tradicional inglesa o irlandesa. Las versiones caseras se conocieron alguna vez como West Coast Stout, una nomenclatura común para cervezas más altamente lupuladas.","Ingredientes característicos":"Maltas base, lúpulos y levaduras estadounidenses comunes. Uso variado de maltas oscuras y rostizadas, así como también de maltas tipo Caramelo. Pueden estar presentes adjuntos o aditivos en pequeñas cantidades para añadir complejidad.","Comparación de estilos":"Como una Irish Extra Stout más lupulada, amarga y fuertemente rostizada. Mucho más rostizada y robusta que una Black IPA. Las versiones más robustas y alcohólicas corresponden al estilo Imperial Stout. Más alcohólica e intensa que una American Porter, particularmente en la adición de maltas o granos oscuros y el carácter de lúpulo.","Estadísticas vitales":"OG: 1.050 – 1.075 IBU: 35 – 75 FG: 1.010 – 1.022 SRM: 30 – 40 ABV: 5.0 – 7.0%","Ejemplos comerciales":"Avery Out of Bounds Stout, Bell’s Kalamazoo Stout, Deschutes Obsidian Stout, Sierra Nevada Stout, Trillium Secret Stairs","Etiquetas":"intensidad-alta, color-oscuro, fermentación-alta, norte-américa, estilo-artesanal, familia-stout, amarga, rostizada"},"glass_color":"#470606","srm_variable":false,"clarity":"opaca","foam_color":"#D9B183","abv_display":"5–7%","ibu_display":"35–75","srm_display":"30–40","og_display":"1.05–1.075","fg_display":"1.01–1.022","country":"Estados Unidos","family":"Stout","glass_shape":"shaker","glass_label":"Pinta americana","distinctive":"Como una Irish Extra Stout más lupulada y rostizada.","ibu_avg":55.0,"ibu_variable":false,"abv_avg":6.0,"abv_variable":false,"summary":"Stout oscura bastante fuerte, muy rostizada y lupulada.","classic_example":"Avery Out of Bounds Stout","foam_level":3,"foam_height":14,"srm_lo_hex":"#5e0b00","srm_hi_hex":"#030403","summary_80":"Una stout oscura bastante fuerte, altamente rostizada, amarga y lupulada. Tiene el cuerpo y los sabores oscuros típicos de una stout.","distinctive_80":"Como una Irish Extra Stout más lupulada, amarga y fuertemente rostizada. Mucho más rostizada y robusta que una Black IPA.","mini_profile":{"malta":2,"lupulo":3,"cuerpo":2,"carbonatacion":3},"char_tags":["amarga","rostizada"],"ingredients_line":"Maltas base, lúpulos y levaduras estadounidenses comunes.","ingredient_chips":["Maltas base","Uso variado de maltas oscuras…"],"balance_pos":2.5,"balance_malta":2,"balance_lupulo":3,"aroma_highlight":"Lúpulo medio","sabor_highlight":"Lúpulo alto","apariencia_highlight":"Opaca","boca_highlight":"Carbonatación alta","aroma_highlights":["Maltas base","Maltas base","Maltas base"],"sabor_highlights":["Maltas base","Maltas base","Maltas base"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Negro","Voluminosa","Opaca"],"ingredientes_highlights":["Maltas base","Uso variado de maltas oscuras…"],"ingredient_types":{"malta":"Maltas base","lupulo":"Maltas base","levadura":"Maltas base"}},{"code":"20C","name":"Imperial Stout","category_num":20,"category_name":"American Porter and Stout","stats":{"OG":[1.075,1.115],"FG":[1.018,1.03],"IBU":[50.0,90.0],"SRM":[30.0,40.0],"ABV":[8.0,12.0]},"fields":{"Impresión general":"Una stout muy oscura y fuerte, de sabores intensos y con un amplio rango de interpretaciones. Malta rostizada y quemada con sabores profundos a frutas oscuras o deshidratadas, final cálido y semi amargo. A pesar de los intensos sabores, los componentes necesitan compenetrarse entre sí para crear una cerveza compleja y armoniosa, y no un auténtico desastre; a veces esto solo se logra mediante su envejecimiento.","Aroma":"Rico, profundo, complejo y a menudo bastante intenso, con una mezcla agradable de rostizado, fruta, lúpulos y alcohol. Aroma rostizado de ligero a moderadamente intenso, que puede tener una cualidad a café, chocolate amargo o semi amargo, cacao, golosina de regaliz negro, alquitrán o a grano ligeramente quemado, a veces con un ligero dulzor de caramelo o maltosidad tostada. Ésteres de bajos a moderadamente altos, a menudo percibidos como frutas oscuras o deshidratadas, tales como ciruelas, ciruelas pasas, higos, grosellas negras o uvas pasas. Lúpulo de muy bajo a bastante agresivo, a menudo con carácter estadounidense o inglés. El aroma a alcohol es opcional, pero no debería ser punzante, quemante o similar al solvente. El balance entre estos cuatro componentes principales puede variar bastante; no todos tienen que ser identificables, pero aquellos que estén presentes deben tener una interacción armoniosa. El envejecimiento puede añadir otra dimensión, incluyendo una impresión vinosa o similar a un oporto, pero nunca acidez. El envejecimiento puede disminuir la intensidad aromática.","Apariencia":"El color varía desde marrón rojizo muy oscuro a negro azabache. Opaca. Espuma de color desde canela profundo a marrón oscuro. Generalmente tiene una espuma de buena formación, aunque su retención puede ser de baja a moderada. El alto alcohol y la viscosidad pueden ser visibles como piernas.","Sabor":"Como el aroma, una compleja mezcla de rostizado, fruta, lúpulos y alcohol (aplican los mismos descriptores). Estos sabores pueden ser bastante intensos, a menudo más que en el aroma, pero aplica la misma advertencia respecto a la amplia variabilidad en el balance. Amargor de medio a agresivamente alto. La maltosidad otorga balance y soporte a los otros sabores, y puede tener cualidades a pan, tostadas o caramelo. El paladar y el final pueden ser de bastantes secos a moderadamente dulces, una impresión que a menudo cambia con el envejecimiento. No debería ser almibarada ni empalagosa. El retrogusto es rostizado, con amargor y tibieza alcohólica. Aplican los mismos efectos del envejecimiento descritos en el aroma.","Sensación en boca":"Cuerpo de pleno a muy pleno y “masticable”, con una textura aterciopelada y exquisita. El cuerpo y la textura pueden disminuir con el envejecimiento. Una tibieza alcohólica amable y suave debería estar presente y ser identificable, pero como un carácter en segundo plano. Carbonatación de baja a moderada.","Comentarios":"A veces conocida como Russian Imperial Stout o RIS. Existe una variedad de interpretaciones, teniendo las estadounidenses un amargor más elevado y mayor carácter rostizado y de lúpulos de adición tardía, mientras que las versiones inglesas a menudo reflejan un carácter de maltas especiales más complejo y un perfil esteroso más protagónico. No todas las Imperial Stout tienen un distintivo carácter “inglés” o “estadounidense”; cualquier interpretación entre ambos también es aceptable, por eso es contraproducente definir subestilos de manera estricta. Al juzgar, se debe ser consciente del amplio rango del estilo, e intentar no juzgar todos los ejemplos como clones de una cerveza comercial específica.","Historia":"Un estilo con una larga tradición, aunque no necesariamente continua. Tiene sus orígenes en las porter inglesas fuertes, elaboradas para exportación en el siglo XVIII, y que se dice que fueron populares en la corte imperial rusa. Después de que las guerras napoleónicas interrumpieran el comercio, estas cervezas aumentaron sus ventas en Inglaterra. El estilo eventualmente casi se extinguió, hasta que fue impulsado de manera popular en la era moderna de la cerveza artesanal; en Inglaterra como un estilo de exportación resucitado, y en Estados Unidos como una adaptación, ampliando el estilo con características típicas estadounidenses.","Ingredientes característicos":"Malta pálida con adiciones significativas de maltas o granos rostizados. Adjuntos en hojuelas son comunes. Son típicos los lúpulos y las levaduras ale estadounidenses o inglesas. Envejecen bastante bien. Ha incrementado su uso como cerveza base para varios estilos de especialidad.","Comparación de estilos":"Más oscura y rostizada que las Barleywine, pero similares en alcohol. Más compleja, con un rango más amplio de sabores posibles que las stout de menor densidad.","Estadísticas vitales":"OG: 1.075 – 1.115 IBU: 50 – 90 FG: 1.018 – 1.030 SRM: 30 – 40 ABV: 8.0 – 12.0%","Ejemplos comerciales":"Estadounidenses – Bell’s Expedition Stout, Great Divide Yeti Imperial Stout, North Coast Old Rasputin Imperial Stout, Oskar Blues Ten Fidy, Sierra Nevada Narwhal Imperial Stout; Ingleses – 2SP Brewing Co The Russian, Courage Imperial Russian Stout, Le Coq Imperial Extra Double Stout, Samuel Smith Imperial Stout, Thornbridge Saint Petersburg","Etiquetas":"intensidad-muy-alta, color-oscuro, fermentaciónalta, islas-británicas, norte-américa, estilo-tradicional, estiloartesanal, familia-stout, maltosa, amarga"},"glass_color":"#470606","srm_variable":false,"clarity":"opaca","foam_color":"#D9B183","abv_display":"8–12%","ibu_display":"50–90","srm_display":"30–40","og_display":"1.075–1.115","fg_display":"1.018–1.03","country":"Inglaterra","family":"Stout","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Más oscura y rostizada que una Barleywine.","ibu_avg":70.0,"ibu_variable":false,"abv_avg":10.0,"abv_variable":false,"summary":"Stout muy oscura y fuerte, sabores intensos a fruta oscura.","classic_example":"Estadounidenses – Bell’s Expedition Stout","foam_level":1,"foam_height":7,"srm_lo_hex":"#5e0b00","srm_hi_hex":"#030403","summary_80":"Una stout muy oscura y fuerte, de sabores intensos y con un amplio rango de interpretaciones.","distinctive_80":"Más oscura y rostizada que las Barleywine, pero similares en alcohol. Más compleja.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":2},"char_tags":["maltosa","amarga"],"ingredients_line":"Malta pálida con adiciones significativas de maltas o granos rostizados. Adjuntos en hojuelas son comunes.","ingredient_chips":["Malta pálida con adiciones…","Adjuntos en hojuelas son…"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Levadura alto","sabor_highlight":"Amargor alto","apariencia_highlight":"Opaca","boca_highlight":"Cuerpo medio","aroma_highlights":["Malta pálida con adiciones…","Son típicos los lúpulos y las…","Son típicos los lúpulos y las…"],"sabor_highlights":["Malta pálida con adiciones…","Son típicos los lúpulos y las…","Son típicos los lúpulos y las…"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Marrón","Canela","Opaca"],"ingredientes_highlights":["Malta pálida con adiciones…","Adjuntos en hojuelas son…"],"ingredient_types":{"malta":"Malta pálida con adiciones…","lupulo":"Son típicos los lúpulos y las…","levadura":"Son típicos los lúpulos y las…"}},{"code":"21A","name":"American IPA","category_num":21,"category_name":"IPA","stats":{"OG":[1.056,1.07],"FG":[1.008,1.014],"IBU":[40.0,70.0],"SRM":[6.0,14.0],"ABV":[5.5,7.5]},"fields":{"Impresión general":"Una ale estadounidense pálida, decididamente lupulada y amarga, y moderadamente fuerte. El balance está orientado al lúpulo, con un perfil de fermentación limpio, un final algo seco y una malta limpia de apoyo, permitiendo que resalte una creativa gama de carácter a lúpulo.","Aroma":"Lúpulo de prominente a intenso, a menudo dando protagonismo a características del lúpulo estadounidense o del Nuevo Mundo, como cítrico, floral, a pino, resinoso, especiado, fruta tropical, fruta de carozo, bayas o melón. Maltosidad de baja a media baja limpia y granosa, que apoya la presentación del lúpulo. Perfil de fermentación generalmente limpio, pero es aceptable una ligera frutosidad. Un alcohol discreto es opcional.","Apariencia":"Color de dorado medio a ámbar rojizo claro. Trasparente, pero se permite una ligera turbidez. Espuma mediana, de blanca a blanquecina y con buena persistencia.","Sabor":"Lúpulo de medio a muy alto (mismos descriptores que el aroma). Maltosidad de baja a media baja, limpia y granosa, posiblemente con sabores a caramelo ligero y a tostadas. Amargor de medio alto a muy alto. Final de seco a semi seco. Retrogusto lupulado y amargo, con malta de apoyo. Ésteres bajos son opcionales. Es opcional un sabor a alcohol limpio en segundo plano.","Sensación en boca":"Cuerpo de medio ligero a medio, con una textura suave. Carbonatación de media a media alta. Sin asperezas. Es opcional una calidez de alcohol suave y muy ligera.","Comentarios":"Es la base de muchas variantes modernas, incluyendo la más intensa Double IPA, como también las IPA con diversos ingredientes. Generalmente esas otras IPA deberían ser inscritas en el estilo 21B Specialty IPA. Una India Pale Lager (IPL) puede ser inscrita como una American IPA si posee un carácter similar, si no iría en 34B Mixed-Style Beer. El roble es inapropiado en este estilo; si es perceptible, se debe inscribir en 33A Wood-Aged Beer. Los ejemplos transparentes, secos e intensamente amargos a veces se conocen como West Coast IPA, que en realidad solo es un tipo de American IPA.","Historia":"En general, se cree que la primera adaptación moderna que hizo la cerveza artesanal estadounidense de este tradicional estilo inglés, fue la Anchor Liberty Ale, elaborada por primera vez en 1975 usando lúpulos Cascade en flor; el estilo ha evolucionado más allá de esa cerveza original, que actualmente sabe más como una American Pale Ale en comparación. Se conocen IPA elaboradas en Estados Unidos en épocas anteriores (particularmente la reconocida Ballantine’s IPA, una cerveza envejecida en roble basada en una antigua receta inglesa). Este estilo está basado en los ejemplos artesanales modernos.","Ingredientes característicos":"Malta base pálida. Levadura estadounidense o inglesa, de perfil limpio o levemente afrutado. Generalmente “todo malta”, pero son aceptables las adiciones de azúcar. Uso discreto de maltas Crystal. A menudo son utilizados lúpulos estadounidenses o del Nuevo Mundo, 40 pero cualquier variedad es aceptable; nuevas variedades de lúpulo son lanzadas continuamente al mercado, y pueden ser utilizadas incluso si no poseen los perfiles sensoriales anteriormente descritos.","Comparación de estilos":"Más fuerte y más altamente lupulada que una American Pale Ale. Comparada con una English IPA, posee menos carácter a caramelo, a pan y a tostadas; a menudo más lúpulos estadounidenses o del Nuevo Mundo; menos ésteres derivados de la levadura; menos cuerpo y a menudo un balance más lupulado; y es levemente más fuerte que la mayoría de los ejemplos. Menos alcohol que una Double IPA, pero con un balance similar.","Estadísticas vitales":"OG: 1.056 – 1.070 IBU: 40 – 70 FG: 1.008 – 1.014 SRM: 6 – 14 ABV: 5.5 – 7.5%","Ejemplos comerciales":"Bell’s Two-Hearted Ale, Cigar City Jai Alai, Fat Heads Head Hunter IPA, Firestone Walker Union Jack, Maine Lunch, Russian River Blind Pig IPA","Etiquetas":"intensidad-alta, color-pálido, fermentación-alta, norte-américa, estilo-artesanal, familia-ipa, amarga"},"glass_color":"#de7c00","srm_variable":false,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"5.5–7.5%","ibu_display":"40–70","srm_display":"6–14","og_display":"1.056–1.07","fg_display":"1.008–1.014","country":"Estados Unidos","family":"IPA","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Más fuerte que una American Pale Ale, menos que una Double IPA.","ibu_avg":55.0,"ibu_variable":false,"abv_avg":6.5,"abv_variable":false,"summary":"Ale estadounidense pálida, decididamente lupulada y amarga.","classic_example":"Bell’s Two-Hearted Ale","foam_level":1,"foam_height":7,"srm_lo_hex":"#f8a600","srm_hi_hex":"#c35900","summary_80":"Una ale estadounidense pálida, decididamente lupulada y amarga, y moderadamente fuerte.","distinctive_80":"Más fuerte y más altamente lupulada que una American Pale Ale.","mini_profile":{"malta":2,"lupulo":4,"cuerpo":2,"carbonatacion":3},"char_tags":["amarga"],"ingredients_line":"Malta base pálida. Levadura estadounidense o inglesa, de perfil limpio o levemente afrutado.","ingredient_chips":["Malta base pálida","Levadura estadounidense o…"],"balance_pos":3.0,"balance_malta":2,"balance_lupulo":4,"aroma_highlight":"Lúpulo alto","sabor_highlight":"Lúpulo muy alto","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta base pálida","Levadura estadounidense o…"],"sabor_highlights":["Malta base pálida","Levadura estadounidense o…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Dorado","Blanquecina","Translúcida"],"ingredientes_highlights":["Malta base pálida","Levadura estadounidense o…"],"ingredient_types":{"malta":"Malta base pálida","levadura":"Levadura estadounidense o…"}},{"code":"21B","name":"Specialty IPA","category_num":21,"category_name":"IPA","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":[3.0,5.0]},"fields":{"Impresión general":"Reconocible como una IPA por su balance (una cerveza orientada al lúpulo, amarga y algo seca) con la presencia de algo adicional para distinguirse de las categorías estándar. Debería contar con una buena tomabilidad, independientemente de cómo sea la cerveza. Una excesiva aspereza y pesadez son típicamente defectos, así como los choques de sabor fuertes entre los lúpulos y los otros ingredientes especiales.","Aroma":"Se requiere un aroma a lúpulo detectable; el carácter de los lúpulos depende del tipo específico de Specialty IPA. Otros aromas pueden estar presentes; típicamente el lúpulo es el elemento más intenso.","Apariencia":"El color depende del tipo específico de Specialty IPA. La mayoría debería ser traslúcida, pero una leve turbidez es aceptable en muchos de los estilos. Los tipos más oscuros pueden ser opacos, haciendo irrelevante la claridad. Espuma buena y persistente, con un color que depende del tipo específico de Specialty IPA.","Sabor":"Variable según el tipo, con la cualidad de cada componente dependiendo de la Specialty IPA específica. Comúnmente lúpulo de medio bajo a alto. Amargor de lúpulo típicamente de medio alto a muy alto. Malta, por lo general, de baja a media. Es común un final de seco a semi seco. Se puede notar algo de sabor a alcohol limpio en las versiones más fuertes. Varios tipos de Specialty IPA pueden mostrar características adicionales a malta y a levadura, dependiendo del tipo.","Sensación en boca":"Suave. Cuerpo de medio ligero a medio. Generalmente carbonatación media. Una calidez de alcohol en segundo plano puede ser percibida en las versiones más fuertes.","Comentarios":"Quienes inscriban pueden usar esta categoría para una versión de diferente intensidad de una IPA definida en su propia subcategoría BJCP (p. ej.: American o English IPA de bajo alcohol o session); excepto cuando ya existe una subcategoría BJCP para ese estilo (p. ej.: Double [American] IPA). Una Session IPA corresponde a una 21B Specialty IPA con estilo base 21A American IPA y de bajo alcohol (Session). Una Double IPA pertenece a la categoría 22A, no 21B.","Instrucciones para la inscripción":"Quien inscriba debe especificar una intensidad de alcohol (baja, estándar, doble); si no se indica una intensidad, será asumida como estándar. La inscripción debe especificar un tipo particular de Specialty IPA de la lista de tipos actualmente definidos identificados en la Guía de Estilos, o de los propuestos en los Estilos Provisionales en el sitio web del BJCP; o la inscripción debe describir el tipo de Specialty IPA y sus características clave en forma de comentario, para que quienes juzgan sepan qué esperar. Quienes inscriban pueden indicar las variedades de lúpulo específicas utilizadas, si consideran que quienes juzgan podrían no reconocer las características de variedades de lúpulos más nuevas. Quienes inscriban pueden especificar una combinación de tipos definidos de IPA (p. ej.: Black Rye IPA) sin aportar descripciones adicionales. Tipos actualmente definidos: Belgian IPA, Black IPA, Brown IPA, Red IPA, Rye IPA, White IPA, Brut IPA","Estadísticas vitales":"Variables según el tipo, revise los estilos individuales. Clasificación por intensidad de alcohol: Baja – ABV: 3.0 – 5.0% Estándar – ABV: 5.0 – 7.5% Doble – ABV: 7.5 – 10.0% Specialty IPA: Belgian IPA","Etiquetas":""},"glass_color":"#f8a600","srm_variable":true,"clarity":"opaca","foam_color":"#F5F1E6","abv_display":"3–5%","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Estados Unidos","family":"IPA","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"El extra depende de la variante: Belgian, Black, Rye IPA, etc.","ibu_avg":50,"ibu_variable":true,"abv_avg":4.0,"abv_variable":false,"summary":"IPA con algo adicional (ingrediente o técnica) que la distingue.","classic_example":null,"foam_level":2,"foam_height":10,"srm_lo_hex":"#f8a600","srm_hi_hex":"#f8a600","summary_80":"Reconocible como una IPA por su balance (una cerveza orientada al lúpulo.","distinctive_80":"El extra depende de la variante: Belgian, Black, Rye IPA, etc.","mini_profile":{"malta":2,"lupulo":4,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"","ingredient_chips":[],"balance_pos":3.0,"balance_malta":2,"balance_lupulo":4,"aroma_highlight":"Lúpulo alto","sabor_highlight":"Lúpulo muy alto","apariencia_highlight":"Opaca","boca_highlight":"Cuerpo medio","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Oscuro","Opaca"],"ingredientes_highlights":[],"ingredient_types":{}},{"code":"21C","name":"Hazy IPA","category_num":21,"category_name":"IPA","stats":{"OG":[1.06,1.085],"FG":[1.01,1.015],"IBU":[25.0,60.0],"SRM":[3.0,7.0],"ABV":[6.0,9.0]},"fields":{"Impresión general":"Una American IPA con intensos sabores y aromas a frutas, un cuerpo suave, sensación en boca sedosa, y a menudo opaca con una turbidez considerable. Con menos amargor percibido que las IPA tradicionales, pero siempre extremadamente orientada al lúpulo.","Aroma":"Lúpulo intenso, con cualidades a fruta de carozo, fruta tropical, cítrico u otras; no a pasto/césped o herbáceo. La malta es limpia, neutra, granosa o ligeramente a pan, y en segundo plano; no a caramelo ni a tostadas. La ausencia de algún carácter a malta es un defecto. Perfil de fermentación de neutro a afrutado. Los ésteres de levadura y lúpulo no deberían chocar. Un aroma a crema, mantequilla o ácido es inapropiado. Ligero aroma a alcohol opcional.","Apariencia":"Color de pajizo a ámbar muy claro, a veces con un tono anaranjado. Turbia, a menudo opaca; no debería ser brumosa o tener una turbidez sucia. La opacidad puede añadir como una especie de brillo a la cerveza y hacer que el color parezca más oscuro. Cualquier materia de lúpulo flotante visible, grumos de levadura u otras partículas, son un defecto. Espuma blanca de media a “rocosa” y similar al merengue, con retención de alta a muy alta.","Sabor":"Lúpulo afrutado de alto a muy alto, con los mismos descriptores que el aroma. Malta de baja a media, con los mismos descriptores que el aroma. Amargor percibido de bajo a medio alto, a menudo oculto tras el cuerpo más pleno, y un final suave de prácticamente seco a medio. En el retrogusto el carácter del lúpulo no debería ser áspero o cortante. Perfil de fermentación de neutro a afrutado, que da apoyo a los lúpulos. No debería ser dulce, aunque a veces los altos niveles de ésteres y el menor amargor pueden dar esa impresión. Un sabor a alcohol en segundo plano es opcional.","Sensación en boca":"Cuerpo de medio a medio pleno. Carbonatación media. Suave. Sin asperezas. Ligera tibieza alcohólica opcional. La cerveza no debería tener una sensación cremosa o viscosa, un toque ácido, o una textura a almidón crudo.","Comentarios":"También conocida como New England IPA o NEIPA. El énfasis en la adición tardía de lúpulos, especialmente en dry hopping, con lúpulos de cualidades a fruta tropical, da el carácter “jugoso” por el cual este estilo es conocido. Los ejemplos espesos que recuerdan a batidos/malteadas (milkshakes), creamsicles (Nota de la Traducción: helados de paleta sabor naranja con centro cremoso sabor a vainilla), o batidos de frutas (smoothies) están fuera de este estilo; las IPA siempre deberían tener tomabilidad. La turbidez proviene del dry hopping, no de levadura en suspensión, turbidez del almidón u otras técnicas; es deseable una turbidez brillante, no un revoltijo brumoso y de turbidez sucia.","Historia":"Un estilo de cerveza artesanal moderno, originado en la región de Nueva Inglaterra en Estados Unidos como una variante de American IPA. Se cree que la cerveza Heady Topper de The Alchemist fue la inspiración original a medida que el estilo creció en popularidad durante la década de 2010. El estilo continúa evolucionando, incluyendo una tendencia hacia un menor amargor y el uso del estilo como base para otras adiciones.","Ingredientes característicos":"Listado de granos como en una American IPA, pero con más cereales en hojuelas y menos maltas Caramelo o especiales. Lúpulos estadounidenses o del Nuevo Mundo con características afrutadas. Levadura de neutra a esterosa. Agua de balanceada a rica en cloruros. Con un dry hopping intenso, parcialmente durante la fermentación activa, utilizando diversas dosis y temperaturas de adición de lúpulo para enfatizar la profundidad del aroma y sabor del lúpulo por encima del amargor. La biotransformación de los aceites del lúpulo durante la fermentación contribuye a la profundidad y complejidad afrutada.","Comparación de estilos":"Tiene una sensación en boca más suave y plena, una mayor expresión afrutada del lúpulo de adición tardía, un balance hacia un amargor percibido más discreto, y una apariencia más turbia que una American IPA. Muchas American IPA modernas son afrutadas y algo turbias; los ejemplos con un final seco y crisp, hasta cuerpo medio y con un amargor percibido alto, deberían ser inscritos como 21A American IPA. Los ejemplos con adiciones notorias de fruta, lactosa, vainilla, etc. para aumentar el carácter suave y afrutado, deberían ser inscritos en una categoría de especialidad definida por los aditivos (p. ej.: 29A Fruit Beer, 29C Specialty Fruit Beer, 30D Specialty Spice Beer).","Estadísticas vitales":"OG: 1.060 – 1.085 IBU: 25 – 60 FG: 1.010 – 1.015 SRM: 3 – 7 ABV: 6.0 – 9.0%","Ejemplos comerciales":"Belching Beaver Hazers Gonna Haze, Hill Farmstead Susan, Other Half Green Diamonds Double IPA, Pinthouse Electric Jellyfish, Tree House Julius, Trillium Congress Street, WeldWerks Juicy Bits","Etiquetas":"intensidad-alta, color-pálido, fermentación-alta, norte-américa, estilo-artesanal, familia-ipa, amarga"},"glass_color":"#fbb123","srm_variable":false,"clarity":"opaca","foam_color":"#F7F4EC","abv_display":"6–9%","ibu_display":"25–60","srm_display":"3–7","og_display":"1.06–1.085","fg_display":"1.01–1.015","country":"Estados Unidos","family":"IPA","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Más turbia y afrutada que una American IPA.","ibu_avg":42.5,"ibu_variable":false,"abv_avg":7.5,"abv_variable":false,"summary":"American IPA muy frutal, turbia y de cuerpo suave.","classic_example":"Belching Beaver Hazers Gonna Haze","foam_level":3,"foam_height":14,"srm_lo_hex":"#ffca5a","srm_hi_hex":"#f39c00","summary_80":"Una American IPA con intensos sabores y aromas a frutas, un cuerpo suave, sensación en boca sedosa, y a menudo opaca con una turbidez considerable.","distinctive_80":"Tiene una sensación en boca más suave y plena, una mayor expresión afrutada del lúpulo de adición tardía.","mini_profile":{"malta":2,"lupulo":4,"cuerpo":2,"carbonatacion":2},"char_tags":["amarga"],"ingredients_line":"Listado de granos como en una American IPA, pero con más cereales en hojuelas y menos maltas Caramelo o especiales.","ingredient_chips":["Listado de granos como en una…","Lúpulos estadounidenses o del…"],"balance_pos":3.0,"balance_malta":2,"balance_lupulo":4,"aroma_highlight":"Lúpulo alto","sabor_highlight":"Lúpulo muy alto","apariencia_highlight":"Opaca","boca_highlight":"Cuerpo medio","aroma_highlights":["Listado de granos como en una…","Lúpulos estadounidenses o del…","Levadura de neutra a esterosa"],"sabor_highlights":["Listado de granos como en una…","Lúpulos estadounidenses o del…","Levadura de neutra a esterosa"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Pajizo","Rocosa","Opaca"],"ingredientes_highlights":["Listado de granos como en una…","Lúpulos estadounidenses o del…"],"ingredient_types":{"malta":"Listado de granos como en una…","lupulo":"Lúpulos estadounidenses o del…","levadura":"Levadura de neutra a esterosa"}},{"code":"22A","name":"Double IPA","category_num":22,"category_name":"Strong American Ale","stats":{"OG":[1.065,1.085],"FG":[1.008,1.018],"IBU":[60.0,100.0],"SRM":[6.0,14.0],"ABV":[7.5,10.0]},"fields":{"Impresión general":"Una ale pálida intensamente lupulada, amarga y bastante fuerte, sin la maltosidad intensa, sabrosa y compleja, el dulzor residual y el cuerpo de una American Barleywine. Fuertemente lupulada, pero limpia, seca y carente de asperezas. A pesar de exhibir su intensidad de alcohol, la tomabilidad debe ser una consideración importante.","Aroma":"Lúpulo de prominente a intenso, típicamente presentando características de lúpulo estadounidense o del Nuevo Mundo como cítrico, floral, pino, resina, especias, fruta tropical, fruta de carozo, bayas o melón. Maltosidad de apoyo, limpia, de neutra a granosa, que puede aparecer en segundo plano. Perfil de fermentación de neutro a ligeramente afrutado. El alcohol puede ser percibido, pero no debería tener un carácter similar al solvente.","Apariencia":"Color de dorado a cobrizo anaranjado claro, pero la mayoría de las versiones modernas son bastante pálidas. Buena claridad, aunque un poco de turbidez es aceptable. Espuma moderada, persistente, con color de blanca a blanquecina.","Sabor":"Lúpulo fuerte y complejo (con los mismos descriptores que el aroma). Amargor de moderadamente alto a muy alto, pero no debería ser áspero. Maltosidad de baja a media de apoyo, con carácter limpio, suave y discreto; puede tener ligeros sabores a caramelo o a tostadas. Final de seco a semi seco, no dulce o pesado, con un retrogusto persistente amargo y lupulado. Frutosidad de baja a moderada opcional. Un sabor a alcohol ligero, limpio y suave está permitido.","Sensación en boca":"Cuerpo de medio ligero a medio, con una textura suave. Carbonatación de media a media alta. Sin astringencia áspera derivada del lúpulo. Es aceptable una tibieza alcohólica discreta y suave.","Comentarios":"Llamada Imperial IPA con poca frecuencia. Muchas versiones modernas poseen múltiples adiciones de dry hop.","Historia":"Una innovación de la cerveza artesanal estadounidense desarrollada por primera vez entre mediados y fines de la década de 1990, como una versión más intensa de la American IPA. Se volvió más común y popular a lo largo de la década de los 2000, e inspiró una creatividad adicional en torno a la IPA. Pliny the Elder de Russian River, elaborada por primera vez en el año 2000, ayudó a popularizar el estilo.","Ingredientes característicos":"Malta base neutra. Son frecuentes los adjuntos de azúcar. Maltas Crystal son poco comunes. Lúpulos estadounidenses o del Nuevo Mundo. Levadura neutra o ligeramente afrutada. Sin roble.","Comparación de estilos":"Con mayor intensidad de alcohol, amargor y lupulado que las English y American IPA. Con menos riqueza de malta, menos cuerpo, más seca y con un mayor balance general hacia el lúpulo que una American Barleywine.","Estadísticas vitales":"OG: 1.065 – 1.085 IBU: 60 – 100 FG: 1.008 – 1.018 SRM: 6 – 14 ABV: 7.5 – 10.0%","Ejemplos comerciales":"Columbus Brewing Bohdi, Fat Head’s Hop Juju, Port Brewing Hop-15, Russian River Pliny 46 the Elder, Stone Ruination Double IPA 2.0, Wicked Weed Freak of Nature","Etiquetas":"intensidad-muy-alta, color-pálido, fermentaciónalta, norte-américa, estilo-artesanal, familia-ipa, amarga"},"glass_color":"#de7c00","srm_variable":false,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"7.5–10%","ibu_display":"60–100","srm_display":"6–14","og_display":"1.065–1.085","fg_display":"1.008–1.018","country":"Estados Unidos","family":"IPA","glass_shape":"snifter","glass_label":"Copa snifter","distinctive":"Más lúpulo que una IPA; más seca que una American Barleywine.","ibu_avg":80.0,"ibu_variable":false,"abv_avg":8.8,"abv_variable":false,"summary":"Ale pálida intensamente lupulada y amarga, bastante fuerte.","classic_example":"Columbus Brewing Bohdi","foam_level":2,"foam_height":10,"srm_lo_hex":"#f8a600","srm_hi_hex":"#c35900","summary_80":"Una ale pálida intensamente lupulada, amarga y bastante fuerte, sin la maltosidad intensa, sabrosa y compleja.","distinctive_80":"Con mayor intensidad de alcohol, amargor y lupulado que las English y American IPA. Con menos riqueza de malta, menos cuerpo.","mini_profile":{"malta":2,"lupulo":3,"cuerpo":2,"carbonatacion":3},"char_tags":["amarga"],"ingredients_line":"Malta base neutra. Son frecuentes los adjuntos de azúcar. Maltas Crystal son poco comunes.","ingredient_chips":["Malta base neutra","Son frecuentes los adjuntos…"],"balance_pos":2.5,"balance_malta":2,"balance_lupulo":3,"aroma_highlight":"Lúpulo alto","sabor_highlight":"Amargor muy alto","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta base neutra","Lúpulos estadounidenses o del…","Levadura neutra o ligeramente…"],"sabor_highlights":["Malta base neutra","Lúpulos estadounidenses o del…","Levadura neutra o ligeramente…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Dorado","Blanquecina","Translúcida"],"ingredientes_highlights":["Malta base neutra","Son frecuentes los adjuntos…"],"ingredient_types":{"malta":"Malta base neutra","lupulo":"Lúpulos estadounidenses o del…","levadura":"Levadura neutra o ligeramente…"}},{"code":"22B","name":"American Strong Ale","category_num":22,"category_name":"Strong American Ale","stats":{"OG":[1.062,1.09],"FG":[1.014,1.024],"IBU":[50.0,100.0],"SRM":[7.0,18.0],"ABV":[6.3,10.0]},"fields":{"Impresión general":"Una ale estadounidense maltosa, amarga y fuerte, que encaja en el espacio entre las American Barleywine, Double IPA y Red IPA. Los sabores maltosos y lupulados pueden ser bastante fuertes, pero generalmente están balanceados.","Aroma":"Lúpulo de medio a alto, típicamente presentando características de lúpulo estadounidense o del Nuevo Mundo como cítrico, floral, pino, resinoso, especiado, fruta tropical, fruta de carozo, bayas o melón. Maltosidad de moderada a fuerte, de apoyo al perfil del lúpulo, comúnmente con caramelo de medio a oscuro, posiblemente con carácter tostado o a pan, y con ligeras notas a rostizado o chocolate permitidas en segundo plano. Perfil de fermentación de neutro a moderadamente afrutado. El alcohol puede ser percibido, pero no debería tener un carácter similar al solvente.","Apariencia":"Color de ámbar medio a cobrizo profundo o marrón claro. Espuma de moderadamente baja a media, con color de blanquecino a canela claro; puede tener baja retención. Buena claridad. Es posible que se observen piernas.","Sabor":"Maltosidad de media a alta, con una cualidad a caramelo, toffee o fruta oscura. La complejidad de malta puede incluir adicionalmente sabores de apoyo tostados, sabrosos o a pan. Se permite un ligero chocolate o rostizado, pero no debería ser punzante o quemado. Amargor de medio alto a alto. Lúpulo de moderado a alto, con los mismos descriptores que en el aroma. Ésteres de bajos a moderados. Un sabor a alcohol puede ser perceptible, pero no debe ser punzante. En el paladar posee un dulzor maltoso de medio a alto, con un final de semi seco a semi dulce. No debería ser almibarada, dulce o empalagosa. Retrogusto de amargo a semi amargo, con lúpulos, malta y alcohol perceptibles.","Sensación en boca":"Cuerpo de medio a pleno. Puede estar presente una tibieza alcohólica, pero no debería ser excesivamente quemante. Se permite una ligera astringencia de lúpulo. Carbonatación de media baja a media.","Comentarios":"Un estilo bastante amplio que describe cervezas etiquetadas de varias formas, incluyendo las modernas Double Red Ale y otras cervezas fuertes que son maltosas a la vez que lupuladas, pero que no están del todo dentro de la clase Barleywine. Suficientemente diversa como para incluir la que puede considerarse como una American Amber Ale fuerte, con espacio para versiones más fuertes de otras ales del tipo American.","Historia":"A pesar de que las versiones artesanales modernas fueron desarrolladas como variantes de ales estadounidenses ámbar o rojas pero con intensidad “imperial”, este estilo tiene mucho en común con las históricas American Stock Ale (ales de guarda estadounidenses). Antes de la Prohibición, las cervezas fuertes y maltosas eran altamente lupuladas para conservarlas como cervezas de provisión. No existe un legado continuo de elaboración de ales de guarda de esta manera, pero la similitud es considerable (aunque sin el carácter del envejecimiento).","Ingredientes característicos":"Malta base pálida. Maltas Crystal de medias a oscuras son comunes. Lúpulos estadounidenses o del Nuevo Mundo. Levadura neutra o ligeramente afrutada.","Comparación de estilos":"Generalmente no tan fuerte e intensa como una American Barleywine. Más balance hacia la malta que una American o Double IPA. Más intensidad de lúpulo estadounidense que en una British Strong Ale. Más maltosa y de cuerpo más pleno que una Red IPA.","Estadísticas vitales":"OG: 1.062 – 1.090 IBU: 50 – 100 FG: 1.014 – 1.024 SRM: 7 – 18 ABV: 6.3 – 10.0%","Ejemplos comerciales":"Arrogant Bastard Ale, Fat Head’s Bone Head, Great Lakes Nosferatu, Oskar Blues G’Knight, Port Brewing Shark Attack Double Red Ale","Etiquetas":"intensidad-alta, color-ámbar, fermentación-alta, norte-américa, estilo-artesanal, familia-ale-fuerte, amarga"},"glass_color":"#cd6600","srm_variable":false,"clarity":"traslucida","foam_color":"#D9B183","abv_display":"6.3–10%","ibu_display":"50–100","srm_display":"7–18","og_display":"1.062–1.09","fg_display":"1.014–1.024","country":"Estados Unidos","family":"Strong Ale","glass_shape":"snifter","glass_label":"Copa snifter","distinctive":"Entre la Barleywine, la Double IPA y la Red IPA.","ibu_avg":75.0,"ibu_variable":false,"abv_avg":8.2,"abv_variable":false,"summary":"Ale estadounidense maltosa, amarga y fuerte.","classic_example":"Arrogant Bastard Ale","foam_level":0,"foam_height":4,"srm_lo_hex":"#f39c00","srm_hi_hex":"#a63e00","summary_80":"Una ale estadounidense maltosa, amarga y fuerte, que encaja en el espacio entre las American Barleywine, Double IPA y Red IPA.","distinctive_80":"Generalmente no tan fuerte e intensa como una American Barleywine. Más balance hacia la malta que una American o Double IPA.","mini_profile":{"malta":3,"lupulo":3,"cuerpo":2,"carbonatacion":2},"char_tags":["amarga"],"ingredients_line":"Malta base pálida. Maltas Crystal de medias a oscuras son comunes. Lúpulos estadounidenses o del Nuevo Mundo.","ingredient_chips":["Malta base pálida","Maltas Crystal de medias a…"],"balance_pos":2.0,"balance_malta":3,"balance_lupulo":3,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":["Malta base pálida","Lúpulos estadounidenses o del…","Levadura neutra o ligeramente…"],"sabor_highlights":["Malta base pálida","Lúpulos estadounidenses o del…","Levadura neutra o ligeramente…"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Ámbar","Canela","Translúcida"],"ingredientes_highlights":["Malta base pálida","Maltas Crystal de medias a…"],"ingredient_types":{"malta":"Malta base pálida","lupulo":"Lúpulos estadounidenses o del…","levadura":"Levadura neutra o ligeramente…"}},{"code":"22C","name":"American Barleywine","category_num":22,"category_name":"Strong American Ale","stats":{"OG":[1.08,1.12],"FG":[1.016,1.03],"IBU":[50.0,100.0],"SRM":[9.0,18.0],"ABV":[8.0,12.0]},"fields":{"Impresión general":"Una ale estadounidense muy fuerte, maltosa, lupulada y amarga, con un paladar rico, sensación en boca plena y un retrogusto cálido, adecuada para tomar contemplativamente a sorbos.","Aroma":"Domina un fuerte aroma a malta y lúpulo. Lúpulos de moderados a intensos, mostrando un rango de características estadounidenses, del Nuevo Mundo o inglesas. Los atributos clásicos son cítricos, afrutados o resinosos, pero otros son posibles incluyendo aquellos propios de lúpulos modernos. Riqueza de malta fuerte, con carácter granoso, a pan, tostado, a caramelo claro o neutro, pero típicamente sin notas a caramelo más oscuro, rostizado ni afrutado profundo. Ésteres y alcohol de bajos a moderadamente fuertes, por debajo de la malta y los lúpulos en el balance. Las intensidades disminuyen con el envejecimiento.","Apariencia":"Color de ámbar a cobrizo medio, raramente llega a marrón claro. Son comunes reflejos rubíes. Espuma de moderadamente baja a voluminosa, con color de blanquecino a canela claro; puede tener baja retención. Claridad de buena a brillante, pero puede poseer algo de turbidez producida a baja temperatura (chill haze). El color puede parecer que posee una gran profundidad, como si se viera a través de un lente de vidrio grueso. Es posible que se observen piernas.","Sabor":"Malta y lúpulo similares al aroma (aplican los mismos descriptores). Amargor de moderadamente fuerte a agresivo, suavizado por un paladar rico y maltoso. Lúpulo de moderado a alto. Ésteres de bajos a moderados. Alcohol perceptible, pero sin carácter similar al solvente. Presenta dulzor de malta en el paladar de moderadamente bajo a moderadamente alto, con un final de algo maltoso a seco, pero pleno. El envejecimiento a menudo la hará más seca y suavizará los sabores. El balance es hacia la malta, pero siempre es amarga.","Sensación en boca":"Cuerpo pleno y “masticable”, con una textura aterciopelada y exquisita, que se reduce con el envejecimiento. Debería percibirse una suave tibieza alcohólica, pero no debería quemar. La carbonatación puede ser de baja a moderada, dependiendo del envejecimiento y el acondicionamiento.","Comentarios":"A veces etiquetada como “Barley Wine” o “Barleywine-style Ale”. Pareciera que muchas cervecerías estadounidenses recientemente han discontinuado sus Barleywine, las han envejecido en barrica, o las han renombrado como alguna versión de IPA.","Historia":"Tradicionalmente era la ale más fuerte ofrecida por una cervecería, a menudo asociada con la temporada de invierno y fechada como un producto de reserva. Al igual que muchos estilos de cerveza artesanal de Estados Unidos, es una adaptación de un estilo inglés con un balance e ingredientes estadounidenses. Una de las primeras versiones artesanales estadounidenses fue la Anchor Old Foghorn, elaborada por primera vez en 1975. La Sierra Nevada Bigfoot, elaborada por primera vez en 1983, estableció el estándar para el estilo actual orientado al lúpulo. La historia cuenta que cuando Sierra Nevada envió la Bigfoot para análisis de laboratorio por primera vez, el laboratorio les llamó y dijo: “Su Barleywine es demasiado amarga”, a lo que Sierra Nevada contestó: “Gracias”.","Ingredientes característicos":"Malta pálida con algunas maltas especiales. Maltas oscuras usadas con gran mesura. Pueden ser utilizados lúpulos de muchas variedades, pero usualmente incluye lúpulos estadounidenses. Levadura ale estadounidense o inglesa.","Comparación de estilos":"Mayor énfasis en el amargor, el sabor y el aroma del lúpulo que en una English Barley Wine, a menudo presentando variedades de lúpulo norteamericano. Por lo general, más pálidas que las English Barley Wine más oscuras y sin sus sabores a malta más profundos, pero más oscura que las English Barley Wine doradas. Se diferencia de una Double IPA en que los lúpulos no son extremos, la malta es más protagónica, y el cuerpo es más pleno y a menudo más sabroso. La American Barleywine típicamente posee más dulzor residual que la Double IPA, lo que afecta su tomabilidad general (sorbos vs. tragos).","Estadísticas vitales":"OG: 1.080 – 1.120 IBU: 50 – 100 FG: 1.016 – 1.030 SRM: 9 – 18 ABV: 8.0 – 12.0%","Ejemplos comerciales":"Anchor Old Foghorn, Bell’s Third Coast Old Ale, East End Gratitude, Hair of the Dog Doggie Claws, Sierra Nevada Bigfoot","Etiquetas":"intensidad-muy-alta, color-ámbar, fermentaciónalta, norte-américa, estilo-artesanal, familia-ale-fuerte, amarga"},"glass_color":"#c75e00","srm_variable":false,"clarity":"brillante","foam_color":"#D9B183","abv_display":"8–12%","ibu_display":"50–100","srm_display":"9–18","og_display":"1.08–1.12","fg_display":"1.016–1.03","country":"Estados Unidos","family":"Strong Ale","glass_shape":"snifter","glass_label":"Copa snifter","distinctive":"Más lúpulo que una English Barley Wine, más cuerpo que una Double IPA.","ibu_avg":75.0,"ibu_variable":false,"abv_avg":10.0,"abv_variable":false,"summary":"Ale estadounidense muy fuerte, maltosa y lupulada.","classic_example":"Anchor Old Foghorn","foam_level":0,"foam_height":4,"srm_lo_hex":"#e58500","srm_hi_hex":"#a63e00","summary_80":"Una ale estadounidense muy fuerte, maltosa, lupulada y amarga, con un paladar rico, sensación en boca plena y un retrogusto cálido.","distinctive_80":"Mayor énfasis en el amargor, el sabor y el aroma del lúpulo que en una English Barley Wine, a menudo presentando variedades de lúpulo norteamericano.","mini_profile":{"malta":3,"lupulo":3,"cuerpo":2,"carbonatacion":2},"char_tags":["amarga"],"ingredients_line":"Malta pálida con algunas maltas especiales. Maltas oscuras usadas con gran mesura.","ingredient_chips":["Malta pálida con algunas…","Maltas oscuras usadas con…"],"balance_pos":2.0,"balance_malta":3,"balance_lupulo":3,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Brillante","boca_highlight":"Cuerpo medio","aroma_highlights":["Malta pálida con algunas maltas…","Levadura ale estadounidense o…"],"sabor_highlights":["Malta pálida con algunas maltas…","Levadura ale estadounidense o…"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Ámbar","Voluminosa","Brillante"],"ingredientes_highlights":["Malta pálida con algunas…","Maltas oscuras usadas con…"],"ingredient_types":{"malta":"Malta pálida con algunas maltas…","levadura":"Levadura ale estadounidense o…"}},{"code":"22D","name":"Wheatwine","category_num":22,"category_name":"Strong American Ale","stats":{"OG":[1.08,1.12],"FG":[1.016,1.03],"IBU":[30.0,60.0],"SRM":[6.0,14.0],"ABV":[8.0,12.0]},"fields":{"Impresión general":"Una cerveza de textura exquisita, alta en alcohol, para tomar a sorbos, con un significativo sabor granoso y a pan, junto con un cuerpo sedoso. El énfasis está primero en los sabores a pan y a trigo, con la malta, los lúpulos, la levadura afrutada y el alcohol aportando complejidad.","Aroma":"Lúpulo suave, que puede representar casi cualquier variedad. Maltosidad de moderada a moderadamente fuerte, con carácter a pan y a trigo, a menudo con una complejidad de malta adicional como a miel y caramelo. Puede ser percibido un alcohol ligero y limpio. Notas afrutadas de bajas a medias pueden ser evidentes. Es opcional un muy bajo diacetilo. El carácter de levadura Weizen a plátano/banana y a clavo de olor es inapropiado.","Apariencia":"Color de dorado a ámbar profundo, a menudo con reflejos granate o rubí. Espuma blanquecina de baja a 47 media, que puede tener una textura cremosa y buena retención. Se permite una turbidez producida a baja temperatura (chill haze), pero usualmente se clarifica a medida que la cerveza se entibia. El alto alcohol y la viscosidad pueden ser visibles como piernas.","Sabor":"Malta de trigo de moderada a moderadamente alta, con carácter a pan, que domina en el balance de sabor por encima de cualquier carácter a lúpulo. Maltosidad de baja a moderada, con notas tostadas, a caramelo, galleta o miel que pueden añadir una complejidad que es bienvenida, pero no obligatoria. Lúpulo de bajo a medio, reflejando cualquier variedad. Frutosidad de moderada a moderadamente alta, a menudo con carácter a fruta deshidratada. Amargor de bajo a moderado, creando un balance de maltoso a equilibrado. No debería ser almibarada o estar subatenuada.","Sensación en boca":"Cuerpo de medio pleno a pleno. “Masticable”, a menudo con una textura aterciopelada y exquisita. Carbonatación de baja a moderada. Es opcional una tibieza alcohólica de ligera a moderada.","Comentarios":"La mayor parte del color proviene de un hervor prolongado. Algunos ejemplos comerciales pueden ser más fuertes que lo indicado en las estadísticas vitales.","Historia":"Un estilo de cerveza artesanal estadounidense que fue elaborado por primera vez por Rubicon Brewing Company 48 en 1988. Usualmente es un lanzamiento de temporada de invierno, tipo reserva o único (one-off).","Ingredientes característicos":"Elaborada típicamente con una combinación de malta de dos hileras y de trigo estadounidenses. Comúnmente se utiliza un 50% o más de trigo malteado. Uso discreto de maltas oscuras. Lúpulos de cualquier variedad pueden ser utilizados. Puede estar envejecida en roble.","Comparación de estilos":"Más que una simple Barleywine con base de trigo, muchas versiones cuentan con notas muy expresivas afrutadas y lupuladas, mientras que otras desarrollan complejidad mediante el envejecimiento en roble. Menos énfasis en los lúpulos que una American Barleywine. Tiene su origen en la American Wheat Beer en vez de cualquier estilo de trigo alemán, por lo que no debería tener ningún carácter a levadura Weizen.","Estadísticas vitales":"OG: 1.080 – 1.120 IBU: 30 – 60 FG: 1.016 – 1.030 SRM: 6 – 14 ABV: 8.0 – 12.0%","Ejemplos comerciales":"The Bruery White Oak, Castelain Winter Ale, Perennial Heart of Gold, Two Brothers Bare Tree","Etiquetas":"intensidad-muy-alta, color-ámbar, fermentaciónalta, norte-américa, estilo-artesanal, familia-ale-fuerte, familiacerveza-trigo, balanceada"},"glass_color":"#de7c00","srm_variable":false,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"8–12%","ibu_display":"30–60","srm_display":"6–14","og_display":"1.08–1.12","fg_display":"1.016–1.03","country":"Estados Unidos","family":"Strong Ale","glass_shape":"snifter","glass_label":"Copa snifter","distinctive":"Una Barleywine de trigo, sin carácter a levadura Weizen.","ibu_avg":45.0,"ibu_variable":false,"abv_avg":10.0,"abv_variable":false,"summary":"Cerveza fuerte y sedosa, con marcado sabor a trigo y pan.","classic_example":"The Bruery White Oak","foam_level":1,"foam_height":7,"srm_lo_hex":"#f8a600","srm_hi_hex":"#c35900","summary_80":"Una cerveza de textura exquisita, alta en alcohol, para tomar a sorbos, con un significativo sabor granoso y a pan, junto con un cuerpo sedoso.","distinctive_80":"Más que una simple Barleywine con base de trigo, muchas versiones cuentan con notas muy expresivas afrutadas y lupuladas.","mini_profile":{"malta":3,"lupulo":2,"cuerpo":2,"carbonatacion":2},"char_tags":["balanceada"],"ingredients_line":"Elaborada típicamente con una combinación de malta de dos hileras y de trigo estadounidenses.","ingredient_chips":["Elaborada típicamente con una…","Comúnmente se utiliza un 50%…"],"balance_pos":1.5,"balance_malta":3,"balance_lupulo":2,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":["Elaborada típicamente con una…","Lúpulos de cualquier variedad…"],"sabor_highlights":["Elaborada típicamente con una…","Lúpulos de cualquier variedad…"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Dorado","Cremosa","Translúcida"],"ingredientes_highlights":["Elaborada típicamente con una…","Comúnmente se utiliza un 50%…"],"ingredient_types":{"malta":"Elaborada típicamente con una…","lupulo":"Lúpulos de cualquier variedad…"}},{"code":"23A","name":"Berliner Weisse","category_num":23,"category_name":"European Sour Ale","stats":{"OG":[1.028,1.032],"FG":[1.003,1.006],"IBU":[3.0,8.0],"SRM":[2.0,3.0],"ABV":[2.8,3.8]},"fields":{"Impresión general":"Una cerveza de trigo alemana muy pálida, refrescante y de bajo alcohol, con una acidez láctica limpia y un nivel de carbonatación muy alto. Un ligero sabor a malta como a masa de pan da soporte a la acidez, la que no debería parecer artificial. Una ligera frutosidad se puede percibir en los mejores ejemplos.","Aroma":"Domina un carácter ácido punzante de moderado a moderadamente alto. Puede tener a lo sumo una frutosidad moderada, a menudo a limón, manzana ácida, durazno/melocotón o damasco/albaricoque, y una ligera nota floral. Sin aroma a lúpulo. El trigo puede ser percibido como masa de pan cruda en las versiones más frescas; al combinarse con la acidez, puede sugerir pan de masa madre.","Apariencia":"De color pajizo, puede ser muy pálida. La claridad varía entre transparente y algo turbia. Espuma blanca abundante, densa y de baja retención. Altamente efervescente.","Sabor":"Domina una acidez láctica limpia y puede ser bastante fuerte. Generalmente se percibe un sabor a trigo complementario, como a masa, pan o granos. El amargor del lúpulo es imperceptible; la acidez provee el balance en lugar de los lúpulos. Nunca avinagrada. Frutosidad distintiva pero discreta que se puede percibir como damasco/albaricoque o durazno/melocotón, cítrico a limón o manzana ácida. Final muy seco. Balance dominado por la acidez, pero algo de sabor a malta debería estar presente. Sin sabor a lúpulo. Sin THP.","Sensación en boca":"Cuerpo ligero, pero nunca demasiado delgado. Carbonatación muy alta. Sin sensación a alcohol. Acidez crisp.","Comentarios":"Cualquier carácter a Brett es discreto, y típicamente se expresa como notas afrutadas y florales, no funky. Los ejemplos envejecidos pueden exhibir un carácter a sidra, miel, heno o ligero a flores silvestres, y algunas veces una acidez mayor. En Alemania está clasificada como una Schankbier, lo que significa una cerveza liviana de densidad inicial en el rango de 7-8 °P (SG 1.028-1.032). Las versiones con frutas o especias deberían ser inscritas como 29A Fruit Beer, como 30A Spice, Herb, or Vegetable Beer, o como 29B Fruit and Spice Beer.","Historia":"Una especialidad regional de Berlín. En 1809, las tropas de Napoleón se refirieron a ella como “la champaña del norte”, debido a su carácter vivaz y elegante. En un momento dado era ahumada y solía existir una versión de intensidad similar a las Märzen (14 °P, SG 1.057). Cada vez es menos común en Alemania, pero hoy en día es producida en diversos países.","Ingredientes característicos":"Malta Pilsner. Usualmente trigo malteado, por lo menos la mitad del total del listado de granos. Una cofermentación simbiótica entre levadura de fermentación alta y BAL (bacterias ácido lácticas) provee la acidez punzante, que puede ser acentuada al mezclar cervezas de distintas edades durante la fermentación y por un envejecimiento en frío. Es tradicional el macerado por decocción y la adición de lúpulo en el macerador. En Alemania, científicos/as en elaboración de cerveza creen que el Brett es esencial para obtener el perfil correcto de sabor afrutado y floral.","Comparación de estilos":"Comparada con una Lambic, tiene una acidez láctica limpia, con una presencia de Brett de discreta a por debajo del umbral sensorial. También con menor alcohol. Comparada con una Straight Sour Beer y una Catharina Sour, tiene una menor densidad y puede contener Brett.","Estadísticas vitales":"OG: 1.028 – 1.032 IBU: 3 – 8 FG: 1.003 – 1.006 SRM: 2 – 3 ABV: 2.8 – 3.8%","Ejemplos comerciales":"Bayerischer Bahnhof Berliner Style Weisse, Berliner Berg Berliner Weisse, Brauerei Meierei Weiße, Lemke Berlin Budike Weisse, Schell’s Brewing Company Schelltheiss, Urban Chestnut Ku’damm","Etiquetas":"intensidad-baja, color-pálido, fermentación-alta, europa-central, estilo-tradicional, familia-cerveza-trigo"},"glass_color":"#ffd169","srm_variable":false,"clarity":"turbia","foam_color":"#F7F4EC","abv_display":"2.8–3.8%","ibu_display":"3–8","srm_display":"2–3","og_display":"1.028–1.032","fg_display":"1.003–1.006","country":"Alemania","family":"Wheat Beer","glass_shape":"flute","glass_label":"Vaso stange / flauta","distinctive":"Menos Brett y alcohol que una Lambic.","ibu_avg":5.5,"ibu_variable":false,"abv_avg":3.3,"abv_variable":false,"summary":"Cerveza de trigo alemana muy pálida, acidez láctica limpia.","classic_example":"Bayerischer Bahnhof Berliner Style Weisse","foam_level":0,"foam_height":4,"srm_lo_hex":"#ffd878","srm_hi_hex":"#ffca5a","summary_80":"Una cerveza de trigo alemana muy pálida, refrescante y de bajo alcohol, con una acidez láctica limpia y un nivel de carbonatación muy alto.","distinctive_80":"Comparada con una Lambic, tiene una acidez láctica limpia, con una presencia de Brett de discreta a por debajo del umbral sensorial.","mini_profile":{"malta":2,"lupulo":0,"cuerpo":1,"carbonatacion":4},"char_tags":[],"ingredients_line":"Malta Pilsner. Usualmente trigo malteado, por lo menos la mitad del total del listado de granos.","ingredient_chips":["Malta Pilsner","Usualmente trigo malteado"],"balance_pos":1.0,"balance_malta":2,"balance_lupulo":0,"aroma_highlight":"Lúpulo nulo","sabor_highlight":"Malta media","apariencia_highlight":"Turbia","boca_highlight":"Carbonatación muy alta","aroma_highlights":["Malta Pilsner","Es tradicional el macerado por…","Una cofermentación simbiótica…"],"sabor_highlights":["Malta Pilsner","Es tradicional el macerado por…","Una cofermentación simbiótica…"],"boca_highlights":["Carbonatación muy alta","Cuerpo ligero"],"apariencia_highlights":["Pajizo","Densa","Turbia"],"ingredientes_highlights":["Malta Pilsner","Usualmente trigo malteado"],"ingredient_types":{"malta":"Malta Pilsner","lupulo":"Es tradicional el macerado por…","levadura":"Una cofermentación simbiótica…"}},{"code":"23B","name":"Flanders Red Ale","category_num":23,"category_name":"European Sour Ale","stats":{"OG":[1.048,1.057],"FG":[1.002,1.012],"IBU":[10.0,25.0],"SRM":[10.0,17.0],"ABV":[4.6,6.5]},"fields":{"Impresión general":"Una ale de estilo belga, ácida y afrutada, envejecida en roble, de color marrón rojizo, con sabores tostados de malta de apoyo y una complejidad a fruta. Un final seco y tánico sustenta la impresión de un vino tinto de guarda.","Aroma":"Complejo perfil afrutado y ácido con malta de apoyo. Alta frutosidad, que recuerda a cerezas negras, naranjas, ciruelas, zarzaparrillas (grosella roja) o fruit leather (Nota de la Traducción: snack a base de puré de fruta deshidratado, con textura que se asemeja al cuero y sabor a fruta concentrado). Puede haber presente un carácter de bajo a medio bajo a vainilla, chocolate o un fenol a pimienta, aportando complejidad. El aroma ácido va de moderado a alto. Un carácter avinagrado dominante es inapropiado, aunque niveles de bajos a moderados de ácido acético son aceptables, si están balanceados con la malta. Sin aroma a lúpulo.","Apariencia":"Color de rojo profundo o bermellón a marrón rojizo. Buena claridad. Espuma de blanca a canela muy clara. Retención de espuma de promedio a buena.","Sabor":"Malta de moderada a moderadamente alta, a menudo con una suave cualidad rica y tostada. Sabores a fruta intensos, con los mismos descriptores que el aroma. Acidez compleja, de moderada a alta, acentuada por los ésteres; no debería ser una simple acidez láctica. Un carácter avinagrado dominante es inapropiado, aunque un ácido acético de bajo a moderado es aceptable, si está balanceado con la malta. Generalmente, a medida que se incrementa el carácter ácido, el carácter a malta disminuye hacia un sabor en segundo plano (y viceversa). Es opcional un carácter de bajo a medio bajo a vainilla, chocolate o un fenol a pimienta. Sin sabor a lúpulo. Amargor discreto; balanceada hacia la malta. Los ácidos y los taninos pueden acentuar la percepción de amargor, y proveer balance y estructura. Algunas versiones están endulzadas, o mezcladas para hacerlas dulces; permita un amplio rango de niveles de dulzor, que pueden suavizar la acidez cortante y la percepción acética.","Sensación en boca":"Cuerpo medio, a menudo realzado por los taninos. Carbonatación de baja a media. Astringencia de baja a media, usualmente con una acidez punzante. Se percibe engañosamente ligera y crisp, aunque no es raro un final algo dulce. 49","Comentarios":"La observación acerca de ser “similar al vino” no debe ser tomada de forma demasiado literal; a algunas personas les puede sugerir un vino francés de Borgoña con alta acidez, pero claramente no es idéntico. Se produce mediante un prolongado envejecimiento (hasta dos años) en grandes cubas de madera (fudres), la mezcla de cervezas jóvenes y maduras, y cantidades variables de endulzantes en el producto final. Es posible una amplia gama de productos dependiendo de la mezcla final de cervezas y de si se agrega algún endulzante. Pueden ser percibidos sabores acéticos, pero no toda la acidez de esta cerveza proviene del ácido acético; la acidez total del vinagre es más de seis veces superior a la de este estilo. Las versiones con fruta deberían ser inscritas como 29A Fruit Beer.","Historia":"Una cerveza autóctona de la provincia de Flandes Occidental (Bélgica), ejemplificada por los productos de la cervecería Rodenbach, establecida en 1821. La maduración en cubas de madera y la mezcla de cervezas maduras con jóvenes se adoptaron de las tradiciones inglesas. En Bélgica, quienes elaboran cerveza consideran que las Flanders Red y las Oud Bruin pertenecen a la misma familia de estilos, pero la distinción fue realizada por primera vez cuando Michael Jackson definió los estilos de cerveza, ya que los perfiles de sabor son evidentemente diferentes. Muchos ejemplos modernos están influenciados por la popularidad de la cerveza Rodenbach Grand Cru.","Ingredientes característicos":"Maltas Viena o Múnich, una variedad de maltas Caramelo, maíz. Lúpulos de Europa continental de bajos alfa ácidos. Sacch, Lacto y Brett. Envejecida en roble. Algunas veces mezclada y endulzada (natural o artificialmente).","Comparación de estilos":"Con una maltosidad menos rica que una Oud Bruin, a menudo con un perfil acético y a fruta de acidez ligera.","Estadísticas vitales":"OG: 1.048 – 1.057 IBU: 10 – 25 FG: 1.002 – 1.012 SRM: 10 – 17 ABV: 4.6 – 6.5%","Ejemplos comerciales":"Cuvée des Jacobins, Duchesse de Bourgogne, New Belgium La Folie, Rodenbach Classic, Rodenbach Grand Cru, Vichtenaar Flemish Ale","Etiquetas":"intensidad-estándar, color-ámbar, fermentaciónalta, europa-occidental, estilo-tradicional, balanceada, ácida"},"glass_color":"#c75e00","srm_variable":false,"clarity":"traslucida","foam_color":"#F7F4EC","abv_display":"4.6–6.5%","ibu_display":"10–25","srm_display":"10–17","og_display":"1.048–1.057","fg_display":"1.002–1.012","country":"Bélgica","family":"Sour Ale","glass_shape":"flute","glass_label":"Vaso stange / flauta","distinctive":"Menos maltosa que una Oud Bruin, más acética.","ibu_avg":17.5,"ibu_variable":false,"abv_avg":5.5,"abv_variable":false,"summary":"Ale belga ácida y afrutada, envejecida en roble, marrón rojiza.","classic_example":"Cuvée des Jacobins","foam_level":1,"foam_height":7,"srm_lo_hex":"#de7c00","srm_hi_hex":"#b04500","summary_80":"Una ale de estilo belga, ácida y afrutada, envejecida en roble, de color marrón rojizo, con sabores tostados de malta de apoyo y una complejidad a fruta.","distinctive_80":"Con una maltosidad menos rica que una Oud Bruin.","mini_profile":{"malta":3,"lupulo":0,"cuerpo":2,"carbonatacion":2},"char_tags":["balanceada","ácida"],"ingredients_line":"Maltas Viena o Múnich, una variedad de maltas Caramelo, maíz. Lúpulos de Europa continental de bajos alfa ácidos.","ingredient_chips":["Maltas Viena o Múnich","Lúpulos de Europa continental…"],"balance_pos":0.5,"balance_malta":3,"balance_lupulo":0,"aroma_highlight":"Malta media","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":["Maltas Viena o Múnich","Lúpulos de Europa continental…"],"sabor_highlights":["Maltas Viena o Múnich","Lúpulos de Europa continental…"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Marrón","Blanca","Translúcida"],"ingredientes_highlights":["Maltas Viena o Múnich","Lúpulos de Europa continental…"],"ingredient_types":{"malta":"Maltas Viena o Múnich","lupulo":"Lúpulos de Europa continental…"}},{"code":"23C","name":"Oud Bruin","category_num":23,"category_name":"European Sour Ale","stats":{"OG":[1.04,1.074],"FG":[1.008,1.012],"IBU":[20.0,25.0],"SRM":[17.0,22.0],"ABV":[4.0,8.0]},"fields":{"Impresión general":"Una ale marrón de estilo belga, maltosa, afrutada, envejecida, ácida en cierta medida, con un sabor de maltas a caramelo y chocolate, y a menudo un alcohol significativo.","Aroma":"Maltosidad rica con ésteres afrutados y una acidez madurada. Ésteres de medios a medio altos, que comúnmente recuerdan a uvas pasas, ciruelas, higos, dátiles, naranjas, cerezas negras o ciruelas pasas. Malta de media baja a media alta, con carácter a caramelo, toffee, sirope dorado (treacle) o chocolate. Son opcionales unos ligeros fenoles especiados a pimienta. Puede estar presente un ligero aroma ácido, que puede aumentar moderadamente con el envejecimiento, pero no debería llegar a un carácter demasiado acético o a vinagre. Aroma a lúpulo ausente. Los ejemplos envejecidos pueden presentar un ligero carácter a oxidación como a frutos secos o similar al jerez.","Apariencia":"Color de marrón rojizo oscuro a marrón. Buena claridad. Retención de espuma de media a buena. Espuma de color desde marfil a canela claro. 50","Sabor":"Maltosa, con u
