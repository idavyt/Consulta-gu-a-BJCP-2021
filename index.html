na complejidad afrutada y típicamente algo de sabor a caramelo oscuro o azúcar quemada. Malta de media baja a media alta, con los mismos descriptores que el aroma. Frutosidad de media a media alta, con los mismos descriptores que el aroma. Son opcionales unos ligeros fenoles especiados a pimienta. Una ligera acidez, que a menudo se torna más pronunciada en los ejemplos maduros, junto con algo de carácter similar al jerez, lo que produce un perfil y retrogusto “agridulce”. La acidez no debería llegar a un carácter demasiado acético o a vinagre. Sabor a lúpulo ausente. Discreto amargor de lúpulo. El balance es maltoso, pero con una frutosidad y acidez presentes. La mezcla de cervezas y el endulzado pueden producir una diversidad de finales y balances.","Sensación en boca":"Cuerpo de medio a medio pleno. Carbonatación de baja a moderada. Sin astringencia. Las versiones más fuertes pueden presentar una notoria tibieza alcohólica.","Comentarios":"Puede haber ejemplos con una larga maduración y mezcla de cervezas jóvenes con maduras, lo que aporta suavidad y complejidad, además de balancear cualquier carácter áspero y ácido. Tradicionalmente, este estilo fue diseñado para la guarda, por lo que los ejemplos con un moderado carácter envejecido son considerados como superiores a los ejemplos más jóvenes. Las versiones con fruta deberían ser inscritas como 29A Fruit Beer.","Historia":"Una cerveza autóctona de la provincia de Flandes Oriental (Bélgica), ejemplificada por los productos de la cervecería Liefmans, con sus orígenes en el siglo XVII. En Bélgica, quienes elaboran cerveza consideran que las Flanders Red y las Oud Bruin pertenecen a la misma familia de estilos, pero la distinción fue realizada por primera vez cuando Michael Jackson definió los estilos de cerveza, ya que los perfiles de sabor son evidentemente diferentes. Muchos ejemplos modernos están influenciados por la popularidad de la cerveza Liefmans Goudenband. No tiene relación con la lager oscura y dulce del mismo nombre elaborada en los Países Bajos.","Ingredientes característicos":"Malta Pils, maltas Crystal oscuras, maíz, maltas de color en pequeña cantidad. Lúpulos de Europa continental de bajos alfa ácidos. Sacch y Lacto. Envejecida. Agua con carbonatos y magnesio, típica de su región de origen.","Comparación de estilos":"Un carácter a malta más profundo con más sabores a caramelo, toffee y chocolate, junto con un color más oscuro, distinguen a estas cervezas de las Flanders Red Ale. La Oud Bruin es menos acética y más maltosa que una Flanders Red, y los sabores afrutados están más orientados a la malta. En tiempos modernos, la Oud Bruin tiende a ser más alta en alcohol que lo normalmente visto en las Flanders Red Ale. Se diferencia de las Lambic en que no son fermentadas de forma espontánea, y no contienen trigo.","Estadísticas vitales":"OG: 1.040 – 1.074 IBU: 20 – 25 FG: 1.008 – 1.012 SRM: 17 – 22 ABV: 4.0 – 8.0%","Ejemplos comerciales":"Ichtegem Oud Bruin, Liefmans Goudenband, Liefmans Oud Bruin, Petrus Roodbruin, pFriem Oud Bruin, VanderGhinste Roodbruin","Etiquetas":"intensidad-estándar, color-oscuro, fermentaciónalta, europa-occidental, estilo-tradicional, maltosa"},"glass_color":"#9e3400","srm_variable":false,"clarity":"traslucida","foam_color":"#F1E8CE","abv_display":"4–8%","ibu_display":"20–25","srm_display":"17–22","og_display":"1.04–1.074","fg_display":"1.008–1.012","country":"Bélgica","family":"Sour Ale","glass_shape":"flute","glass_label":"Vaso stange / flauta","distinctive":"Más maltosa y menos acética que una Flanders Red.","ibu_avg":22.5,"ibu_variable":false,"abv_avg":6.0,"abv_variable":false,"summary":"Ale belga marrón, maltosa, afrutada y algo ácida.","classic_example":"Ichtegem Oud Bruin","foam_level":1,"foam_height":7,"srm_lo_hex":"#b04500","srm_hi_hex":"#8e2900","summary_80":"Una ale marrón de estilo belga, maltosa, afrutada, envejecida, ácida en cierta medida, con un sabor de maltas a caramelo y chocolate.","distinctive_80":"Un carácter a malta más profundo con más sabores a caramelo, toffee y chocolate, junto con un color más oscuro.","mini_profile":{"malta":3,"lupulo":1,"cuerpo":2,"carbonatacion":2},"char_tags":["maltosa"],"ingredients_line":"Malta Pils, maltas Crystal oscuras, maíz, maltas de color en pequeña cantidad. Lúpulos de Europa continental de bajos alfa ácidos.","ingredient_chips":["Malta Pils","Lúpulos de Europa continental…"],"balance_pos":1.0,"balance_malta":3,"balance_lupulo":1,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":["Malta Pils","Lúpulos de Europa continental…"],"sabor_highlights":["Malta Pils","Lúpulos de Europa continental…"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Marrón","Translúcida"],"ingredientes_highlights":["Malta Pils","Lúpulos de Europa continental…"],"ingredient_types":{"malta":"Malta Pils","lupulo":"Lúpulos de Europa continental…"}},{"code":"23D","name":"Lambic","category_num":23,"category_name":"European Sour Ale","stats":{"OG":[1.04,1.054],"FG":[1.001,1.01],"IBU":[0.0,10.0],"SRM":[3.0,6.0],"ABV":[5.0,6.5]},"fields":{"Impresión general":"Una cerveza “salvaje” de trigo, originaria de Bélgica, bastante ácida, a menudo moderadamente funky, en la que la acidez reemplaza al amargor del lúpulo en el balance. Tradicionalmente servida sin carbonatación como una bebida de cafetería.","Aroma":"Las versiones jóvenes pueden ser bastante ácidas y afrutadas, pero con el tiempo pueden desarrollar un carácter funky a establo, tierra, cabra, heno, caballo o manta de caballo. El carácter afrutado puede adquirir una cualidad ligera a cítricos, cáscara de cítrico, frutas pomáceas o ruibarbo, que se torna más compleja con el tiempo. La malta puede tener una cualidad ligera a pan, grano, miel o similar al trigo, si es que se percibe. No debe tener defectos entéricos, ahumados, similares al puro habano o al queso. Sin lúpulo.","Apariencia":"Color de amarillo pálido a dorado intenso; el envejecimiento tiende a hacerla más oscura. Claridad de buena a turbia. Las versiones más jóvenes a menudo son brumosas, mientras que las más envejecidas son generalmente transparentes. Espuma de color blanco, que generalmente tiene baja retención.","Sabor":"Las versiones jóvenes a menudo tienen una acidez láctica intensa con sabores afrutados (mismos descriptores que en el aroma), mientras que las versiones envejecidas son más balanceadas y complejas. Se pueden desarrollar con el tiempo notas funky, con los mismos descriptores que en el aroma. Malta ligera a pan y granos. El amargor por lo general está por debajo del umbral sensorial; la acidez provee el balance. Sin sabor a lúpulo. Final seco, que se incrementa con el tiempo. No debe tener defectos entéricos, ahumados, similares a puro habano o a queso.","Sensación en boca":"Cuerpo de ligero a medio ligero; no debería ser aguada. Tiene una cualidad de acidez que hace fruncir, en intensidad de media a alta, sin astringencia punzante. Las versiones tradicionales van de casi a completamente no carbonatadas, pero las versiones embotelladas pueden adquirir una carbonatación moderada con el tiempo.","Comentarios":"Una cerveza no mezclada, elaborada de un solo lote, que refleja el carácter peculiar de la cervecería. Generalmente servida joven (6 meses) desde un cask. Las versiones más jóvenes tienden a ser unidimensionales y ácidas, ya que el carácter complejo a Brett tarda un año o más en desarrollarse. Un significativo carácter a vinagre o a sidra es considerado como un defecto por productores/as belgas. Típicamente es embotellada solo cuando ha fermentado completamente. Una Lambic endulzada con azúcar sin refinar al momento de servirla se conoce como Faro.","Historia":"Ale “salvaje” de fermentación espontánea producida en la zona de Bruselas y sus alrededores (también conocidos como el valle del río Senne y Pajottenland), que proviene de la tradición de elaboración de cerveza en granjas (farmhouse) con varios siglos de antigüedad.","Ingredientes característicos":"Malta Pilsner, trigo sin maltear. Lúpulos envejecidos (más de 3 años), utilizados más como un conservante que para amargor. Fermentada de forma espontánea, con levaduras y bacterias que se presentan de forma natural, en barricas de roble neutras de bastante uso.","Comparación de estilos":"A menudo tiene una acidez más simple y menos complejidad que una Gueuze, pero una mayor variabilidad entre lotes. Tradicionalmente servida sin carbonatación en jarras, mientras que la Gueuze es embotellada y muy altamente carbonatada.","Estadísticas vitales":"OG: 1.040 – 1.054 IBU: 0 – 10 FG: 1.001 – 1.010 SRM: 3 – 6 ABV: 5.0 – 6.5%","Ejemplos comerciales":"Cantillon Grand Cru Bruocsella. En la zona de Bruselas, muchas cafeterías de especialidad tienen Lambic tirada (draft) de Boon, De Cam, Cantillon, Drie Fonteinen, Lindemans, Timmermans, Girardin y otros.","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónsalvaje, europa-occidental, estilo-tradicional, familia-cervezatrigo"},"glass_color":"#fdb832","srm_variable":false,"clarity":"turbia","foam_color":"#F7F4EC","abv_display":"5–6.5%","ibu_display":"0–10","srm_display":"3–6","og_display":"1.04–1.054","fg_display":"1.001–1.01","country":"Bélgica","family":"Wheat Beer","glass_shape":"flute","glass_label":"Vaso stange / flauta","distinctive":"Acidez más simple que una Gueuze, sin carbonatar.","ibu_avg":5.0,"ibu_variable":false,"abv_avg":5.8,"abv_variable":false,"summary":"Cerveza de trigo belga fermentada espontáneamente, ácida y funky.","classic_example":"Cantillon Grand Cru Bruocsella. En la zona de Bruselas","foam_level":0,"foam_height":4,"srm_lo_hex":"#ffca5a","srm_hi_hex":"#f8a600","summary_80":"Una cerveza “salvaje” de trigo, originaria de Bélgica, bastante ácida, a menudo moderadamente funky.","distinctive_80":"A menudo tiene una acidez más simple y menos complejidad que una Gueuze, pero una mayor variabilidad entre lotes.","mini_profile":{"malta":1,"lupulo":0,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Malta Pilsner, trigo sin maltear. Lúpulos envejecidos (más de 3 años), utilizados más como un conservante que para amargor.","ingredient_chips":["Malta Pilsner","Lúpulos envejecidos (más de 3…"],"balance_pos":1.5,"balance_malta":1,"balance_lupulo":0,"aroma_highlight":"Malta baja","sabor_highlight":"Amargor medio","apariencia_highlight":"Turbia","boca_highlight":"Cuerpo medio","aroma_highlights":["Malta Pilsner","Lúpulos envejecidos (más de 3…","Fermentada de forma espontánea"],"sabor_highlights":["Malta Pilsner","Lúpulos envejecidos (más de 3…","Fermentada de forma espontánea"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Amarillo","Turbia"],"ingredientes_highlights":["Malta Pilsner","Lúpulos envejecidos (más de 3…"],"ingredient_types":{"malta":"Malta Pilsner","lupulo":"Lúpulos envejecidos (más de 3…","levadura":"Fermentada de forma espontánea"}},{"code":"23E","name":"Gueuze","category_num":23,"category_name":"European Sour Ale","stats":{"OG":[1.04,1.054],"FG":[1.0,1.006],"IBU":[0.0,10.0],"SRM":[5.0,6.0],"ABV":[5.0,8.0]},"fields":{"Impresión general":"Una cerveza “salvaje” de trigo, de origen belga, muy refrescante, altamente carbonatada, placenteramente ácida pero balanceada. El carácter a cerveza “salvaje” puede ser complejo y variado, combinando sabores ácidos, funky y afrutados.","Aroma":"Moderadamente ácido, con carácter funky complejo pero balanceado, acentuado por notas afrutadas. El carácter funky puede ser de moderado a intenso, y se puede describir como a establo, cuero, tierra, cabra, heno, caballo o manta de caballo. Frutosidad de ligera a moderada, con una cualidad a fruta cítrica, cáscara de cítrico, frutas pomáceas o ruibarbo. Malta de apoyo que puede tener un ligero carácter a pan, grano, miel o trigo, si es que se percibe. No debe tener defectos entéricos, ahumados, similares a puro habano ni a queso. Sin lúpulo. Es aceptable un ligero carácter a roble. La complejidad del aroma es prioritaria a su intensidad, pero es deseable una presentación balanceada de la acidez.","Apariencia":"Color dorado con excelente claridad. Espuma de color blanco, densa, “rocosa”, similar a un mousse, que parece durar para siempre. Efervescente.","Sabor":"Paladar ácido y funky, con un carácter similar al del aroma (aplican los mismos descriptores e intensidades para el funk y la fruta). Malta baja a pan y grano. Amargor de nulo a bajo; la acidez provee el balance. Sin sabor a lúpulo. Final seco y crisp, con un retrogusto funky y con acidez ligera. Es aceptable un ligero carácter a roble, vainilla o miel. No debe tener defectos entéricos, ahumados, similares a puro habano ni a queso. La cerveza no debería ser unidimensionalmente ácida; una presentación balanceada y moderadamente ácida es lo clásico, con las notas funky y afrutadas aportando complejidad. Puede estar envejecida.","Sensación en boca":"Cuerpo de ligero a medio ligero; no debería ser aguada. Tiene una cualidad de acidez que hace fruncir, en intensidad de baja a alta, sin tener una astringencia punzante. Algunas versiones tienen una muy ligera tibieza alcohólica. Altamente carbonatada.","Comentarios":"La mezcla de Lambic jóvenes con envejecidas crea un producto más complejo, y a menudo refleja el gusto personal de quien realiza las mezclas. Un significativo carácter a vinagre o a sidra es considerado como un defecto por productores/as belgas. Una buena Gueuze no es la que tiene mayor acritud, sino la que posee un bouquet pleno y tentador, un aroma intenso junto a una textura suave y sedosa. Las Lambic se sirven sin carbonatación, mientras que las Gueuze se sirven carbonatadas. Los productos identificados como oude o vieille (“antiguo”) se consideran como los más tradicionales.","Historia":"La misma historia que las Lambic, pero involucra la mezcla de cervezas, lo que puede ser llevado a cabo fuera de la cervecería. Algunos de los mejores ejemplos son elaborados por productores/as que realizan mezclas (blenders), quienes fermentan, envejecen, mezclan y envasan el producto final. Algunos productores/as modernos/as están endulzando sus 51 productos de forma posterior a la fermentación, para hacerlos más agradables a un público más amplio. Esta Guía describe el producto seco tradicional.","Ingredientes característicos":"Los mismos que las Lambic, excepto que se mezclan cervezas de uno, dos y tres años para luego ser llevadas a guarda.","Comparación de estilos":"Más compleja y carbonatada que una Lambic. La acidez no es necesariamente más fuerte, pero tiende a tener un carácter “salvaje” más desarrollado.","Estadísticas vitales":"OG: 1.040 – 1.054 IBU: 0 – 10 FG: 1.000 – 1.006 SRM: 5 – 6 ABV: 5.0 – 8.0%","Ejemplos comerciales":"Fonteinen Oud Gueuze, Cantillon Classic Gueuze 100% Lambic, Girardin Gueuze 1882 (Black Label), Hanssens Oude Gueuze, Lindemans Gueuze Cuvée René, Oude Gueuze Boon","Etiquetas":"intensidad-alta, color-pálido, fermentaciónsalvaje, europa-occidental, estilo-tradicional, familia-cervezatrigo, envejecida"},"glass_color":"#faac12","srm_variable":false,"clarity":"traslucida","foam_color":"#F7F4EC","abv_display":"5–8%","ibu_display":"0–10","srm_display":"5–6","og_display":"1.04–1.054","fg_display":"1–1.006","country":"Bélgica","family":"Wheat Beer","glass_shape":"flute","glass_label":"Vaso stange / flauta","distinctive":"Más compleja y carbonatada que una Lambic.","ibu_avg":5.0,"ibu_variable":false,"abv_avg":6.5,"abv_variable":false,"summary":"Cerveza de trigo belga muy carbonatada, ácida pero balanceada.","classic_example":"Fonteinen Oud Gueuze","foam_level":3,"foam_height":14,"srm_lo_hex":"#fbb123","srm_hi_hex":"#f8a600","summary_80":"Una cerveza “salvaje” de trigo, de origen belga, muy refrescante, altamente carbonatada, placenteramente ácida pero balanceada.","distinctive_80":"Más compleja y carbonatada que una Lambic. La acidez no es necesariamente más fuerte.","mini_profile":{"malta":1,"lupulo":0,"cuerpo":2,"carbonatacion":2},"char_tags":["envejecida"],"ingredients_line":"Los mismos que las Lambic, excepto que se mezclan cervezas de uno, dos y tres años para luego ser llevadas a guarda.","ingredient_chips":[],"balance_pos":1.5,"balance_malta":1,"balance_lupulo":0,"aroma_highlight":"Malta baja","sabor_highlight":"Malta baja","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Dorado","Densa","Translúcida"],"ingredientes_highlights":[],"ingredient_types":{}},{"code":"23F","name":"Fruit Lambic","category_num":23,"category_name":"European Sour Ale","stats":{"OG":[1.04,1.06],"FG":[1.0,1.01],"IBU":[0.0,10.0],"SRM":[3.0,7.0],"ABV":[5.0,7.0]},"fields":{"Impresión general":"Una cerveza belga de trigo, compleja, refrescante y placenteramente ácida, que mezcla un carácter a fruta fermentada que se complementa con una Gueuze, ácida y funky.","Aroma":"La fruta especificada debería ser el aroma dominante, integrándose bien con los aromas similares de una Gueuze (aplica la misma descripción, pero con la adición del carácter a fruta fermentada).","Apariencia":"Similar a una Gueuze, pero alterada por el color de la fruta utilizada, disminuyendo su intensidad con el envejecimiento. La claridad a menudo es buena, aunque algunas frutas no precipitarán, impidiendo que sea brillante. Si está altamente carbonatada de la forma tradicional, tendrá una espuma densa, “rocosa”, similar a un mousse y generalmente de larga duración, algunas veces con unos tonos que reflejan la fruta añadida.","Sabor":"Combina el perfil de sabor de una Gueuze (aplica la misma descripción), con una presencia significativa de la fruta añadida. Las versiones tradicionales son secas y tienen una acidez ligera, con un sabor adicional a fruta fermentada. Las versiones modernas pueden tener un dulzor variable, que puede compensar la acidez. Los sabores de la fruta pueden disminuir con el envejecimiento y perder su vitalidad, por lo que su intensidad puede ir de baja a alta.","Sensación en boca":"Cuerpo de ligero a medio ligero; no debería ser aguada. Tiene una cualidad de acidez que hace fruncir, en intensidad de baja a alta, sin tener una astringencia punzante. Algunas versiones tienen una ligera tibieza alcohólica. La carbonatación puede variar de casi sin gas a burbujeante.","Comentarios":"Producida como una Gueuze, con la fruta comúnmente añadida a la mitad de la maduración, de manera de que las levaduras y bacterias puedan fermentar todos los azúcares de la fruta; o de manera menos común, agregando fruta a una Lambic. Algunas veces, la variedad de fruta puede ser difícil de identificar, ya que fermentada y envejecida a menudo se percibe de forma diferente a la fruta fresca, que es más fácil de reconocer. La fruta puede aportar acidez y taninos, además de sabor y aroma; entender el carácter fermentado de la fruta añadida ayuda a juzgar el estilo.","Historia":"La misma historia que las Gueuze, incluyendo la tendencia reciente de endulzarla, pero con fruta además del 52 azúcar. La fruta era añadida tradicionalmente por la persona a cargo de realizar las mezclas o de su servicio, con el fin de ampliar la variedad de cervezas disponibles en las cafeterías locales.","Ingredientes característicos":"La misma base que las Gueuze. La fruta es añadida a los barriles durante la fermentación y mezcla. Las frutas tradicionales incluyen cerezas ácidas (guindas) y frambuesas; las modernas incluyen duraznos/melocotones, damascos/albaricoques, uvas y otras. Puede utilizar endulzantes naturales o artificiales.","Comparación de estilos":"Es una Gueuze con fruta, no una simple Fruit Beer ácida; el carácter “salvaje” debe ser evidente.","Instrucciones para la inscripción":"El tipo de fruta utilizada debe ser especificado. Quien la elabora debe declarar un nivel de carbonatación (bajo, medio, alto) y de dulzor (bajo/nulo, medio, alto).","Estadísticas vitales":"OG: 1.040 – 1.060 IBU: 0 – 10 FG: 1.000 – 1.010 SRM: 3 – 7 (varía por fruta) ABV: 5.0 – 7.0%","Ejemplos comerciales":"Fonteinen Schaerbeekse Kriek, Cantillon Fou’ Foune, Cantillon Lou Pepe Framboise, Cantillon Vigneronne, Hanssens Oude Kriek, Oude Kriek Boon","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónsalvaje, europa-occidental, estilo-tradicional, familia-cervezatrigo, ácida"},"glass_color":"#fbb123","srm_variable":false,"clarity":"brillante","foam_color":"#F5F1E6","abv_display":"5–7%","ibu_display":"0–10","srm_display":"3–7","og_display":"1.04–1.06","fg_display":"1–1.01","country":"Bélgica","family":"Wheat Beer","glass_shape":"flute","glass_label":"Vaso stange / flauta","distinctive":"Una Gueuze con fruta, no una Fruit Beer simple.","ibu_avg":5.0,"ibu_variable":false,"abv_avg":6.0,"abv_variable":false,"summary":"Lambic belga con fruta, compleja y ácida.","classic_example":"Fonteinen Schaerbeekse Kriek","foam_level":3,"foam_height":14,"srm_lo_hex":"#ffca5a","srm_hi_hex":"#f39c00","summary_80":"Una cerveza belga de trigo, compleja, refrescante y placenteramente ácida, que mezcla un carácter a fruta fermentada que se complementa con una Gueuze.","distinctive_80":"Es una Gueuze con fruta, no una simple Fruit Beer ácida; el carácter “salvaje” debe ser evidente.","mini_profile":{"malta":null,"lupulo":null,"cuerpo":2,"carbonatacion":0},"char_tags":["ácida"],"ingredients_line":"La misma base que las Gueuze. La fruta es añadida a los barriles durante la fermentación y mezcla.","ingredient_chips":[],"balance_pos":null,"balance_malta":null,"balance_lupulo":null,"aroma_highlight":null,"sabor_highlight":null,"apariencia_highlight":"Brillante","boca_highlight":"Cuerpo medio","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Cuerpo medio","Carbonatación nula"],"apariencia_highlights":["Densa","Brillante"],"ingredientes_highlights":[],"ingredient_types":{}},{"code":"23G","name":"Gose","category_num":23,"category_name":"European Sour Ale","stats":{"OG":[1.036,1.056],"FG":[1.006,1.01],"IBU":[5.0,12.0],"SRM":[3.0,4.0],"ABV":[4.2,4.8]},"fields":{"Impresión general":"Una cerveza histórica centroeuropea de trigo, de acidez ligera, levemente amarga, con un carácter distintivo pero discreto a sal y semillas de cilantro. Muy refrescante, con un final seco, alta carbonatación y sabores vivos.","Aroma":"A frutas pomáceas en intensidad de ligera a moderada. Acidez ligera, un tanto punzante. Semilla de cilantro notoria, que puede tener una cualidad aromática a limón, y una intensidad a lo sumo moderada. Carácter a levadura ligero a pan o masa, similar a un pan de masa madre crudo. La acidez y las semillas de cilantro pueden aportar una impresión fresca y distintiva. La sal puede ser percibida como un carácter a brisa marina muy ligero y limpio, o solo como una frescura general, si es que se percibe en alguna medida.","Apariencia":"Sin filtrar, con una turbidez de moderada a total. Espuma blanca de moderada a alta, con burbujas compactas y buena retención. Efervescente. Color amarillo.","Sabor":"Acidez notoria, de media baja a media alta. Sabor a malta moderado, similar al pan o masa. Carácter afrutado de ligero a moderado, a frutas pomáceas, frutas de carozo o limones. Carácter a sal de ligero a moderado, hasta el umbral de sabor; la sal debe ser perceptible (en especial en el gusto inicial) pero no tener un sabor decididamente salado. Amargor muy bajo. Sin sabor a lúpulo. Final seco y completamente atenuado, con la acidez balanceando a la malta, en lugar de los lúpulos. La acidez puede ser más notoria en el final, y acentuar la cualidad refrescante de la cerveza. La acidez debe ser balanceada, no agresiva (aunque las versiones históricas pueden ser muy ácidas). Sin THP.","Sensación en boca":"Carbonatación de alta a muy alta. Efervescente. Cuerpo de medio ligero a medio pleno. La sal puede aportar una impresión de un ligero hormigueo, que hace agua la boca, y una sensación en boca más redonda y espesa. La levadura y el trigo también pueden agregar un poco de cuerpo, pero no debería sentirse pesado debido a los efectos de la acidez sobre el mismo, que puede aligerarlo.","Comentarios":"Las versiones históricas pueden haber sido más ácidas que los ejemplos modernos debido a las fermentaciones espontáneas, y pueden ser mezcladas con siropes como se hace con las Berliner Weisse, o con licor de comino de prado (alcaravea, caraway). Los ejemplos modernos son inoculados con Lacto, son más balanceados y generalmente no requieren endulzado. Se pronuncia como “GO-se”","Historia":"Es un estilo menor asociado a Leipzig, pero con su origen en la Edad Media en el pueblo de Goslar, en el río Gose. Se ha documentado su presencia en Leipzig hacia el 1740. Se dice que Leipzig tenía 80 casas elaboradoras de Gose en 1900. La producción disminuyó significativamente después de la Segunda Guerra Mundial, y cesó completamente en 1966. La producción moderna se restableció en la década de 1980 en Alemania, pero la cerveza no estaba ampliamente disponible. Se volvió popular fuera de Alemania recientemente como un estilo resucitado, y se utiliza a menudo como un estilo base para cervezas ácidas con fruta y otras Cervezas de Especialidad.","Ingredientes característicos":"Malta Pilsner y trigo malteado, uso discreto de sal y semillas de cilantro, Lacto. Las semillas de cilantro deberían tener una distintiva nota fresca y a cítricos (limón o naranja amarga), y no ser vegetal, similar al apio o al jamón. La sal debería tener un carácter a sal fresca o sal de mar, no una nota metálica y a yodo.","Comparación de estilos":"La acidez percibida no es tan intensa como en una Berliner Weisse o Gueuze. Uso discreto de la sal, semillas de cilantro y Lacto; no debe tener un sabor decididamente salado. El aroma a las semillas de cilantro puede ser similar al de una Witbier. Turbidez similar a una Weissbier.","Estadísticas vitales":"OG: 1.036 – 1.056 IBU: 5 – 12 FG: 1.006 – 1.010 SRM: 3 – 4 ABV: 4.2 – 4.8%","Ejemplos comerciales":"Anderson Valley Gose, Bayerisch Bahnhof Leipziger Gose, Original Ritterguts Gose, Westbrook Gose","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónalta, europa-central, estilo-histórico, familia-cerveza-trigo, ácida"},"glass_color":"#ffc44e","srm_variable":false,"clarity":"traslucida","foam_color":"#F7F4EC","abv_display":"4.2–4.8%","ibu_display":"5–12","srm_display":"3–4","og_display":"1.036–1.056","fg_display":"1.006–1.01","country":"Alemania","family":"Wheat Beer","glass_shape":"flute","glass_label":"Vaso stange / flauta","distinctive":"Menos ácida que una Berliner Weisse o Gueuze.","ibu_avg":8.5,"ibu_variable":false,"abv_avg":4.5,"abv_variable":false,"summary":"Cerveza centroeuropea de trigo, acidez ligera, sal y cilantro.","classic_example":"Anderson Valley Gose","foam_level":1,"foam_height":7,"srm_lo_hex":"#ffca5a","srm_hi_hex":"#ffbf42","summary_80":"Una cerveza histórica centroeuropea de trigo, de acidez ligera, levemente amarga, con un carácter distintivo pero discreto a sal y semillas de cilantro.","distinctive_80":"La acidez percibida no es tan intensa como en una Berliner Weisse o Gueuze.","mini_profile":{"malta":2,"lupulo":0,"cuerpo":2,"carbonatacion":4},"char_tags":["ácida"],"ingredients_line":"Malta Pilsner y trigo malteado, uso discreto de sal y semillas de cilantro, Lacto.","ingredient_chips":["Malta Pilsner y trigo malteado"],"balance_pos":1.0,"balance_malta":2,"balance_lupulo":0,"aroma_highlight":"Levadura bajo","sabor_highlight":"Malta media","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación muy alta","aroma_highlights":["Malta Pilsner y trigo malteado"],"sabor_highlights":["Malta Pilsner y trigo malteado"],"boca_highlights":["Carbonatación muy alta","Cuerpo medio"],"apariencia_highlights":["Amarillo","Compacta","Translúcida"],"ingredientes_highlights":["Malta Pilsner y trigo malteado"],"ingredient_types":{"malta":"Malta Pilsner y trigo malteado"}},{"code":"24A","name":"Witbier","category_num":24,"category_name":"Belgian Ale","stats":{"OG":[1.044,1.052],"FG":[1.008,1.012],"IBU":[8.0,20.0],"SRM":[2.0,4.0],"ABV":[4.5,5.5]},"fields":{"Impresión general":"Una cerveza de trigo belga pálida y turbia, con especias que acentúan el carácter de la levadura. Una ale delicada, ligeramente especiada y de intensidad moderada, que es una bebida refrescante de verano por su alta carbonatación, final seco y ligero lupulado.","Aroma":"Maltosidad moderada a pan, a menudo con ligeras notas a miel o vainilla. Ligero aroma a trigo con carácter granoso y especiado. Aroma moderado a semillas de cilantro con notas perfumadas y a limón, a menudo con un complejo perfil herbáceo, especiado o a pimienta en segundo plano. Frutosidad moderada a ralladura de cítricos como naranja. Un aroma bajo a lúpulo especiado y herbáceo es opcional, pero generalmente está ausente. Las especias deben mezclarse con los aromas afrutados, florales y dulces, y no deben ser demasiado intensas.","Apariencia":"Color de pajizo muy pálido a amarillo profundo. La cerveza estará muy brumosa debido a la turbidez del almidón o por la levadura, lo que le da un brillo amarillo blanquecino lechoso. Espuma blanca, densa y como mousse. La retención de espuma debería ser bastante buena.","Sabor":"Agradable sabor a malta, con perfil granoso y a pan, a menudo con un carácter a miel o vainilla. Frutosidad moderada a ralladura de cítricos como naranja. Son comunes los sabores herbáceos y especiados, que pueden incluir semillas de cilantro con carácter a limón junto a otras especias, y deben ser sutiles y balanceados, no abrumadores. Un sabor a lúpulo especiado y terroso puede ser bajo o nulo, y nunca debe eclipsar las especias. El amargor del lúpulo es de bajo a medio bajo, y apoya los sabores refrescantes de frutas y especias. Refrescante, crisp, con un final seco, y sin retrogusto amargo ni áspero.","Sensación en boca":"Cuerpo de medio ligero a medio, a menudo con una suavidad y cremosidad ligera. Carácter efervescente por su alta carbonatación. Refrescante por su carbonatación, sequedad y falta de amargor en el final. Sin asperezas ni astringencia. No debe ser demasiado seca ni delgada, ni tampoco debe ser espesa y pesada.","Comentarios":"Las versiones históricas podrían haber tenido algo de acidez láctica, pero esto está ausente en las versiones modernas frescas. Hay diversas variantes en el uso de las especias, pero no debe ser excesivo. Las semillas de cilantro de cierto origen o edad pueden dar un carácter inapropiado a jamón o apio. Esta cerveza tiende a ser perecedera, por lo que los ejemplos más jóvenes, más frescos y apropiadamente manejados son los más deseables. Una impresión de dulzor a menudo se debe a un bajo amargor, no a azúcares residuales. La mayoría de los ejemplos se mueven alrededor de un 5% ABV.","Historia":"Perteneciente al grupo de cervezas blancas belgas medievales, procedentes del área de Lovaina, se extinguió en 1957 y fue revivida posteriormente en 1966 por Pierre Celis, en lo que se convirtió en Hoegaarden. Después de que Interbrew adquiriera Hoegaarden, el estilo creció rápidamente e inspiró muchos productos similares que se remontan a la recreación del estilo por parte de Celis, no a los de siglos pasados.","Ingredientes característicos":"Trigo sin maltear (30-60%), el resto cebada malteada de bajo color. Algunas versiones utilizan hasta un 5-10% de avena cruda u otros cereales sin maltear. Tradicionalmente se utilizan semillas de cilantro y cáscara deshidratada de naranja de Curaçao. Se rumorea que se usan otras especias secretas en algunas versiones, como cáscara de naranja dulce. Levadura ale belga con suave carácter afrutado y especiado.","Comparación de estilos":"Bajo nivel de amargor, con un balance similar a una Weissbier, pero con un carácter especiado y cítrico proveniente de las adiciones más que de la levadura.","Estadísticas vitales":"OG: 1.044 – 1.052 IBU: 8 – 20 FG: 1.008 – 1.012 SRM: 2 – 4 ABV: 4.5 – 5.5% 53","Ejemplos comerciales":"Allagash White, Blanche de Bruxelles, Celis White, Hoegaarden White, Ommegang Witte, St. Bernardus Wit","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónalta, europa-occidental, estilo-tradicional, familia-cervezatrigo"},"glass_color":"#ffca5a","srm_variable":false,"clarity":"turbia","foam_color":"#F7F4EC","abv_display":"4.5–5.5%","ibu_display":"8–20","srm_display":"2–4","og_display":"1.044–1.052","fg_display":"1.008–1.012","country":"Bélgica","family":"Wheat Beer","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Como una Weissbier, pero el especiado viene de las adiciones.","ibu_avg":14.0,"ibu_variable":false,"abv_avg":5.0,"abv_variable":false,"summary":"Cerveza de trigo belga pálida y turbia, con especias.","classic_example":"Allagash White","foam_level":2,"foam_height":10,"srm_lo_hex":"#ffd878","srm_hi_hex":"#ffbf42","summary_80":"Una cerveza de trigo belga pálida y turbia, con especias que acentúan el carácter de la levadura.","distinctive_80":"Bajo nivel de amargor, con un balance similar a una Weissbier.","mini_profile":{"malta":2,"lupulo":1,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"Trigo sin maltear (30-60%), el resto cebada malteada de bajo color.","ingredient_chips":["Trigo sin maltear (30-60%)","Algunas versiones utilizan…"],"balance_pos":1.5,"balance_malta":2,"balance_lupulo":1,"aroma_highlight":"Malta media","sabor_highlight":"Malta media","apariencia_highlight":"Turbia","boca_highlight":"Carbonatación alta","aroma_highlights":["Trigo sin maltear (30-60%)","Levadura ale belga con suave…"],"sabor_highlights":["Trigo sin maltear (30-60%)","Levadura ale belga con suave…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Pajizo","Densa","Turbia"],"ingredientes_highlights":["Trigo sin maltear (30-60%)","Algunas versiones utilizan…"],"ingredient_types":{"malta":"Trigo sin maltear (30-60%)","levadura":"Levadura ale belga con suave…"}},{"code":"24B","name":"Belgian Pale Ale","category_num":24,"category_name":"Belgian Ale","stats":{"OG":[1.048,1.054],"FG":[1.01,1.014],"IBU":[20.0,30.0],"SRM":[8.0,14.0],"ABV":[4.8,5.5]},"fields":{"Impresión general":"Una ale belga de fermentación alta e intensidad media, elaborada solo con malta, moderadamente amarga, sin dry hop ni sabores fuertes. Una cerveza de color cobrizo que carece del carácter agresivo a levadura o la acidez de muchas cervezas belgas, pero que tiene un perfil bien balanceado, maltoso, afrutado y, a menudo, con carácter a pan y a tostado.","Aroma":"Moderado aroma a malta con carácter a pan, que puede incluir notas tostadas, a galleta o frutos secos, posiblemente con un toque de caramelo ligero o miel. Una frutosidad de moderada a moderadamente alta complementa la malta y sugiere pera, naranja, manzana o limón y, a veces, frutas de carozo oscuras como las ciruelas. Carácter a lúpulo especiado, herbáceo o floral de bajo a moderado. Son opcionales fenoles especiados a pimienta de baja intensidad. El carácter del lúpulo pesa menos en el balance que la malta y la frutosidad.","Apariencia":"Color de ámbar a cobrizo. La claridad es muy buena. Espuma blanca cremosa y “rocosa”. Bien carbonatada.","Sabor":"Tiene un sabor inicial suave y delicado, moderadamente maltoso, con un perfil variable de notas tostadas, a galleta, a frutos secos, a caramelo ligero o a miel. Frutosidad de moderada a moderadamente alta, con carácter a pera, naranja, manzana o limón. Carácter de lúpulo especiado, herbáceo o floral de bajo a medio bajo. Amargor de medio bajo a medio alto, realzado por fenoles a pimienta opcionales, de bajos a muy bajos. Final de seco a balanceado, con lúpulos que se vuelven más pronunciados en el retrogusto de aquellas versiones con un final más seco. Bastante bien balanceada en general, sin un solo componente de alta intensidad; la malta y el carácter afrutado son más intensos inicialmente, con un amargor de apoyo y un carácter seco que aparecen posteriormente.","Sensación en boca":"Cuerpo de medio ligero a medio. Paladar suave. El nivel de alcohol es discreto, y cualquier carácter cálido debe ser bajo si está presente. Carbonatación de media a media alta.","Comentarios":"Se encuentra más comúnmente en las provincias flamencas de Amberes, Brabante Flamenco y Flandes Oriental, además de la provincia de Henao. Denominada Spéciale Belge Ale (cerveza especial belga) en Bélgica.","Historia":"Concebida después de una competencia, realizada en 1904, para crear una cerveza regional de especialidad que compitiera con las ales británicas importadas y las lagers de Europa continental. El ejemplo moderno más conocido es De Koninck, de Amberes, que lleva elaborando la cerveza desde 1913.","Ingredientes característicos":"Listado de granos variable con maltas pálidas, especiales y Caramelo. Sin adjuntos. Lúpulos ingleses o de Europa continental. Levadura afrutada con bajos fenoles.","Comparación de estilos":"Bastante similar a las Pale Ale de Inglaterra (11C Strong Bitter), normalmente con un carácter a levadura ligeramente diferente y un perfil de malta más 54 variado. Sin embargo, tiene menos carácter a levadura que muchas otras cervezas belgas.","Estadísticas vitales":"OG: 1.048 – 1.054 IBU: 20 – 30 FG: 1.010 – 1.014 SRM: 8 – 14 ABV: 4.8 – 5.5%","Ejemplos comerciales":"De Koninck Bolleke, De Ryck Special, Palm, Palm Dobble","Etiquetas":"intensidad-estándar, color-ámbar, fermentaciónalta, europa-occidental, estilo-tradicional, familia-ale-pálida"},"glass_color":"#d77200","srm_variable":false,"clarity":"traslucida","foam_color":"#F7F4EC","abv_display":"4.8–5.5%","ibu_display":"20–30","srm_display":"8–14","og_display":"1.048–1.054","fg_display":"1.01–1.014","country":"Bélgica","family":"Pale Ale","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Bastante similar a una Pale Ale inglesa.","ibu_avg":25.0,"ibu_variable":false,"abv_avg":5.2,"abv_variable":false,"summary":"Ale belga de intensidad media, solo con malta, amargor moderado.","classic_example":"De Koninck Bolleke","foam_level":3,"foam_height":14,"srm_lo_hex":"#ea8f00","srm_hi_hex":"#c35900","summary_80":"Una ale belga de fermentación alta e intensidad media, elaborada solo con malta, moderadamente amarga, sin dry hop ni sabores fuertes.","distinctive_80":"Bastante similar a las Pale Ale de Inglaterra (11C Strong Bitter).","mini_profile":{"malta":3,"lupulo":3,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"Listado de granos variable con maltas pálidas, especiales y Caramelo. Sin adjuntos. Lúpulos ingleses o de Europa continental.","ingredient_chips":["Listado de granos variable…","Lúpulos ingleses o de Europa…"],"balance_pos":2.0,"balance_malta":3,"balance_lupulo":3,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Listado de granos variable con…","Lúpulos ingleses o de Europa…","Levadura afrutada con bajos…"],"sabor_highlights":["Listado de granos variable con…","Lúpulos ingleses o de Europa…","Levadura afrutada con bajos…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Ámbar","Cremosa","Translúcida"],"ingredientes_highlights":["Listado de granos variable…","Lúpulos ingleses o de Europa…"],"ingredient_types":{"malta":"Listado de granos variable con…","lupulo":"Lúpulos ingleses o de Europa…","levadura":"Levadura afrutada con bajos…"}},{"code":"24C","name":"Bière de Garde","category_num":24,"category_name":"Belgian Ale","stats":{"OG":[1.06,1.08],"FG":[1.008,1.016],"IBU":[18.0,28.0],"SRM":[6.0,19.0],"ABV":[6.0,8.5]},"fields":{"Impresión general":"Una familia de cervezas artesanales francesas suaves, bastante intensas y maltosas, acondicionadas en frío, con una gama de sabores de malta apropiados para el color rubio, ámbar o marrón. Todas son maltosas pero secas, con sabores limpios. Las versiones más oscuras tienen más carácter a malta, mientras que las versiones más pálidas pueden tener más lúpulos, sin dejar de ser cervezas centradas en la malta.","Aroma":"Riqueza de malta prominente, a menudo con un carácter complejo, tostado y a pan, con intensidad de ligera a moderada. Ésteres de bajos a moderados. Lúpulo bajo especiado, a pimienta o herbáceo es opcional. Generalmente bastante limpia, aunque las versiones más fuertes pueden tener una ligera nota especiada de alcohol a medida que se entibia. Las versiones más pálidas siguen siendo maltosas, pero carecen de aromas más ricos y profundos, y pueden tener un poco más de lúpulo.","Apariencia":"Existen variantes rubias, ámbares y oscuras/marrones, y el color varía en consecuencia: de rubio dorado a bronce rojizo a marrón castaño. La claridad es de buena a brillante, pero se permite algo de turbidez. Espuma bien formada, generalmente de blanca a blanquecina (varía con el color de la cerveza), con persistencia media.","Sabor":"Riqueza de malta de media a alta, a menudo con un carácter tostado, a galletas, toffee o caramelo ligero. Ésteres y sabores a alcohol de bajos a moderados. Amargor de lúpulo medio bajo, dando un balance maltoso al paladar y retrogusto. Final de seco a semi seco, no dulce, empalagoso ni pesado. Un bajo sabor a lúpulo especiado, a pimienta o herbáceo es opcional. El sabor, profundidad, riqueza, intensidad y complejidad de la malta aumentan con el color de la cerveza. Las versiones más oscuras tendrán una impresión inicial más rica en malta que las versiones más pálidas, pero no deberían parecer rostizadas. Las versiones más pálidas pueden tener un sabor a lúpulo ligeramente mayor.","Sensación en boca":"Cuerpo de medio ligero a medio, a menudo con un carácter suave, cremoso y sedoso. Carbonatación de moderada a alta. Moderada tibieza alcohólica, pero no debe ser quemante.","Comentarios":"El carácter a bodega, humedad, mohoso o rústico que se mencionan a menudo en la literatura, son signos de importaciones mal manejadas, no de productos frescos y auténticos. El envejecimiento y la oxidación también pueden aumentar los sabores afrutados y acaramelados, pero aumentan la aspereza. Si bien las notas a caramelo y fruta pueden ser parte del estilo, no confunda el carácter de oxidación con la propia cerveza base.","Historia":"El nombre significa, de manera amplia, cerveza para guardar. Una ale artesanal tradicional, elaborada en granjas (farmhouse) de la zona de Lille, en el norte de Francia. Históricamente, se elaboraba a principios de la primavera y se conservaba en bodegas frías para su consumo cuando el clima se volvía más cálido. Aunque su existencia está documentada desde el siglo XIX, Jenlain es el prototipo de la versión lager ámbar moderna, siendo embotellada por primera vez en la década de 1940.","Ingredientes característicos":"Las maltas base varían según el color de la cerveza, pero generalmente incluyen maltas pálidas, Viena y Múnich. Maltas tipo Crystal de color variable. Se pueden usar adjuntos de azúcar. Levadura lager o ale, fermentada a temperaturas bajas del rango de la levadura ale, seguido de un largo acondicionamiento en frío. Lúpulos de Europa continental.","Comparación de estilos":"Llamar a esta cerveza “de granja” (farmhouse) invita a compararla con la Saison, que tiene un balance completamente diferente: la Bière de Garde es maltosa y suave, mientras que la Saison es lupulada y amarga. En realidad, tiene más similitud a una Bock en el perfil de malta.","Instrucciones para la inscripción":"Quien inscriba debe especificar si la Bière de Garde es rubia, ámbar u oscura/marrón. Si no se especifica ningún color, quien la juzgue debe intentar hacerlo en función de la observación inicial, esperando un sabor a malta y balance que coincida con el color.","Estadísticas vitales":"OG: 1.060 – 1.080 IBU: 18 – 28 FG: 1.008 – 1.016 SRM: 6 – 19 ABV: 6.0 – 8.5%","Ejemplos comerciales":"Ch’Ti Blonde, Jenlain Ambrée, La Choulette Brune, Russian River Perdition, Saint Sylvestre 3 Monts Blonde, Two Brothers Domaine Dupage","Etiquetas":"intensidad-alta, color-pálido, color-ámbar, cualquier-fermentación, acondicionada-en-frío, europaoccidental, estilo-tradicional, familia-ale-ámbar"},"glass_color":"#cd6600","srm_variable":false,"clarity":"brillante","foam_color":"#F5F1E6","abv_display":"6–8.5%","ibu_display":"18–28","srm_display":"6–19","og_display":"1.06–1.08","fg_display":"1.008–1.016","country":"Francia","family":"Amber Ale","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Más parecida a una Bock que a una Saison.","ibu_avg":23.0,"ibu_variable":false,"abv_avg":7.2,"abv_variable":false,"summary":"Ale francesa suave y maltosa, rubia, ámbar o marrón.","classic_example":"Ch’Ti Blonde","foam_level":1,"foam_height":7,"srm_lo_hex":"#f8a600","srm_hi_hex":"#a13700","summary_80":"Una familia de cervezas artesanales francesas suaves, bastante intensas y maltosas, acondicionadas en frío.","distinctive_80":"Llamar a esta cerveza “de granja” (farmhouse) invita a compararla con la Saison.","mini_profile":{"malta":3,"lupulo":1,"cuerpo":2,"carbonatacion":3},"char_tags":["europaoccidental"],"ingredients_line":"Las maltas base varían según el color de la cerveza, pero generalmente incluyen maltas pálidas, Viena y Múnich.","ingredient_chips":["Maltas tipo Crystal de color…","Se pueden usar adjuntos de…"],"balance_pos":1.0,"balance_malta":3,"balance_lupulo":1,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Brillante","boca_highlight":"Carbonatación alta","aroma_highlights":["Maltas tipo Crystal de color…","Lúpulos de Europa continental","Levadura lager o ale"],"sabor_highlights":["Maltas tipo Crystal de color…","Lúpulos de Europa continental","Levadura lager o ale"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Ámbar","Blanquecina","Brillante"],"ingredientes_highlights":["Maltas tipo Crystal de color…","Se pueden usar adjuntos de…"],"ingredient_types":{"malta":"Maltas tipo Crystal de color…","lupulo":"Lúpulos de Europa continental","levadura":"Levadura lager o ale"}},{"code":"25A","name":"Belgian Blond Ale","category_num":25,"category_name":"Strong Belgian Ale","stats":{"OG":[1.062,1.075],"FG":[1.008,1.018],"IBU":[15.0,30.0],"SRM":[4.0,6.0],"ABV":[6.0,7.5]},"fields":{"Impresión general":"Una ale belga dorada, moderadamente alcohólica con una agradable y sutil complejidad de levadura con carácter cítrico y especiado, paladar maltoso sedoso y un final seco y suave.","Aroma":"Malta con carácter a grano dulce, tostado ligero o a galletas cracker, en intensidad de ligera a moderada. Perfil de levadura de sutil a moderado, destacando ésteres afrutados cítricos (como a naranja o limón), con fenoles especiados a pimienta en segundo plano. Suaves notas terrosas o especiadas derivadas del lúpulo son opcionales. Un ligero alcohol perfumado y toques de un leve dulzor de malta pueden dar una nota similar a la miel o al azúcar. Sutil pero compleja.","Apariencia":"Color de amarillo profundo a dorado profundo. Generalmente muy transparente. Espuma abundante, densa y cremosa, con color de blanco a blanquecino. Buena retención de espuma con encaje belga.","Sabor":"Similar al aroma, percibiendo en primer lugar el sabor a grano dulce de la malta, de ligero a moderado. Sutil dulzor de azúcar ligeramente caramelizada o a miel en el paladar. Amargor medio, con la malta levemente más prominente en el balance. Perfil de levadura de moderado a bajo, con ésteres de notas a limón o naranja y un ligero fenol especiado a pimienta. Puede tener un leve carácter perfumado. Lúpulo ligero en el sabor, puede ser especiado o terroso, complementando a la levadura. El final es de seco a semi seco, suave y delicado, con un retrogusto ligero a alcohol y malta.","Sensación en boca":"Carbonatación de media alta a alta, que puede dar una sensación burbujeante que llena la boca. Cuerpo medio. Tibieza alcohólica de ligera a moderada, pero suave. Puede ser algo cremosa.","Comentarios":"La mayoría de los ejemplos comerciales están en un rango de alcohol de 6.5 – 7%. Generalmente tiene un carácter similar a una lager, que le da un perfil más limpio en comparación a muchos otros estilos belgas. En Bélgica, los hablantes flamencos utilizan el término Blond, mientras que los francófonos lo escriben Blonde. Muchas variedades monásticas o artesanales belgas se llaman Blond pero no son representativas de este estilo.","Historia":"Con un desarrollo relativamente reciente para poder llegar a los bebedores de Pils europeos, ha aumentado su popularidad debido a un intenso marketing y amplia distribución. A pesar de las afirmaciones sobre su origen en el siglo XIII, el estilo fue creado después de la Segunda Guerra Mundial y fue popularizado por primera vez por Leffe.","Ingredientes característicos":"Malta Pils belga, maltas aromáticas, azúcar u otros adjuntos, cepas de levadura belga de tipo abadía, lúpulos de Europa continental. No se utilizan especias de manera tradicional; si están presentes, debería ser solo un carácter en segundo plano.","Comparación de estilos":"Similar intensidad y balance que una Belgian Dubbel pero de color dorado y sin los sabores de malta más oscura. Similar en carácter a una Belgian Golden Strong Ale o una Belgian Tripel, aunque un poco más maltosa, no tan amarga y con menor graduación alcohólica. 56","Estadísticas vitales":"OG: 1.062 – 1.075 IBU: 15 – 30 FG: 1.008 – 1.018 SRM: 4 – 6 ABV: 6.0 – 7.5%","Ejemplos comerciales":"Affligem Blond, Corsendonk Blond, Grimbergen Blonde, La Trappe Blond, Leffe Blond, Val-Dieu Blonde","Etiquetas":"intensidad-alta, color-pálido, fermentación-alta, europa-occidental, estilo-tradicional"},"glass_color":"#fbb123","srm_variable":false,"clarity":"brillante","foam_color":"#F7F4EC","abv_display":"6–7.5%","ibu_display":"15–30","srm_display":"4–6","og_display":"1.062–1.075","fg_display":"1.008–1.018","country":"Bélgica","family":"Pale Ale","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Más maltosa y menos fuerte que una Tripel.","ibu_avg":22.5,"ibu_variable":false,"abv_avg":6.8,"abv_variable":false,"summary":"Ale belga dorada, moderadamente alcohólica y especiada.","classic_example":"Affligem Blond","foam_level":3,"foam_height":14,"srm_lo_hex":"#ffbf42","srm_hi_hex":"#f8a600","summary_80":"Una ale belga dorada, moderadamente alcohólica con una agradable y sutil complejidad de levadura con carácter cítrico y especiado.","distinctive_80":"Similar intensidad y balance que una Belgian Dubbel pero de color dorado y sin los sabores de malta más oscura.","mini_profile":{"malta":3,"lupulo":1,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"Malta Pils belga, maltas aromáticas, azúcar u otros adjuntos, cepas de levadura belga de tipo abadía.","ingredient_chips":["Malta Pils belga","No se utilizan especias de…"],"balance_pos":1.0,"balance_malta":3,"balance_lupulo":1,"aroma_highlight":"Levadura alto","sabor_highlight":"Malta alta","apariencia_highlight":"Brillante","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta Pils belga","Malta Pils belga","Malta Pils belga"],"sabor_highlights":["Malta Pils belga","Malta Pils belga","Malta Pils belga"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Amarillo","Cremosa","Brillante"],"ingredientes_highlights":["Malta Pils belga","No se utilizan especias de…"],"ingredient_types":{"malta":"Malta Pils belga","lupulo":"Malta Pils belga","levadura":"Malta Pils belga"}},{"code":"25B","name":"Saison","category_num":25,"category_name":"Strong Belgian Ale","stats":{"OG":[1.048,1.065],"FG":[1.002,1.008],"IBU":[20.0,35.0],"SRM":[5.0,14.0],"ABV":[3.5,5.0]},"fields":{"Impresión general":"Una familia de ales belgas refrescantes, altamente atenuadas, lupuladas y bastante amargas, con un final muy seco y alta carbonatación. Caracterizadas por un perfil de fermentación afrutado, especiado y algunas veces fenólico, el uso de cereales y a veces especias para aportar complejidad. Existe una amplia variedad en cuanto a intensidad alcohólica y color.","Aroma":"Una agradable mezcla de levadura afrutada y especiada con lúpulos. Los ésteres afrutados son de moderados a altos, y generalmente tienen un carácter a cítricos, frutas pomáceas o frutas de carozo. Notas especiadas de bajas a moderadamente altas, que a menudo recuerdan a pimienta negra, pero no a clavo de olor. Los lúpulos son de bajos a moderados y tienen un carácter típico de los lúpulos de Europa continental (especiado, floral, terroso o afrutado). La malta generalmente está en un segundo plano, pero si se detecta, es ligeramente granosa. Especias y hierbas son opcionales, pero no deben dominar. La acidez es opcional (consulte la sección de Comentarios). Las versiones más fuertes tienen una mayor intensidad aromática y pueden añadir un carácter ligero a alcohol y moderado a malta. Las versiones de mesa tienen una menor intensidad y no poseen un carácter a alcohol. Las versiones más oscuras presentan un carácter de malta asociado a los granos más oscuros.","Apariencia":"Color de dorado pálido a ámbar profundo, a veces anaranjado pálido. Espuma duradera, densa y “rocosa”, con color de blanco a marfil. Encaje belga. Sin filtrar, por lo que su claridad es variable (de pobre a buena) y puede ser turbia. Efervescente. Las versiones más oscuras pueden ser de color desde cobrizo a marrón oscuro. Las versiones más alcohólicas pueden ser de un color un poco más profundo.","Sabor":"Un balance entre levadura afrutada y especiada, un moderado lupulado y malta granosa, con un amargor de moderado a alto y un final muy seco. Los matices afrutados y especiados van de medio bajos a medio altos, y el sabor a lúpulo es de bajo a medio, ambos con un carácter similar al aroma (aplican los mismos descriptores). La malta es de baja a media, con un paladar suave y granoso. Atenuación muy alta, nunca con un final pesado ni dulce. Retrogusto amargo y especiado. Especias y hierbas son opcionales, pero en caso de usarse, deben estar en armonía con la levadura. La acidez es opcional (consulte la sección de Comentarios). Las versiones más oscuras tendrán un mayor carácter a malta, incluyendo sabores de las maltas más oscuras. Las versiones más alcohólicas tendrán mayor intensidad de malta y una ligera nota a alcohol.","Sensación en boca":"Cuerpo de ligero a medio ligero. Carbonatación muy alta. Efervescente. Una ligera tibieza alcohólica es opcional. La acidez es rara pero opcional (consulte la sección de Comentarios). Las versiones más fuertes pueden tener un cuerpo de nivel a lo sumo medio y presentar cierta tibieza alcohólica. Las versiones de mesa no poseen tibieza alcohólica.","Comentarios":"Este estilo generalmente describe la versión pálida de intensidad estándar, seguido por las diferencias de las distintas variantes en intensidad de alcohol y color. Las versiones más oscuras tienden a tener mayor carácter de malta y menor amargor aparente de lúpulo, logrando una presentación más balanceada. Las versiones más alcohólicas generalmente tienen más sabor a malta, riqueza, tibieza alcohólica y mayor cuerpo simplemente por la mayor densidad inicial. No hay correlación entre intensidad de alcohol y color. La acidez es totalmente opcional y, de estar presente, es a niveles de bajos a moderados, pudiendo sustituir en cierta medida al amargor en el balance. Una Saison no debería ser ácida y amarga al mismo tiempo. La alta atenuación puede hacer que la cerveza se perciba más amarga de lo que sugiere el valor de IBU. Las versiones pálidas son a menudo más amargas y lupuladas que las versiones más oscuras. Generalmente, la selección de levadura es la que determina el balance entre las notas afrutadas y especiadas, y puede cambiar significativamente el carácter; permita un rango amplio de interpretaciones. Generalmente son llamadas Farmhouse Ale (ale de granja) en Estados Unidos, pero este término no es común en Europa donde simplemente son parte de un grupo mayor de ales artesanales. El uso de Brettanomyces no es típico para este estilo; las Saisons con Brett deberían ser inscritas en el estilo 28A Brett Beer. Una Grisette es un tipo de Saison bastante conocido y popular entre los mineros; las Grisette deben ser inscritas como una 25B Saison, indicando intensidad de Sesión, con el comentario: Grisette con trigo como grano especial.","Historia":"Una ale de provisión (Nota de la Traducción: del francés bière de provision, referido a cervezas reservadas para consumo en los meses cálidos venideros) de la Región Valona, la zona francófona de Bélgica. Originalmente un producto con un bajo nivel de alcohol para no debilitar a los granjeros y trabajadores del campo, pero también existían productos de una intensidad de alcohol apropiada para su venta en tabernas. La saison moderna mejor conocida, Saison Dupont, fue elaborada por primera vez en la década de 1920. La Super Saison de Dupont fue elaborada por primera vez en 1954 y su versión marrón a mediados de la década de 1980. Fantôme inició la producción de sus saisons “de temporada” en 1988. Aunque el estilo conserva su imagen rústica, hoy en día son elaboradas en su mayoría en grandes cervecerías.","Ingredientes característicos":"Malta base pálida. Cereales como trigo, avena, espelta o centeno. Puede contener adjuntos de azúcar. Lúpulos de Europa continental. Levadura de Saison belga especiada y afrutada. Las especias y hierbas son poco comunes, pero permitidas mientras no dominen.","Comparación de estilos":"Las versiones pálidas y de intensidad de alcohol estándar son similares a una Belgian Blond Ale más altamente atenuada, lupulada y amarga, y con un carácter a levadura más intenso. Las versiones pálidas y más alcohólicas son similares a una Belgian Tripel, pero generalmente con una cualidad granosa y rústica, y a veces con un carácter de levadura más especiado.","Instrucciones para la inscripción":"Quien inscriba debe especificar la intensidad de alcohol (mesa, estándar, súper) y el color (pálido, oscuro). Además puede identificar los granos especiales utilizados.","Estadísticas vitales":"OG: 1.048 – 1.065 (estándar) IBU: 20 – 35 FG: 1.002 – 1.008 (estándar) SRM: 5 – 14 (pálida) ABV: 3.5 – 5.0% (mesa) 15 – 22 (oscura) 5.0 – 7.0% (estándar) 7.0 – 9.5% (súper)","Ejemplos comerciales":"Ellezelloise Saison 2000, Lefebvre Saison 1900, Saison Dupont, Saison de Pipaix, Saison Voisin, Boulevard Tank 7","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónalta, europa-occidental, estilo-tradicional"},"glass_color":"#e28000","srm_variable":false,"clarity":"turbia","foam_color":"#F7F4EC","abv_display":"3.5–5%","ibu_display":"20–35","srm_display":"5–14","og_display":"1.048–1.065","fg_display":"1.002–1.008","country":"Bélgica","family":"Pale Ale","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Las versiones fuertes recuerdan a una Tripel más rústica.","ibu_avg":27.5,"ibu_variable":false,"abv_avg":4.2,"abv_variable":false,"summary":"Ale belga refrescante, muy atenuada, lupulada y amarga.","classic_example":"Ellezelloise Saison 2000","foam_level":3,"foam_height":14,"srm_lo_hex":"#fbb123","srm_hi_hex":"#c35900","summary_80":"Una familia de ales belgas refrescantes, altamente atenuadas, lupuladas y bastante amargas, con un final muy seco y alta carbonatación.","distinctive_80":"Las versiones pálidas y de intensidad de alcohol estándar son similares a una Belgian Blond Ale más altamente atenuada, lupulada y amarga.","mini_profile":{"malta":3,"lupulo":2,"cuerpo":3,"carbonatacion":4},"char_tags":[],"ingredients_line":"Malta base pálida. Cereales como trigo, avena, espelta o centeno. Puede contener adjuntos de azúcar.","ingredient_chips":["Malta base pálida","Cereales como trigo"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Malta alta","sabor_highlight":"Amargor alto","apariencia_highlight":"Turbia","boca_highlight":"Carbonatación muy alta","aroma_highlights":["Malta base pálida","Lúpulos de Europa continental","Levadura de Saison belga…"],"sabor_highlights":["Malta base pálida","Lúpulos de Europa continental","Levadura de Saison belga…"],"boca_highlights":["Carbonatación muy alta","Cuerpo pleno"],"apariencia_highlights":["Dorado","Densa","Turbia"],"ingredientes_highlights":["Malta base pálida","Cereales como trigo"],"ingredient_types":{"malta":"Malta base pálida","lupulo":"Lúpulos de Europa continental","levadura":"Levadura de Saison belga…"}},{"code":"25C","name":"Belgian Golden Strong Ale","category_num":25,"category_name":"Strong Belgian Ale","stats":{"OG":[1.07,1.095],"FG":[1.005,1.016],"IBU":[22.0,35.0],"SRM":[3.0,6.0],"ABV":[7.5,10.5]},"fields":{"Impresión general":"Una ale belga muy pálida, altamente atenuada y fuerte, que es más afrutada y lupulada que especiada. Compleja y delicada, con un final seco, cuerpo ligero y alta carbonatación que acentúan el carácter a levadura y lúpulo. Carbonatación burbujeante y efervescente, formando una espuma blanca “rocosa”.","Aroma":"Un complejo bouquet de ésteres afrutados, lúpulos herbáceos y un alcohol que recuerda a pimienta, sobre una base de malta prácticamente neutra. Los ésteres son de moderados a altos, generalmente a frutas pomáceas, en particular a pera. Los lúpulos son herbáceos, florales o especiados en intensidad de baja a moderada. El alcohol y los fenoles generalmente tienen una cualidad perfumada o a pimienta, con intensidad de baja a moderada. La percepción del alcohol debería ser suave, no quemante ni similar al solvente. Malta prácticamente neutra, posiblemente con un carácter ligero a grano dulce.","Apariencia":"Color de amarillo pálido a dorado. Buena claridad. Efervescente. Espuma blanca enorme, duradera y “rocosa” que da paso al característico encaje belga en el vaso a medida que se desvanece.","Sabor":"Perfil del sabor similar al aroma (aplican los mismos descriptores e intensidades) para ésteres, lúpulo, malta, fenoles y alcohol. Los ésteres similares a pera, el alcohol que recuerda a la pimienta, los lúpulos herbáceos y los suaves sabores a malta perduran en el paladar hasta el final largo y seco, y en el retrogusto. Amargor de medio a alto, acentuado por el final seco y la alta carbonatación, que perdura hasta el retrogusto.","Sensación en boca":"Carbonatación muy alta. Efervescente. Cuerpo de ligero a medio, más ligero que lo que sugiere su considerable densidad. La carbonatación acentúa la percepción de ligereza. Tibieza alcohólica suave pero notoria, no quemante ni similar al solvente.","Comentarios":"Muchos nombres de los ejemplos comerciales de este estilo tienen referencias al diablo, haciendo alusión al alto nivel de alcohol y como tributo al ejemplo original (Duvel). Tradicionalmente acondicionada en botella.","Historia":"Desarrollada por la cervecería Moortgat después de la Primera Guerra Mundial como una respuesta a la creciente popularidad de las cervezas Pilsner. Si bien en sus inicios era más oscura, alcanzó su forma moderna en la década de 1970.","Ingredientes característicos":"Malta Pilsner con una cuantiosa adición de adjuntos de azúcar. Lúpulos de Europa continental. Levadura belga afrutada. Agua bastante blanda. Las especias no son tradicionales. 57","Comparación de estilos":"A menudo se confunde con la Belgian Tripel, pero usualmente es más pálida, con un cuerpo más ligero, más crisp y más seca. Se acostumbra a usar una levadura que promueva el desarrollo de ésteres (sobre todo a frutas pomáceas) por encima del carácter especiado en el balance, y tiene un mayor carácter a lúpulo de adición tardía.","Estadísticas vitales":"OG: 1.070 – 1.095 IBU: 22 – 35 FG: 1.005 – 1.016 SRM: 3 – 6 ABV: 7.5 – 10.5%","Ejemplos comerciales":"Brigand, Delirium Tremens, Duvel, Judas, Lucifer, Russian River Damnation","Etiquetas":"intensidad-muy-alta, color-pálido, fermentaciónalta, europa-occidental, estilo-tradicional"},"glass_color":"#fdb832","srm_variable":false,"clarity":"traslucida","foam_color":"#F7F4EC","abv_display":"7.5–10.5%","ibu_display":"22–35","srm_display":"3–6","og_display":"1.07–1.095","fg_display":"1.005–1.016","country":"Bélgica","family":"Strong Ale","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Se confunde con la Tripel, pero más pálida y seca.","ibu_avg":28.5,"ibu_variable":false,"abv_avg":9.0,"abv_variable":false,"summary":"Ale belga muy pálida y fuerte, afrutada y lupulada.","classic_example":"Brigand","foam_level":3,"foam_height":14,"srm_lo_hex":"#ffca5a","srm_hi_hex":"#f8a600","summary_80":"Una ale belga muy pálida, altamente atenuada y fuerte, que es más afrutada y lupulada que especiada.","distinctive_80":"A menudo se confunde con la Belgian Tripel, pero usualmente es más pálida, con un cuerpo más ligero, más crisp y más seca.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":4},"char_tags":[],"ingredients_line":"Malta Pilsner con una cuantiosa adición de adjuntos de azúcar. Lúpulos de Europa continental. Levadura belga afrutada.","ingredient_chips":["Malta Pilsner con una…","Lúpulos de Europa continental"],"balance_pos":2.0,"balance_malta":1,"balance_lupulo":1,"aroma_highlight":"Levadura alto","sabor_highlight":"Amargor alto","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación muy alta","aroma_highlights":["Malta Pilsner con una cuantiosa…","Lúpulos de Europa continental","Levadura belga afrutada"],"sabor_highlights":["Malta Pilsner con una cuantiosa…","Lúpulos de Europa continental","Levadura belga afrutada"],"boca_highlights":["Carbonatación muy alta","Cuerpo medio"],"apariencia_highlights":["Amarillo","Rocosa","Translúcida"],"ingredientes_highlights":["Malta Pilsner con una…","Lúpulos de Europa continental"],"ingredient_types":{"malta":"Malta Pilsner con una cuantiosa…","lupulo":"Lúpulos de Europa continental","levadura":"Levadura belga afrutada"}},{"code":"26A","name":"Belgian Single","category_num":26,"category_name":"Monastic Ale","stats":{"OG":[1.044,1.054],"FG":[1.004,1.01],"IBU":[25.0,45.0],"SRM":[3.0,5.0],"ABV":[4.8,6.0]},"fields":{"Impresión general":"Una cerveza de mesa rubia, amarga y lupulada, muy seca y altamente carbonatada. El agresivo carácter de la levadura belga, afrutado y especiado, junto con el alto amargor predominan en el balance, con un suave paladar de malta a grano dulce de soporte, y un perfil de lúpulo especiado y floral.","Aroma":"Carácter de levadura belga de medio bajo a medio alto, mostrando un carácter afrutado y especiado, junto con lúpulos de medio bajos a medios, de notas especiadas o florales, realzados ocasionalmente por adiciones ligeras de hierbas o especias con perfil cítrico. Malta de soporte de baja a media baja, con notas a pan, galleta cracker, granos o ligeros toques a miel. La expresión afrutada puede variar ampliamente (manzana, pera, pomelo/toronja, limón, naranja, durazno/melocotón, damasco/albaricoque). Los fenoles son típicamente como a pimienta negra o clavo de olor. Goma de mascar es inapropiada.","Apariencia":"Color de amarillo pálido a dorado medio. En general tiene una buena claridad, con una espuma blanca de tamaño moderado, persistente y esponjosa, con el característico encaje belga.","Sabor":"Ligera maltosidad inicial con un carácter a pan, galleta cracker o galleta de miel. Paladar a malta granoso pero suave, y un final crisp, seco y con amargor del lúpulo. Sabor moderado en el paladar a lúpulo especiado o floral. Ésteres moderados de carácter similar al aroma. Fenoles especiados de ligeros a moderados como los encontrados en el aroma. Amargor de medio a alto, acentuado por la sequedad. El carácter a levadura y lúpulo perduran hasta el retrogusto.","Sensación en boca":"Cuerpo de medio ligero a medio. Suave. Carbonatación de media alta a alta, que puede ser algo punzante. No debe tener una tibieza alcohólica perceptible.","Comentarios":"No se elaboran frecuentemente, y a menudo no están etiquetadas ni disponibles fuera del monasterio. También se denomina cerveza del monje, cerveza del hermano, o simplemente una Blond (no usamos este término para evitar 58 confusiones con el muy diferente estilo Belgian Blond Ale). Altamente atenuada, generalmente un 85% o más.","Historia":"Si bien las cervecerías monásticas tienen la tradición de elaborar una cerveza de baja intensidad para la ración diaria de los monjes (Westmalle comenzó a elaborar la suya en 1922), la cerveza amarga y pálida descrita en este estilo es una invención relativamente moderna que refleja los gustos actuales. Westvleteren elaboró la suya por primera vez en 1999, pero reemplazó otros productos antiguos de baja densidad.","Ingredientes característicos":"Malta Pilsner. Levadura belga. Lúpulos de Europa continental.","Comparación de estilos":"Como una interpretación belga de una German Pils de fermentación alta: pálida, lupulada y bien atenuada, pero con un intenso carácter a levadura belga. Tiene menos dulzor, mayor atenuación, menos carácter a malta y es más centrada en el lúpulo que una Belgian Pale Ale. Más parecida a una Belgian Tripel menos intensa, y más altamente lupulada (con su amargor y sequedad) que una Belgian Blond Ale menos intensa.","Estadísticas vitales":"OG: 1.044 – 1.054 IBU: 25 – 45 FG: 1.004 – 1.010 SRM: 3 – 5 ABV: 4.8 – 6.0%","Ejemplos comerciales":"Chimay Gold, La Trappe Puur, Russian River Redemption, St. Bernardus Extra 4, Westmalle Extra, Westvleteren Blond","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónalta, europa-occidental, estilo-artesanal, amarga"},"glass_color":"#ffbf42","srm_variable":false,"clarity":"traslucida","foam_color":"#F7F4EC","abv_display":"4.8–6%","ibu_display":"25–45","srm_display":"3–5","og_display":"1.044–1.054","fg_display":"1.004–1.01","country":"Bélgica","family":"Pale Ale","glass_shape":"goblet","glass_label":"Cáliz / Copa belga","distinctive":"Como una German Pils con levadura belga.","ibu_avg":35.0,"ibu_variable":false,"abv_avg":5.4,"abv_variable":false,"summary":"Cerveza de mesa belga rubia, amarga y muy seca.","classic_example":"Chimay Gold","foam_level":2,"foam_height":10,"srm_lo_hex":"#ffca5a","srm_hi_hex":"#fbb123","summary_80":"Una cerveza de mesa rubia, amarga y lupulada, muy seca y altamente carbonatada.","distinctive_80":"Como una interpretación belga de una German Pils de fermentación alta: pálida, lupulada y bien atenuada.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":3},"char_tags":["amarga"],"ingredients_line":"Malta Pilsner. Levadura belga. Lúpulos de Europa continental.","ingredient_chips":["Malta Pilsner","Levadura belga"],"balance_pos":2.5,"balance_malta":1,"balance_lupulo":2,"aroma_highlight":"Levadura alto","sabor_highlight":"Amargor alto","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta Pilsner","Lúpulos de Europa continental","Levadura belga"],"sabor_highlights":["Malta Pilsner","Lúpulos de Europa continental","Levadura belga"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Amarillo","Esponjosa","Translúcida"],"ingredientes_highlights":["Malta Pilsner","Levadura belga"],"ingredient_types":{"malta":"Malta Pilsner","lupulo":"Lúpulos de Europa continental","levadura":"Levadura belga"}},{"code":"26B","name":"Belgian Dubbel","category_num":26,"category_name":"Monastic Ale","stats":{"OG":[1.062,1.075],"FG":[1.008,1.018],"IBU":[15.0,25.0],"SRM":[10.0,17.0],"ABV":[6.0,7.6]},"fields":{"Impresión general":"Una ale belga de color rojo cobrizo profundo, moderadamente fuerte, maltosa y compleja, con ricos sabores a malta, ésteres de frutas oscuras o deshidratadas y un alcohol ligero, todo mezclado en una presentación que, aunque maltosa, tiene un final bastante seco.","Aroma":"Malta rica de moderada a moderadamente fuerte, con notas a chocolate, azúcar caramelizada o tostadas. Nunca rostizado ni quemado. Ésteres afrutados moderados, a menudo a frutas oscuras o deshidratadas, especialmente uvas pasas y ciruelas, a veces frutas pomáceas o bananas/plátanos. Fenoles especiados y a pimienta de bajos a moderados. Lúpulo típicamente ausente, pero puede tener un bajo carácter especiado, herbáceo o floral. La malta predomina en el balance, con los ésteres y las especias agregando complejidad. Un bajo alcohol suave y perfumado es opcional.","Apariencia":"Color de ámbar oscuro a cobrizo, con una atractiva profundidad de tonos rojizos. Generalmente traslúcida. Espuma blanquecina voluminosa, densa, cremosa y de larga duración.","Sabor":"Perfil de sabor similar al aroma (aplican los mismos descriptores e intensidades) para la malta, ésteres, fenoles, alcohol y lúpulos. Amargor de medio bajo a medio, pero la malta siempre es más prominente en el balance. Los ésteres y fenoles añaden complejidad e interés a la malta, y normalmente el alcohol no se suele percibir. Presenta un sabor rico a malta, a veces dulce, que termina moderadamente seco, con un retrogusto maltoso acentuado por los ésteres y fenoles de levadura.","Sensación en boca":"Cuerpo suave, de medio a medio pleno. Carbonatación media alta, que puede influir en la percepción del cuerpo. Una baja tibieza alcohólica es opcional, nunca quemante ni similar al solvente.","Comentarios":"La mayoría de los ejemplos comerciales están en el rango de 6.5 – 7% ABV. Pueden tener un sabor algo dulce debido a su discreto amargor, pero estas cervezas en realidad son bastante secas.","Historia":"Aunque se producían cervezas oscuras y fuertes desde mucho antes, la Dubbel moderna tiene sus orígenes en la cerveza marrón doble o fuerte producida por primera vez en Westmalle en 1922, cuando la cervecería fue restablecida después de la Primera Guerra Mundial. Otros ejemplos son posteriores a la Segunda Guerra Mundial.","Ingredientes característicos":"Levadura belga esterosa y especiada. El listado de granos da la impresión de ser complejo, aunque muchas versiones tradicionales son bastante sencillas, con los siropes de azúcar caramelizado o azúcares sin refinar y la levadura aportando gran parte de la complejidad. Lúpulos de Europa continental. Las especias no son típicas; si están presentes, deben ser sutiles.","Comparación de estilos":"Tal vez similar a una Dunkles Bock pero con un carácter a azúcar y levadura belga. Similar en intensidad y balance a una Belgian Blond Ale, pero con un perfil a malta y ésteres más rico. Menos fuerte e intensa que una Belgian Dark Strong Ale.","Estadísticas vitales":"OG: 1.062 – 1.075 IBU: 15 – 25 FG: 1.008 – 1.018 SRM: 10 – 17 ABV: 6.0 – 7.6%","Ejemplos comerciales":"Chimay Red, Corsendonk Bruin, La Trappe Dubbel, Rochefort 6, St. Bernardus Pater 6, Westmalle Dubbel","Etiquetas":"intensidad-alta, color-ámbar, fermentación-alta, europa-occidental, estilo-tradicional"},"glass_color":"#c75e00","srm_variable":false,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"6–7.6%","ibu_display":"15–25","srm_display":"10–17","og_display":"1.062–1.075","fg_display":"1.008–1.018","country":"Bélgica","family":"Amber Ale","glass_shape":"goblet","glass_label":"Cáliz / Copa belga","distinctive":"Similar a una Blond Ale, pero con más malta y ésteres.","ibu_avg":20.0,"ibu_variable":false,"abv_avg":6.8,"abv_variable":false,"summary":"Ale belga cobriza, moderadamente fuerte y compleja.","classic_example":"Chimay Red","foam_level":3,"foam_height":14,"srm_lo_hex":"#de7c00","srm_hi_hex":"#b04500","summary_80":"Una ale belga de color rojo cobrizo profundo, moderadamente fuerte, maltosa y compleja, con ricos sabores a malta.","distinctive_80":"Tal vez similar a una Dunkles Bock pero con un carácter a azúcar y levadura belga.","mini_profile":{"malta":3,"lupulo":2,"cuerpo":1,"carbonatacion":3},"char_tags":[],"ingredients_line":"Levadura belga esterosa y especiada.","ingredient_chips":["Levadura belga esterosa y…","Lúpulos de Europa continental"],"balance_pos":1.5,"balance_malta":3,"balance_lupulo":2,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Lúpulos de Europa continental","Levadura belga esterosa y…"],"sabor_highlights":["Lúpulos de Europa continental","Levadura belga esterosa y…"],"boca_highlights":["Carbonatación alta","Cuerpo ligero"],"apariencia_highlights":["Ámbar","Cremosa","Translúcida"],"ingredientes_highlights":["Levadura belga esterosa y…","Lúpulos de Europa continental"],"ingredient_types":{"lupulo":"Lúpulos de Europa continental","levadura":"Levadura belga esterosa y…"}},{"code":"26C","name":"Belgian Tripel","category_num":26,"category_name":"Monastic Ale","stats":{"OG":[1.075,1.085],"FG":[1.008,1.014],"IBU":[20.0,40.0],"SRM":[4.5,7.0],"ABV":[7.5,9.5]},"fields":{"Impresión general":"Una ale belga fuerte, pálida y en cierta medida especiada, con un sabor a malta agradable y redondo, amargor firme y final seco. Bastante aromática, con notas especiadas, afrutadas y a ligero alcohol, combinadas con un carácter limpio a malta de soporte, para producir una bebida con una sorprendente tomabilidad considerando su alto contenido de alcohol.","Aroma":"Bouquet complejo y armonioso a especias, de moderado a significativo, con ésteres afrutados moderados, alcohol bajo, lúpulo bajo y malta ligera. Abundantes fenoles especiados, a pimienta, y a veces, a clavo de olor. Los ésteres recuerdan a menudo a cítricos, como naranjas o limones, pero a veces puede tener un ligero carácter a banana/plátano madura/o. Un aroma a lúpulo bajo, pero identificable, de carácter especiado, floral, y a veces perfumado, es opcional. Los alcoholes son suaves, especiados y de baja intensidad. El carácter a malta es ligero, con una impresión suave y sutil a grano dulce o a miel.","Apariencia":"Color de amarillo profundo a ámbar claro. Buena claridad. Efervescente. Espuma blanca, “rocosa”, cremosa y de larga duración, que da lugar al característico encaje belga en el vaso a medida que se desvanece.","Sabor":"Perfil de sabor similar al aroma (aplican los mismos descriptores) para la malta, ésteres, fenoles, alcohol y lúpulos. Ésteres de bajos a moderados, fenoles de bajos a moderados, lúpulo de bajo a moderado, alcohol bajo, todo bien combinado en una presentación coherente. Amargor de medio a alto, acentuado por un final seco. Amargor moderado en el retrogusto, con un considerable carácter a levadura especiado y afrutado. No debe ser dulce.","Sensación en boca":"Cuerpo de medio ligero a medio, aunque más liviano de lo que sugeriría su considerable densidad. Altamente carbonatada. El contenido de alcohol es engañoso, y su tibieza alcohólica va en un rango de no evidente a ligera. Efervescente. No debe ser pesada.","Comentarios":"Pese al alto contenido de alcohol, no tienen un sabor fuerte a alcohol. Los mejores ejemplos son engañosos, no evidentes. La alta carbonatación y atenuación ayudan a resaltar los variados sabores y aumentar la percepción de un final seco. La mayoría de las versiones tradicionales tienen al menos 30 IBU y son muy secas.","Historia":"Popularizada por el monasterio de Westmalle, fue elaborada por primera vez en 1931.","Ingredientes característicos":"Malta Pilsner, a menudo con adjuntos pálidos de azúcar. Lúpulos de Europa continental. Cepas de levadura belga, especiadas y afrutadas. Las adiciones de especias generalmente no son tradicionales y, si se usan, deben aparecer solo en segundo plano. Agua bastante blanda.","Comparación de estilos":"Puede parecerse a una Belgian Golden Strong Ale, pero es un poco más oscura y tiene un poco más de cuerpo, con más énfasis en los fenoles y menos en los ésteres, y menos lúpulos de adición tardía. No debería parecer una Barleywine rubia.","Estadísticas vitales":"OG: 1.075 – 1.085 IBU: 20 – 40 FG: 1.008 – 1.014 SRM: 4.5 – 7 ABV: 7.5 – 9.5%","Ejemplos comerciales":"Chimay Tripel, La Rulles Tripel, La Trappe Tripel, St. Bernardus Tripel, Val-Dieu Triple, Westmalle Tripel","Etiquetas":"intensidad-alta, color-pálido, fermentación-alta, europa-occidental, estilo-tradicional"},"glass_color":"#f9a909","srm_variable":false,"clarity":"traslucida","foam_color":"#F7F4EC","abv_display":"7.5–9.5%","ibu_display":"20–40","srm_display":"4.5–7","og_display":"1.075–1.085","fg_display":"1.008–
