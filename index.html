  function section(title, text, cls, iconKey, highlights, linkifyCode){
    if(!text) return '';
    const icon = iconKey ? `<span class="msec-icon">${SECTION_ICONS[iconKey]}</span>` : '';
    const hl = (highlights && highlights.length)
      ? `<div class="msec-highlights">${highlights.map(h=>`<span class="msec-highlight">${escapeHTML(h)}</span>`).join('')}</div>`
      : '';
    const body = linkifyCode ? linkifyStyleNames(text, linkifyCode) : escapeHTML(text);
    return `<div class="msec ${cls||''}"><h3>${icon}${title}</h3><p>${body}</p>${hl}</div>`;
  }

  let modalHistory = [];
  let currentModalCode = null;

  function openModal(code){
    modalHistory = [];
    currentModalCode = code;
    renderModal(code);
  }
  let gridScrollY = 0;

  function navigateModal(code){
    const overlayOpen = document.getElementById('modalOverlay').classList.contains('open');
    if(currentModalCode && overlayOpen){
      const overlayEl = document.getElementById('modalOverlay');
      const activeTabBtn = document.querySelector('.mtab.active');
      modalHistory.push({
        code: currentModalCode,
        scrollTop: overlayEl ? overlayEl.scrollTop : 0,
        tab: activeTabBtn ? activeTabBtn.dataset.tab : 'perfil'
      });
    } else {
      gridScrollY = window.scrollY;
      modalHistory.push({ fromGrid: true });
    }
    currentModalCode = code;
    renderModal(code);
    document.getElementById('modalOverlay').scrollTop = 0;
  }
  function goBackModal(){
    if(!modalHistory.length) return;
    const prev = modalHistory.pop();
    if(prev.fromGrid){
      closeModal();
      window.scrollTo(0, gridScrollY);
      return;
    }
    currentModalCode = prev.code;
    renderModal(prev.code);
    if(prev.tab && prev.tab !== 'perfil'){
      const btn = document.querySelector(`.mtab[data-tab="${prev.tab}"]`);
      if(btn) btn.click();
    }
    document.getElementById('modalOverlay').scrollTop = prev.scrollTop;
  }

  function renderModal(code){
    const style = DATA.find(d=>d.code===code);
    if(!style) return;
    const f = style.fields;
    const overlay = document.getElementById('modalOverlay');
    const tagsHTML = (f['Etiquetas']||'').split(',').map(t=>t.trim()).filter(Boolean)
      .map(t=>`<span class="tag">${escapeHTML(t)}</span>`).join('');
    const backBtn = modalHistory.length
      ? `<button class="modal-back" id="modalBackBtn" aria-label="Volver">&larr;</button>` : '';

    document.getElementById('modalContent').innerHTML = `
      <div class="modal-head">
        <div class="modal-glass-wrap">
          ${style.classic_example ? `<div class="classic-example">${escapeHTML(style.classic_example)}</div>` : ''}
          ${glassSVG(style,92)}<div class="glass-label">${style.glass_label}</div>
          <div class="srm-caption stat-chip">${srmCaption(style)}</div>
          <div class="hop-gauge"><div class="hop-row-icons">${hopBitternessRow(style,26)}</div><span class="ibu-num stat-chip">${ibuCaption(style)}</span></div>
          <div class="abv-gauge">${speedometer(style,74)}<span class="abv-num stat-chip">${abvCaption(style)}</span></div>
        </div>
        <div class="modal-head-text">
          <div class="modal-cat">${escapeHTML(style.category_num===99 ? style.category_name : (style.category_num + '. ' + style.category_name))} · ${escapeHTML(style.country)} · ${escapeHTML(style.family)}</div>
          <div class="modal-code">${style.code}${style.suggested_category ? ' · ubicación sugerida: categoría '+escapeHTML(style.suggested_category) : ''}</div>
          <div class="modal-title">${escapeHTML(style.name)}</div>
          <div class="modal-stats-inline">
            <div class="msi-row">
              ${statBox('OG', style.og_display)}
              ${statBox('FG', style.fg_display)}
            </div>
            <div class="msi-row">
              ${statBox('IBU', style.ibu_display)}
              ${statBox('SRM', style.srm_display)}
              ${statBox('ABV', style.abv_display)}
            </div>
          </div>
          ${modalProfileHTML(style)}
        </div>
        ${backBtn}
        <button class="modal-close" id="modalCloseBtn" aria-label="Cerrar">&times;</button>
      </div>
      </div>
      <div class="modal-lede">
        ${section('Impresión general', f['Impresión general'], '', 'general')}
      </div>
      <div class="modal-tabs" role="tablist">
        <button class="mtab active" data-tab="perfil">Perfil</button>
        <button class="mtab" data-tab="ingredientes">Ingredientes</button>
        <button class="mtab" data-tab="comparacion">Comparación</button>
        <button class="mtab" data-tab="ejemplos">Ejemplos</button>
        <button class="mtab" data-tab="contexto">Contexto</button>
      </div>
      <div class="modal-sections">
        <div class="tab-panel" data-panel="perfil">
          ${section('Aroma', f['Aroma'], '', 'aroma', style.aroma_highlights)}
          ${section('Apariencia', f['Apariencia'], '', 'apariencia', style.apariencia_highlights)}
          ${section('Sabor', f['Sabor'], '', 'sabor', style.sabor_highlights)}
          ${section('Sensación en boca', f['Sensación en boca'], '', 'boca', style.boca_highlights)}
        </div>
        <div class="tab-panel" data-panel="ingredientes" hidden>
          ${section('Ingredientes característicos', f['Ingredientes característicos'], '', 'ingredientes', style.ingredientes_highlights)}
          ${section('Instrucciones para la inscripción', f['Instrucciones para la inscripción'], '', 'inscripcion')}
        </div>
        <div class="tab-panel" data-panel="comparacion" hidden>
          ${section('Comparación de estilos', f['Comparación de estilos'], '', 'comparacion', null, style.code)}
        </div>
        <div class="tab-panel" data-panel="ejemplos" hidden>
          ${section('Ejemplos comerciales', f['Ejemplos comerciales'], 'examples', 'ejemplos')}
          ${tagsHTML ? `<div class="msec tags"><h3><span class="msec-icon">${SECTION_ICONS.etiquetas}</span>Etiquetas</h3>${tagsHTML}</div>` : ''}
        </div>
        <div class="tab-panel" data-panel="contexto" hidden>
          ${section('Comentarios', f['Comentarios'], '', 'comentarios')}
          ${section('Historia', f['Historia'], '', 'historia')}
        </div>
      </div>
    `;
    overlay.classList.add('open');
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    const backEl = document.getElementById('modalBackBtn');
    if(backEl) backEl.addEventListener('click', goBackModal);
    document.querySelectorAll('.mtab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.mtab').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const target = btn.dataset.tab;
        document.querySelectorAll('.tab-panel').forEach(p=>{
          p.hidden = p.dataset.panel !== target;
        });
      });
    });
    document.body.style.overflow='hidden';
  }
  function closeModal(){
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow='';
    modalHistory = [];
    currentModalCode = null;
  }
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });
  document.addEventListener('click', (e)=>{
    const link = e.target.closest ? e.target.closest('.style-link') : null;
    if(link){
      e.stopPropagation();
      e.preventDefault();
      navigateModal(link.dataset.code);
    }
  }, true);

  // ---------- Init ----------
  function populateSelects(){
    const catSel = document.getElementById('categorySelect');
    catSel.innerHTML = '<option value="">Estilo BJCP</option>' +
      CATEGORY_ORDER.map(c=>{
        const item = DATA.find(d=>d.category_num===c);
        const label = c===99 ? item.category_name : `${c}. ${item.category_name}`;
        return `<option value="${c}">${escapeHTML(label)}</option>`;
      }).join('');

    const countrySel = document.getElementById('countrySelect');
    countrySel.innerHTML = '<option value="">País</option>' +
      COUNTRY_ORDER.map(c=>`<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join('');

    const familySel = document.getElementById('familyStyleSelect');
    familySel.innerHTML = '<option value="">Familia estilo</option>' +
      FAMILY_ORDER.map(f=>`<option value="${escapeHTML(f)}">${escapeHTML(f)}</option>`).join('');
  }

  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('categorySelect').addEventListener('change', applyFilters);
  document.getElementById('countrySelect').addEventListener('change', applyFilters);
  document.getElementById('familyStyleSelect').addEventListener('change', applyFilters);

  svgDefsOnce();
  populateSelects();
  render(DATA);
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
</script>
</body>
</html>
