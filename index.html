ariar en sabor e intensidad, pero nunca debe opacar la impresión de amargor general. La tomabilidad es un componente crítico de este estilo.","Aroma":"A malta de bajo a moderado, a menudo (pero no siempre) con una ligera cualidad a caramelo. Es común una complejidad de malta a pan, galleta o tostado ligero. Frutosidad de leve a moderada. El aroma a lúpulo varía de nulo a moderado, típicamente con carácter floral, terroso, resinoso o afrutado. Generalmente sin diacetilo, aunque está permitido a niveles muy bajos.","Apariencia":"Color de ámbar pálido a cobrizo claro. Claridad de buena a brillante. Espuma de baja a moderada, con color de blanco a blanquecino. Puede tener muy poca espuma debido a su baja carbonatación.","Sabor":"Amargor de medio a moderadamente alto. Ésteres afrutados de moderadamente bajos a moderadamente altos. Sabor a lúpulo de bajo a moderado, típicamente con carácter terroso, resinoso, afrutado o floral. Maltosidad de baja a media, con un final seco. El perfil a malta es típicamente a pan, galleta o ligeramente tostado. Sabores a caramelo o toffee de bajos a moderados son opcionales. El balance es a menudo decididamente amargo, aunque el amargor no debe sobreponerse completamente al sabor de la malta, los ésteres y el lúpulo. Generalmente sin diacetilo, aunque está permitido a niveles muy bajos.","Sensación en boca":"Cuerpo de ligero a medio ligero. Baja carbonatación, aunque los ejemplos embotellados pueden tener carbonatación moderada.","Comentarios":"Esta categoría agrupa los ejemplos con la menor densidad de la familia de British Bitter. Es conocida típicamente por quienes la consumen simplemente como “Bitter” (aunque quienes la elaboran tienden a referirse a ella 20 como Ordinary Bitter, para distinguirla de los otros ejemplos de esta familia).","Historia":"Consulte los comentarios en la introducción a la categoría.","Ingredientes característicos":"Maltas Pale Ale, ámbar o Crystal. Puede llevar un toque de malta oscura para ajustar el color. Puede usar adjuntos de azúcar, maíz o trigo. Lúpulos ingleses de adición tardía son los más tradicionales, pero cualquier variedad podría ser utilizada; si se usan lúpulos estadounidenses, solo se necesita un ligero toque. Levadura inglesa expresiva.","Comparación de estilos":"Algunas versiones modernas son elaboradas exclusivamente con maltas pálidas, y son conocidas como Golden Ale, Summer Ale o Golden Bitter. El énfasis está en la adición de lúpulo de amargor, a diferencia de las ales estadounidenses, con adiciones agresivas de lúpulo a mitad y final del hervor.","Estadísticas vitales":"OG: 1.030 – 1.039 IBU: 25 – 35 FG: 1.007 – 1.011 SRM: 8 – 14 ABV: 3.2 – 3.8%","Ejemplos comerciales":"Bateman’s XB, Brains Bitter, Brakspear Gravity, Fuller’s Chiswick Bitter, Greene King IPA, Tetley’s Original Bitter","Etiquetas":"intensidad-baja, color-ámbar, fermentación-alta, islas-británicas, estilo-tradicional, familia-ale-ámbar"},"glass_color":"#d77200","srm_variable":false,"clarity":"brillante","foam_color":"#F7F4EC","abv_display":"3.2–3.8%","ibu_display":"25–35","srm_display":"8–14","og_display":"1.03–1.039","fg_display":"1.007–1.011","country":"Inglaterra","family":"Amber Ale","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Solo con malta pálida se llama Golden Ale o Summer Ale.","ibu_avg":30.0,"ibu_variable":false,"abv_avg":3.5,"abv_variable":false,"summary":"Ale inglesa de sesión, ligera y muy fácil de tomar.","classic_example":"Bateman’s XB","foam_level":1,"foam_height":7,"srm_lo_hex":"#ea8f00","srm_hi_hex":"#c35900","summary_80":"Su baja densidad, nivel de alcohol y carbonatación hacen que esta sea una cerveza de sesión fácil de tomar.","distinctive_80":"Algunas versiones modernas son elaboradas exclusivamente con maltas pálidas, y son conocidas como Golden Ale, Summer Ale o Golden Bitter.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Maltas Pale Ale, ámbar o Crystal. Puede llevar un toque de malta oscura para ajustar el color.","ingredient_chips":["Maltas Pale Ale","Lúpulos ingleses de adición…"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Malta media","sabor_highlight":"Amargor alto","apariencia_highlight":"Brillante","boca_highlight":"Cuerpo medio","aroma_highlights":["Maltas Pale Ale","Lúpulos ingleses de adición…","Levadura inglesa expresiva"],"sabor_highlights":["Maltas Pale Ale","Lúpulos ingleses de adición…","Levadura inglesa expresiva"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Ámbar","Brillante"],"ingredientes_highlights":["Maltas Pale Ale","Lúpulos ingleses de adición…"],"ingredient_types":{"malta":"Maltas Pale Ale","lupulo":"Lúpulos ingleses de adición…","levadura":"Levadura inglesa expresiva"}},{"code":"11B","name":"Best Bitter","category_num":11,"category_name":"British Bitter","stats":{"OG":[1.04,1.048],"FG":[1.008,1.012],"IBU":[25.0,40.0],"SRM":[8.0,16.0],"ABV":[3.8,4.6]},"fields":{"Impresión general":"Una cerveza de sesión sabrosa y refrescante. Algunos ejemplos pueden estar más balanceados a la malta, pero esta no debe opacar la impresión de amargor general. La tomabilidad es un componente crítico de este estilo.","Aroma":"A malta de bajo a moderado, a menudo (pero no siempre) con una cualidad a caramelo de baja a medio baja. Es común una complejidad de malta a pan, galleta o tostado ligero. Frutosidad de leve a moderada. El aroma a lúpulo varía de nulo a moderado, típicamente con carácter floral, terroso, resinoso o afrutado. Generalmente sin diacetilo, aunque está permitido a niveles muy bajos.","Apariencia":"Color de ámbar pálido a cobrizo medio. Claridad de buena a brillante. Espuma de baja a moderada, con color de blanco a blanquecino. Puede tener muy poca espuma debido a su baja carbonatación.","Sabor":"Amargor de medio a moderadamente alto. Ésteres afrutados de moderadamente bajos a moderadamente altos. Sabor a lúpulo de bajo a moderado, típicamente con carácter terroso, resinoso, afrutado o floral. Maltosidad de baja a media, con un final seco. El perfil a malta es típicamente a pan, galleta o ligeramente tostado. Sabores a caramelo o toffee de bajos a moderados son opcionales. El balance es a menudo decididamente amargo, aunque el amargor no debe sobreponerse completamente al sabor de la malta, los ésteres y el lúpulo. Generalmente sin diacetilo, aunque está permitido a niveles muy bajos.","Sensación en boca":"Cuerpo de medio ligero a medio. Baja carbonatación, aunque los ejemplos embotellados pueden tener carbonatación moderada.","Comentarios":"Sabor a malta más evidente que en una Ordinary Bitter; esta es una ale de bajo alcohol más intensa.","Historia":"Consulte los comentarios en la introducción a la categoría.","Ingredientes característicos":"Maltas Pale Ale, ámbar o Crystal. La mayoría contiene azúcar. Puede usar un toque de malta Caramelo u oscura para ajustar el color. Puede usar maíz o trigo. Lúpulos ingleses de adición tardía son los más tradicionales, pero cualquier variedad podría ser utilizada; si se usan lúpulos estadounidenses, solo se necesita un ligero toque. Levadura inglesa expresiva.","Comparación de estilos":"Más alcohol que una Ordinary Bitter y a menudo utilizando ingredientes de mayor calidad. Menos alcohol que una Strong Bitter. Más carácter a malta base o Caramelo, y más color que una British Golden Ale. El énfasis está en la adición de lúpulo de amargor, a diferencia de las ales estadounidenses, con adiciones agresivas de lúpulo a mitad y final del hervor.","Estadísticas vitales":"OG: 1.040 – 1.048 IBU: 25 – 40 FG: 1.008 – 1.012 SRM: 8 – 16 ABV: 3.8 – 4.6%","Ejemplos comerciales":"Adnams Southwold Bitter, Fuller’s London Pride, Harvey’s Sussex Best Bitter, Salopian Darwin’s Origin, Surrey Hills Shere Drop, Timothy Taylor Landlord","Etiquetas":"intensidad-estándar, color-ámbar, fermentaciónalta, islas-británicas, estilo-tradicional, familia-ale-ámbar"},"glass_color":"#cf6900","srm_variable":false,"clarity":"brillante","foam_color":"#F7F4EC","abv_display":"3.8–4.6%","ibu_display":"25–40","srm_display":"8–16","og_display":"1.04–1.048","fg_display":"1.008–1.012","country":"Inglaterra","family":"Amber Ale","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Más alcohol que una Ordinary Bitter, menos que una Strong Bitter.","ibu_avg":32.5,"ibu_variable":false,"abv_avg":4.2,"abv_variable":false,"summary":"Ale inglesa de sesión sabrosa y refrescante.","classic_example":"Adnams Southwold Bitter","foam_level":1,"foam_height":7,"srm_lo_hex":"#ea8f00","srm_hi_hex":"#b54c00","summary_80":"Una cerveza de sesión sabrosa y refrescante.","distinctive_80":"Más alcohol que una Ordinary Bitter y a menudo utilizando ingredientes de mayor calidad. Menos alcohol que una Strong Bitter.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Maltas Pale Ale, ámbar o Crystal. La mayoría contiene azúcar.","ingredient_chips":["Maltas Pale Ale","Lúpulos ingleses de adición…"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Malta media","sabor_highlight":"Amargor alto","apariencia_highlight":"Brillante","boca_highlight":"Cuerpo medio","aroma_highlights":["Maltas Pale Ale","Lúpulos ingleses de adición…","Levadura inglesa expresiva"],"sabor_highlights":["Maltas Pale Ale","Lúpulos ingleses de adición…","Levadura inglesa expresiva"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Ámbar","Brillante"],"ingredientes_highlights":["Maltas Pale Ale","Lúpulos ingleses de adición…"],"ingredient_types":{"malta":"Maltas Pale Ale","lupulo":"Lúpulos ingleses de adición…","levadura":"Levadura inglesa expresiva"}},{"code":"11C","name":"Strong Bitter","category_num":11,"category_name":"British Bitter","stats":{"OG":[1.048,1.06],"FG":[1.01,1.016],"IBU":[30.0,50.0],"SRM":[8.0,18.0],"ABV":[4.6,6.2]},"fields":{"Impresión general":"Una ale británica amarga con una intensidad de promedio a moderadamente fuerte. El balance puede variar desde bastante parejo entre malta y lúpulos a algo amargo. La tomabilidad es un componente crítico de este estilo. Es un estilo un tanto extenso que permite una interpretación amplia por quien elabora la cerveza.","Aroma":"Lúpulo de moderadamente bajo a moderadamente alto, típicamente con un carácter floral, terroso, resinoso o afrutado. Malta de media a media alta, opcionalmente con un carácter a caramelo de bajo a moderado. Ésteres afrutados de medio bajos a medio altos. Generalmente sin diacetilo, aunque está permitido a niveles muy bajos.","Apariencia":"Color de ámbar pálido a cobrizo profundo. Claridad de buena a brillante. Espuma de baja a moderada, con color de blanco a blanquecino. Una espuma baja es aceptable cuando la carbonatación también sea baja.","Sabor":"Amargor de medio a medio alto con sabor evidente a malta como apoyo. El perfil de malta es típicamente a pan, galleta, frutos secos o ligeramente tostado, y opcionalmente tiene un sabor a caramelo o toffee de moderadamente bajo a moderado. Lúpulo de moderado a moderadamente alto, típicamente con un carácter floral, terroso, resinoso o afrutado. El amargor y sabor del lúpulo deberían ser perceptibles, pero no deberían dominar totalmente a los sabores de la malta. Ésteres afrutados de moderadamente bajos a altos. Un bajo sabor a alcohol es opcional. Final de seco a semi seco. Generalmente sin diacetilo, aunque está permitido a niveles muy bajos.","Sensación en boca":"Cuerpo de medio ligero a medio pleno. Carbonatación de baja a moderada, aunque en las versiones embotelladas será mayor. Las versiones más fuertes pueden tener una ligera tibieza alcohólica, pero este carácter no debería ser demasiado alto.","Comentarios":"Actualmente en Inglaterra, “ESB” es una marca registrada de Fuller’s, y nadie piensa en ella como una clase genérica de cerveza. Es una cerveza única (pero muy bien conocida) que posee un perfil de malta muy intenso y complejo que no se encuentra en otros ejemplos, a menudo llevando a quienes juzgan a penalizar excesivamente las Strong Bitter inglesas tradicionales. En Estados Unidos, el término ESB ha sido adoptado para describir una ale de tipo británica maltosa, amarga, rojiza y de intensidad de alcohol estándar (para Estados Unidos), y es un estilo popular de cerveza artesanal. Esto puede causar que algunas de las personas al juzgarlas, piensen en las ESB de los pubs cerveceros de Estados Unidos como representativas de este estilo.","Historia":"Consulte los comentarios en la introducción a la categoría. Las Strong Bitter pueden ser consideradas como versiones de Best Bitter de mayor densidad (aunque no necesariamente “de mejor calidad”, ya que las Best Bitter son tradicionalmente el mejor producto de la cervecería). Las Pale Ale británicas son generalmente consideradas como una cerveza pálida, amarga, de intensidad de alcohol para exportación y de alta calidad, que se aproxima a grandes rasgos a una Strong Bitter, aunque reformulada para el embotellado (incluyendo un mayor nivel de carbonatación). Aunque la Pale Ale británica moderna es considerada una bitter embotellada, históricamente los estilos eran diferentes.","Ingredientes característicos":"Maltas Pale Ale, ámbar o Crystal, puede usar un toque de malta negra para ajustar el color. Puede usar adjuntos de azúcar, maíz o trigo. Lúpulos ingleses de adición tardía son los más tradicionales, pero cualquier variedad podría ser utilizada; si se usan lúpulos estadounidenses, solo se necesita un ligero toque. Levadura inglesa expresiva. Las versiones de Burton usan agua con sulfatos de medios a altos, lo que puede incrementar la percepción de sequedad, además de añadir un aroma y sabor mineral o sulfuroso.","Comparación de estilos":"Sabor a malta y lúpulo más evidente que en una Special o Best Bitter, así como también más alcohol. Las versiones más fuertes pueden solaparse un poco con las British Strong Ale, aunque las Strong Bitter tenderán a ser más pálidas y amargas. Más sabor a malta (particularmente caramelo) y ésteres que una American Pale Ale, con un carácter diferente de lúpulos de adición tardía.","Estadísticas vitales":"OG: 1.048 – 1.060 IBU: 30 – 50 FG: 1.010 – 1.016 SRM: 8 – 18 ABV: 4.6 – 6.2% 21","Ejemplos comerciales":"Bass Ale, Bateman’s Triple XB, Robinsons Trooper, Samuel Smith’s Organic Pale Ale, Shepherd Neame Bishop’s Finger, Summit Extra Pale Ale","Etiquetas":"intensidad-estándar, color-ámbar, fermentaciónalta, islas-británicas, estilo-tradicional, familia-ale-ámbar"},"glass_color":"#cb6200","srm_variable":false,"clarity":"brillante","foam_color":"#F7F4EC","abv_display":"4.6–6.2%","ibu_display":"30–50","srm_display":"8–18","og_display":"1.048–1.06","fg_display":"1.01–1.016","country":"Inglaterra","family":"Amber Ale","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Más malta, lúpulo y alcohol que una Best Bitter.","ibu_avg":40.0,"ibu_variable":false,"abv_avg":5.4,"abv_variable":false,"summary":"Ale inglesa amarga de intensidad media a fuerte.","classic_example":"Bass Ale","foam_level":1,"foam_height":7,"srm_lo_hex":"#ea8f00","srm_hi_hex":"#a63e00","summary_80":"Una ale británica amarga con una intensidad de promedio a moderadamente fuerte.","distinctive_80":"Sabor a malta y lúpulo más evidente que en una Special o Best Bitter, así como también más alcohol.","mini_profile":{"malta":3,"lupulo":3,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Maltas Pale Ale, ámbar o Crystal, puede usar un toque de malta negra para ajustar el color.","ingredient_chips":["Maltas Pale Ale","Lúpulos ingleses de adición…"],"balance_pos":2.0,"balance_malta":3,"balance_lupulo":3,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Brillante","boca_highlight":"Cuerpo medio","aroma_highlights":["Maltas Pale Ale","Lúpulos ingleses de adición…","Levadura inglesa expresiva"],"sabor_highlights":["Maltas Pale Ale","Lúpulos ingleses de adición…","Levadura inglesa expresiva"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Ámbar","Brillante"],"ingredientes_highlights":["Maltas Pale Ale","Lúpulos ingleses de adición…"],"ingredient_types":{"malta":"Maltas Pale Ale","lupulo":"Lúpulos ingleses de adición…","levadura":"Levadura inglesa expresiva"}},{"code":"12A","name":"British Golden Ale","category_num":12,"category_name":"Pale Commonwealth Beer","stats":{"OG":[1.038,1.053],"FG":[1.006,1.012],"IBU":[20.0,45.0],"SRM":[2.0,5.0],"ABV":[3.8,5.0]},"fields":{"Impresión general":"Cerveza pálida, amarga, balanceada hacia el lúpulo y de intensidad de media a moderadamente fuerte. La tomabilidad y una cualidad refrescante son componentes críticos del estilo, ya que inicialmente era una cerveza para la temporada de verano.","Aroma":"El aroma a lúpulo va de moderadamente bajo a moderadamente alto, y se puede usar cualquier variedad: los más comunes son los florales, herbáceos o terrosos de origen inglés, y los lúpulos estadounidenses cítricos. Con frecuencia se destacará una sola variedad de lúpulo. Bajo aroma a malta con carácter a pan, sin caramelo. Aroma afrutado de bajo a medio bajo por el lúpulo más que por ésteres. Es opcional un ligero diacetilo.","Apariencia":"Color de pajizo a dorado. Claridad de buena a brillante. Espuma blanca de baja a moderada. Cuando la carbonatación sea baja, también es aceptable que la espuma lo sea.","Sabor":"Amargor de medio a medio alto. El sabor del lúpulo va de moderado a moderadamente alto, de cualquier variedad, aunque los sabores cítricos son cada vez más comunes. El carácter de la malta va de bajo a medio bajo, generalmente con carácter a pan con quizá un ligero sabor a galleta. Los sabores a caramelo suelen estar ausentes. El amargor y el sabor del lúpulo deben ser pronunciados. Ésteres de bajos a moderadamente bajos. Final de seco a semi seco. El amargor aumenta con el nivel de alcohol, pero debe estar siempre balanceado. Es opcional un ligero diacetilo.","Sensación en boca":"Cuerpo de ligero a medio. Carbonatación de baja a moderada al servirla tirada (draft), aunque en las versiones comerciales embotelladas será más alta. Las versiones más fuertes pueden tener una ligera tibieza alcohólica, pero este carácter no debe ser demasiado alto.","Comentarios":"Cerveza bien lupulada y refrescante que hace hincapié en los lúpulos. Servida más fría que las bitters tradicionales, este estilo se posicionó originalmente como una cerveza refrescante de verano pero ahora, a menudo, se produce durante todo el año. Antes se elaboraba con lúpulos ingleses, pero cada vez se utilizan más lúpulos estadounidenses con sabores cítricos. Las Golden Ale también se denominan Golden Bitter, Summer Ale o British Blonde Ale. Se pueden encontrar en cask, barril y botella.","Historia":"Las Golden Ale modernas se desarrollaron en Inglaterra para competir con las lagers fuertemente publicitadas. Aunque es difícil identificar cuál fue la primera, muchos creen que la cerveza Summer Lightning de Hop Back, elaborada por primera vez en 1986, fue la que potenció el estilo.","Ingredientes característicos":"Malta pálida de color ligero o malta Lager, que actúan como lienzo en blanco para el carácter del lúpulo. Puede utilizar adjuntos como azúcar, maíz o trigo. Se utilizan con frecuencia lúpulos ingleses, aunque las variedades estadounidenses cítricas son cada vez más comunes. Levadura británica de fermentación un tanto limpia. 22","Comparación de estilos":"Más parecida a una American Pale Ale que a cualquier otra cerveza, aunque suele tener menos alcohol e incluir ingredientes británicos. No tiene caramelo y tiene menos ésteres en comparación con las British Bitter y Pale Ale. Igual de secas que las British Bitter, pero con menos carácter de malta para apoyar el lúpulo, lo que resulta en un balance diferente. A menudo utiliza (y destaca) lúpulos estadounidenses, más que la mayoría de los otros estilos británicos modernos. Balance de lúpulo entre una Blonde Ale y una American Pale Ale.","Estadísticas vitales":"OG: 1.038 – 1.053 IBU: 20 – 45 FG: 1.006 – 1.012 SRM: 2 – 5 ABV: 3.8 – 5.0%","Ejemplos comerciales":"Adnams Explorer, Crouch Vale Brewers Gold, Golden Hill Exmoor Gold, Hop Back Summer Lightning, Oakham JHB, Spitfire Golden Ale","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónalta, islas-británicas, estilo-artesanal, familia-ale-pálida, amarga"},"glass_color":"#ffc44e","srm_variable":false,"clarity":"brillante","foam_color":"#F7F4EC","abv_display":"3.8–5%","ibu_display":"20–45","srm_display":"2–5","og_display":"1.038–1.053","fg_display":"1.006–1.012","country":"Inglaterra","family":"Pale Ale","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Se parece más a una American Pale Ale que a otras inglesas.","ibu_avg":32.5,"ibu_variable":false,"abv_avg":4.4,"abv_variable":false,"summary":"Ale inglesa pálida y amarga, ideal de verano.","classic_example":"Adnams Explorer","foam_level":1,"foam_height":7,"srm_lo_hex":"#ffd878","srm_hi_hex":"#fbb123","summary_80":"Cerveza pálida, amarga, balanceada hacia el lúpulo y de intensidad de media a moderadamente fuerte.","distinctive_80":"Más parecida a una American Pale Ale que a cualquier otra cerveza. No tiene caramelo y tiene menos ésteres que las British Bitter y Pale Ale.","mini_profile":{"malta":1,"lupulo":3,"cuerpo":2,"carbonatacion":2},"char_tags":["amarga"],"ingredients_line":"Malta pálida de color ligero o malta Lager, que actúan como lienzo en blanco para el carácter del lúpulo.","ingredient_chips":["Malta pálida de color ligero…","Se utilizan con frecuencia…"],"balance_pos":3.0,"balance_malta":1,"balance_lupulo":3,"aroma_highlight":"Lúpulo alto","sabor_highlight":"Lúpulo alto","apariencia_highlight":"Brillante","boca_highlight":"Cuerpo medio","aroma_highlights":["Malta pálida de color ligero o…","Malta pálida de color ligero o…","Levadura británica de…"],"sabor_highlights":["Malta pálida de color ligero o…","Malta pálida de color ligero o…","Levadura británica de…"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Pajizo","Blanca","Brillante"],"ingredientes_highlights":["Malta pálida de color ligero…","Se utilizan con frecuencia…"],"ingredient_types":{"malta":"Malta pálida de color ligero o…","lupulo":"Malta pálida de color ligero o…","levadura":"Levadura británica de…"}},{"code":"12B","name":"Australian Sparkling Ale","category_num":12,"category_name":"Pale Commonwealth Beer","stats":{"OG":[1.038,1.05],"FG":[1.004,1.006],"IBU":[20.0,35.0],"SRM":[4.0,7.0],"ABV":[4.5,6.0]},"fields":{"Impresión general":"Una ale pálida, bien balanceada, muy carbonatada y refrescante, adecuada para tomar en climas cálidos. Bastante amarga, con un perfil moderado de lúpulo herbáceo y especiado, y ésteres a frutas pomáceas. Sabores de malta suaves y neutros, con un cuerpo más pleno pero un final crisp y muy atenuado.","Aroma":"Bastante suave y limpio con una mezcla balanceada de ésteres, lúpulo, malta y levadura, todo en intensidad de baja a moderada. Los ésteres son frecuentemente a peras y manzanas, opcionalmente con un toque muy ligero a banana/plátano. Los lúpulos son terrosos, herbáceos o pueden mostrar el característico aroma a hierro de la variedad Pride of Ringwood. La malta puede variar desde un grano neutro hasta un dulzor moderado o un ligero pan; no debe ser evidente el caramelo. Los ejemplos más frescos pueden tener un leve aroma sulfuroso y a levadura.","Apariencia":"Color de amarillo profundo a ámbar claro, a menudo dorado medio. Espuma blanca, alta, esponjosa y persistente, con burbujas muy pequeñas. Efervescencia notable debido a una alta carbonatación. Claridad brillante si se decanta, pero normalmente se sirve con levadura para darle una apariencia brumosa.","Sabor":"Sabor a malta redondo de bajo a medio, entre grano y pan. Al principio presenta un sabor suave y con dulzor de malta, que evoluciona en el paladar hacia un amargor de medio a medio alto, que balancea la maltosidad inicial. Los sabores a caramelo suelen estar ausentes. Muy atenuada, dando un final seco y crisp con un amargor persistente, aunque el cuerpo aporta una impresión de plenitud. Sabor a lúpulo de medio a medio alto que perdura en el retrogusto, algo terroso y posiblemente herbáceo, resinoso, a pimienta o hierro, pero no floral. Ésteres de medio bajos a medio altos, a menudo a peras y manzanas. La banana/plátano es opcional, pero nunca debe dominar. Puede ser ligeramente mineral o sulfurosa, especialmente si la levadura está presente. No debe ser insípida.","Sensación en boca":"Carbonatación de alta a muy alta, con burbujas que llenan la boca, y un picor carbónico crisp y burbujeante. Cuerpo de medio a medio pleno, inclinándose al lado más pleno si se sirve con levadura. Suave pero gaseosa. Las versiones más fuertes pueden tener una ligera tibieza alcohólica, pero las versiones de menor alcohol no. Muy bien atenuada; no debería tener ningún dulzor residual.","Comentarios":"Coopers ha estado elaborando su emblemática Sparkling Ale desde 1862, aunque la fórmula ha cambiado a lo largo de los años. En la actualidad, la cerveza tiene una claridad brillante si se decanta, pero quien la sirve en el bar suele verter la mayor parte de la cerveza en un vaso, luego girar la botella y vaciar toda la levadura también en el vaso. En algunos bares, la botella se hace rodar por la barra. Cuando se sirve tirada (draft), la cervecería le indica a quienes la sirven que inviertan el barril para mezclar la levadura. La apariencia brumosa del estilo parece ser una preferencia del consumidor moderno. Siempre está naturalmente carbonatada, incluso en el barril. Es una cerveza de consumo inmediato, que se disfruta mejor fresca.","Historia":"Los registros cerveceros muestran que la mayor parte de la cerveza australiana elaborada en el siglo XIX eran XXX (mild) y porter tiradas. La ale en botella se desarrolló originalmente para competir con las Pale Ale embotelladas importadas de las cervecerías británicas, como Bass y Wm Younger’s Monk. A principios del siglo XX, las Pale Ale embotelladas pasaron de moda y se pusieron en boga las cervezas lager “más ligeras”. Muchas Sparkling y Pale Ale australianas se etiquetaban como ales, pero en realidad eran lagers de fermentación baja con un listado de granos muy similar a las ales que reemplazaron. Coopers de Adelaida, Australia Meridional, es la única cervecería que queda produciendo el estilo Sparkling Ale.","Ingredientes característicos":"Malta australiana pálida de 2 hileras, con un horneado ligero. Pueden utilizarse variedades de malta Lager. Pequeñas cantidades de malta Crystal solo para ajuste de color. Los ejemplos modernos no utilizan adjuntos, el azúcar de caña solo se usa para la carbonatación en botella. Los ejemplos históricos utilizaban un 45% de malta de 2 hileras y un 30% de malta con más proteínas (6 hileras), completando con alrededor de un 25% de azúcar para diluir el contenido de nitrógeno. Tradicionalmente se utilizaban lúpulos australianos, Cluster y Goldings, hasta que fueron sustituidos por Pride of Ringwood a mediados de la década de 1960. Levadura de tipo Burton altamente atenuante (típica cepa tipo australiana). Perfil de agua variable, normalmente bajo en carbonatos y moderados sulfatos.","Comparación de estilos":"Superficialmente similar a las Pale Ale inglesas, aunque mucho más carbonatada, con menos caramelo, menos lúpulos de adición tardía, y destacando la cepa de levadura y la variedad de lúpulos característicos. Más amarga de lo que podrían sugerir los IBU debido a la alta atenuación, baja densidad final y lúpulos algo ásperos.","Estadísticas vitales":"OG: 1.038 – 1.050 IBU: 20 – 35 FG: 1.004 – 1.006 SRM: 4 – 7 ABV: 4.5 – 6.0%","Ejemplos comerciales":"Coopers Sparkling Ale","Etiquetas":"intensidad-estándar, color-pálido, fermentaciónalta, pacífico, estilo-tradicional, familia-ale-pálida"},"glass_color":"#faac12","srm_variable":false,"clarity":"turbia","foam_color":"#F7F4EC","abv_display":"4.5–6%","ibu_display":"20–35","srm_display":"4–7","og_display":"1.038–1.05","fg_display":"1.004–1.006","country":"Australia","family":"Pale Ale","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Como una Pale Ale inglesa pero mucho más carbonatada.","ibu_avg":27.5,"ibu_variable":false,"abv_avg":5.2,"abv_variable":false,"summary":"Ale pálida australiana, muy carbonatada y amarga.","classic_example":"Coopers Sparkling Ale","foam_level":2,"foam_height":10,"srm_lo_hex":"#ffbf42","srm_hi_hex":"#f39c00","summary_80":"Una ale pálida, bien balanceada, muy carbonatada y refrescante, adecuada para tomar en climas cálidos.","distinctive_80":"Superficialmente similar a las Pale Ale inglesas, aunque mucho más carbonatada, con menos caramelo, menos lúpulos de adición tardía.","mini_profile":{"malta":2,"lupulo":3,"cuerpo":2,"carbonatacion":4},"char_tags":[],"ingredients_line":"Malta australiana pálida de 2 hileras, con un horneado ligero. Pueden utilizarse variedades de malta Lager.","ingredient_chips":["Malta australiana pálida de 2…","Pequeñas cantidades de malta…"],"balance_pos":2.5,"balance_malta":2,"balance_lupulo":3,"aroma_highlight":"Malta media","sabor_highlight":"Lúpulo alto","apariencia_highlight":"Turbia","boca_highlight":"Carbonatación muy alta","aroma_highlights":["Malta australiana pálida de 2…","Tradicionalmente se utilizaban…","Levadura de tipo Burton…"],"sabor_highlights":["Malta australiana pálida de 2…","Tradicionalmente se utilizaban…","Levadura de tipo Burton…"],"boca_highlights":["Carbonatación muy alta","Cuerpo medio"],"apariencia_highlights":["Amarillo","Esponjosa","Turbia"],"ingredientes_highlights":["Malta australiana pálida de 2…","Pequeñas cantidades de malta…"],"ingredient_types":{"malta":"Malta australiana pálida de 2…","lupulo":"Tradicionalmente se utilizaban…","levadura":"Levadura de tipo Burton…"}},{"code":"12C","name":"English IPA","category_num":12,"category_name":"Pale Commonwealth Beer","stats":{"OG":[1.05,1.07],"FG":[1.01,1.015],"IBU":[40.0,60.0],"SRM":[6.0,14.0],"ABV":[5.0,7.5]},"fields":{"Impresión general":"Una ale pálida británica, amarga, moderadamente fuerte, muy bien atenuada, con un final seco, y con aroma y sabor a lúpulo. Los ingredientes británicos clásicos proporcionan el perfil de sabor más auténtico.","Aroma":"A lúpulo de moderado a moderadamente alto, con carácter típicamente floral, especiado a pimienta, o cítrico a naranja. Un ligero aroma a lúpulo agregado como dry hop es aceptable, pero no obligatorio. Malta de media baja a media con carácter a pan o galleta, opcionalmente con una presencia de malta a caramelo o tostado moderadamente baja. Se acepta una frutosidad de baja a moderada. Una ligera nota sulfurosa es opcional.","Apariencia":"El color oscila entre el dorado y el ámbar profundo, pero la mayoría son bastante pálidas. Debería ser traslúcida, aunque las versiones con dry hop sin filtrar pueden ser un poco turbias. La espuma es de tamaño moderado y persistente, con un color blanquecino.","Sabor":"El lúpulo es de medio a alto en sabor, con un amargor de moderado a fuerte. El sabor del lúpulo debe ser similar al aroma (floral, especiado a pimienta o cítrico a naranja). El sabor de la malta debe estar entre medio bajo y medio, y en cierta medida con carácter a pan, opcionalmente con matices a galleta, tostadas, toffee o caramelo de ligeros a medio ligeros. Frutosidad de media baja a media. El final es de muy seco a semi seco, y el amargor puede persistir en el retrogusto, pero no debe ser áspero. El balance se inclina hacia el lúpulo, pero la malta debe seguir siendo un apoyo evidente. Si se utiliza agua con alto contenido de sulfato, suele tener un final seco y claramente mineral, un cierto sabor sulfuroso y un amargor persistente. En las versiones más fuertes, se puede notar un cierto sabor a alcohol limpio.","Sensación en boca":"Suave, con cuerpo de medio ligero a medio, sin astringencia derivada del lúpulo. Una carbonatación de media a media alta puede aportar una sensación general de sequedad, a pesar de la presencia de malta de apoyo. En las versiones más fuertes, se puede percibir una tibieza alcohólica baja y suave.","Comentarios":"Los atributos de la IPA que eran importantes para su llegada en buenas condiciones a la India, fueron que estaba muy bien atenuada y fuertemente lupulada. El simple hecho de que la IPA se enviara así, no significa que otras cervezas, como la porter, no se enviaran también a la India, o que la IPA se haya inventado para ser enviada a la India, o que la IPA tuviera más lúpulo que otras cervezas de guarda o que el nivel de alcohol fuera inusual para la época. Muchos ejemplos modernos etiquetados como IPA son bastante débiles en intensidad. Según CAMRA (Campaign for Real Ale), “las supuestas IPA con graduaciones de alrededor del 3.5% no son fieles al estilo”. El historiador de la cerveza inglesa Martyn Cornell ha comentado que las cervezas de este tipo “no se distinguen realmente de una Ordinary Bitter”. Así que optamos por estar de acuerdo con estas fuentes para nuestra Guía, en lugar de lo que algunas cervecerías británicas modernas están llamando IPA; solo hay que ser conscientes de que estos dos tipos principales de IPA existen en el mercado británico actual. Las cervezas eran enviadas en casks de roble con uso previo, por lo que el estilo no debería tener ningún carácter a roble o a Brett.","Historia":"Originalmente era una ale pálida de guarda (stock ale) de Londres, que se envió por primera vez a la India a finales del siglo XVIII. George Hodgson de Bow Brewery no creó el estilo, pero fue el primer cervecero conocido en dominar 23 el mercado. Tras una disputa comercial, la Compañía Británica de las Indias Orientales le encargó a Samuel Allsopp que recreara (y reformulara) la cerveza en 1823 utilizando el agua de Burton rica en sulfatos. El nombre India Pale Ale no se utilizó hasta alrededor de 1830. La intensidad y la popularidad disminuyeron con el tiempo, y el estilo prácticamente desapareció en la segunda mitad del siglo XX. Aunque se mantuvo la IPA más fuerte del tipo Burton, el nombre también se aplicó a productos lupulados, de menor densidad y a menudo embotellados (una tendencia que continúa en algunos ejemplos británicos modernos). El estilo experimentó un redescubrimiento por parte de la cerveza artesanal en la década de 1980, y es lo que se describe en esta Guía. Los ejemplos modernos se inspiran en las versiones clásicas, pero no debe suponerse que tienen un linaje ininterrumpido con exactamente el mismo perfil. White Shield es probablemente el ejemplo con el linaje más largo, que se remonta a las Burton IPA fuertes de antaño y fue elaborada por primera vez en 1829.","Ingredientes característicos":"Malta Pale Ale. Lúpulo inglés, especialmente en adiciones tardías. Levadura ale británica de alta atenuación. En algunas versiones puede utilizarse azúcar refinado. Es opcional un carácter a sulfatos del agua tipo Burton.","Comparación de estilos":"Generalmente tendrá más lúpulos de adición tardía, y menor frutosidad y caramelo que las British Bitter y Pale Ale. Tiene menos intensidad de lúpulo y un sabor a malta más pronunciado que las típicas American IPA.","Estadísticas vitales":"OG: 1.050 – 1.070 IBU: 40 – 60 FG: 1.010 – 1.015 SRM: 6 – 14 ABV: 5.0 – 7.5%","Ejemplos comerciales":"Berkshire Lost Sailor IPA, Fuller’s Bengal Lancer, Marston’s Old Empire IPA, Meantime London IPA, Thornbridge Jaipur, Worthington White Shield","Etiquetas":"intensidad-alta, color-pálido, fermentación-alta, islas-británicas, estilo-tradicional, familia-ipa, amarga"},"glass_color":"#de7c00","srm_variable":false,"clarity":"turbia","foam_color":"#F5F1E6","abv_display":"5–7.5%","ibu_display":"40–60","srm_display":"6–14","og_display":"1.05–1.07","fg_display":"1.01–1.015","country":"Inglaterra","family":"IPA","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Menos lúpulo pero más malta que una American IPA.","ibu_avg":50.0,"ibu_variable":false,"abv_avg":6.2,"abv_variable":false,"summary":"Ale pálida inglesa, amarga y bien atenuada.","classic_example":"Berkshire Lost Sailor IPA","foam_level":2,"foam_height":10,"srm_lo_hex":"#f8a600","srm_hi_hex":"#c35900","summary_80":"Una ale pálida británica, amarga, moderadamente fuerte, muy bien atenuada, con un final seco, y con aroma y sabor a lúpulo.","distinctive_80":"Generalmente tendrá más lúpulos de adición tardía, y menor frutosidad y caramelo que las British Bitter y Pale Ale.","mini_profile":{"malta":2,"lupulo":3,"cuerpo":2,"carbonatacion":3},"char_tags":["amarga"],"ingredients_line":"Malta Pale Ale. Lúpulo inglés, especialmente en adiciones tardías. Levadura ale británica de alta atenuación.","ingredient_chips":["Malta Pale Ale","Lúpulo inglés"],"balance_pos":2.5,"balance_malta":2,"balance_lupulo":3,"aroma_highlight":"Lúpulo alto","sabor_highlight":"Lúpulo alto","apariencia_highlight":"Turbia","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta Pale Ale","Lúpulo inglés","Levadura ale británica de alta…"],"sabor_highlights":["Malta Pale Ale","Lúpulo inglés","Levadura ale británica de alta…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Dorado","Turbia"],"ingredientes_highlights":["Malta Pale Ale","Lúpulo inglés"],"ingredient_types":{"malta":"Malta Pale Ale","lupulo":"Lúpulo inglés","levadura":"Levadura ale británica de alta…"}},{"code":"13A","name":"Dark Mild","category_num":13,"category_name":"Brown British Beer","stats":{"OG":[1.03,1.038],"FG":[1.008,1.013],"IBU":[10.0,25.0],"SRM":[14.0,25.0],"ABV":[3.0,3.8]},"fields":{"Impresión general":"Una ale británica de sesión, oscura, de baja densidad, centrada en la malta, muy apropiada para tomar en cantidad. Refrescante, aunque sabrosa a pesar de su intensidad, con una amplia expresión de malta oscura o azúcar morena.","Aroma":"A malta de bajo a moderado, y puede tener algo de frutosidad. La expresión de la malta puede adoptar un amplio rango de caracteres, que puede incluir caramelo, toffee, granoso, tostado, a frutos secos, a chocolate o ligeramente rostizado. Un aroma bajo a lúpulo terroso o floral es opcional. Un muy ligero diacetilo es opcional.","Apariencia":"Color de cobrizo a marrón oscuro o caoba. Generalmente traslúcida, aunque tradicionalmente no se filtra. Espuma de baja a moderada, con color de blanquecino a canela; la retención puede ser pobre.","Sabor":"Generalmente una cerveza maltosa, aunque puede tener una muy amplia variedad de sabores a base de malta y levadura (p. ej.: maltoso, dulce, caramelo, toffee, tostadas, frutos secos, chocolate, café, rostizado, fruta, regaliz, ciruela, uvas pasas) sobre una base a pan, galletas o tostado. Puede terminar entre dulce y seco. Las versiones con maltas más oscuras pueden tener un final seco y rostizado. Amargor de bajo a moderado, suficiente para proporcionar algo de balance, pero no como para dominar a la malta. Ésteres afrutados moderados son opcionales. Es opcional un bajo sabor a lúpulo. Un ligero diacetilo es opcional.","Sensación en boca":"Cuerpo de ligero a medio. Carbonatación generalmente de baja a media baja. Las versiones con base rostizada pueden tener una ligera astringencia. Las versiones más dulces pueden aparentar una 24 sensación en boca bastante plena para su densidad. No debe ser sin gas, aguada ni delgada.","Comentarios":"La mayoría son cervezas de sesión, de baja densidad y en torno al 3.2%, aunque algunas versiones se pueden elaborar en el rango más fuerte (4%+) para exportación, festivales, ocasiones especiales o de temporada. Generalmente se sirve desde un cask; las versiones embotelladas de bajo alcohol a menudo no soportan bien el transporte. Es posible una amplia gama de interpretaciones. Existen versiones pálidas (de ámbar medio a marrón claro), pero son aún más escasas que las Dark Mild; esta Guía solo describe la versión oscura moderna.","Historia":"Históricamente, la “mild” era simplemente una cerveza no envejecida, y podía usarse como un adjetivo para distinguirla de cervezas de guarda envejecidas o más altamente lupuladas. Las mild modernas tienen sus orígenes en las ales tipo X más débiles del siglo XIX, que comenzaron a ser más oscuras en la década de 1880, pero que solo después de la Primera Guerra Mundial se volvieron de color marrón oscuro. En su uso actual, el término implica una cerveza de menor intensidad y con menos amargor de lúpulo que las bitters. La Guía describe la versión británica moderna. Actualmente, el término “mild” ha perdido popularidad entre quienes consumen cerveza, y muchas cervecerías ya no lo usan. Es cada vez más escasa. No existe una conexión o relación histórica entre la mild y la porter.","Comparación de estilos":"Algunas versiones pueden parecerse a una English Porter moderna de baja densidad. Mucho menos dulce que la London Brown Ale.","Ingredientes característicos":"Maltas base británicas pálidas (a menudo con bastantes dextrinas), malta Crystal, maltas oscuras o azúcar morena como adjuntos, también puede incluir adjuntos tales como hojuelas de maíz, y se puede colorear con caramelo cervecero. Levadura ale inglesa expresiva. Cualquier tipo de lúpulo, ya que su carácter es tenue y rara vez se percibe.","Estadísticas vitales":"OG: 1.030 – 1.038 IBU: 10 – 25 FG: 1.008 – 1.013 SRM: 14 – 25 ABV: 3.0 – 3.8%","Ejemplos comerciales":"Brain’s Dark, Greene King XX Mild, Hobson’s Champion Mild, Mighty Oak Oscar Wilde, Moorhouse Black Cat, Theakston Traditional Mild","Etiquetas":"intensidad-baja, color-oscuro, fermentación-alta, islas-británicas, estilo-tradicional, familia-ale-marrón"},"glass_color":"#9e3400","srm_variable":false,"clarity":"traslucida","foam_color":"#D9B183","abv_display":"3–3.8%","ibu_display":"10–25","srm_display":"14–25","og_display":"1.03–1.038","fg_display":"1.008–1.013","country":"Inglaterra","family":"Brown Ale","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Mucho menos dulce que una London Brown Ale.","ibu_avg":17.5,"ibu_variable":false,"abv_avg":3.4,"abv_variable":false,"summary":"Ale inglesa de sesión, oscura y centrada en la malta.","classic_example":"Brain’s Dark","foam_level":1,"foam_height":7,"srm_lo_hex":"#c35900","srm_hi_hex":"#7b1a00","summary_80":"Una ale británica de sesión, oscura, de baja densidad, centrada en la malta, muy apropiada para tomar en cantidad.","distinctive_80":"Algunas versiones pueden parecerse a una English Porter moderna de baja densidad.","mini_profile":{"malta":2,"lupulo":1,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Maltas base británicas pálidas (a menudo con bastantes dextrinas), malta Crystal, maltas oscuras o azúcar morena como adjuntos.","ingredient_chips":["Maltas base británicas…","Levadura ale inglesa expresiva"],"balance_pos":1.5,"balance_malta":2,"balance_lupulo":1,"aroma_highlight":"Malta media","sabor_highlight":"Malta media","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":["Maltas base británicas pálidas…","Cualquier tipo de lúpulo","Levadura ale inglesa expresiva"],"sabor_highlights":["Maltas base británicas pálidas…","Cualquier tipo de lúpulo","Levadura ale inglesa expresiva"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Cobrizo","Canela","Translúcida"],"ingredientes_highlights":["Maltas base británicas…","Levadura ale inglesa expresiva"],"ingredient_types":{"malta":"Maltas base británicas pálidas…","lupulo":"Cualquier tipo de lúpulo","levadura":"Levadura ale inglesa expresiva"}},{"code":"13B","name":"British Brown Ale","category_num":13,"category_name":"Brown British Beer","stats":{"OG":[1.04,1.052],"FG":[1.008,1.013],"IBU":[20.0,30.0],"SRM":[12.0,22.0],"ABV":[4.2,5.9]},"fields":{"Impresión general":"Una ale británica marrón, maltosa y acaramelada, sin los sabores rostizados de una porter. Balanceada y llena de sabor, pero por lo general un poco más fuerte que la mayoría de las cervezas promedio del Reino Unido.","Aroma":"Ligero aroma a malta dulce con notas a toffee, frutos secos o chocolate ligero, y una cualidad a caramelo de ligera a fuerte. También se puede percibir un ligero pero atractivo aroma a lúpulo floral o terroso. Un ligero aroma afrutado puede ser evidente, pero no debe dominar.","Apariencia":"Color de ámbar oscuro a marrón rojizo oscuro. Traslúcida. Espuma de baja a moderada, con color de blanquecino a canela claro.","Sabor":"Dulzor de malta de suave a moderado, con un carácter a caramelo de ligero a fuerte, y un final de seco a medio. La malta también puede tener un carácter a frutos secos, tostado, a galleta, toffee o chocolate ligero. Amargor de medio bajo a medio. El balance del lúpulo y la malta varía de equilibrado a maltoso. Un bajo sabor a lúpulo floral o terroso es opcional. Ésteres afrutados de bajos a moderados son opcionales.","Sensación en boca":"Cuerpo de medio ligero a medio. Carbonatación de media a media alta.","Comentarios":"Una categoría amplia con diferentes interpretaciones posibles, que van desde cervezas de colores más claros a lupuladas o a más profundas, más oscuras y centradas en el caramelo; sin embargo, ninguna de las versiones tiene sabores fuertemente rostizados. Las Double Brown Ale más fuertes fueron más populares en el pasado, pero son muy difíciles de encontrar hoy en día. Aunque las London Brown Ale se comercializan utilizando el nombre Brown Ale, las incluimos como un estilo de evaluación distinto debido a diferencias significativas en el balance (especialmente el dulzor) y la graduación alcohólica; sin embargo, eso no quiere decir que no estén en la misma familia.","Historia":"La Brown Ale tiene una larga historia en Gran Bretaña, aunque diferentes productos han usado ese nombre en diversos períodos. La Brown Ale moderna es una creación del siglo XX, y no es igual a los productos históricos con el mismo nombre. Han sido elaboradas en una amplia gama de densidades, pero las Brown Ale modernas son generalmente las interpretaciones más fuertes (según los estándares actuales del Reino Unido). Este estilo se basa en las Brown Ale británicas modernas más fuertes, no en las versiones históricas, ni en la London Brown Ale más dulce descrita en la categoría Historical Beer. En la actualidad, es un producto principalmente embotellado, pero no de forma exclusiva.","Ingredientes característicos":"Malta base Mild Ale o Pale Ale británicas, junto a maltas Caramelo. También puede tener pequeñas cantidades de maltas más oscuras (p. ej.: chocolate) para proporcionar color y el carácter a frutos secos. Las variedades de lúpulo inglés son las más auténticas.","Comparación de estilos":"Balance más maltoso que las British Bitter, con más sabores a malta de los granos más oscuros. Más fuerte que una Dark Mild. Menos rostizada que una English Porter. Más fuerte y mucho menos dulce que la London Brown Ale.","Estadísticas vitales":"OG: 1.040 – 1.052 IBU: 20 – 30 FG: 1.008 – 1.013 SRM: 12 – 22 ABV: 4.2 – 5.9%","Ejemplos comerciales":"AleSmith Nut Brown Ale, Cigar City Maduro Brown Ale, Maxim Double Maxim, Newcastle Brown Ale, Riggwelter Yorkshire Ale, Samuel Smith’s Nut Brown Ale","Etiquetas":"intensidad-estándar, color-ámbar, fermentaciónalta, islas-británicas, estilo-tradicional, familia-ale-marrón"},"glass_color":"#b04500","srm_variable":false,"clarity":"traslucida","foam_color":"#D9B183","abv_display":"4.2–5.9%","ibu_display":"20–30","srm_display":"12–22","og_display":"1.04–1.052","fg_display":"1.008–1.013","country":"Inglaterra","family":"Brown Ale","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Más fuerte que una Dark Mild, menos rostizada que una Porter.","ibu_avg":25.0,"ibu_variable":false,"abv_avg":5.1,"abv_variable":false,"summary":"Ale inglesa marrón, maltosa y acaramelada.","classic_example":"AleSmith Nut Brown Ale","foam_level":1,"foam_height":7,"srm_lo_hex":"#cf6900","srm_hi_hex":"#8e2900","summary_80":"Una ale británica marrón, maltosa y acaramelada, sin los sabores rostizados de una porter. Balanceada y llena de sabor.","distinctive_80":"Balance más maltoso que las British Bitter, con más sabores a malta de los granos más oscuros. Más fuerte que una Dark Mild.","mini_profile":{"malta":2,"lupulo":1,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"Malta base Mild Ale o Pale Ale británicas, junto a maltas Caramelo.","ingredient_chips":["Malta base Mild Ale o Pale…","Ej.: chocolate) para…"],"balance_pos":1.5,"balance_malta":2,"balance_lupulo":1,"aroma_highlight":"Malta baja","sabor_highlight":"Malta media","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta base Mild Ale o Pale Ale…"],"sabor_highlights":["Malta base Mild Ale o Pale Ale…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Ámbar","Canela","Translúcida"],"ingredientes_highlights":["Malta base Mild Ale o Pale…","Ej.: chocolate) para…"],"ingredient_types":{"malta":"Malta base Mild Ale o Pale Ale…"}},{"code":"13C","name":"English Porter","category_num":13,"category_name":"Brown British Beer","stats":{"OG":[1.04,1.052],"FG":[1.008,1.014],"IBU":[18.0,35.0],"SRM":[20.0,30.0],"ABV":[4.0,5.4]},"fields":{"Impresión general":"Una ale inglesa marrón oscuro, de intensidad moderada, con un discreto carácter rostizado y amargo. Puede tener una gama de sabores rostizados, generalmente sin carácter quemado, y a menudo tiene un perfil maltoso a chocolate y caramelo.","Aroma":"A malta de moderadamente bajo a moderado, con carácter tostado, a pan y galleta, con un rostizado suave, a menudo como chocolate. Una complejidad de maltas adicional puede estar presente como caramelo, frutos secos o dulzor de toffee. Puede tener hasta un nivel moderado de lúpulo floral o terroso. Ésteres afrutados moderados son opcionales, pero deseables. Un ligero diacetilo es opcional.","Apariencia":"Color de marrón a marrón oscuro, a menudo con destellos rubí. Buena claridad, aunque puede ser opaca. Espuma moderada con color de blanquecino a canela claro, y con retención de regular a buena.","Sabor":"Sabor maltoso moderado a pan, galleta y tostado, con un rostizado de chocolate de leve a moderado, y a menudo un significativo carácter a caramelo, frutos secos o toffee, posiblemente con niveles más bajos de sabores más oscuros como café o regaliz. No debe tener un carácter quemado o un rostizado áspero, aunque pequeñas cantidades pueden aportar una complejidad a chocolate amargo. Es opcional un sabor a lúpulo, hasta moderado, terroso o floral. Ésteres afrutados de bajos a moderados. Un amargor de medio bajo a medio varía el balance de ligeramente maltoso a ligeramente amargo, con un final de bastante seco a ligeramente dulce. Es opcional un diacetilo moderadamente bajo.","Sensación en boca":"Cuerpo de medio ligero a medio. Carbonatación de media baja a media alta. Textura cremosa de ligera a moderada.","Comentarios":"Esta descripción de estilo hace referencia a la versión moderna de la English Porter, y no a todas las posibles variaciones históricas de cada región donde existió. Las recreaciones históricas se deberían inscribir en la categoría 27 Historical Beer, con una descripción apropiada que detalle el perfil de la cerveza. Los ejemplos artesanales modernos en el Reino Unido son más intensos y lupulados.","Historia":"La porter se originó en Londres a principios del siglo XVIII, y se desarrolló como una versión más altamente lupulada y envejecida (de guarda) de la Brown Beer popular en esa época. Evolucionó muchas veces a partir de varios 25 desarrollos tecnológicos y de ingredientes (como la invención de la malta negra tipo Black Patent en 1817 y la elaboración de cerveza industrial a gran escala), así como de las preferencias de los consumidores, las guerras y la política fiscal. Se convirtió en un estilo muy popular y ampliamente exportado a principios del siglo XIX, antes de declinar en la década de 1870 cuando cambió a una cerveza de baja densidad y sin añejamiento. A medida que las densidades continuaron disminuyendo en todas las cervezas del Reino Unido en la primera mitad del siglo XX, muchos estilos dejaron de ser elaborados (incluyendo la porter, que desapareció en la década de 1950). La era de la cerveza artesanal condujo a su reintroducción en 1978. Se dice que el nombre se deriva de su popularidad entre la clase obrera de Londres, que realizaba varios trabajos de transporte de carga de esa época. Predecesora de varias interpretaciones regionales a lo largo del tiempo, así como de todas las stout (que originalmente fueron llamadas “stout porter”). No existe una conexión o relación histórica entre mild y porter.","Ingredientes característicos":"El listado de granos varía, pero siempre hay algo involucrado para producir el color oscuro. Son comunes las maltas chocolate u otras maltas rostizadas, malta Caramelo, azúcares cerveceros y similares. Las porter tipo londinense suelen utilizar malta marrón como sabor característico.","Comparación de estilos":"Difiere de la American Porter en que generalmente tiene sabores más suaves, más dulces y más acaramelados, menor densidad, y a menudo menos alcohol; las American Porter también suelen tener más carácter a lúpulo. Más sustanciosa y rostizada que una British Brown Ale. Densidad más alta que una Dark Mild.","Estadísticas vitales":"OG: 1.040 – 1.052 IBU: 18 – 35 FG: 1.008 – 1.014 SRM: 20 – 30 ABV: 4.0 – 5.4%","Ejemplos comerciales":"Bateman’s Salem Porter, Burton Bridge Burton Porter, Fuller’s London Porter, Nethergate Old Growler Porter, RCH Old Slug Porter, Samuel Smith Taddy Porter","Etiquetas":"intensidad-estándar, color-oscuro, fermentaciónalta, islas-británicas, estilo-tradicional, familia-porter, maltosa"},"glass_color":"#7b1a00","srm_variable":false,"clarity":"opaca","foam_color":"#D9B183","abv_display":"4–5.4%","ibu_display":"18–35","srm_display":"20–30","og_display":"1.04–1.052","fg_display":"1.008–1.014","country":"Inglaterra","family": n tostadas, galletas inglesas, galletas integrales dulces (tipo Graham), butterscotch o a bizcochos de soletilla (Nota de la Traducción: ladyfingers, bizcocho de forma alargada, dulce y esponjoso que se suele usar en la elaboración del tiramisú). Se permite una ligera frutosidad a frutas pomáceas y un leve aroma a lúpulos ingleses (terroso, floral, cítrico a naranja, especiado, etc.).","Apariencia":"Color de cobrizo profundo a marrón oscuro. Traslúcida. Espuma cremosa, blanquecina, de baja a moderada retención.","Sabor":"Malta con carácter tostado y a pan en intensidad media, con notas a caramelo y toffee, terminando con una ligera sequedad rostizada. Es posible encontrar un amplio rango de sabores a azúcar caramelizada y a pan tostado, con descriptores similares a los utilizados en el aroma. Maltosidad y perfil de fermentación limpios. Son apropiados ligeros ésteres y sabores a lúpulos (descriptores similares a los del aroma). Amargor suficiente para evitar ser empalagosa, pero con un final y retrogusto maltosos.","Sensación en boca":"Cuerpo de medio bajo a medio. Carbonatación de baja a moderada. Puede ser moderadamente cremosa.","Comentarios":"Consulte la introducción a la categoría para comentarios detallados. Puede no parecer tan amarga como indican las especificaciones debido a la mayor densidad final y el dulzor residual. Es un producto típicamente de barril, pero en cierto modo poco común. No malinterprete la ligera sequedad rostizada como humo; este no debe estar presente en estas cervezas.","Historia":"Consulte la introducción a la categoría. Los nombres con Shilling de estas ales fueron utilizados para cervezas mild (no envejecidas) antes de la Primera Guerra Mundial, pero los estilos adquirieron su perfil moderno solo después de la Segunda Guerra Mundial.","Ingredientes característicos":"La versión más simple es con malta Pale Ale, pero también se pueden utilizar maltas para color, azúcares, maíz, trigo, maltas tipo Crystal, colorantes y una variedad de omentarios":"Consulte la introducción a la categoría para comentarios detallados. Puede no parecer tan amarga como indican las especificaciones debido a la mayor densidad final y el dulzor residual. No malinterprete la ligera sequedad rostizada como humo; este no debe estar presente en estas cervezas.","Historia":"Consulte la introducción a la categoría. Los nombres con Shilling de estas ales fueron utilizados para cervezas mild (no envejecidas) antes de la Primera Guerra Mundial, pero los estilos adquirieron su perfil moderno solo después de la Segunda Guerra Mundial.","Ingredientes característicos":"La versión más simple es con malta Pale Ale y malta para color, pero también se pueden utilizar azúcares, maíz, trigo, maltas tipo Crystal, colorantes y una variedad de otros granos. Levadura limpia. Agua blanda. Sin malta ahumada con turba.","Comparación de estilos":"Consulte la introducción a la categoría. Similar a otras ales escocesas en el perfil de sabor, de color más ligero y más intensa que una Scottish Light. Similar en intensidad de alcohol a la Ordinary Bitter, pero con un perfil de sabor y balance diferentes.","Estadísticas vitales":"OG: 1.035 – 1.040 IBU: 10 – 20 FG: 1.010 – 1.015 SRM: 12 – 20 ABV: 3.3 – 3.9%","Ejemplos comerciales":"McEwan’s 70/-, Orkney Raven Ale","Etiquetas":"intensidad-baja, color-ámbar, fermentación-alta, islas-británicas, estilo-tradicional, familia-ale-ámbar"},"glass_color":"#b54c00","srm_variable":false,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"3.3–3.9%","ibu_display":"10–20","srm_display":"12–20","og_display":"1.035–1.04","fg_display":"1.01–1.015","country":"Escocia","family":"Amber Ale","glass_shape":"nonic","glass_label":"Pinta inglesa (nonic)","distinctive":"Más intensa que la Scottish Light.","ibu_avg":15.0,"ibu_variable":false,"abv_avg":3.6,"abv_variable":false,"summary":"Ale escocesa maltosa de alcohol moderado-bajo.","classic_example":"McEwan’s 70/-","foam_level":1,"foam_height":7,"srm_lo_hex":"#cf6900"," slúcida. Espuma cremosa, blanquecina, de baja a moderada retención.","Sabor":"Malta con carácter tostado y a pan en intensidad media, con notas a caramelo y toffee, terminando con una ligera sequedad rostizada. Es posible encontrar un amplio rango de sabores a azúcar caramelizada y pan tostado, con 27 descriptores similares a los utilizados en el aroma. Maltosidad y perfil de fermentación limpios. Son apropiados ligeros ésteres y sabores a lúpulos (descriptores similares a los del aroma). Amargor suficiente para evitar ser empalagosa, pero con un final y retrogusto maltosos.","Sensación en boca":"Cuerpo medio. Carbonatación de moderadamente baja a moderada. Puede ser moderadamente cremosa.","Comentarios":"Consulte la introducción a la categoría para comentarios detallados. Puede no parecer tan amarga como indican las especificaciones debido a la mayor densidad final y el dulzor residual. No malinterprete la ligera sequedad rostizada como humo; este no debe estar presente en estas cervezas. Las versiones al estilo estadounidense son a menudo de mayor intensidad de alcohol (similar al enfoque estadounidense de las Irish Red Ale).","Historia":"Consulte la introducción a la categoría. Los nombres con Shilling de estas ales fueron utilizados para cervezas mild (no envejecidas) antes de la Primera Guerra Mundial, pero los estilos adquirieron su perfil moderno solo después de la Segunda Guerra Mundial.","Ingredientes característicos":"La versión más simple es con malta Pale Ale y malta para color, pero también se pueden utilizar azúcares, maíz, trigo, maltas tipo Crystal, colorantes y una variedad de otros granos. Levadura limpia. Agua blanda. Sin malta ahumada con turba.","Comparación de estilos":"Consulte la introducción a la categoría. Más intensa que otras ales escocesas, pero con un perfil de sabor parecido. Similar en intensidad de alcohol a la Best Bitter y a la Strong Bitter, pero con un perfil de sabor y balance diferentes.","Estadísticas vitales":"OG: 1.040 – 1.0
