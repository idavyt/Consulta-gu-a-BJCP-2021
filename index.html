1.014","country":"Bélgica","family":"Strong Ale","glass_shape":"goblet","glass_label":"Cáliz / Copa belga","distinctive":"Como una Golden Strong Ale, algo más oscura.","ibu_avg":30.0,"ibu_variable":false,"abv_avg":8.5,"abv_variable":false,"summary":"Ale belga fuerte, pálida y algo especiada.","classic_example":"Chimay Tripel","foam_level":3,"foam_height":14,"srm_lo_hex":"#fdb832","srm_hi_hex":"#f39c00","summary_80":"Una ale belga fuerte, pálida y en cierta medida especiada, con un sabor a malta agradable y redondo, amargor firme y final seco.","distinctive_80":"Puede parecerse a una Belgian Golden Strong Ale, pero es un poco más oscura y tiene un poco más de cuerpo.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":2},"char_tags":[],"ingredients_line":"Malta Pilsner, a menudo con adjuntos pálidos de azúcar. Lúpulos de Europa continental.","ingredient_chips":["Malta Pilsner","Lúpulos de Europa continental"],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Levadura alto","sabor_highlight":"Amargor alto","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":["Malta Pilsner","Lúpulos de Europa continental","Cepas de levadura belga"],"sabor_highlights":["Malta Pilsner","Lúpulos de Europa continental","Cepas de levadura belga"],"boca_highlights":["Cuerpo medio","Carbonatación media"],"apariencia_highlights":["Amarillo","Cremosa","Translúcida"],"ingredientes_highlights":["Malta Pilsner","Lúpulos de Europa continental"],"ingredient_types":{"malta":"Malta Pilsner","lupulo":"Lúpulos de Europa continental","levadura":"Cepas de levadura belga"}},{"code":"26D","name":"Belgian Dark Strong Ale","category_num":26,"category_name":"Monastic Ale","stats":{"OG":[1.075,1.11],"FG":[1.01,1.024],"IBU":[20.0,35.0],"SRM":[12.0,22.0],"ABV":[8.0,12.0]},"fields":{"Impresión general":"Una ale belga oscura, compleja y muy fuerte, con una deliciosa combinación de riqueza de malta, sabores a frutas oscuras y notas especiadas. Compleja, rica, suave y peligrosa.","Aroma":"Una mezcla compleja y bastante intensa de riqueza de malta y frutosidad profunda, acentuada por los fenoles especiados y el alcohol. El carácter a malta es de 59 moderadamente alto a alto, y tiene una base profunda a pan y a tostado, con notas a caramelo oscuro, pero sin la impresión a malta oscura o rostizada. Los ésteres son de moderadamente bajos a fuertes, y recuerdan a uvas pasas, ciruelas, cerezas deshidratadas, higos, dátiles o ciruelas pasas. Pueden estar presentes fenoles especiados como a pimienta negra o vainilla, no a clavo de olor, con un carácter en segundo plano, de nivel de bajo a moderado. El alcohol es suave, especiado, perfumado o similar a rosas, de bajo a moderado, pero nunca quemante ni similar al solvente. El lúpulo normalmente no se percibe, pero si está presente puede agregar un ligero carácter especiado, floral o herbáceo.","Apariencia":"Color de ámbar profundo a marrón cobrizo profundo (el término oscuro [dark] en el nombre del estilo implica un color más profundo que el dorado, no negro). Espuma enorme, densa, como mousse, persistente, y con color de crema a canela claro. Generalmente traslúcida.","Sabor":"Maltosidad rica y compleja, pero no pesada en el final. El carácter del sabor es similar al aroma (los mismos comentarios sobre la malta, ésteres, fenoles, alcohol y lúpulo también se aplican aquí). Paladar con riqueza de malta moderada, que puede aportar una impresión dulce si el amargor es bajo. Por lo general tiene un final de seco a moderadamente seco, aunque puede llegar a ser moderadamente dulce. Amargor de medio bajo a moderado; el alcohol proporciona algo de balance a la malta. Generalmente con un balance rico a malta, pero puede ser bastante equilibrado con el amargor. Los sabores complejos y variados deben mezclarse suave y armoniosamente, y a menudo se benefician del envejecimiento. El final no debe ser pesado o almibarado.","Sensación en boca":"Carbonatación alta pero no punzante. Tibieza alcohólica suave pero perceptible. El cuerpo puede variar de medio ligero a medio pleno y cremoso. La mayoría son de cuerpo medio. 60","Comentarios":"También conocida como Belgian Quad, principalmente fuera de Bélgica (Quadruple es el nombre de una cerveza específica). Tiene un rango de interpretación más amplio que el de otros estilos belgas. Las versiones tradicionales tienden a ser más secas que muchas de las versiones comerciales modernas, que pueden ser bastante dulces y con cuerpo pleno. Muchos ejemplos son conocidos simplemente por su intensidad de alcohol o designación de color. Algunos pueden estar etiquetados como Grand Cru, pero esto es más una declaración de calidad que de estilo.","Historia":"Westvleteren comenzó a elaborar su versión justo antes de la Segunda Guerra Mundial, con Chimay y Rochefort sumando sus ejemplos justo después. Otras cervecerías monásticas crearon sus productos hacia finales del siglo XX, pero algunas cervecerías seculares ya habían comenzado a producir cervezas similares a partir de 1960, aproximadamente.","Ingredientes característicos":"Levadura belga esterosa y especiada. El listado de granos da la impresión de ser complejo, aunque muchas versiones tradicionales son bastante sencillas, con los siropes de azúcar caramelizado o azúcares sin refinar y la levadura aportando gran parte de la complejidad. Lúpulos de Europa continental. Las especias no son típicas; si están presentes, deben ser sutiles.","Comparación de estilos":"Como una Belgian Dubbel más intensa, con un cuerpo más pleno y mayor riqueza de malta. No tan amarga o lupulada como una Belgian Tripel, pero de similar intensidad.","Estadísticas vitales":"OG: 1.075 – 1.110 IBU: 20 – 35 FG: 1.010 – 1.024 SRM: 12 – 22 ABV: 8.0 – 12.0%","Ejemplos comerciales":"Achel Extra Bruin, Boulevard The Sixth Glass, Chimay Blue, Rochefort 10, St. Bernardus Abt 12, Westvleteren 12","Etiquetas":"intensidad-muy-alta, color-ámbar, fermentaciónalta, europa-occidental, estilo-tradicional","Instrucciones para la inscripción":"Se debe especificar, o bien un estilo de la lista detallada a continuación, o bien una cerveza histórica diferente que no esté descrita en ninguna otra parte de esta Guía. En el caso de un estilo que haya cambiado considerablemente a través de los años (como porter o stout), la inscripción puede especificar un estilo BJCP existente junto a una época (p. ej.: 1820 English Porter). En el caso de que la inscripción especifique algún estilo que no esté en la lista detallada por el BJCP en esta categoría o en los Estilos Provisionales, se debe proveer una descripción del estilo para que quienes la juzguen, cuenten con suficientes detalles. Si una cerveza se inscribe solo con un nombre de estilo y sin descripción, es muy poco probable que quienes la juzguen puedan entender cómo hacerlo. Ejemplos definidos actualmente: Kellerbier, Kentucky Common, Lichtenhainer, London Brown Ale, Piwo Grodziskie, Pre-Prohibition Lager, Pre-Prohibition Porter, Roggenbier, Sahti. Historical Beer: Kellerbier La Kellerbier original es una lager tipo Märzen de la región de Franconia en Alemania, pero otras versiones tradicionales se basan en las lagers Munich Helles y Dunkel. Las variantes basadas en una Pils son una invención más moderna, con un grupo de seguidores/as internacionales más amplio y una mayor producción."},"glass_color":"#b04500","srm_variable":false,"clarity":"traslucida","foam_color":"#F0E4BE","abv_display":"8–12%","ibu_display":"20–35","srm_display":"12–22","og_display":"1.075–1.11","fg_display":"1.01–1.024","country":"Bélgica","family":"Strong Ale","glass_shape":"goblet","glass_label":"Cáliz / Copa belga","distinctive":"Como una Dubbel más intensa, con más cuerpo.","ibu_avg":27.5,"ibu_variable":false,"abv_avg":10.0,"abv_variable":false,"summary":"Ale belga oscura, muy fuerte y compleja.","classic_example":"Achel Extra Bruin","foam_level":2,"foam_height":10,"srm_lo_hex":"#cf6900","srm_hi_hex":"#8e2900","summary_80":"Una ale belga oscura, compleja y muy fuerte, con una deliciosa combinación de riqueza de malta, sabores a frutas oscuras y notas especiadas.","distinctive_80":"Como una Belgian Dubbel más intensa, con un cuerpo más pleno y mayor riqueza de malta. No tan amarga o lupulada como una Belgian Tripel.","mini_profile":{"malta":3,"lupulo":2,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"Levadura belga esterosa y especiada.","ingredient_chips":["Levadura belga esterosa y…","Lúpulos de Europa continental"],"balance_pos":1.5,"balance_malta":3,"balance_lupulo":2,"aroma_highlight":"Malta alta","sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":["Lúpulos de Europa continental","Levadura belga esterosa y…"],"sabor_highlights":["Lúpulos de Europa continental","Levadura belga esterosa y…"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Ámbar","Densa","Translúcida"],"ingredientes_highlights":["Levadura belga esterosa y…","Lúpulos de Europa continental"],"ingredient_types":{"lupulo":"Lúpulos de Europa continental","levadura":"Levadura belga esterosa y…"}},{"code":"28A","name":"Brett Beer","category_num":28,"category_name":"American Wild Ale","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":null},"fields":{"Impresión general":"La mayoría de las veces más seca y afrutada de lo que sugiere el estilo base. Las notas afrutadas o funky van de bajas a altas, dependiendo del envejecimiento de la cerveza y de las cepas de Brett utilizadas. Puede tener una ligera acidez no láctica.","Aroma":"Variable según el estilo base. Las cervezas con Brett jóvenes tendrán más notas afrutadas (p. ej.: frutas tropicales, frutas de carozo o cítricos), pero esto varía según las cepas de Brett utilizadas. Las cervezas con Brett más maduras pueden empezar a desarrollar un ligero carácter funky (p. ej.: a establo, heno mojado, o notas ligeramente terrosas o ahumadas), pero este carácter no debería ser dominante.","Apariencia":"Variable según el estilo base. La claridad puede ser variable y depende del estilo base y de los ingredientes utilizados. Un poco de turbidez no es necesariamente un defecto.","Sabor":"Variable según el estilo base. El carácter a Brett puede variar de mínimo a agresivo. Puede ser bastante afrutada (p. ej.: frutas tropicales, bayas, frutas de carozo, cítricos), o tener algo de carácter ahumado, terroso o a establo. No debe ser desagradablemente funky, como curita/tirita (Band-Aid), fétido, quitaesmalte, queso, etc. Siempre es más afrutada cuando es joven, ganando más carácter funky con el envejecimiento. Puede no tener un carácter láctico. Los sabores a malta suelen ser menos pronunciados que en el estilo base, quedando la mayoría de las veces una cerveza seca y crisp debido a la alta atenuación del Brett.","Sensación en boca":"Variable según el estilo base. Generalmente tiene un cuerpo ligero, más ligero de lo que podría esperarse del estilo base, pero un cuerpo demasiado delgado es un defecto. Generalmente la carbonatación es de moderada a alta. La sensación en boca es variable, pero a menudo es menor que en el estilo base.","Comentarios":"El estilo base describe la mayor parte del carácter de estas cervezas, pero la adición de Brett garantiza un producto más seco, de cuerpo más delgado y a menudo más afrutado y funky. Las versiones más jóvenes son más intensas y 70 afrutadas, mientras que las más maduras poseen un funky más profundo y pueden perder un poco más del carácter del estilo base. El carácter a Brett siempre debe combinar con el estilo; estas cervezas nunca deberían ser una “bomba de Brett”. Aunque el Brett puede producir niveles bajos de ácidos orgánicos, su uso no es un método primario de acidificación de la cerveza.","Historia":"Son interpretaciones modernas por parte de las cervezas artesanales estadounidenses de las ales salvajes belgas, o experimentos inspirados en las ales salvajes belgas o en las cervezas históricas inglesas con Brett. Las denominadas cervezas 100% Brett ganaron popularidad a partir del año 2000, pero esto ocurrió cuando se pensaba que la S. Trois era una cepa de Brett (que no lo es). El uso del Brett junto con una fermentación Sacch es una práctica habitual en la actualidad.","Ingredientes característicos":"Prácticamente cualquier estilo de cerveza (excepto las que ya utilizan una cofermentación Sacch/Brett), que luego se finaliza con una o más cepas de Brett. Alternativamente, una fermentación mixta con Sacch y una o más cepas de Brett. Sin Lacto.","Comparación de estilos":"En comparación con el mismo estilo de cerveza sin Brett, una cerveza con Brett será más seca, más altamente atenuada, más afrutada, más ligera de cuerpo y ligeramente más funky a medida que envejece. Tiene menos acidez y profundidad que las cervezas “salvajes” belgas.","Instrucciones para la inscripción":"Quien inscriba debe especificar uno de dos: o el estilo base, o aportar una descripción de los ingredientes, especificaciones o el carácter deseado. Además puede especificar las cepas de Brett utilizadas.","Estadísticas vitales":"Variable según el estilo base.","Ejemplos comerciales":"Boulevard Saison Brett, Hill Farmstead Arthur, Logsdon Seizoen Bretta, Lost Abbey Brett Devo, Russian River Sanctification, The Bruery Saison Rue","Etiquetas":"fermentación-salvaje, norte-américa, estiloartesanal"},"glass_color":"#fbb123","srm_variable":true,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Más seco y funky que el mismo estilo sin Brett.","ibu_avg":15,"ibu_variable":true,"abv_avg":6.0,"abv_variable":true,"summary":"Estilo base fermentado con Brettanomyces, seco y funky.","classic_example":"Boulevard Saison Brett","foam_level":1,"foam_height":7,"srm_lo_hex":"#fbb123","srm_hi_hex":"#fbb123","summary_80":"La mayoría de las veces más seca y afrutada de lo que sugiere el estilo base.","distinctive_80":"En comparación con el mismo estilo de cerveza sin Brett, una cerveza con Brett será más seca, más altamente atenuada, más afrutada.","mini_profile":{"malta":3,"lupulo":null,"cuerpo":1,"carbonatacion":3},"char_tags":[],"ingredients_line":"Prácticamente cualquier estilo de cerveza (excepto las que ya utilizan una cofermentación Sacch/Brett).","ingredient_chips":["Prácticamente cualquier…","Alternativamente"],"balance_pos":1.5,"balance_malta":3,"balance_lupulo":null,"aroma_highlight":null,"sabor_highlight":"Malta alta","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Carbonatación alta","Cuerpo ligero"],"apariencia_highlights":["Translúcida"],"ingredientes_highlights":["Prácticamente cualquier…","Alternativamente"],"ingredient_types":{}},{"code":"28B","name":"Mixed-Fermentation Sour Beer","category_num":28,"category_name":"American Wild Ale","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":null},"fields":{"Impresión general":"Una versión ácida y funky de un estilo de cerveza base.","Aroma":"Variable según el estilo base. La contribución de los microbios que no son Sacch debería ser de perceptible a fuerte, y a menudo aportan una nota ácida, funky y “salvaje”. Los mejores ejemplos mostrarán una gama de aromas, en lugar de un único carácter dominante. El aroma debe ser atractivo, no áspero ni desagradable.","Apariencia":"Variable según el estilo base. La claridad puede ser variable; algo de turbidez no es un defecto. La retención de espuma puede ser baja.","Sabor":"Variable según el estilo base. Busque un balance agradable entre la cerveza base y el carácter de la fermentación. Es posible obtener una gama de resultados que van desde una acidez y funk bastante elevados hasta una cerveza sutil, placentera y armoniosa. Los mejores ejemplos son agradables de tomar, con ésteres y fenoles complementando la malta o el lúpulo. El carácter “salvaje” puede ser prominente, pero no tiene por qué ser dominante en estilos con un perfil de malta o lúpulo fuerte. La acidez debe ser firme pero disfrutable, y puede variar entre limpia y compleja, pero no debe ser punzante ni avinagrada; un ácido acético prominente, desagradable u ofensivo es un defecto. El amargor tiende a ser bajo, especialmente a medida que aumenta la acidez.","Sensación en boca":"Variable según el estilo base. Generalmente tiene un cuerpo ligero, casi siempre más ligero de lo que podría esperarse del estilo base. La carbonatación suele ser de moderada a alta, aunque a menudo es menor en los ejemplos de mayor contenido alcohólico.","Comentarios":"El estilo de cerveza base se vuelve menos relevante en este estilo ya que las diversas levaduras y bacterias tienden a dominar el perfil. El amargor suele ser restringido, ya que los sabores amargos y ácidos chocan en el paladar. Las características como el diacetilo, el solvente, la textura viscosa (ropiness) y la oxidación fuerte son inapropiadas.","Historia":"Son interpretaciones modernas por parte de las cervezas artesanales estadounidenses de las ales ácidas belgas, o experimentos inspirados en las ales ácidas belgas.","Ingredientes característicos":"Prácticamente cualquier estilo de cerveza. Generalmente fermentada por alguna combinación de Lacto, Pedio, Sacch y Brett. También puede ser una mezcla de estilos. El envejecimiento con madera o en barrica es muy común, pero no es obligatorio; si está presente, no debe ser un sabor primario o dominante.","Comparación de estilos":"Una versión ácida y funky de un estilo base, pero no tiene que ser necesariamente tan ácida o tan funky como algunos ejemplos ácidos tradicionales de Europa.","Instrucciones para la inscripción":"Quien inscriba debe especificar una descripción de la cerveza, identificando las levaduras o bacterias utilizadas, y uno de dos: o el estilo base, o los ingredientes, especificaciones o carácter objetivo de la cerveza.","Estadísticas vitales":"Variable según el estilo base.","Ejemplos comerciales":"Boulevard Love Child, Jester King Le Petit Prince, Jolly Pumpkin Oro de Calabaza, Lost Abbey Ghosts in the Forest, New Belgium Le Terroir, Russian River Temptation","Etiquetas":"fermentación-salvaje, norte-américa, estiloartesanal, cerveza-especialidad"},"glass_color":"#fbb123","srm_variable":true,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Depende del estilo base elegido.","ibu_avg":15,"ibu_variable":true,"abv_avg":6.0,"abv_variable":true,"summary":"Versión ácida y funky de un estilo de cerveza base.","classic_example":"Boulevard Love Child","foam_level":1,"foam_height":7,"srm_lo_hex":"#fbb123","srm_hi_hex":"#fbb123","summary_80":"Una versión ácida y funky de un estilo de cerveza base.","distinctive_80":"Una versión ácida y funky de un estilo base, pero no tan ácida ni funky como una tradición europea.","mini_profile":{"malta":4,"lupulo":4,"cuerpo":1,"carbonatacion":3},"char_tags":[],"ingredients_line":"Prácticamente cualquier estilo de cerveza. Generalmente fermentada por alguna combinación de Lacto, Pedio, Sacch y Brett.","ingredient_chips":["Prácticamente cualquier…","Generalmente fermentada por…"],"balance_pos":2.0,"balance_malta":4,"balance_lupulo":4,"aroma_highlight":null,"sabor_highlight":"Malta muy alta","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Carbonatación alta","Cuerpo ligero"],"apariencia_highlights":["Translúcida"],"ingredientes_highlights":["Prácticamente cualquier…","Generalmente fermentada por…"],"ingredient_types":{}},{"code":"28C","name":"Wild Specialty Beer","category_num":28,"category_name":"American Wild Ale","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":null},"fields":{"Impresión general":"Una American Wild Ale con frutas, hierbas, especias u otros Ingredientes Especiales.","Aroma":"Variable según el estilo base. Los Ingredientes Especiales deben ser evidentes, así como los atributos que caracterizan una fermentación “salvaje” para cada estilo base. Los mejores ejemplos mezclarán los aromas de la fermentación con los ingredientes especiales, creando un aroma que puede ser difícil de atribuir con precisión.","Apariencia":"Variable según el estilo base, generalmente muestra un color, matiz o tono de cualquier Ingrediente Especial usado (en particular si se utiliza fruta), tanto en la cerveza como en la espuma. La claridad puede ser variable; algo de turbidez no es un defecto. La retención de espuma es baja a menudo.","Sabor":"Variable según el estilo base. Los Ingredientes Especiales deben ser evidentes, así como los atributos que caracterizan una fermentación “salvaje” para cada estilo base. Si se ha fermentado fruta, el dulzor suele desaparecer, de modo que solo quedan los ésteres de la fruta. La fruta y otros Ingredientes Especiales pueden añadir su propia acidez; si es así, la acidez podría ser prominente, pero no debería ser abrumadora. La acidez y los taninos de cualquier fruta u otro Ingrediente Especial pueden aumentar la sequedad de la cerveza, por lo que hay que tener cuidado con el balance. La acidez debería realzar la percepción de cualquier sabor a fruta, no reducirlo. Las notas a madera, si están presentes, añaden sabor pero deben estar balanceadas.","Sensación en boca":"Variable según el estilo base. Generalmente tiene un cuerpo ligero, más ligero de lo que podría esperarse del estilo base. La carbonatación es generalmente de moderada a alta; la carbonatación debe equilibrar el estilo base si se declara uno. La presencia de taninos de algunos Ingredientes Especiales (a menudo fruta o madera) puede agregar una ligera astringencia, realzar el cuerpo o hacer que la cerveza parezca más seca de lo que es.","Comentarios":"Este estilo está previsto para versiones con frutas (y otros Ingredientes Especiales añadidos) de otros estilos dentro de la categoría 28, no para variantes de Estilos Clásicos europeos salvajes o ácidos. Las versiones con frutas de Lambic deben inscribirse en 23F Fruit Lambic. Las versiones con frutas de otros Estilos Clásicos ácidos (p. ej.: Flanders Red, Oud Bruin, Gose, Berliner Weisse) deben inscribirse en 29A Fruit Beer. Las cervezas con azúcares y frutas no fermentadas, añadidas después de la fermentación, deben inscribirse en 29C Specialty Fruit Beer.","Historia":"Son interpretaciones modernas por parte de las cervezas artesanales estadounidenses de ales salvajes belgas, o experimentos inspirados en las ales salvajes belgas.","Ingredientes característicos":"Prácticamente cualquier estilo de cerveza. Cualquier combinación de Sacch, Brett, Lacto, Pedio u otros microorganismos fermentativos similares. También puede ser una mezcla de estilos. Aunque las cerezas, las frambuesas y los duraznos/melocotones son los más comunes, también se pueden utilizar otras frutas. Incluso se pueden utilizar verduras con características frutales (p. ej.: 71 chile/ají, ruibarbo, calabaza/zapallo). El envejecimiento con madera o en barrica es muy común, pero no es obligatorio. Se permite el uso de madera con características de sabor inusuales o únicas, o de madera que haya estado previamente en contacto con otros tipos de bebidas alcohólicas.","Comparación de estilos":"Como una cerveza con frutas, hierbas, especias o madera, pero ácida o funky.","Instrucciones para la inscripción":"Quien inscriba debe especificar cualquier Ingrediente Especial utilizado (p. ej.: fruta, especias, hierbas o madera). Además debe especificar una descripción de la cerveza, identificando las levaduras o bacterias utilizadas y uno de dos: o el estilo base, o los ingredientes, las especificaciones o el carácter objetivo de la cerveza. Una descripción general de la naturaleza especial de la cerveza puede cubrir todos los elementos requeridos.","Estadísticas vitales":"Variable según el estilo base.","Ejemplos comerciales":"Cascade Bourbonic Plague, Jester King Atrial Rubicite, New Belgium Dominga Mimosa Sour, New Glarus Wisconsin Belgian Red, Russian River Supplication, The Lost Abbey Cuvee de Tomme","Etiquetas":"fermentación-salvaje, norte-américa, estiloartesanal, cerveza-especialidad, ácida"},"glass_color":"#fbb123","srm_variable":true,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Como una cerveza con frutas o especias, pero ácida.","ibu_avg":15,"ibu_variable":true,"abv_avg":6.0,"abv_variable":true,"summary":"American Wild Ale con frutas, hierbas o especias.","classic_example":"Cascade Bourbonic Plague","foam_level":1,"foam_height":7,"srm_lo_hex":"#fbb123","srm_hi_hex":"#fbb123","summary_80":"Una American Wild Ale con frutas, hierbas.","distinctive_80":"Como una cerveza con frutas, hierbas, especias o madera.","mini_profile":{"malta":null,"lupulo":null,"cuerpo":1,"carbonatacion":3},"char_tags":["ácida"],"ingredients_line":"Prácticamente cualquier estilo de cerveza.","ingredient_chips":["Prácticamente cualquier…","Cualquier combinación de Sacch"],"balance_pos":null,"balance_malta":null,"balance_lupulo":null,"aroma_highlight":"Levadura medio","sabor_highlight":"Levadura medio","apariencia_highlight":"Translúcida","boca_highlight":"Carbonatación alta","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Carbonatación alta","Cuerpo ligero"],"apariencia_highlights":["Translúcida"],"ingredientes_highlights":["Prácticamente cualquier…","Cualquier combinación de Sacch"],"ingredient_types":{}},{"code":"28D","name":"Straight Sour Beer","category_num":28,"category_name":"American Wild Ale","stats":{"OG":[1.048,1.065],"FG":[1.006,1.013],"IBU":[3.0,8.0],"SRM":[2.0,3.0],"ABV":[4.5,7.0]},"fields":{"Impresión general":"Una cerveza pálida, ácida y refrescante, con una acidez láctica limpia. Un suave sabor a malta pálida apoya la acidez a limón con moderados ésteres afrutados.","Aroma":"Predomina un carácter ácido punzante (de moderadamente alto a alto). Puede tener un carácter, a lo sumo, moderadamente afrutado (a menudo durazno/melocotón, damasco/albaricoque, limón o manzana ácida). Sin aroma a lúpulo. Malta pálida de apoyo, generalmente con carácter a galleta, o a galleta cracker en particular. Fermentación limpia.","Apariencia":"Color muy pálido. La claridad varía de transparente a algo turbia. Espuma blanca voluminosa, densa y con baja retención. Efervescente.","Sabor":"Predomina la acidez láctica limpia, que puede ser bastante fuerte. Generalmente se percibe un sabor complementario a pan, galleta, galleta cracker o grano. El amargor del lúpulo es imperceptible. Nunca con carácter a vinagre o acidez punzante. Puede ser percibido un carácter a 72 frutas pálidas de intensidad moderada, incluyendo un sabor cítrico a limón o a manzana ácida. El final es de seco a prácticamente seco. El balance está dominado por la acidez, pero debe estar presente algo de sabor a malta y a ésteres de fruta. Sin sabor a lúpulo. Limpia.","Sensación en boca":"Cuerpo ligero. Carbonatación de moderada a alta. Nunca quemante, aunque los ejemplos de mayor densidad pueden tener algo de tibieza alcohólica. Acidez crisp.","Comentarios":"Una versión más fuerte de una cerveza tipo Berliner Weisse con un listado de granos menos restrictivo y sin Brett. Este estilo de cerveza se suele utilizar como base para cervezas modernas intensamente saborizadas con frutas, especias, azúcares, etc.; dichas cervezas deben ser inscritas en la categoría 28C Wild Specialty Beer.","Historia":"El científico cervecero alemán Otto Francke desarrolló lo que se conoció como el proceso de acidificación Francke, que permitió acelerar y hacer más consistentes los métodos tradicionales de cultivos mixtos para las Berliner Weisse; esto también se conoce como kettle souring. Muchos ejemplos modernos de cerveza ácida comercial utilizan este método para una producción rápida, y como alternativa a la compleja producción en barricas.","Ingredientes característicos":"La mayor parte o la totalidad del listado de granos es malta pálida, Pils o trigo malteado en cualquier combinación. Se pueden emplear maltas con un horneado ligero para obtener una mayor profundidad de malta. Se pueden utilizar maltas tipo Carapils para darle cuerpo. Se pueden utilizar azúcares pálidos para una densidad mayor sin aumentar el cuerpo. No contiene lactosa ni maltodextrina. Puede producirse mediante kettle souring, cultivos para cofermentación (levadura y bacterias acidolácticas), o utilizando levaduras especiales que produzcan ácido láctico. Sin Brett.","Comparación de estilos":"Los ejemplos de menor densidad pueden ser muy parecidos a una Berliner Weisse sin Brett. Comparada con una Lambic, generalmente no es tan ácida y tiene una acidez láctica limpia con un carácter funky de discreto a por debajo del umbral sensorial. Tiene mayor contenido de alcohol que ambas.","Estadísticas vitales":"OG: 1.048 – 1.065 IBU: 3 – 8 FG: 1.006 – 1.013 SRM: 2 – 3 ABV: 4.5 – 7.0%","Ejemplos comerciales":"Rara vez se encuentran, ya que este estilo suele ser típicamente la base para otras Cervezas de Especialidad.","Etiquetas":"color-pálido, fermentación-alta"},"glass_color":"#ffd169","srm_variable":false,"clarity":"turbia","foam_color":"#F7F4EC","abv_display":"4.5–7%","ibu_display":"3–8","srm_display":"2–3","og_display":"1.048–1.065","fg_display":"1.006–1.013","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Menos ácida que una Lambic, más alcohol que una Berliner Weisse.","ibu_avg":5.5,"ibu_variable":false,"abv_avg":5.8,"abv_variable":false,"summary":"Cerveza pálida, ácida y refrescante, acidez láctica limpia.","classic_example":"Rara vez se encuentran","foam_level":0,"foam_height":4,"srm_lo_hex":"#ffd878","srm_hi_hex":"#ffca5a","summary_80":"Una cerveza pálida, ácida y refrescante, con una acidez láctica limpia.","distinctive_80":"Los ejemplos de menor densidad pueden ser muy parecidos a una Berliner Weisse sin Brett.","mini_profile":{"malta":2,"lupulo":0,"cuerpo":1,"carbonatacion":3},"char_tags":[],"ingredients_line":"La mayor parte o la totalidad del listado de granos es malta pálida, Pils o trigo malteado en cualquier combinación.","ingredient_chips":["Se pueden emplear maltas con…","Se pueden utilizar maltas…"],"balance_pos":1.0,"balance_malta":2,"balance_lupulo":0,"aroma_highlight":"Malta media","sabor_highlight":"Malta media","apariencia_highlight":"Turbia","boca_highlight":"Carbonatación alta","aroma_highlights":["Se pueden emplear maltas con un…"],"sabor_highlights":["Se pueden emplear maltas con un…"],"boca_highlights":["Carbonatación alta","Cuerpo ligero"],"apariencia_highlights":["Pálido","Densa","Turbia"],"ingredientes_highlights":["Se pueden emplear maltas con…","Se pueden utilizar maltas…"],"ingredient_types":{"malta":"Se pueden emplear maltas con un…"}},{"code":"29A","name":"Fruit Beer","category_num":29,"category_name":"Fruit Beer","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":null},"fields":{"Impresión general":"Una agradable integración de la fruta con la cerveza, pero aún reconocible como cerveza. El carácter de la fruta debe ser evidente, pero en balance con la cerveza, no tan agresivo como para sugerir un producto artificial.","Aroma":"Variable según el estilo base. El carácter de la fruta debe notarse en el aroma; sin embargo, algunas frutas (p. ej.: frambuesas, cerezas) tienen aromas más fuertes y son más distintivas que otras (p. ej.: arándanos, frutillas/fresas); permita una variedad de caracteres e intensidades de la fruta, desde sutiles hasta agresivos. El aroma a lúpulo puede ser más bajo que en el estilo base para mostrar mejor el carácter de la fruta. La fruta debe añadir complejidad, pero no ser tan prominente como para desequilibrarla.","Apariencia":"Variable según el estilo base y los ingredientes especiales. La cerveza de color más claro puede mostrar los colores distintivos de los ingredientes, incluso en la espuma. El color de la fruta en la cerveza suele ser más claro que la pulpa de la fruta misma, y puede adquirir tonos ligeramente diferentes. Claridad variable, aunque la turbidez es generalmente indeseable. Algunos ingredientes pueden afectar la retención de espuma.","Sabor":"Variable según el estilo base. Al igual que con el aroma, los sabores distintivos de las frutas deben ser notorios, y pueden variar en intensidad de sutiles a agresivos, pero el carácter de la fruta no debe ser tan artificial ni inapropiadamente abrumador como para sugerir una “bebida de jugo de frutas”. El amargor, los sabores a malta y lúpulo, el contenido de alcohol y los subproductos de la fermentación como ésteres, deben ser apropiados para el estilo base, pero deben ser armoniosos y balanceados con los distintivos sabores de las frutas presentes. La fruta generalmente agrega sabor, no dulzor, ya que los azúcares de la fruta a menudo son fermentados por completo, lo que aligera el sabor y hace que el final sea más seco. Sin embargo, el dulzor residual no es necesariamente una característica negativa a menos que tenga una cualidad cruda y sin fermentar. Algunas frutas pueden agregar acidez, amargor y taninos, que deben estar en balance con el perfil de sabor resultante.","Sensación en boca":"Variable según el estilo base. La fruta a menudo reduce el cuerpo y hace que la cerveza parezca más liviana en el paladar. Algunas frutas más pequeñas y oscuras pueden agregar una profundidad tánica, pero esta astringencia no debería abrumar a la cerveza base.","Comentarios":"La descripción de la cerveza es fundamental para su evaluación; quienes la juzguen deberían pensar más en el concepto declarado que en tratar de detectar cada ingrediente individual. El balance, la tomabilidad y la ejecución del concepto son los factores decisivos más importantes. La fruta debe complementar el estilo original y no abrumarlo. Los atributos del estilo base serán diferentes después de agregar la fruta; no espere que la cerveza tenga un sabor idéntico al estilo base sin modificar. Las Fruit Beer basadas en un Estilo Clásico deben inscribirse en este estilo, excepto Lambic; existe un estilo especial para Fruit Lambic (23F). Las cervezas ácidas o de fermentación mixta con fruta, sin una base de Estilo Clásico, deben inscribirse en 28C Wild Specialty Beer. Las versiones con frutas de las cervezas ácidas de Estilo Clásico (p. ej.: Flanders Red, Oud Bruin, Gose, Berliner Weisse) deben inscribirse en 29A Fruit Beer. Las versiones a base de frutas de Estilos Clásicos donde las especias son una parte inherente de la definición del estilo (p. ej.: Witbier, Gose) no cuentan como una Spice Beer para efectos de inscripción.","Instrucciones para la inscripción":"Quien inscriba debe especificar el tipo de fruta(s) utilizada(s). Además debe especificar una descripción de la cerveza, identificando uno de dos: o un estilo base o los ingredientes, las especificaciones o el carácter objetivo de la cerveza. Una descripción general de la naturaleza especial de la cerveza puede cubrir todos los elementos requeridos.","Estadísticas vitales":"OG, FG, IBU, SRM y ABV variarán según la cerveza base, pero la fruta a menudo se reflejará en el color.","Ejemplos comerciales":"21st Amendment Hell or High Watermelon, Anderson Valley Blood Orange Gose, Avery Liliko’i Kepolo, Ballast Point Grapefruit Sculpin, Bell’s Cherry Stout, Founders Rübæus","Etiquetas":"cerveza-especialidad"},"glass_color":"#f8a600" una variedad de caracteres e intensidades de las frutas y especias, desde sutiles 73 hasta agresivos. El aroma a lúpulo puede ser más bajo que en el estilo base para mostrar mejor el carácter de especialidad. Los ingredientes especiales deben añadir complejidad, pero no ser tan prominentes como para desequilibrar la cerveza.","Apariencia":"Variable según el estilo base y los ingredientes especiales. La cerveza de color más claro puede mostrar los colores distintivos de los ingredientes, incluso en la espuma. El color de la fruta en la cerveza suele ser más claro que la pulpa de la fruta misma, y puede adquirir tonos ligeramente diferentes. Claridad variable, aunque la turbidez es generalmente indeseable. Algunos ingredientes pueden afectar la retención de espuma.","Sabor":"Variable según el estilo base. Al igual que con el aroma, los sabores distintivos de las frutas y especias deben ser notorios, y pueden variar en intensidad de sutiles a agresivos. El carácter de la fruta no debe ser tan artificial ni inapropiadamente abrumador como para sugerir una bebida de jugo de frutas con especias. El amargor y sabor a lúpulo, los sabores a malta, el contenido de alcohol y los subproductos de la fermentación como ésteres, deben ser apropiados para el estilo base, pero deben ser armoniosos y balanceados con los distintivos sabores de las frutas y especias presentes. La fruta generalmente agrega sabor, no dulzor, ya que los azúcares de la fruta generalmente son fermentados por completo, lo que aligera el sabor y hace que el final sea más seco. Sin embargo, el dulzor residual no es necesariamente una característica negativa a menos que tenga una cualidad cruda y sin fermentar. Algunos ingredientes pueden agregar acidez, amargor y taninos, que deben estar en balance con el perfil de sabor resultante.","Sensación en boca":"Variable según el estilo base. La fruta a menudo reduce el cuerpo y hace que la cerveza parezca más liviana en el paladar. Algunas frutas más pequeñas y oscuras pueden agregar una profundidad tánica, pero esta astringencia no debería abrumar a la cerveza base. Los SHV (Especias, Hierbas o Vegetales) pueden aumentar o disminuir el cuerpo. Algunos SHV pueden agregar un poco de astringencia, aunque no es deseable un carácter “crudo” a especias.","Comentarios":"La descripción de la cerveza es fundamental para su evaluación; quienes la juzguen deberían pensar más en el concepto declarado que en tratar de detectar cada ingrediente individual. El balance, la tomabilidad y la ejecución del concepto son los factores decisivos más importantes. Los ingredientes especiales deben complementar el estilo original y no abrumarlo. Los atributos del estilo base serán diferentes después de agregar frutas y especias; no espere que la cerveza tenga un sabor idéntico al estilo base sin modificar.","Instrucciones para la inscripción":"Quien inscriba debe especificar el tipo de fruta y de SHV utilizados; no es necesario especificar los ingredientes individuales de SHV si se usa una mezcla conocida de especias (p. ej.: especias para tarta de manzana). Además debe especificar una descripción de la cerveza, identificando uno de dos: o un estilo base o los ingredientes, las especificaciones o el carácter objetivo de la cerveza. Una descripción general de la naturaleza especial de la cerveza puede cubrir todos los elementos requeridos.","Estadísticas vitales":"OG, FG, IBU, SRM y ABV variarán según la cerveza base, pero la fruta a menudo se reflejará en el color.","Ejemplos comerciales":"Cigar City Margarita Gose, Firestone Walker Chocolate Cherry Stout, Golden Road Spicy Mango Cart, Kona Island Colada Cream Ale, New Glarus Blueberry Cocoa Stout, Sun King Orange Vanilla Sunlight","Etiquetas":"cerveza-especialidad, fruta"},"glass_color":"#f8a600","srm_variable":true,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Depende del estilo base, la fruta y las especias.","ibu_avg":20,"ibu_variable":true,"abv_avg":6.0,"abv_variable":true,"summary":"Frutas y especias integradas en la cerveza.","classic_example":"Cigar City Margarita Gose","foam_level":1,"foam_height":7,"srm_lo_hex":"#f8a600","srm_hi_hex":"#f8a600","summary_80":"Una unión agradable de frutas, especias y cerveza, pero aún reconocible como cerveza.","distinctive_80":"Depende del estilo base, la fruta y las especias.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":null},"char_tags":["fruta"],"ingredients_line":"","ingredient_chips":[],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Lúpulo bajo","sabor_highlight":"Malta media","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Cuerpo medio"],"apariencia_highlights":["Translúcida"],"ingredientes_highlights":[],"ingredient_types":{}},{"code":"29C","name":"Specialty Fruit Beer","category_num":29,"category_name":"Fruit Beer","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":null},"fields":{"Impresión general":"Una atractiva combinación de fruta, azúcar y cerveza, pero aún reconocible como cerveza. El carácter de la fruta y el azúcar debe ser evidente, pero en balance con la cerveza, no tan agresivo como para sugerir un producto artificial.","Aroma":"Igual que la Fruit Beer, excepto que algunos fermentables adicionales (p. ej.: miel, melaza) pueden agregar un componente de aroma. Cualquier componente de aroma adicional que esté presente debe estar en balance con los componentes de la fruta y la cerveza, y ser una combinación agradable.","Apariencia":"Igual que la Fruit Beer.","Sabor":"Igual que la Fruit Beer, excepto que algunos fermentables adicionales (p. ej.: miel, melaza) pueden agregar un componente de sabor. Cualquier componente de sabor adicional que esté presente debe estar en balance con los componentes de la fruta y la cerveza, y ser una combinación agradable. Los azúcares agregados no deben tener un sabor crudo y sin fermentar. Algunos azúcares agregados tendrán elementos no fermentables que pueden brindar un final más pleno y dulce; en cambio, los azúcares totalmente fermentables pueden diluir el final.","Sensación en boca":"Igual que la Fruit Beer, aunque dependiendo del tipo de azúcar añadido, podría aumentar o disminuir el cuerpo.","Comentarios":"Si los fermentables o procesos adicionales no agregan un carácter significativo a la cerveza, inscríbala como uno de los otros estilos de Fruit Beer (no Specialty) y omita la descripción de los ingredientes o procesos adicionales.","Instrucciones para la inscripción":"Quien inscriba debe especificar el tipo de fruta utilizada. Además debe especificar el tipo de ingrediente adicional (según la introducción) o proceso especial empleado. Por otro lado, debe especificar una descripción de la cerveza, identificando uno de dos: o un estilo base o los ingredientes, las especificaciones o el carácter objetivo de la cerveza. Una descripción general de la naturaleza especial de la cerveza puede cubrir todos los elementos requeridos.","Estadísticas vitales":"OG, FG, IBU, SRM y ABV variarán según la cerveza base, pero la fruta a menudo se reflejará en el color.","Ejemplos comerciales":"The Bruery Goses are Red, New Planet Raspberry Ale, Tired Hands Strawberry Milkshake IPA, WeldWerks Piña Colada IPA","Etiquetas":"cerveza-especialidad"},"glass_color":"#f8a600","srm_variable":true,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Depende del estilo base, la fruta y el azúcar.","ibu_avg":20,"ibu_variable":true,"abv_avg":6.0,"abv_variable":true,"summary":"Fruta, azúcar y cerveza combinados en balance.","classic_example":"The Bruery Goses are Red","foam_level":1,"foam_height":7,"srm_lo_hex":"#f8a600","srm_hi_hex":"#f8a600","summary_80":"Una atractiva combinación de fruta, azúcar y cerveza, pero aún reconocible como cerveza.","distinctive_80":"Depende del estilo base, la fruta y el azúcar.","mini_profile":{"malta":null,"lupulo":null,"cuerpo":2,"carbonatacion":null},"char_tags":[],"ingredients_line":"","ingredient_chips":[],"balance_pos":null,"balance_malta":null,"balance_lupulo":null,"aroma_highlight":null,"sabor_highlight":null,"apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Cuerpo medio"],"apariencia_highlights":["Translúcida"],"ingredientes_highlights":[],"ingredient_types":{}},{"code":"29D","name":"Grape Ale","category_num":29,"category_name":"Fruit Beer","stats":{"OG":[1.059,1.075],"FG":[1.004,1.013],"IBU":[10.0,30.0],"SRM":[4.0,8.0],"ABV":[6.0,8.5]},"fields":{"Impresión general":"Combina el perfil de un vino espumoso y una cerveza de base relativamente neutra, que permite que las cualidades aromáticas de la uva se mezclen agradablemente con los aromas del lúpulo y la levadura. Puede estar en un rango de refrescante a compleja.","Aroma":"Las características aromáticas de la variedad de uva son notorias, pero no deben dominar. El carácter de la uva debe fusionarse bien con el carácter subyacente de la malta base. Si bien el aroma a lúpulo suele ser discreto, puede oscilar entre completamente ausente y medio bajo. La fermentación suele ser bastante limpia, pero puede tener delicadas notas especiadas y a ésteres afrutados. La banana/plátano, la goma de mascar y similares se consideran defectos.","Apariencia":"El color puede variar de dorado pálido a rubí, pero aquellas que usan uvas tintas tienden hacia el burdeos. Estos colores más oscuros también pueden provenir del uso de productos de uva cocidos o concentrados, nunca de granos oscuros especiales. Espuma de blanca a rojiza, con una retención generalmente media baja. La claridad es generalmente buena. Nunca turbia.","Sabor":"Al igual que con el aroma, el carácter de la uva puede variar de intensidad sutil a media alta, y ser lo más prominente. Los sabores afrutados (frutas de carozo, tropicales, bayas, etc.) son apropiados según corresponda a la variedad de uva. Las uvas tintas más oscuras pueden aportar sabores más rústicos (p. ej.: terroso, tabaco, cuero). El carácter de la malta es de apoyo, no predominante, y por lo general de las variedades pálidas y con horneado ligero. Se permiten niveles muy bajos de maltas Crystal pálidas, pero el carácter rostizado o a chocolate intenso es siempre inapropiado. El amargor es generalmente bajo y los sabores a lúpulo pueden ser de inexistentes a bajos. Unas suaves notas de acidez ligera son comunes, debido a la variedad y cantidad de uva utilizada, y pueden ayudar a hacerla más digerible, pero no deben acercarse al umbral de “acidez fuerte”. El roble complementario es opcional, pero no debería estar presente un carácter a Brett funky. Fermentación limpia.","Sensación en boca":"Carbonatación de media alta a alta que mejora la percepción del aroma. El cuerpo es generalmente de bajo a medio, y algo de acidez puede contribuir a una mayor percepción de sequedad. El final es extremadamente seco y crisp. Los ejemplos más fuertes pueden mostrar algo de tibieza alcohólica.","Comentarios":"Las intensidades de alcohol pueden ser tan bajas como 4.5% o tan altas como 12.5%, pero más comúnmente en el rango de las estadísticas vitales. La percepción del color varía ampliamente según el matiz de la uva añadida.","Historia":"Elaborada inicialmente por Birrificio Montegioco y Birrificio Barley en 2006-2007. Se hizo más popular después de ser publicada en la Guía de Estilos 2015 como Italian Grape Ale (IGA), e inspiró muchas variaciones locales en otros países.","Ingredientes característicos":"Malta base pálida o Pils, limitada cantidad de malta Crystal pálida o trigo malteado. El mosto de uva (variedades tintas o blancas, típicamente mosto fresco) suele ser del 15 al 20% del total, pero puede superar el 40%. El mosto se fermenta con la cerveza, no es una mezcla de vino y cerveza. Las levaduras afrutadas y especiadas son las más comunes, pero se pueden usar variedades neutras. Los lúpulos deben seleccionarse para complementar el perfil general. Esta cerveza no tiene dry hopping. El roble está permitido, pero no es obligatorio, y no debe ser abrumador ni estar en niveles más altos que los encontrados en el vino.","Comparación de estilos":"Base similar a varios estilos belgas, como Belgian Blond, Saison y Belgian Single, pero con uvas. Los ejemplos de mayor intensidad son similares a las Belgian Tripel o Belgian Golden Strong Ale, pero con uvas. No es funky como la Fruit Lambic.","Instrucciones para la inscripción":"Quien inscriba debe especificar el tipo de uva utilizada. Además puede proporcionar información adicional sobre el estilo base o los ingredientes característicos.","Estadísticas vitales":"OG: 1.059 – 1.075 IBU: 10 – 30 FG: 1.004 – 1.013 SRM: 4 – 8 ABV: 6.0 – 8.5%","Ejemplos comerciales":"Montegioco Open Mind, Birrificio del Forte Il Tralcio, Luppolajo Mons Rubus, Firestone Walker Feral Vinifera, pFriem Family Brewers Druif, 4 Árvores Abbondanza","Etiquetas":"cerveza-especialidad"},"glass_color":"#f8a600","srm_variable":false,"clarity":"turbia","foam_color":"#F7F4EC","abv_display":"6–8.5%","ibu_display":"10–30","srm_display":"4–8","og_display":"1.059–1.075","fg_display":"1.004–1.013","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"tulip","glass_label":"Copa tulipán","distinctive":"Con base belga (Blond, Saison, Single) pero con uvas.","ibu_avg":20.0,"ibu_variable":false,"abv_avg":7.2,"abv_variable":false,"summary":"Cruce entre vino espumoso y cerveza de base neutra, con uva.","classic_example":"Montegioco Open Mind","foam_level":1,"foam_height":7,"srm_lo_hex":"#ffbf42","srm_hi_hex":"#ea8f00","summary_80":"Combina el perfil de un vino espumoso y una cerveza de base relativamente neutra.","distinctive_80":"Base similar a varios estilos belgas, como Belgian Blond, Saison y Belgian Single, pero con uvas.","mini_profile":{"malta":2,"lupulo":1,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"Malta base pálida o Pils, limitada cantidad de malta Crystal pálida o trigo malteado.","ingredient_chips":["Malta base pálida o Pils","Esta cerveza no tiene dry…"],"balance_pos":2.0,"balance_malta":1,"balance_lupulo":1,"aroma_highlight":"Malta media","sabor_highlight":"Levadura medio","apariencia_highlight":"Turbia","boca_highlight":"Carbonatación alta","aroma_highlights":["Malta base pálida o Pils"],"sabor_highlights":["Malta base pálida o Pils"],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Dorado","Blanca","Turbia"],"ingredientes_highlights":["Malta base pálida o Pils","Esta cerveza no tiene dry…"],"ingredient_types":{"malta":"Malta base pálida o Pils"}},{"code":"30A","name":"Spice, Herb, or Vegetable Beer","category_num":30,"category_name":"Spiced Beer","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":null},"fields":{"Impresión general":"Una atractiva fusión de especias, hierbas o vegetales (SHV, por sus siglas en inglés) y cerveza, pero aún reconocible como cerveza. El carácter de SHV debe ser evidente, pero en balance con la cerveza, no tan agresivo como para sugerir un producto artificial.","Aroma":"Variable según el estilo base. El carácter de SHV debe ser perceptible en el aroma; sin embargo, algunos SHV (p. ej.: jengibre, canela, romero) tienen aromas más fuertes y son más distintivos que otros (p. ej.: la mayoría de los vegetales); permita una variedad de caracteres e intensidades de los SHV, desde sutiles hasta agresivos. El aroma a lúpulo puede ser más bajo que en el estilo base para mostrar mejor el carácter de SHV. Los SHV deben añadir complejidad, pero no ser tan prominentes como para desequilibrar la presentación resultante de la cerveza.","Apariencia":"Variable según el estilo base y los ingredientes especiales. La cerveza de color más claro puede mostrar los colores distintivos de los ingredientes, incluso en la espuma. Claridad variable, aunque la turbidez es generalmente indeseable. Algunos ingredientes pueden afectar la retención de espuma.","Sabor":"Variable según el estilo base. Al igual que con el aroma, los sabores distintivos de los SHV deben ser notorios, y pueden variar en intensidad de sutiles a agresivos. Algunos SHV son inherentemente amargos y pueden resultar en una cerveza más amarga que lo declarado en el estilo base. El amargor, los sabores a malta y lúpulo, el contenido de alcohol y los subproductos de la fermentación como los ésteres, deben ser apropiados para el estilo base, pero deben ser armoniosos y balanceados con los distintivos sabores de los SHV presentes.","Sensación en boca":"Variable según el estilo base. Los SHV pueden incrementar o disminuir el cuerpo. Algunos SHV pueden añadir una ligera astringencia, aunque un carácter a especias “crudas” es indeseable.","Comentarios":"La descripción de la cerveza es fundamental para su evaluación; quienes la juzguen deberían pensar más en el concepto declarado que en tratar de detectar cada ingrediente individual. El balance, la tomabilidad y la ejecución del concepto son los factores decisivos más importantes. Los SHV deben complementar el estilo original y no anularlo. Los atributos del estilo base serán diferentes después de agregar los SHV; no espere que la cerveza tenga un sabor idéntico al estilo base sin modificar. 76","Instrucciones para la inscripción":"Quien inscriba debe especificar el tipo de especias, hierbas o vegetales utilizados; no es necesario especificar los ingredientes individuales si se usa una mezcla conocida de especias (p. ej.: especias para tarta de manzana, curry en polvo, ají en polvo). Además debe especificar una descripción de la cerveza, identificando uno de dos: o un estilo base o los ingredientes, las especificaciones o el carácter objetivo de la cerveza. Una descripción general de la naturaleza especial de la cerveza puede cubrir todos los elementos requeridos.","Estadísticas vitales":"OG, FG, IBU, SRM y ABV variarán según la cerveza base.","Ejemplos comerciales":"Alesmith Speedway Stout, Elysian Avatar Jasmine IPA, Founders Breakfast Stout, Rogue Yellow Snow Pilsner, Traquair Jacobite Ale, Young’s Double Chocolate Stout","Etiquetas":"cerveza-especialidad"},"glass_color":"#de7c00","srm_variable":true,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Depende del estilo base y los SHV usados.","ibu_avg":20,"ibu_variable":true,"abv_avg":6.0,"abv_variable":true,"summary":"Especias, hierbas o vegetales integrados en la cerveza.","classic_example":"Alesmith Speedway Stout","foam_level":1,"foam_height":7,"srm_lo_hex":"#de7c00","srm_hi_hex":"#de7c00","summary_80":"Una atractiva fusión de especias, hierbas o vegetales (SHV, por sus siglas en inglés) y cerveza, pero aún reconocible como cerveza.","distinctive_80":"Depende del estilo base y los SHV usados.","mini_profile":{"malta":2,"lupulo":2,"cuerpo":2,"carbonatacion":null},"char_tags":[],"ingredients_line":"","ingredient_chips":[],"balance_pos":2.0,"balance_malta":2,"balance_lupulo":2,"aroma_highlight":"Lúpulo bajo","sabor_highlight":"Malta media","apariencia_highlight":"Translúcida","boca_highlight":"Cuerpo medio","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Cuerpo medio"],"apariencia_highlights":["Translúcida"],"ingredientes_highlights":[],"ingredient_types":{}},{"code":"30B","name":"Autumn Seasonal Beer","category_num":30,"category_name":"Spiced Beer","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":null},"fields":{"Impresión general":"Una cerveza maltosa y especiada que frecuentemente tiene un cuerpo moderadamente pleno y un final ligeramente cálido, que sugiere un buen acompañamiento para la temporada más fresca de otoño, y evoca tradiciones de la cosecha o del Día de Acción de Gracias.","Aroma":"Maltoso, especiado y balanceado. Es posible un amplio rango de aromas, siempre y cuando evoque el tema de la cosecha. Los ingredientes declarados y el concepto son los que establecen la expectativa. Los lúpulos generalmente son sutiles. El alcohol generalmente está presente, pero es suave y de apoyo. Los componentes deben estar bien integrados y crear una presentación coherente. Consulte la sección de Sabor para el carácter de especias, malta, azúcar y vegetales.","Apariencia":"Color de ámbar medio a marrón cobrizo; las versiones más claras son más comunes. Traslúcida, si no es opaca. Espuma bien formada, persistente, con color de blanquecino a canela. Algunas versiones con calabaza/zapallo tendrán un tono poco usual para la cerveza, con matices cercanos al anaranjado.","Sabor":"Maltoso, especiado y balanceado. Permita la creatividad por parte de quien elabora la cerveza. Son comunes las especias cálidas o dulces. Sabores a malta ricos y tostados son comunes, pudiendo incluir sabores a caramelo, corteza tostada de pan o de tarta, galletas o frutos secos. Puede incluir sabores distintivos de azúcar, como melaza, miel o azúcar morena. Los sabores derivados de los vegetales tipo calabaza/zapallo generalmente son difíciles de percibir, y a menudo solo aportan un dulzor más intenso. Los ingredientes especiales deberían otorgar soporte y balance, sin opacar a la cerveza base. El amargor y los sabores de lúpulo usualmente son discretos para no interferir con el carácter especial. Usualmente el final es, en cierta medida, pleno y llenador, ocasionalmente con un ligero sabor a alcohol. Los sabores de malta con características rostizadas típicamente están ausentes.","Sensación en boca":"El cuerpo usualmente es de medio a pleno, y puede ser “masticable”. Carbonatación de moderadamente baja a moderadamente alta. Se acepta el carácter del envejecimiento. Se acepta una tibieza alcohólica.","Comentarios":"Utiliza el perfil sensorial de productos que sugieren la temporada de cosecha en Estados Unidos, como pastel de calabaza, tarta de manzana o batata/camote confitado, balanceados con una cerveza base que otorga soporte y generalmente es maltosa. La descripción de la cerveza es fundamental para su evaluación; quienes la juzguen deberían pensar más en el concepto declarado que en tratar de detectar cada ingrediente individual. El balance, la tomabilidad y la ejecución del concepto son los factores decisivos más importantes.","Ingredientes característicos":"Las especias son obligatorias y generalmente incluyen aquellas que evocan las épocas de otoño, la cosecha o el Día de Acción de Gracias (p. ej.: pimienta de Jamaica, nuez moscada, canela, clavo de olor, jengibre), pero cualquier combinación es posible y se valora la creatividad. Los adjuntos con sabor propio son comunes (p. ej.: melaza, azúcar invertido, azúcar morena, miel, sirope de arce). Se utilizan con frecuencia vegetales de tipo cucurbitáceas (la calabaza/zapallo es el más frecuente).","Instrucciones para la inscripción":"Quien inscriba debe especificar el tipo de especias, hierbas o vegetales utilizados; no es necesario especificar los ingredientes individuales si se usa una mezcla conocida de especias (p. ej.: especias para pastel de calabaza). Además debe especificar una descripción de la cerveza, identificando uno de dos: o un estilo base o los ingredientes, las especificaciones o el carácter objetivo de la cerveza. Una descripción general de la naturaleza especial de la cerveza puede cubrir todos los elementos requeridos.","Estadísticas vitales":"OG, FG, IBU, SRM y ABV variarán según la cerveza base. El ABV generalmente es mayor a 5%, y la mayoría de los ejemplos tienen un color cercano al ámbar cobrizo.","Ejemplos comerciales":"Dogfish Head Punkin Ale, Elysian Punkuccino, Rogue Pumpkin Patch Ale, Schlafly Pumpkin Ale, UFO Pumpkin, Weyerbacher Imperial Pumpkin","Etiquetas":"cerveza-especialidad"},"glass_color":"#de7c00","srm_variable":true,"clarity":"opaca","foam_color":"#D9B183","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Depende del estilo base y las especias elegidas.","ibu_avg":20,"ibu_variable":true,"abv_avg":6.0,"abv_variable":true,"summary":"Cerveza maltosa y especiada, pensada para el otoño.","classic_example":"Dogfish Head Punkin Ale","foam_level":2,"foam_height":10,"srm_lo_hex":"#de7c00","srm_hi_hex":"#de7c00","summary_80":"Una cerveza maltosa y especiada que frecuentemente tiene un cuerpo moderadamente pleno y un final ligeramente cálido.","distinctive_80":"Depende del estilo base y las especias elegidas.","mini_profile":{"malta":3,"lupulo":1,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"Las especias son obligatorias y generalmente incluyen aquellas que evocan las épocas de otoño.","ingredient_chips":["Ej.: pimienta de Jamaica","Ej.: melaza"],"balance_pos":1.0,"balance_malta":3,"balance_lupulo":1,"aroma_highlight":"Malta media","sabor_highlight":"Malta alta","apariencia_highlight":"Opaca","boca_highlight":"Carbonatación alta","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Ámbar","Canela","Opaca"],"ingredientes_highlights":["Ej.: pimienta de Jamaica","Ej.: melaza"],"ingredient_types":{}},{"code":"30C","name":"Winter Seasonal Beer","category_num":30,"category_name":"Spiced Beer","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":null},"fields":{"Impresión general":"Una cerveza fuerte, oscura y especiada que frecuentemente tiene un cuerpo pleno y un final cálido, que las convierte en un buen acompañamiento para la fría temporada de invierno.","Aroma":"Maltoso, especiado, afrutado y balanceado. Es posible un amplio rango de aromas, siempre y cuando evoque el tema de la temporada navideña. Los ingredientes declarados y el concepto son los que establecen la expectativa. La fruta generalmente es de carácter oscuro o deshidratado. Los lúpulos generalmente son sutiles. El alcohol generalmente está presente, pero es suave y de apoyo. Los aromas maltosos y azucarados tienden a tener más peso en el balance y aportan soporte a las especias. Los componentes deben estar bien integrados y crear una presentación coherente. Consulte la sección de Sabor para el carácter de especias, malta, azúcar y fruta.","Apariencia":"Color de ámbar medio a marrón muy oscuro; las versiones más oscuras son más comunes. Usualmente traslúcida, aunque las versiones más oscuras pueden ser virtualmente opacas. Espuma bien formada, persistente, con color de blanquecino a canela.","Sabor":"Maltoso, especiado, afrutado y balanceado. Permita la creatividad por parte de quien elabora la cerveza. Son comunes las especias cálidas o dulces. Son comunes los sabores a malta ricos y dulces, pudiendo incluir sabores a caramelo, tostadas, frutos secos o chocolate. Puede incluir sabores a frutos o cáscaras deshidratadas como uvas pasas, ciruelas, higos, cerezas, cáscara de naranja o de limón. Puede incluir sabores distintivos de azúcar, como melaza, miel o azúcar morena. Los ingredientes especiales deberían otorgar soporte y balance, sin opacar a la cerveza base. El amargor y los sabores de lúpulo usualmente son discretos para no interferir con el carácter especial. Usualmente el final es bastante pleno y llenador, a menudo con un ligero sabor a alcohol. Los sabores de malta con características rostizadas son poco comunes, y típicamente no son más intensos que el chocolate.","Sensación en boca":"El cuerpo usualmente es de medio a pleno, y puede tener una maltosidad “masticable”. Carbonatación de moderadamente baja a moderadamente alta. Se acepta el carácter del envejecimiento. Se acepta una tibieza alcohólica.","Comentarios":"Utiliza el perfil sensorial de los productos que sugieren la temporada navideña, como galletas de navidad, pan/galletas de jengibre, pudin de navidad tipo inglés, pastel de ron, ponche de huevo, árboles de hoja perenne, popurrí, especias para bebidas calientes (Nota de la Traducción: mulling spices, en inglés. Usualmente canela, clavo de olor, pimienta de Jamaica, nuez moscada), balanceados con una cerveza base que otorga soporte y generalmente es maltosa, oscura y cálida. La descripción de la cerveza es fundamental para su evaluación; quienes la juzguen deberían pensar más en el concepto declarado que en tratar de detectar cada ingrediente individual. El balance, la tomabilidad y la ejecución del concepto son los factores decisivos más importantes.","Historia":"La temporada de vacaciones de invierno en el hemisferio norte es un tiempo donde tradicionalmente los buenos amigos se reúnen, y en el que se sirven cervezas más intensas y con un contenido alcohólico mayor. Muchas cervecerías ofrecen productos estacionales para esta temporada que pueden ser más oscuros, fuertes, especiados o, en alguna otra manera, con mayor carácter que las cervezas disponibles el resto del año. Las versiones especiadas son de tradición estadounidense o belga, ya que las cervecerías inglesas o alemanas no usan tradicionalmente especias en sus cervezas. Muchas versiones artesanales estadounidenses se inspiraron en la cerveza Our Special Ale de Anchor, producida por primera vez en 1975. 77","Ingredientes característicos":"Las especias son obligatorias y generalmente incluyen aquellas que evocan la temporada navideña (p. ej.: pimienta de Jamaica, nuez moscada, canela, clavo de olor, jengibre) pero cualquier combinación es posible y se valora la creatividad. Pueden utilizarse cáscaras de fruta (p. ej.: naranja, limón), así como adiciones sutiles de otras frutas (generalmente frutas deshidratadas u oscuras). Son comunes los adjuntos con sabor propio (p. ej.: melaza, sirope dorado [treacle], azúcar invertido, azúcar morena, miel, sirope de arce). Usualmente son ales, aunque existen lagers oscuras fuertes.","Instrucciones para la inscripción":"Quien inscriba debe especificar el tipo de especias, azúcares, frutas o fermentables adicionales utilizados; no es necesario especificar los ingredientes individuales si se usa una mezcla conocida de especias (p. ej.: especias para bebidas calientes [mulling spices]). Además debe especificar una descripción de la cerveza, identificando uno de dos: o un estilo base o los ingredientes, las especificaciones o el carácter objetivo de la cerveza. Una descripción general de la naturaleza especial de la cerveza puede cubrir todos los elementos requeridos.","Estadísticas vitales":"OG, FG, IBU, SRM y ABV variarán según la cerveza base. El ABV generalmente es mayor a 6%, y la mayoría de los ejemplos tienen un color en cierta medida oscuro.","Ejemplos comerciales":"Anchor Christmas Ale, Great Lakes Christmas Ale, Harpoon Winter Warmer, Rogue Santa’s Private Reserve, Schlafly Christmas Ale, Troeg’s The Mad Elf","Etiquetas":"cerveza-especialidad"},"glass_color":"#de7c00","srm_variable":true,"clarity":"opaca","foam_color":"#D9B183","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"Depende del estilo base y las especias elegidas.","ibu_avg":20,"ibu_variable":true,"abv_avg":6.0,"abv_variable":true,"summary":"Cerveza fuerte, oscura y especiada, pensada para el invierno.","classic_example":"Anchor Christmas Ale","foam_level":2,"foam_height":10,"srm_lo_hex":"#de7c00","srm_hi_hex":"#de7c00","summary_80":"Una cerveza fuerte, oscura y especiada que frecuentemente tiene un cuerpo pleno y un final cálido.","distinctive_80":"Depende del estilo base y las especias elegidas.","mini_profile":{"malta":3,"lupulo":1,"cuerpo":2,"carbonatacion":3},"char_tags":[],"ingredients_line":"Las especias son obligatorias y generalmente incluyen aquellas que evocan la temporada navideña (p. ej.: pimienta de Jamaica.","ingredient_chips":["Ej.: pimienta de Jamaica","Ej.: naranja"],"balance_pos":1.0,"balance_malta":3,"balance_lupulo":1,"aroma_highlight":"Malta media","sabor_highlight":"Malta alta","apariencia_highlight":"Opaca","boca_highlight":"Carbonatación alta","aroma_highlights":[],"sabor_highlights":[],"boca_highlights":["Carbonatación alta","Cuerpo medio"],"apariencia_highlights":["Ámbar","Canela","Opaca"],"ingredientes_highlights":["Ej.: pimienta de Jamaica","Ej.: naranja"],"ingredient_types":{}},{"code":"30D","name":"Specialty Spice Beer","category_num":30,"category_name":"Spiced Beer","stats":{"OG":null,"FG":null,"IBU":null,"SRM":null,"ABV":null},"fields":{"Impresión general":"Una atractiva combinación de especias, hierbas o vegetales (SHV, por sus siglas en inglés), azúcares y cerveza, pero aún reconocible como cerveza. El carácter de los SHV y los azúcares debe ser evidente, pero en balance con la 78 cerveza y no tan agresivo como para sugerir un producto artificial.","Aroma":"Igual que una SHV Beer, excepto que algunos fermentables adicionales (p. ej.: miel, melaza) pueden agregar un componente de aroma. Cualquier componente de aroma adicional que esté presente debe estar en balance con los componentes de los SHV y la cerveza, y producir una combinación agradable.","Apariencia":"Igual que para Spice, Herb, or Vegetable Beer.","Sabor":"Igual que una SHV Beer, excepto que algunos fermentables adicionales (p. ej.: miel, melaza) pueden agregar un componente de sabor. Cualquier componente de sabor adicional que esté presente debe estar en balance con los componentes de los SHV y la cerveza, y producir una combinación agradable. Los azúcares agregados no deben tener un sabor crudo y sin fermentar. Algunos azúcares agregados podrían tener elementos no fermentables que pueden aportar un final más pleno y dulce; los azúcares totalmente fermentables pueden diluir el final.","Sensación en boca":"Igual que una SHV Beer, aunque dependiendo del tipo de azúcar añadido, podría aumentar o disminuir el cuerpo.","Comentarios":"Si los fermentables o procesos adicionales no agregan un carácter significativo a la cerveza, inscríbala como uno de los otros estilos de Spiced Beer (no Specialty) y omita la descripción de los ingredientes o procesos adicionales.","Instrucciones para la inscripción":"Quien inscriba debe especificar el tipo de SHV utilizados, pero no es necesario especificar los ingredientes individuales si se usa una mezcla conocida de especias (p. ej.: especias para tarta de manzana, curry en polvo, ají en polvo). Además debe especificar el tipo de ingrediente adicional (según la introducción) o proceso especial empleado. Por otro lado, debe especificar una descripción de la cerveza, identificando uno de dos: o un estilo base o los ingredientes, las especificaciones o el carácter objetivo de la cerveza. Una descripción general de la naturaleza especial de la cerveza puede cubrir todos los elementos requeridos.","Estadísticas vitales":"OG, FG, IBU, SRM y ABV variarán según la cerveza base.","Ejemplos comerciales":"New Belgium Honey Orange Tripel, Westbrook It’s Tiki Time","Etiquetas":"cerveza-especialidad"},"glass_color":"#de7c00","srm_variable":true,"clarity":"traslucida","foam_color":"#F5F1E6","abv_display":"Variable","ibu_display":"Variable","srm_display":"Variable","og_display":"Variable","fg_display":"Variable","country":"Cerveza de Especialidad","family":"Cerveza de Especialidad","glass_shape":"seidel","glass_label":"Jarra / Seidel","distinctive":"
